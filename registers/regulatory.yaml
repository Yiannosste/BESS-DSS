  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-021
  topic: curtailment
  title: Τηλεποπτεία και τηλεδιαχείριση για σταθμούς άνω των 400 kW στο δίκτυο διανομής, με κυρώσεις
  requirement: 'Ο ΔΕΔΔΗΕ αναπτύσσει τηλεποπτεία και τηλεδιαχείριση όλων των σταθμών ΑΠΕ άνω των 400 kW. Οι παραγωγοί εγκαθιστούν με δικές τους δαπάνες τον εξοπλισμό και υποβάλλουν υπεύθυνη δήλωση συμμόρφωσης εντός 8 μηνών από τη γνωστοποίηση των απαιτήσεων. Αλλιώς επιβάλλεται μηνιαία χρέωση = π x Τιμή Αναφοράς (ή ΕΤΑ) x παραχθείσα ενέργεια. Το π αυξάνεται ανά μήνα καθυστέρησης: 5% (600 kW έως 1 MW, σύνδεση μετά τις 4.7.2019), 3% (400 έως 600 kW, μετά τις 4.7.2019), 2,5% (400 kW έως 1 MW, πριν τις 4.7.2019), με ανώτατο 25%. Σε παρατεταμένη μη συμμόρφωση ακολουθεί αποσύνδεση.'
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 9Α (προστέθηκε με ν. 5106/2024 άρθρο 111, παρ. 4 έως 9 όπως ισχύουν με ν. 5188/2025 άρθρο 35, ΦΕΚ Α' 49/28.03.2025)
    url: https://www.taxheaven.gr/law/5188/2025/arthro/35
    quote: Το ποσοστό δεν δύναται σε καμία εκ των περ. α), β) και γ), να υπερβαίνει το είκοσι πέντε τοις εκατό (25%), ανεξαρτήτως των μηνών καθυστέρησης συμμόρφωσης με την προθεσμία της παρ. 4.
  date_issued: '2025-03-28'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα άνω των 400 kW συνδεδεμένα στο ΕΔΔΗΕ, με ή χωρίς ενίσχυση. Τα πάρκα έως 400 kW δεν έχουν αυτή την υποχρέωση.
  model_impact: Τα πάρκα έως 400 kW πρακτικά δεν περικόπτονται με τηλεχειρισμό (μόνο με τοπικούς χειρισμούς ή αποσύνδεση), άρα έχουν μικρότερη περικοπτόμενη ενέργεια για να σώσει η μπαταρία. Τα πάρκα άνω των 400 kW είναι εκτεθειμένα σε περικοπές.
  suggested_parameter:
    name: telecontrol_threshold_kw
    default: '400'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Το ότι τα πάρκα έως 400 kW περικόπτονται μόνο με τοπικούς χειρισμούς είναι δημοσιογραφική πληροφορία. Δεν επαλήθευσα τις ακριβείς ημερομηνίες γνωστοποίησης των απαιτήσεων από τον ΔΕΔΔΗΕ ούτε πόσα πάρκα έχουν συμμορφωθεί. Δημοσίευμα αναφέρει προθεσμία 15.9.2026 για αυτοπαραγωγούς άνω των 400 kW (μη επιβεβαιωμένο). Ο Κανονισμός (ΕΕ) 2019/943 άρθρο 12 δίνει προτεραιότητα κατανομής σε ΑΠΕ κάτω των 400 kW.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-022
  topic: curtailment
  title: Πλαίσιο περιορισμών παραγωγής ΑΠΕ με υπουργική απόφαση (άρθρο 10Α ν. 4951/2022)
  requirement: 'Με απόφαση του Υπουργού Περιβάλλοντος και Ενέργειας καθορίζεται πλαίσιο περιορισμών παραγωγής ΑΠΕ: κατηγορίες περιορισμών (τοπική συμφόρηση, ασφάλεια, πλεόνασμα παραγωγής σε επίπεδο ζώνης προσφορών), όρια, αρχές και προτεραιότητα επιβολής, κατηγοριοποίηση σταθμών, συνεργασία με αποθήκευση ανά αγορά, ρόλοι ΑΔΜΗΕ, ΔΕΔΔΗΕ, ΕΧΕ, ΔΑΠΕΕΠ, ΦοΣΕ, υποχρεώσεις εξοπλισμού και κυρώσεις. Αποδεκτά όρια περιορισμών μπορούν να τεθούν μόνο όταν ο ΔΕΔΔΗΕ ελέγχει την παραγωγή ΑΠΕ του δικτύου του.'
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 10Α (προστέθηκε με ν. 5106/2024 άρθρο 117, ΦΕΚ Α' 63/01.05.2024)
    url: https://www.taxheaven.gr/law/5106/2024/arthro/117
    quote: Δύναται να καθορίζονται όρια επιβολής περιορισμών έγχυσης στους σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α., οι αρχές και η προτεραιότητα επιβολής των περιορισμών αυτών στους σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α. και η σχετική κατηγοριοποίηση των σταθμών, καθώς και η συνεργασία τους με σταθμούς αποθήκευσης ηλεκτρικής ενέργειας, για κάθε επιμέρους αγορά ηλεκτρικής ενέργειας (Αγορά Επόμενης Ημέρας, Ενδοημερήσια Αγορά, Αγορά Εξισορρόπησης) αφού ληφθούν υπόψη οι ανάγκες ανακατανομής.
  date_issued: '2024-05-01'
  status: pending
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί ΑΠΕ και αποθήκευσης.
  model_impact: Ο τρόπος κατανομής των περικοπών μεταξύ σταθμών (αναλογικά, κατά κατηγορία, εξαιρέσεις μικρών ή παλιών) δεν έχει οριστεί σε κανονιστικό κείμενο που να βρήκα. Το μοντέλο πρέπει να δέχεται το ποσοστό περικοπής ως παράμετρο σεναρίου ανά πάρκο.
  suggested_parameter:
    name: curtailment_allocation_rule
    default: unknown_use_scenario_input
    alternatives:
    - pro_rata_within_controllable_group
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η εξουσιοδότηση ισχύει, αλλά δεν βρήκα ΦΕΚ της απόφασης-πλαισίου. Δημοσιεύματα του 2026 περιγράφουν ότι οι περισσότερες περικοπές γίνονται πλέον από τους ΦοΣΕ για συμμόρφωση με τα προγράμματα αγοράς και ότι τα έργα στο σύστημα του ΑΔΜΗΕ κόβονται πολύ περισσότερο από όσα είναι στο δίκτυο του ΔΕΔΔΗΕ.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-023
  topic: pending_change
  title: 'Μηχανισμός Αντιστάθμισης (Αναδιανομής) Περικοπών ΑΠΕ: προβλέπεται στον νόμο, η απόφαση εκκρεμεί'
  requirement: 'Ο νόμος επιτρέπει να θεσπιστεί με υπουργική απόφαση Μηχανισμός Αντιστάθμισης Περικοπών μεταξύ παραγωγών ΑΠΕ: χρεώσεις σε σταθμούς που δεν μπορούν τεχνικά να περικοπούν, πιστώσεις σε σταθμούς που περικόπηκαν πέραν της αναλογίας τους. Φορέας εφαρμογής η ΔΑΠΕΕΠ με ειδικό λογαριασμό. Κατά τον Τύπο (Αύγουστος και Οκτώβριος 2026) το πλαίσιο έχει οριστικοποιηθεί χωρίς αναδρομική ισχύ, η απόφαση αναμενόταν έως το τέλος του 2026 και η πρώτη εκκαθάριση στις αρχές του 2027.'
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 10Α παρ. 5 (ν. 5106/2024 άρθρο 117)
    url: https://www.taxheaven.gr/law/5106/2024/arthro/117
    quote: Με απόφαση του Υπουργού Περιβάλλοντος και Ενέργειας, δύναται, κατόπιν πρότασης της Ομάδας Διοίκησης Έργου, να θεσπίζεται Μηχανισμός Αντιστάθμισης Περικοπών Α.Π.Ε. και Σ.Η.Θ.Υ.Α. μεταξύ παραγωγών Α.Π.Ε. και Σ.Η.Θ.Υ.Α., για την αντιστάθμιση των πρόσθετων περιορισμών που επιβάλλονται σε σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α., λόγω της τεχνικής αδυναμίας εφαρμογής στην πράξη αναλογικού επιμερισμού των περιορισμών σε όλους τους σταθμούς της αυτής ομάδας περιορισμών, με χρεώσεις που επιβάλλονται σε σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α. οι οποίοι δεν δύναται να εφαρμόσουν λόγω τεχνικής αδυναμίας τους ως άνω περιορισμούς.
  date_issued: '2024-05-01'
  status: pending
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: 'Όλοι οι παραγωγοί ΑΠΕ. Ειδικά: πάρκα που δεν περικόπτονται (π.χ. μικρά χωρίς τηλεέλεγχο) θα πληρώνουν, πάρκα που περικόπτονται δυσανάλογα θα εισπράττουν.'
  model_impact: Αν εφαρμοστεί, μειώνει το όφελος της μπαταρίας για τα πολύ περικοπτόμενα πάρκα (παίρνουν ήδη μερική αντιστάθμιση) και δημιουργεί κόστος στα μη περικοπτόμενα. Να μπει ως σενάριο με διακόπτη.
  suggested_parameter:
    name: curtailment_redistribution_mechanism_active
    default: 'false'
    alternatives:
    - true από το 2027 (αν εκδοθεί η υπουργική απόφαση)
  notes: Οι λεπτομέρειες (θεωρητική παραγωγή υπολογισμένη από ΑΔΜΗΕ και ΔΕΔΔΗΕ, χρηματοδότηση ελλείμματος από ΕΛΑΠΕ, χρεώσεις μη συμμόρφωσης) προέρχονται μόνο από δημοσίευμα του B2Green (4.8.2026). Δεν βρήκα ΦΕΚ. Παλαιότερα δημοσιεύματα έλεγαν αναδρομική ισχύ από 1.1.2026, νεότερα το αποκλείουν.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-024
  topic: curtailment
  title: 'Ενωσιακός κανόνας αποζημίωσης ανακατανομής (redispatch): Κανονισμός (ΕΕ) 2019/943 άρθρο 13'
  requirement: Η ανακατανομή πρέπει να βασίζεται στην αγορά και να αποζημιώνεται. Όταν γίνεται ανακατανομή που δεν βασίζεται στην αγορά, ο διαχειριστής που τη ζητά αποζημιώνει τον παραγωγό, εκτός αν η συμφωνία σύνδεσης δεν εγγυάται σταθερή παράδοση ενέργειας. Η αποζημίωση είναι τουλάχιστον το πρόσθετο λειτουργικό κόστος ή τα καθαρά έσοδα της αγοράς επόμενης ημέρας που θα είχε ο σταθμός, μαζί με την οικονομική στήριξη που θα λάμβανε. Οι διαχειριστές εγγυώνται ελάχιστη ανακατανομή ΑΠΕ, με αναφορά το 5% της ετήσιας παραγωγής.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943, άρθρο 13 παρ. 2, 5, 6 και 7 (ενοποιημένη έκδοση 16.07.2024, όπως τροποποιήθηκε με τον Κανονισμό (ΕΕ) 2024/1747)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Όταν χρησιμοποιείται ανακατανομή που δεν βασίζεται στην αγορά, αποτελεί αντικείμενο οικονομικής αποζημίωσης από τον διαχειριστή συστήματος που ζητεί την ανακατανομή προς τον διαχειριστή της εγκατάστασης ανακατανομής μονάδας, αποθήκευσης ενέργειας ή απόκρισης ζήτησης, με την εξαίρεση των ηλεκτροπαραγωγών που έχουν δεχθεί συμφωνία σύνδεσης στην οποία δεν υπάρχει εγγύηση παγιωμένη για παράδοση σταθερών ποσοτήτων ενέργειας.
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί ΑΠΕ που υφίστανται τεχνικές περικοπές κατ' εντολή διαχειριστή.
  model_impact: Κατ' αρχήν οι τεχνικές περικοπές είναι αποζημιώσιμες στο ενωσιακό δίκαιο. Στην πράξη το μοντέλο δεν πρέπει να υπολογίζει αποζημίωση (βλ. REG-B-025). Η εξαίρεση για συμβάσεις σύνδεσης χωρίς εγγύηση σταθερής παράδοσης καλύπτει τους σταθμούς με όρους περιορισμών έγχυσης.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Ο Κανονισμός έχει άμεση ισχύ. Δεν βρήκα ελληνική διάταξη ή απόφαση ΡΑΑΕΥ που να οργανώνει πληρωμή αποζημίωσης για εντολές περιορισμού ΑΠΕ.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-025
  topic: curtailment
  title: Στην Ελλάδα η περικοπτόμενη ενέργεια ΑΠΕ δεν αποζημιώνεται στην πράξη
  requirement: Δεν εντόπισα σε νόμο, υπουργική απόφαση ή απόφαση ΡΑΑΕΥ μηχανισμό που να πληρώνει τον παραγωγό για ενέργεια που δεν εγχύθηκε λόγω Εντολής Περιορισμού ή λόγω μη αποδοχής της προσφοράς στην αγορά. Η σύμβαση FiT, ΣΕΣΤ ή ΣΕΔΠ πληρώνει μόνο ενέργεια που εγχύθηκε και μετρήθηκε. Ο μόνος προβλεπόμενος μηχανισμός είναι η αναδιανομή μεταξύ παραγωγών (REG-B-023), που δεν έχει ενεργοποιηθεί.
  source:
    type: secondary_press
    citation: 'Συνδυασμός: ν. 4951/2022 άρθρα 10Α και 10Β, δημοσιεύματα B2Green (7.5.2026 και 4.8.2026), ανακοινώσεις ΠΟΣΠΗΕΦ'
    url: https://news.b2green.gr/77779/
    quote: ''
  date_issued: ''
  status: unclear
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Όλα τα Φ/Β πάρκα.
  model_impact: 'Η περικοπή ισοδυναμεί με μηδενικό έσοδο για την αντίστοιχη ενέργεια. Αυτό είναι η βασική πηγή αξίας της μπαταρίας: η ενέργεια που θα κοβόταν αποθηκεύεται και πωλείται αργότερα σε τιμή αγοράς.'
  suggested_parameter:
    name: curtailed_energy_compensation_eur_mwh
    default: '0'
    alternatives:
    - αξία αντιστάθμισης από τον μηχανισμό αναδιανομής όταν εφαρμοστεί (άγνωστο ύψος)
  notes: 'Αρνητικό εύρημα: η απουσία μηχανισμού δεν αποδεικνύεται από ένα κείμενο. Υπάρχει ένταση με το άρθρο 13 παρ. 7 του Κανονισμού (ΕΕ) 2019/943. Δεν διάβασα τον Κώδικα Διαχείρισης ΕΣΜΗΕ ούτε τον Κανονισμό Αγοράς Εξισορρόπησης στο σύνολό τους.'
  enforced_by: Ρύθμιση curtailment_compensation_frac = 0.
- id: REG-B-026
  topic: curtailment
  title: Μέγεθος περικοπών ΑΠΕ 2023 έως 2026
  requirement: 'Εκτιμήσεις Green Tank με βάση δεδομένα προγραμματισμού του ΑΔΜΗΕ: 2023: 228 GWh. 2024: 860 GWh (3,3% της παραγωγής ΑΠΕ). 2025: 1.867 GWh (6,6%). Ιανουάριος έως Σεπτέμβριος 2026: 2.063 GWh (7,8%), έναντι 1.786 GWh την ίδια περίοδο του 2025. Σεπτέμβριος 2026: 158,2 GWh (5,4%). Η ΠΟΣΠΗΕΦ εκτιμά 3,3 έως 3,7 TWh για όλο το 2026 και απώλειες εσόδων Φ/Β άνω του 40%. Άλλες εκτιμήσεις αγοράς: 30 έως 35% της παραγωγής Φ/Β.'
  source:
    type: secondary_press
    citation: Green Tank «Τάσεις στην ηλεκτροπαραγωγή» (μηνιαίες αναλύσεις 2024 έως Σεπτέμβριος 2026), όπως αναδημοσιεύτηκαν (ienergeia.gr, michanikos-online.gr, powergame.gr), ανακοινώσεις ΠΟΣΠΗΕΦ
    url: https://www.ienergeia.gr/ilektrismos/44439/greentank-taseis-stin-ilektroparagogi-septemvrios-2026
    quote: ''
  date_issued: '2026-11-01'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Σύνολο ΑΠΕ διασυνδεδεμένου συστήματος. Τα ποσοστά για Φ/Β είναι πολύ υψηλότερα από τον μέσο όρο ΑΠΕ.
  model_impact: Βαθμονόμηση των σεναρίων περικοπών. Τα συστημικά ποσοστά (7 έως 9% των ΑΠΕ) υποεκτιμούν την περικοπή ενός Φ/Β πάρκου με τηλεέλεγχο τις μεσημβρινές ώρες. Χρειάζονται δεδομένα ανά πάρκο από τον ΦοΣΕ ή τον διαχειριστή.
  suggested_parameter:
    name: system_res_curtailment_share_2025
    default: '0.066'
    alternatives:
    - 0.078 (Ιανουάριος έως Σεπτέμβριος 2026)
    - 0.30 έως 0.40 της παραγωγής Φ/Β (ισχυρισμοί συλλόγων παραγωγών, μη επαληθευμένοι)
  notes: Δεν είναι επίσημα απολογιστικά στοιχεία ΑΔΜΗΕ, ΡΑΑΕΥ ή ΔΑΠΕΕΠ. Είναι εκτιμήσεις τρίτου από δεδομένα προγραμματισμού και τις είδα μέσω συνόψεων αναζήτησης. Δεν βρήκα επίσημη ετήσια έκθεση ανακατανομής (άρθρο 13 παρ. 4 του Κανονισμού 2019/943). Τα ποσοστά ΠΟΣΠΗΕΦ μπερδεύουν μερικές φορές απώλεια ενέργειας με απώλεια εσόδων.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-027
  topic: curtailment
  title: Προτεραιότητα κατανομής μικρών και παλιών ΑΠΕ και απώλειά της σε «σημαντική τροποποίηση»
  requirement: Οι διαχειριστές δίνουν προτεραιότητα κατανομής σε ΑΠΕ κάτω των 400 kW (κάτω των 200 kW για όσες τεθούν σε λειτουργία μετά την 1.1.2026). Οι ΑΠΕ που τέθηκαν σε λειτουργία πριν από τις 4.7.2019 και είχαν προτεραιότητα κατανομής τη διατηρούν, αλλά τη χάνουν όταν υποστούν σημαντικές τροποποιήσεις, δηλαδή τουλάχιστον όταν απαιτείται νέα συμφωνία σύνδεσης ή αυξάνεται η ισχύς παραγωγής.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943, άρθρο 12 παρ. 2, 5 και 6 (ενοποιημένη έκδοση 16.07.2024)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Η κατανομή κατά προτεραιότητα παύει να εφαρμόζεται στις εν λόγω εγκαταστάσεις ηλεκτροπαραγωγής από την ημερομηνία κατά την οποία η εγκατάσταση ηλεκτροπαραγωγής υφίσταται σημαντικές τροποποιήσεις, γεγονός που θεωρείται ότι συμβαίνει τουλάχιστον όταν απαιτείται νέα συμφωνία σύνδεσης ή όταν αυξάνεται η ισχύς παραγωγής της εγκατάστασης ηλεκτροπαραγωγής.
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα κάτω των 400 kW και πάρκα με λειτουργία πριν τις 4.7.2019.
  model_impact: 'Κίνδυνος για παλιά πάρκα: αν η προσθήκη μπαταρίας απαιτήσει νέα σύμβαση σύνδεσης, μπορεί να χαθεί η προτεραιότητα κατανομής και το πάρκο να γίνει περικόψιμο όπως τα νεότερα. Να μπει ως ποιοτική προειδοποίηση του DSS.'
  suggested_parameter:
    name: priority_dispatch_lost_on_new_connection_agreement
    default: 'true'
    alternatives:
    - false (αν η τροποποίηση της σύμβασης σύνδεσης δεν θεωρηθεί «νέα συμφωνία»)
  notes: Η εφαρμογή στην προσθήκη μπαταρίας είναι δική μου ερμηνεία, δεν βρήκα ελληνική οδηγία. Πώς εφαρμόζει η Ελλάδα την προτεραιότητα κατανομής στα παλιά FiT σε συνθήκες περικοπών δεν επαληθεύτηκε.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-028
  topic: market_participation
  title: 'ΣΕΔΠ: υποχρέωση εγγραφής στο Μητρώο Συμμετεχόντων ή σύμβασης με ΦοΣΕ'
  requirement: Οι κάτοχοι σταθμών με ΣΕΔΠ πρέπει να είναι εγγεγραμμένοι στο Μητρώο Συμμετεχόντων ή να έχουν Σύμβαση Εκπροσώπησης με Φορέα Σωρευτικής Εκπροσώπησης (ΦοΣΕ) και να έχουν υποβάλει Δήλωση Εκπροσώπησης στη ΔΑΠΕΕΠ.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5 παρ. 4, όπως ισχύει μετά το άρθρο 54 του ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/54
    quote: '[...] υποχρεούνται να έχουν εγγραφεί στο Μητρώο Συμμετεχόντων ή να έχουν συνάψει Σύμβαση Εκπροσώπησης με Φορέα Σωρευτικής Εκπροσώπησης (Φο.Σ.Ε.) και να έχουν υποβάλει τη σχετική Δήλωση Εκπροσώπησης στον Διαχειριστή Ανανεώσιμων Πηγών Ενέργειας και Εγγυήσεων Προέλευσης (Δ.Α.Π.Ε.Ε.Π. Α.Ε.).'
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ. Αναλογικά και πάρκα χωρίς ενίσχυση (άρθρο 12Α ν. 4414/2016).
  model_impact: Το μοντέλο αφαιρεί αμοιβή ΦοΣΕ και κόστος αποκλίσεων από τα έσοδα αγοράς. Ο ΦοΣΕ είναι και αυτός που στην πράξη θα προγραμματίζει την μπαταρία στην αγορά.
  suggested_parameter:
    name: market_access_route
    default: aggregator_fose
    alternatives:
    - direct_participant
    - fosetek_last_resort
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr).
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-029
  topic: aggregator
  title: 'ΦοΣΕΤεΚ: σήμερα η ΔΑΠΕΕΠ, από 1.1.2027 με διαγωνισμό ΡΑΑΕΥ και ανώτατη χρέωση 6% της ΕΤΑ'
  requirement: Φορέας Σωρευτικής Εκπροσώπησης Τελευταίου Καταφυγίου (ΦοΣΕΤεΚ) ορίστηκε με την ΥΑ ΥΠΕΝ/ΔΑΠΕΕΚ/25512/883/20.3.2019 (η ΔΑΠΕΕΠ). Από 1.1.2027 και ανά διετία ο ΦοΣΕΤεΚ επιλέγεται με πρόσκληση της ΡΑΑΕΥ. Κριτήριο είναι η χαμηλότερη μηνιαία χρέωση ως ποσοστό της μηνιαίας Ειδικής Τιμής Αγοράς της τεχνολογίας, που δεν μπορεί να υπερβαίνει το 6%. Για σταθμούς που συνεχίζουν να λειτουργούν μετά τη λήξη της σύμβασής τους και αμείβονται μόνο από την αγορά, η χρέωση είναι μειωμένη κατά μία ποσοστιαία μονάδα.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5 παρ. 5, όπως συμπληρώθηκε με το άρθρο 58 παρ. 1 του ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.taxheaven.gr/law/5261/2025/arthro/58
    quote: Κριτήριο επιλογής του Φο.Σ.Ε.Τε.Κ αποτελεί η χαμηλότερη μηνιαία χρέωση, σε ποσοστό επί της αντίστοιχης μηνιαίας Ειδικής Τιμής Αγοράς, της τεχνολογίας όπου ανήκει ο σταθμός, η οποία δεν δύναται να υπερβαίνει το έξι τοις εκατό (6%).
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ΣΕΔΠ ή χωρίς ενίσχυση που δεν βρίσκουν ιδιωτικό ΦοΣΕ. Πάρκα μετά τη λήξη της σύμβασης FiT.
  model_impact: 'Ανώτατο όριο κόστους εκπροσώπησης για το μοντέλο από το 2027: 6% της ΕΤΑ (5% για πάρκα με ληγμένη σύμβαση). Οι ιδιωτικοί ΦοΣΕ είναι λογικά φθηνότεροι, αλλά οι αμοιβές τους δεν είναι δημόσιες.'
  suggested_parameter:
    name: aggregator_fee_fraction_of_market_revenue
    default: '0.06'
    alternatives:
    - 0.05 (σταθμοί με ληγμένη σύμβαση, από 2027)
    - 'εμπορική αμοιβή ιδιωτικού ΦοΣΕ: μη δημόσια, να ζητηθεί προσφορά'
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Οι τρέχουσες χρεώσεις ΦοΣΕΤεΚ της ΔΑΠΕΕΠ (ΥΑ του 2019, ΦΕΚ Β' 1020) και το «αντικίνητρο παρατεταμένης παραμονής» δεν επαληθεύτηκαν αριθμητικά. Δεν βρήκα δημόσια στοιχεία για αμοιβές ιδιωτικών ΦοΣΕ ούτε για το αν χρεώνουν ξεχωριστά τη διαχείριση μπαταρίας.
  enforced_by: Υπόθεση ASM-F07 (αμοιβή ΦοΣΕ) στο οικονομικό μοντέλο.
- id: REG-B-030
  topic: imbalance
  title: Ευθύνη εξισορρόπησης για ΣΕΣΤ και FiT άνω των 400 kW με λειτουργία από 4.7.2019
  requirement: Από 1.1.2020 οι σταθμοί ισχύος 400 kW και άνω με ΣΕΣΤ ή σύμβαση πώλησης που τέθηκαν σε λειτουργία από 4.7.2019 είναι υπεύθυνοι για τις αποκλίσεις τους. Το κόστος εξισορρόπησης υπολογίζεται με μεθοδολογία του Κώδικα ΔΑΠΕΕΠ, παρακρατείται από τη ΔΑΠΕΕΠ και δεν μπορεί να υπερβαίνει τις χρεώσεις και το αντικίνητρο του ΦοΣΕΤεΚ για σταθμούς της ίδιας κατηγορίας. Οι σταθμοί αυτοί με σύμβαση πώλησης μπορούν να μεταπέσουν σε ΣΕΔΠ με Τιμή Αναφοράς ίση με την τιμή πώλησής τους.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5Α, όπως διαμορφώθηκε με το άρθρο 46 του ν. 4951/2022 (ΦΕΚ Α' 129/04.07.2022)
    url: https://www.taxheaven.gr/law/4951/2022/arthro/46
    quote: 1. Από την 1η Ιανουαρίου 2020, σταθμοί εγκατεστημένης ισχύος ή μέγιστης ισχύος παραγωγής μεγαλύτερης ή ίσης των 400kW, που οι κάτοχοί τους έχουν συνάψει Σ.Ε.Σ.Τ. ή σύμβαση πώλησης ηλεκτρικής ενέργειας του άρθρου 12 του ν. 3468/2006 (Α' 129) [...] και οι οποίοι τέθηκαν σε λειτουργία (κανονική ή δοκιμαστική) από την 4η Ιουλίου 2019 και εφεξής, είναι υπεύθυνοι για τις αποκλίσεις που προκαλούν («ευθύνη εξισορρόπησης»).
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα ΣΕΣΤ ή FiT με ισχύ 400 kW και άνω και λειτουργία από 4.7.2019. Τα παλαιότερα FiT και τα μικρότερα πάρκα δεν φέρουν ευθύνη εξισορρόπησης.
  model_impact: Για αυτά τα πάρκα το μοντέλο αφαιρεί κόστος εξισορρόπησης από τα έσοδα σταθερής τιμής. Η μπαταρία θα μπορούσε να μειώσει αποκλίσεις, αλλά το κόστος παρακρατείται με μεθοδολογία χαρτοφυλακίου και το όφελος για το μεμονωμένο πάρκο είναι αβέβαιο.
  suggested_parameter:
    name: balancing_cost_fixed_price_parks_eur_mwh
    default: ''
    alternatives:
    - να ληφθεί από τα μηνιαία δελτία ΕΛΑΠΕ της ΔΑΠΕΕΠ (μη προσβάσιμα κατά την έρευνα)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Δεν βρήκα την τρέχουσα μοναδιαία χρέωση. Σύνοψη αναζήτησης αναφέρει τιμές της τάξης 7,5 έως 15 ευρώ/MWh σε δελτία ΔΑΠΕΕΠ χωρίς σαφή περίοδο, δεν τις υιοθετώ.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-031
  topic: imbalance
  title: 'Ενωσιακοί κανόνες αποκλίσεων: ευθύνη εξισορρόπησης, 15λεπτη εκκαθάριση, τιμή ανισορροπίας'
  requirement: Όλοι οι συμμετέχοντες στην αγορά φέρουν ευθύνη εξισορρόπησης. Παρεκκλίσεις επιτρέπονται μόνο για έργα επίδειξης, ΑΠΕ κάτω των 400 kW και εγκαταστάσεις με εγκεκριμένη στήριξη που τέθηκαν σε λειτουργία πριν από τις 4.7.2019. Η περίοδος εκκαθάρισης ανισορροπιών είναι 15 λεπτά. Η τιμή ανισορροπίας μπορεί να είναι θετική, μηδενική ή αρνητική και συνδέεται με την ενεργοποιημένη ενέργεια εξισορρόπησης.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943 άρθρο 5 παρ. 1 και 2, Κανονισμός (ΕΕ) 2017/2195 (EBGL) άρθρα 53 και 55
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02017R2195-20220619
    quote: Εντός τριών ετών από την έναρξη ισχύος του παρόντος κανονισμού, όλοι οι ΔΣΜ εφαρμόζουν την περίοδο εκκαθάρισης ανισορροπιών που έχει διάρκεια 15 λεπτών σε όλες τις περιοχές προγραμματισμού, διασφαλίζοντας παράλληλα ότι όλα τα όρια της αγοραίας χρονικής μονάδας συμπίπτουν με τα όρια της περιόδου εκκαθάρισης ανισορροπιών.
  date_issued: '2017-11-23'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα που συμμετέχουν στην αγορά (ΣΕΔΠ, merchant, PPA) και οι ΦοΣΕ τους.
  model_impact: Η προσομοίωση πρέπει να τρέχει σε βήμα 15 λεπτών. Το κόστος αποκλίσεων εξαρτάται από τιμές αποκλίσεων που μπορούν να γίνουν αρνητικές (βλ. REG-B-034).
  suggested_parameter:
    name: imbalance_settlement_period_minutes
    default: '15'
    alternatives: []
  notes: Δεν διάβασα τον ελληνικό Κανονισμό Αγοράς Εξισορρόπησης στο σύνολό του (τύπος τιμής αποκλίσεων, χρεώσεις μη συμμόρφωσης, προσαυξήσεις ΛΠ-3). Οι χρεώσεις αυτές υπάρχουν αλλά δεν τις ποσοτικοποίησα.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-032
  topic: market_participation
  title: 15λεπτη χρονική μονάδα στην Αγορά Επόμενης Ημέρας από την ημέρα παράδοσης 1.10.2025
  requirement: Στις 30.9.2025 η ευρωπαϊκή σύζευξη αγορών επόμενης ημέρας (SDAC) πέρασε από ωριαία σε 15λεπτα διαστήματα συναλλαγών, με πρώτη ημέρα παράδοσης την 1.10.2025. Οι τιμές υπολογίζονται ανά 15 λεπτά (96 τιμές την ημέρα). Ο ελληνικός νόμος ορίζει πλέον ως «Περίοδο Κατανομής» το 15λεπτο.
  source:
    type: official_report
    citation: Ευρωπαϊκή Επιτροπή, ΓΔ Ενέργειας, ανακοίνωση 1.10.2025 «EU electricity trading in the day-ahead markets becomes more dynamic», και ν. 4414/2016 άρθρο 5 παρ. 10 τελευταίο εδάφιο
    url: https://energy.ec.europa.eu/news/eu-electricity-trading-day-ahead-markets-becomes-more-dynamic-2025-10-01_en
    quote: On 30 September 2025, the EU’s day-ahead electricity market moved from hourly to 15-minute trading intervals.
  date_issued: '2025-10-01'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι συμμετέχοντες στην ΑΕΗ.
  model_impact: Χρονικό βήμα μοντέλου 15 λεπτά για τιμές ΑΕΗ από 1.10.2025. Τα ιστορικά δεδομένα πριν από την ημερομηνία αυτή είναι ωριαία.
  suggested_parameter:
    name: dam_market_time_unit_minutes
    default: '15'
    alternatives:
    - 60 για δεδομένα πριν από 1.10.2025
  notes: Δεν άνοιξα ανακοίνωση του Ελληνικού Χρηματιστηρίου Ενέργειας για την ελληνική ζώνη, στηρίζομαι στην ανακοίνωση της Επιτροπής και στη διατύπωση του ελληνικού νόμου. Ο Κανονισμός 2019/943 άρθρο 8 ορίζει κλείσιμο πύλης διαζωνικής ενδοημερήσιας αγοράς το αργότερο 30 λεπτά πριν τον πραγματικό χρόνο από 1.1.2026, με δυνατότητα παρέκκλισης έως 1.1.2029. Στον ιστότοπο της ΡΑΑΕΥ υπάρχει αίτημα παρέκκλισης (Νοέμβριος 2025) που δεν διάβασα.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-033
  topic: balancing_services
  title: Συμμετοχή αποθήκευσης και ΑΠΕ με αποθήκευση στην Αγορά Εξισορρόπησης (ΡΑΑΕΥ Ε-14/2026)
  requirement: Η Αγορά Εξισορρόπησης λειτουργεί με κεντρικό προγραμματισμό ανά μονάδα. Μεγάλος Σταθμός Αποθήκευσης είναι όποιος συνδέεται στο ΕΣΜΗΕ με Μέγιστη Ισχύ Έγχυσης 10 MW και άνω (το όριο μειώθηκε από 40 MW). Οι Μεγάλοι Σταθμοί Αποθήκευσης και οι Σταθμοί ΑΠΕ με Μεγάλη Αποθήκευση συμμετέχουν υποχρεωτικά ως διακριτές Οντότητες και όχι σε χαρτοφυλάκια. Οι μικρότεροι συμμετέχουν μέσω χαρτοφυλακίων.
  source:
    type: raaey_decision
    citation: Απόφαση ΡΑΑΕΥ Ε-14/2026 «Τροποποίηση του Κανονισμού Αγοράς Εξισορρόπησης [...] για τη συμμετοχή των Σταθμών Αποθήκευσης Ηλεκτρικής Ενέργειας στην Αγορά Εξισορρόπησης και το Τέλος Αγοράς Εξισορρόπησης»
    url: https://www.raaey.gr/energeia/wp-content/uploads/2026/02/%CE%91%CE%A0%CE%9F%CE%A6%CE%91%CE%A3%CE%97-%CE%95-14_2026_%CE%A4%CF%81%CE%BF%CF%80%CE%BF%CF%80%CE%BF%CE%AF%CE%B7%CF%83%CE%B7-%CE%9A%CE%91%CE%95-%CE%B3%CE%B9%CE%B1-%CE%A3%CE%91%CE%97%CE%95_final.pdf
    quote: Οι Μεγάλοι Σταθμοί Αποθήκευσης και οι Σταθμοί ΑΠΕ με Μεγάλη Αποθήκευση συμμετέχουν υποχρεωτικά ως διακριτές Οντότητες στις αγορές και δε δύνανται να συμμετέχουν σε χαρτοφυλάκια.
  date_issued: '2026-02-20'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί αποθήκευσης και ΑΠΕ με αποθήκευση. Για μικρά Φ/Β πάρκα διανομής με μπαταρία πίσω από τον μετρητή η εφαρμογή είναι ασαφής.
  model_impact: Για πάρκο λίγων MW στο δίκτυο διανομής δεν πρέπει να υπολογίζονται έσοδα aFRR ή mFRR στο βασικό σενάριο. Μόνο ως αισιόδοξο σενάριο μέσω ΦοΣΕ.
  suggested_parameter:
    name: balancing_services_revenue_enabled
    default: 'false'
    alternatives:
    - true μέσω χαρτοφυλακίου ΦοΣΕ (δεν επιβεβαιώθηκε ότι επιτρέπεται για σταθμούς 11Α διανομής)
  notes: Διάβασα το σκεπτικό της απόφασης, όχι ολόκληρο τον τροποποιημένο Κανονισμό. Ο αριθμός ΦΕΚ (Β' 939/20.02.2026) και ο εθελοντικός χαρακτήρας της συμμετοχής προέρχονται από δημοσίευμα. Οι σταθμοί 11Α με ενίσχυση περιορίζονται από τον κανόνα ότι η ενέργεια της μπαταρίας αμείβεται με τιμές των αγορών «σύμφωνα με τη συμμετοχή τους σε αυτές» (άρθρο 11Γ παρ. 2), άρα η συμμετοχή σε άλλες αγορές δεν αποκλείεται από τον νόμο. Δεν βρήκα κανόνα προεπιλογής για μικρούς σταθμούς διανομής. Σχετική και η απόφαση Ε-20/2026 (όροι Παρόχων Υπηρεσιών Εξισορρόπησης), που δεν διάβασα.
  enforced_by: 'Ρύθμιση balancing_services_allowed = False: τα έσοδα εξισορρόπησης δεν μετρώνται.'
- id: REG-B-034
  topic: balancing_services
  title: 'Κατώτατο όριο προσφορών ενέργειας εξισορρόπησης: μείον 100 ευρώ/MWh για ένα έτος από 26.6.2026'
  requirement: Το Κατώτατο Όριο Προσφοράς Ενέργειας Εξισορρόπησης ορίστηκε σε μείον 100 ευρώ/MWh για ένα έτος, με ισχύ από 26.6.2026 (Ημέρα Κατανομής 27.6.2026). Από 27.6.2025 ίσχυε προσωρινό όριο μείον 50 ευρώ/MWh (απόφαση Ε-96/2025). Πριν από αυτό οι αρνητικές προσφορές ήταν σε αναστολή (απόφαση 54/2021).
  source:
    type: raaey_decision
    citation: Απόφαση ΡΑΑΕΥ Ε-181/2026 (18.06.2026), τροποποίηση άρθρου 27.2 του Κανονισμού Αγοράς Εξισορρόπησης
    url: https://www.admie.gr/sites/default/files/users/dda/%CE%B5-181_2026%20%CE%B1%CF%81%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%AD%CF%82%20%CF%84%CE%B9%CE%BC%CE%AD%CF%82.pdf.pdf
    quote: Πλέον των όσων προβλέπονται ανωτέρω, θεσπίζεται αριθμητική τιμή για το Κατώτατο Όριο Προσφοράς Ενέργειας Εξισορρόπησης, η οποία ανέρχεται σε -100 €/MWh και ισχύει για χρονικό διάστημα ενός έτους από την έναρξη ισχύος της Ε-181/2026 Απόφασης του Κλάδου Ενέργειας της ΡΑΑΕΥ.
  date_issued: '2026-06-18'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι συμμετέχοντες που εκτίθενται σε τιμές αποκλίσεων, δηλαδή χαρτοφυλάκια ΑΠΕ με ΣΕΔΠ ή χωρίς ενίσχυση.
  model_impact: Οι τιμές αποκλίσεων μπορούν να γίνουν αρνητικές έως μείον 100 ευρώ/MWh τις ώρες πλεονάσματος. Αυξάνει το κόστος θετικών αποκλίσεων για Φ/Β και την αξία της ελεγχόμενης απορρόφησης από μπαταρία.
  suggested_parameter:
    name: balancing_energy_bid_floor_eur_mwh
    default: '-100'
    alternatives:
    - -50 (27.6.2025 έως 25.6.2026)
    - άγνωστο μετά τις 26.6.2027 (προσωρινό μέτρο υπό επανεξέταση)
  notes: Διάβασα την απόφαση σε PDF στον ιστότοπο του ΑΔΜΗΕ. Δεν επαλήθευσα αριθμό ΦΕΚ.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-035
  topic: support_merchant_ppa
  title: Μετά τη λήξη της σύμβασης το πάρκο συνεχίζει και αμείβεται μόνο από την αγορά
  requirement: Σταθμοί με σύμβαση λειτουργικής ενίσχυσης ή σύμβαση πώλησης που συνεχίζουν να λειτουργούν μετά τη λήξη της αποζημιώνονται μόνο από τη συμμετοχή τους στην αγορά ηλεκτρικής ενέργειας (άρθρο 3 παρ. 19 ν. 4414/2016 και ΥΑ ΑΠΕΕΚ/Α/Φ1/οικ.172857/22.3.2018, ΦΕΚ Β' 1150), με εκπροσώπηση από ΦοΣΕ ή ΦοΣΕΤεΚ.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 3 παρ. 19 και άρθρο 5 παρ. 5, όπως αναφέρονται στο άρθρο 58 παρ. 1 του ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.taxheaven.gr/law/5261/2025/arthro/58
    quote: '[...] οι οποίοι συνεχίζουν να λειτουργούν μετά την ημερομηνία λήξης της αντίστοιχης σύμβασης και αποζημιώνονται μόνο στο πλαίσιο της συμμετοχής τους στην αγορά ηλεκτρικής ενέργειας, σύμφωνα με την παρ. 19 του άρθρου 3 του παρόντος και την υπό στοιχεία ΑΠΕΕΚ/Α/Φ1/οικ.172857/22.3.2018 απόφαση του Υπουργού Περιβάλλοντος και Ενέργειας (Β'' 1150)'
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα FiT που φτάνουν στο τέλος των 20 ή 27 ετών.
  model_impact: 'Το μοντέλο χρειάζεται δύο περιόδους ανά πάρκο: με σύμβαση και μετά τη σύμβαση (τιμές αγοράς). Μετά τη λήξη το πάρκο εμπίπτει στους «Φ/Β που συμμετέχουν απευθείας στην αγορά χωρίς ενίσχυση» του άρθρου 11Γ παρ. 4 και 5.'
  suggested_parameter:
    name: post_contract_revenue_basis
    default: market_price
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Δεν διάβασα την παρ. 19 του άρθρου 3 ούτε την ΥΑ του 2018, μόνο την παραπομπή του νόμου σε αυτές.
  enforced_by: SupportScheme.end_year.
- id: REG-B-036
  topic: support_merchant_ppa
  title: 'Πάρκα χωρίς ενίσχυση (merchant, PPA): όλα τα έσοδα σε τιμές αγοράς ή σύμβασης, η μπαταρία επιτρέπεται'
  requirement: Σταθμοί ΑΠΕ μπορούν να λειτουργούν χωρίς σύμβαση ενίσχυσης, ως Συμμετέχοντες ή μέσω ΦοΣΕ (άρθρο 12Α ν. 4414/2016). Το άρθρο 11Γ παρ. 4 και 5 ν. 4685/2020 καλύπτει ρητά τα «Φ/Β που συμμετέχουν απευθείας στην αγορά ηλεκτρικής ενέργειας και δεν λαμβάνουν λειτουργική ενίσχυση» για προσθήκη αποθήκευσης, χωρίς όριο ημερομηνίας λειτουργίας. Διμερή συμβόλαια (PPA) διέπονται από το συμβατικό δίκαιο. Ο τρόπος που μια μπαταρία επηρεάζει το PPA εξαρτάται από τους όρους του.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 4 και 5, και ν. 4414/2016 άρθρο 12Α (ν. 4643/2019 άρθρο 20)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: Για τους φωτοβολταϊκούς σταθμούς της παρ. 1, τους φωτοβολταϊκούς σταθμούς αυτοκατανάλωσης, καθώς και τους φωτοβολταϊκούς σταθμούς που συμμετέχουν απευθείας στην αγορά ηλεκτρικής ενέργειας και δεν λαμβάνουν λειτουργική ενίσχυση, σε περίπτωση υποβολής αιτήματος για την προσθήκη μονάδων αποθήκευσης, σύμφωνα με το παρόν, οι Βεβαιώσεις Παραγωγού, η Οριστική Προσφορά Σύνδεσης [...] καθώς και κάθε άλλη άδεια ή έγκριση τροποποιούνται κατά προτεραιότητα
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα merchant, πάρκα με PPA, πάρκα μετά τη λήξη της σύμβασης FiT.
  model_impact: 'Η καθαρότερη περίπτωση: η μπαταρία αποτιμάται με διαφορά τιμών (μεσημέρι προς βράδυ) και με ενέργεια που σώζεται από περικοπές. Αν επιλεγεί 11Β προστίθεται και φόρτιση από το δίκτυο.'
  suggested_parameter:
    name: merchant_battery_revenue_basis
    default: market_price_spread_plus_curtailment_recovery
    alternatives:
    - ppa_terms (αν υπάρχει PPA με ρήτρες προφίλ ή όγκου)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Δεν βρήκα ελληνική ρύθμιση για το πώς λογίζεται η ενέργεια μπαταρίας σε PPA με Εγγυήσεις Προέλευσης. Η ΚΥΑ ΥΠΕΝ/ΔΑΠΕΕΚ/88889/2592/14.8.2024 (ΦΕΚ Β' 4918) για διμερείς συμβάσεις και προτεραιότητα σύνδεσης αναφέρεται στον νόμο αλλά δεν τη διάβασα. Τα άρθρα του Κανονισμού 2019/943 για PPA (19α) δεν τα διάβασα.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-037
  topic: subsidy
  title: Πρόγραμμα «Συστήματα Αποθήκευσης στις Επιχειρήσεις» (ΤΑΑ, 153,74 εκατ. ευρώ)
  requirement: Προκήρυξη με ΚΥΑ ΥΠΕΝ/ΔΕΠΕΑ/140608/2339/18.12.2024. Δαπάνη 153.740.000 ευρώ από το Πρόγραμμα Δημοσίων Επενδύσεων, χρηματοδότηση από το Ταμείο Ανάκαμψης και Ανθεκτικότητας. Αφορά επιχειρήσεις που εγκαθιστούν αποθήκευση μαζί με Φ/Β αυτοκατανάλωσης. Τροποποιήθηκε με τις ΥΠΕΝ/ΔΕΠΕΑ/61080/391/2.6.2026 και ΥΠΕΝ/ΔΕΠΕΑ/96969/652/28.8.2026.
  source:
    type: ministerial_decision
    citation: ΚΥΑ ΥΠΕΝ/ΔΕΠΕΑ/140608/2339/18.12.2024 «Προκήρυξη του Προγράμματος Συστήματα Αποθήκευσης στις Επιχειρήσεις» (ΦΕΚ Β' 6978/19.12.2024)
    url: https://www.taxheaven.gr/circulars/49096/ypen-depea-140608-2339-18-12-2024
    quote: '[...] προκαλείται δαπάνη στον κρατικό προϋπολογισμό η οποία ανέρχεται σε 153.740.000,00 €, η οποία θα καλυφθεί από πόρους του Προγράμματος Δημοσίων Επενδύσεων (ΣΑΤΑ 075) του Υπουργείου Περιβάλλοντος και Ενέργειας'
  date_issued: '2024-12-18'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Επιχειρήσεις αυτοκαταναλωτές. Κατά την ανάγνωσή μου όχι Φ/Β πάρκα που πωλούν στο δίκτυο.
  model_impact: 'Δεν πρέπει να υπολογίζεται επιδότηση από αυτό το πρόγραμμα για πάρκο παραγωγής. Σχετίζεται έμμεσα: οι αιτήσεις του προγράμματος έχουν προτεραιότητα στη σειρά εξέτασης του ΔΕΔΔΗΕ (άρθρο 11Γ παρ. 4).'
  suggested_parameter:
    name: capex_subsidy_rate_existing_programme
    default: '0.0'
    alternatives: []
  notes: 'Διάβασα μόνο το προοίμιο και το ποσό. Οι δικαιούχοι, τα ποσοστά ενίσχυσης και οι όροι βρίσκονται στο παράρτημα (οδηγός) που δεν διάβασα. Στοιχεία Τύπου: 209 προσωρινοί δικαιούχοι με περίπου 8,2 εκατ. ευρώ. Η περιγραφή δικαιούχων προέρχεται από δευτερογενή πηγή (σημείωμα PwC).'
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-038
  topic: pending_change
  title: 'Εξαγγελία: τέσσερα προγράμματα επιδότησης μπαταριών συνολικά 200 εκατ. ευρώ, ένα για Φ/Β πάρκα 11Α και 11Γ'
  requirement: 'Κατά δημοσίευμα της 16.10.2026 το ΥΠΕΝ σχεδιάζει τέσσερα προγράμματα των 50 εκατ. ευρώ με προκηρύξεις έως το τέλος του 2026: (1) αποθήκευση σε υφιστάμενα ή νέα Φ/Β πάρκα κατηγοριών 11Α και 11Γ, με αποκλεισμό των 11Β, επιλογή με μειοδοτικό διαγωνισμό επί της αιτούμενης επενδυτικής ενίσχυσης, (2) αυτόνομες μπαταρίες, (3) επιχειρήσεις με ποσοστό 30 έως 40%, (4) ΟΤΑ με 50%. Χρηματοδότηση από δημόσιους πόρους μέσω της ρήτρας διαφυγής για την ενέργεια.'
  source:
    type: secondary_press
    citation: 'powergame.gr, 16.10.2026, «Μπαταρίες: Ξεκλειδώνουν εντός του 2026 οι επιδοτήσεις, ποιοι επενδυτές αποκτούν προβάδισμα»'
    url: https://www.powergame.gr/green-power/1436120/bataries-xekleidonoun-entos-tou-2026-oi-epidotiseis-poioi-ependytes-apoktoun-provadisma/
    quote: ''
  date_issued: '2026-10-16'
  status: proposed
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Υφιστάμενα και νέα Φ/Β πάρκα που προσθέτουν μπαταρία χωρίς φόρτιση από το δίκτυο (11Α) ή με κοινό σταθμό αποθήκευσης (11Γ).
  model_impact: 'Πιθανή επιδότηση CAPEX για την περίπτωση που εξετάζει το DSS, αλλά χωρίς γνωστό ποσοστό. Βασικό σενάριο: χωρίς επιδότηση. Εναλλακτικό: ποσοστό ως παράμετρος. Η επιλεξιμότητα ευνοεί την επιλογή 11Α έναντι 11Β.'
  suggested_parameter:
    name: capex_subsidy_rate_new_programme
    default: '0.0'
    alternatives:
    - 'άγνωστο: θα προκύψει από μειοδοτικό διαγωνισμό, δεν έχει προκηρυχθεί'
  notes: Μόνο δημοσιογραφική πληροφορία. Δεν υπάρχει ΦΕΚ, νομική βάση ή επίσημη ανακοίνωση που να βρήκα. Δεν είναι γνωστό αν η επιδότηση θα μειώνει τη λειτουργική ενίσχυση (βλ. REG-B-039).
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-039
  topic: subsidy
  title: Επενδυτική ενίσχυση μειώνει τη λειτουργική ενίσχυση (Συντελεστής Απομείωσης Κεφαλαίου)
  requirement: Όταν ο κάτοχος σταθμού ΑΠΕ λαμβάνει επενδυτική ενίσχυση (κεφαλαιακή ή ισοδύναμη), τα έσοδα λειτουργικής ενίσχυσης (ΣΕΔΠ ή ΣΕΣΤ) μειώνονται ετησίως κατά ΕΑΛΕ = ΣΑΚ x ΕΕ. Ο κάτοχος οφείλει να δηλώσει την ενίσχυση πριν από την επόμενη μηνιαία εκκαθάριση. Μη δήλωση ή ανακριβής δήλωση επιφέρει τριπλάσια απομείωση.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 3 παρ. 7, 8 και 9 (ΦΕΚ Α' 149/09.08.2016)
    url: https://www.taxheaven.gr/law/4414/2016/arthro/3
    quote: Για τις περιπτώσεις κατόχων σταθμών Α.Π.Ε. και Σ.Η.Θ.Υ.Α. οι οποίοι λαμβάνουν Επενδυτική Ενίσχυση, υπό τη μορφή κεφαλαιακής ενίσχυσης ή ενίσχυση άλλης ισοδύναμης μορφής η οποία ανάγεται σε όρους κεφαλαιακής ενίσχυσης, τα έσοδα της Λειτουργικής Ενίσχυσης στη βάση Διαφορικής Προσαύξησης ή Σταθερής Τιμής, απομειώνονται κατά το ποσό που υπολογίζεται με βάση ένα Συντελεστή Απομείωσης του Κεφαλαίου (Σ.Α.Κ.).
  date_issued: '2016-08-09'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ΣΕΔΠ ή ΣΕΣΤ που λαμβάνουν επιδότηση κεφαλαίου. Η εφαρμογή σε επιδότηση που αφορά μόνο την μπαταρία είναι ασαφής.
  model_impact: 'Συντηρητική παραδοχή: επιδότηση CAPEX για την μπαταρία μειώνει ισόποσα (σε παρούσα αξία) τη λειτουργική ενίσχυση του πάρκου, άρα το καθαρό όφελος της επιδότησης μπορεί να είναι μικρό. Να υπάρχει διακόπτης στο μοντέλο.'
  suggested_parameter:
    name: capex_subsidy_reduces_operating_aid
    default: 'true'
    alternatives:
    - false (αν η επιδότηση θεωρηθεί ότι αφορά μόνο την αποθήκευση, της οποίας η ενέργεια δεν παίρνει ενίσχυση)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Αρχικό κείμενο 2016. Δεν βρήκα κανόνα ή ερμηνεία για επιδότηση αποθήκευσης σε σταθμό 11Α. Για πάρκα FiT του ν. 3468/2006 δεν έλεγξα αντίστοιχη διάταξη σώρευσης.
  enforced_by: Προειδοποίηση στον έλεγχο συμμόρφωσης όταν δίνεται επιδότηση CAPEX (CHK-12).
- id: REG-B-040
  topic: subsidy
  title: 'Αυτόνομη αποθήκευση: διαγωνισμοί με ενίσχυση και εμπορική οδός 4.700 MW, όρια και προτεραιότητες'
  requirement: 'Οι αυτόνομοι σταθμοί αποθήκευσης αναπτύσσονται με δύο οδούς. Α) Ανταγωνιστικές διαδικασίες ΡΑΑΕΥ με επενδυτική και λειτουργική ενίσχυση (άρθρο 143ΣΤ ν. 4001/2011), όπου τα έσοδα αγοράς πάνω από το ετήσιο επιτρεπόμενο έσοδο ανακτώνται. Β) Εμπορική οδός χωρίς ενίσχυση με προτεραιότητα σύνδεσης: ανώτατο όριο 3.800 MW στο ΕΣΜΗΕ και 900 MW στο ΕΔΔΗΕ (ΚΥΑ ΥΠΕΝ/ΓΔΕ/28255/1143/13.3.2025, ΦΕΚ Β'' 1248). Για αποθήκευση κοινού αιτήματος με Φ/Β (11Γ παρ. 5) δίνεται απόλυτη προτεραιότητα για 1.000 MW. Ισχύει πλαφόν 500 MW ανά πρόσωπο ή όμιλο έως το 2029 για μπαταρίες, εκτός των σταθμών 11Α.'
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ παρ. 5.δ (ν. 5325/2026 άρθρο 57), άρθρο 11Δ παρ. 8 (ν. 5299/2026 άρθρο 56 παρ. 5), ν. 4001/2011 άρθρο 143ΣΤ παρ. 5Α (ν. 5325/2026 άρθρο 58)
    url: https://www.taxheaven.gr/law/5325/2026/arthro/57
    quote: Τα αιτήματα εξετάζονται εναλλάξ σύμφωνα με το δεύτερο εδάφιο, μέχρι την πλήρη κάλυψη του ορίου της συνολικής ισχύος τριών χιλιάδων οκτακοσίων μεγαβάτ (3.800 MW), όπως ορίζεται στο άρθρο 2 της υπό στοιχεία ΥΠΕΝ/ΓΔΕ/28255/1143/13.3.2025 κοινής απόφασης του Υπουργού και της Υφυπουργού Περιβάλλοντος και Ενέργειας
  date_issued: '2026-07-31'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Αυτόνομοι σταθμοί αποθήκευσης. Έμμεσα όλα τα πάρκα, επειδή ο ανταγωνισμός μπαταριών μειώνει τη διαφορά τιμών μεσημέρι προς βράδυ.
  model_impact: Η μαζική είσοδος αυτόνομων μπαταριών (στόχος γιγαβάτ έως το 2028 έως 2030) θα συμπιέσει τα περιθώρια arbitrage και θα μειώσει τις περικοπές. Το μοντέλο πρέπει να έχει σενάρια μείωσης της διαφοράς τιμών και των περικοπών με τον χρόνο.
  suggested_parameter:
    name: standalone_bess_buildout_scenario_gw_2030
    default: '4.3'
    alternatives:
    - 6.8 (κυβερνητική εξαγγελία κατά τον Τύπο)
    - 3.0 (στόχος 2028 κατά τον Τύπο)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Το όριο 900 MW ΕΔΔΗΕ προκύπτει από το κείμενο του ν. 5261/2025 άρθρο 56. Το άθροισμα 4.700 MW είναι δικός μου υπολογισμός και συμφωνεί με τον Τύπο. Τρεις διαγωνισμοί ΡΑΑΕΥ με περίπου 900 MW και καθορισμός λειτουργικής ενίσχυσης για 32 σταθμούς το 2026 αναφέρονται μόνο σε δημοσιεύματα. Δεν βρήκα πρόγραμμα δανείων ΕΤΕπ ή Αναπτυξιακής Τράπεζας ειδικά για μπαταρίες σε υφιστάμενα Φ/Β πάρκα, ούτε ειδικό φορολογικό κίνητρο. Ο Αναπτυξιακός Νόμος δεν ελέγχθηκε.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-041
  topic: targets
  title: Στόχοι αναθεωρημένου ΕΣΕΚ για Φ/Β, αιολικά και αποθήκευση
  requirement: 'Το αναθεωρημένο ΕΣΕΚ κυρώθηκε και δημοσιεύτηκε στο ΦΕΚ Β'' 6983/19.12.2024. Στόχοι 2030 κατά δευτερογενείς πηγές: Φ/Β 13,5 GW, χερσαία αιολικά 8,9 GW, υπεράκτια αιολικά 1,9 GW, μπαταρίες 4,325 GW, αντλησιοταμίευση 1,928 GW στο τελικό κείμενο (1,745 GW στο σχέδιο διαβούλευσης), μερίδιο ΑΠΕ στην ηλεκτρική ενέργεια 75,7% στο τελικό κείμενο (76,8% στο σχέδιο). 2035 (έκδοση διαβούλευσης Αυγούστου 2024): Φ/Β 18,5 GW, χερσαία αιολικά 9,5 GW, υπεράκτια 3,9 GW. 2050 (ίδια έκδοση): Φ/Β 35,1 GW, χερσαία αιολικά 13 GW, υπεράκτια 11,8 GW, μπαταρίες 12 GW, αντλησιοταμίευση 5,4 GW.'
  source:
    type: official_report
    citation: Αναθεωρημένο Εθνικό Σχέδιο για την Ενέργεια και το Κλίμα (ΕΣΕΚ), ΦΕΚ Β' 6983/19.12.2024
    url: https://ypen.gov.gr/wp-content/uploads/2025/04/%CE%91%CE%BD%CE%B1%CE%B8%CE%B5%CF%89%CF%81%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF-%CE%95%CE%A3%CE%95%CE%9A-2024-%CE%A6%CE%95%CE%9A-6983.pdf
    quote: ''
  date_issued: '2024-12-19'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Γενικό πλαίσιο για σενάρια αγοράς.
  model_impact: Ο στόχος Φ/Β 2030 (13,5 GW) έχει ουσιαστικά καλυφθεί ήδη το 2026, ενώ η αποθήκευση υπολείπεται πολύ. Αυτό εξηγεί τις περικοπές και στηρίζει σενάρια υψηλών περικοπών για 2026 έως 2028 και αποκλιμάκωσης όταν μπουν οι μπαταρίες.
  suggested_parameter:
    name: necp_battery_target_2030_gw
    default: '4.325'
    alternatives:
    - 3.1 (προηγούμενο σχέδιο)
  notes: Δεν μπόρεσα να ανοίξω το ΦΕΚ στο ypen.gov.gr (403). Οι αριθμοί προέρχονται από energygame.gr (23.8.2024, έκδοση διαβούλευσης), balkangreenenergynews.com (21.10.2024, τελικό κείμενο) και ανακοινώσεις ΣΕΦ. Οι τιμές 2035 και 2050 είναι από την έκδοση διαβούλευσης και ίσως διαφέρουν στο τελικό. Αντιφάσεις μεταξύ εκδόσεων για την αντλησιοταμίευση και το μερίδιο ΑΠΕ.
  enforced_by: Σημεία αγκύρωσης των σεναρίων (registers/scenarios.yaml).
- id: REG-B-042
  topic: targets
  title: Εγκατεστημένη ισχύς Φ/Β, αιολικών και μπαταριών (στοιχεία 2025 και 2026)
  requirement: 'Φ/Β: 11.538 MWp διασυνδεδεμένα στο τέλος του 2025, με 1.840 MWp νέα το 2025 (στατιστικά ΣΕΦ). Περίπου 13 GWp έως τον Μάιο 2026 κατά τον ΣΕΦ. Αιολικά: 6.017 MW στο τέλος του Α'' εξαμήνου 2026 (ΕΛΕΤΑΕΝ). Μπαταρίες: περίπου 530 MW ηλεκτρισμένα στο σύστημα του ΑΔΜΗΕ και σχεδόν 100 MW στο δίκτυο του ΔΕΔΔΗΕ (δήλωση υφυπουργού, καλοκαίρι 2026). Πάνω από 700 MW σε λειτουργία ή δοκιμαστική λειτουργία τον Οκτώβριο και Νοέμβριο 2026, με προοπτική 1 GW έως το τέλος του 2026. Από τα 900 MW των διαγωνισμών ΡΑΑΕΥ περίπου 400 MW ήταν συνδεδεμένα στα τέλη Σεπτεμβρίου 2026, συν περίπου 100 MW μικρών μπαταριών σε αυτοκατανάλωση. Αντλησιοταμίευση σε λειτουργία: 699 MW (Σφηκιά και Θησαυρός, ΔΕΗ). Υπό κατασκευή: Αμφιλοχία 680 MW, με ολοκλήρωση κατασκευής το 2026 και κανονική λειτουργία το 2027. Αδειοδοτημένα έως τον Αύγουστο 2026: 55,3 GW αυτόνομων μπαταριών, 11,8 GW μπαταριών σε σταθμούς 11Β, 16,7 GW αντλησιοταμίευσης. Προβλέψεις μπαταριών 2030: 8,6 GW (ΣΕΦ, σενάριο επιτάχυνσης), 4 έως 5 GW (Aurora).
    Μελέτη Επάρκειας ΑΔΜΗΕ: ανάγκη αποθήκευσης 3 GW έως το 2030 μαζί με αντλησιοταμίευση (παλαιότερο δημοσίευμα).'
  source:
    type: secondary_press
    citation: ΣΕΦ (HELAPCO) στατιστικά 2025 μέσω euro2day.gr, ΕΛΕΤΑΕΝ στατιστική Α' εξαμήνου 2026 μέσω ienergeia.gr, ess-news.com (29.9.2026), balkangreenenergynews.com, δημοσιεύματα protothema.gr, newmoney.gr, b2green.gr, energypress.gr
    url: https://www.euro2day.gr/news/economy/article/2353774/pano-apo-165-dis-eyro-oi-ependyseis-sta-fotovoltai.html
    quote: ''
  date_issued: '2026-10-31'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Γενικό πλαίσιο για σενάρια αγοράς.
  model_impact: Με περίπου 13 GWp Φ/Β και λιγότερο από 1 GW μπαταριών, οι μεσημβρινές τιμές και οι περικοπές θα μείνουν δυσμενείς βραχυπρόθεσμα. Η αξία της μπαταρίας πίσω από τον μετρητή είναι μέγιστη τώρα και φθίνει όσο προστίθεται αποθήκευση στο σύστημα.
  suggested_parameter:
    name: installed_pv_gw_mid_2026
    default: '13.0'
    alternatives:
    - 11.5 (τέλος 2025, διασυνδεδεμένα, ΣΕΦ)
    - 'λοιπές τιμές για σενάρια: αιολικά 6.0 GW (μέσα 2026), μπαταρίες 0.6 έως 0.7 GW (φθινόπωρο 2026), αντλησιοταμίευση 0.699 GW'
  notes: 'Καμία επίσημη πηγή (ΔΑΠΕΕΠ, ΑΔΜΗΕ) δεν ήταν προσβάσιμη: dapeep.gr και ypen.gov.gr επέστρεψαν 403. Το «περίπου 13 GWp έως Μάιο 2026» δεν συμβιβάζεται εύκολα με τα 11.538 MWp τέλους 2025, ίσως περιλαμβάνει έργα κατασκευασμένα αλλά μη συνδεδεμένα ή άλλη βάση μέτρησης. Τα στοιχεία μπαταριών είναι δηλώσεις και δημοσιεύματα και διαφέρουν μεταξύ τους (περίπου 630 MW ηλεκτρισμένα το καλοκαίρι, περίπου 500 MW συνδεδεμένα τον Σεπτέμβριο, πάνω από 700 MW τον Νοέμβριο), ανάλογα με το αν μετρούν ηλέκτριση, δοκιμαστική ή εμπορική λειτουργία. Άλλη πηγή δίνει 696 MW για την αντλησιοταμίευση. Το αποθετήριο έχει το αρχείο data/processed/installed_capacity_gr.csv από άλλη εργασία, δεν το διασταύρωσα. Το Δεκαετές Πρόγραμμα Ανάπτυξης του ΑΔΜΗΕ δεν διαβάστηκε.'
  enforced_by: Σημεία εκκίνησης των σεναρίων (registers/scenarios.yaml).
- id: REG-B-043
  topic: eu_law
  title: Αμφίδρομες συμβάσεις επί διαφοράς για νέα καθεστώτα στήριξης από 17.7.2027
  requirement: Τα καθεστώτα άμεσης στήριξης τιμών για επενδύσεις σε νέες εγκαταστάσεις παραγωγής (μεταξύ άλλων ηλιακές) παίρνουν τη μορφή αμφίδρομων συμβάσεων επί διαφοράς ή ισοδύναμων, για συμβάσεις που συνάπτονται από 17.7.2027. Η συμμετοχή είναι προαιρετική. Ο σχεδιασμός πρέπει να διατηρεί κίνητρα αποδοτικής λειτουργίας και να μη στρεβλώνει τις αποφάσεις κατανομής και προσφορών.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943 άρθρο 19δ, όπως προστέθηκε με τον Κανονισμό (ΕΕ) 2024/1747 (ενοποιημένη έκδοση 16.07.2024)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Το πρώτο εδάφιο ισχύει για συμβάσεις στο πλαίσιο καθεστώτων άμεσης στήριξης των τιμών για επενδύσεις σε νέα παραγωγή που συνάπτονται την ή μετά τις 17 Ιουλίου 2027
  date_issued: '2024-06-13'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Νέα έργα μετά τα μέσα του 2027. Όχι υφιστάμενες συμβάσεις FiT ή ΣΕΔΠ.
  model_impact: Δεν αλλάζει τα έσοδα υφιστάμενων πάρκων. Η ελληνική ΣΕΔΠ λειτουργεί ήδη αμφίδρομα (επιστροφή όταν η ΕΤΑ υπερβαίνει την ΤΑ).
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Ο χαρακτηρισμός της ΣΕΔΠ ως αμφίδρομης στηρίζεται σε δευτερογενή γνώση (βλ. REG-B-005).
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-044
  topic: eu_law
  title: 'Ευελιξία χωρίς ορυκτά καύσιμα: εκτίμηση αναγκών, ενδεικτικός εθνικός στόχος, καθεστώτα στήριξης'
  requirement: Η ρυθμιστική αρχή εκδίδει ανά διετία έκθεση αναγκών ευελιξίας για ορίζοντα 5 έως 10 ετών. Έξι μήνες μετά την έκθεση κάθε κράτος μέλος ορίζει ενδεικτικό εθνικό στόχο για ευελιξία χωρίς ορυκτά καύσιμα, με ειδικές συνεισφορές απόκρισης ζήτησης και αποθήκευσης. Αν οι επενδύσεις δεν επαρκούν, τα κράτη μπορούν να εφαρμόσουν καθεστώτα στήριξης με πληρωμές για διαθέσιμη ικανότητα ευελιξίας, περιορισμένα σε νέες επενδύσεις.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943 άρθρα 19ε, 19στ, 19ζ και 19η, όπως προστέθηκαν με τον Κανονισμό (ΕΕ) 2024/1747
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Το αργότερο έξι μήνες μετά την υποβολή της έκθεσης σύμφωνα με το άρθρο 19ε παράγραφος 1 του παρόντος κανονισμού, κάθε κράτος μέλος ορίζει, βάσει της εν λόγω έκθεσης, έναν ενδεικτικό εθνικό στόχο για την ευελιξία χωρίς ορυκτά καύσιμα, συμπεριλαμβανομένης στον εν λόγω στόχο των αντίστοιχων ειδικών συνεισφορών τόσο της απόκρισης ζήτησης όσο και της αποθήκευσης ενέργειας.
  date_issued: '2024-06-13'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Κράτος και ρυθμιστής. Έμμεσα νέες επενδύσεις αποθήκευσης.
  model_impact: Πιθανή μελλοντική πηγή εσόδου διαθεσιμότητας για νέες μπαταρίες. Δεν υπάρχει σήμερα στην Ελλάδα, άρα μηδέν στο βασικό σενάριο.
  suggested_parameter:
    name: flexibility_capacity_payment_eur_per_mw_year
    default: '0'
    alternatives:
    - θετική τιμή μόνο ως υποθετικό σενάριο
  notes: Δεν βρήκα ελληνική έκθεση αναγκών ευελιξίας ή εθνικό στόχο ευελιξίας κατά τα άρθρα 19ε και 19στ. Το άρθρο 7α (προϊόν εξομάλυνσης αιχμών) ενεργοποιείται μόνο σε κηρυγμένη κρίση τιμών.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-045
  topic: eu_law
  title: 'Οδηγία (ΕΕ) 2019/944 και RED III: αποθήκευση χωρίς διπλές χρεώσεις, ενσωμάτωση ΑΠΕ'
  requirement: 'Οδηγία 2019/944 άρθρο 15 παρ. 5: οι ενεργοί πελάτες με εγκαταστάσεις αποθήκευσης έχουν δικαίωμα σύνδεσης σε εύλογο χρόνο, δεν υφίστανται διπλή επιβάρυνση για αποθηκευμένη ενέργεια που μένει εντός των εγκαταστάσεών τους και μπορούν να παρέχουν πολλές υπηρεσίες ταυτόχρονα. Οδηγία 2018/2001 όπως τροποποιήθηκε από την (ΕΕ) 2023/2413 (RED III): δεσμευτικός ενωσιακός στόχος ΑΠΕ τουλάχιστον 42,5% το 2030 (άρθρο 3) και υποχρεώσεις διευκόλυνσης της ενσωμάτωσης ΑΠΕ στο σύστημα (άρθρο 20α).'
  source:
    type: eu_directive
    citation: Οδηγία (ΕΕ) 2019/944 άρθρο 15 παρ. 5 (όπως ισχύει μετά την Οδηγία (ΕΕ) 2024/1711), Οδηγία (ΕΕ) 2018/2001 άρθρα 3 και 20α (όπως τροποποιήθηκε με την Οδηγία (ΕΕ) 2023/2413)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019L0944-20240716
    quote: δεν υποβάλλονται σε καμία διπλή επιβάρυνση, συμπεριλαμβανομένων των τελών δικτύου, για την αποθηκευμένη ηλεκτρική ενέργεια που παραμένει εντός των εγκαταστάσεών τους και όταν παρέχουν υπηρεσίες ευελιξίας σε διαχειριστές συστημάτων
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Κυρίως αυτοκαταναλωτές. Για πάρκα παραγωγής έχει ερμηνευτική αξία.
  model_impact: Δεν δίνει άμεσα αριθμητική παράμετρο. Στηρίζει την παραδοχή ότι η ενέργεια που αποθηκεύεται πίσω από τον μετρητή και δεν περνά από το δίκτυο δεν επιβαρύνεται με χρεώσεις δικτύου.
  suggested_parameter:
    name: grid_charges_on_behind_meter_storage_eur_mwh
    default: '0'
    alternatives: []
  notes: Οι οδηγίες χρειάζονται ενσωμάτωση. Η ενσωμάτωση για την αποθήκευση έγινε με τον ν. 4951/2022 (τίτλος κεφαλαίου που είδα), δεν έλεγξα την ενσωμάτωση της 2024/1711 ούτε της RED III. Οι χρεώσεις (ΥΚΩ, ΕΤΜΕΑΡ, χρήσης δικτύου) για φόρτιση από το δίκτυο σε σταθμούς 11Β ρυθμίζονται στον ν. 4951/2022 και δεν τις ανέλυσα.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-046
  topic: tax
  title: Φόρος εισοδήματος νομικών προσώπων 22%
  requirement: Τα κέρδη από επιχειρηματική δραστηριότητα νομικών προσώπων και νομικών οντοτήτων φορολογούνται με 22% για τα εισοδήματα του φορολογικού έτους 2021 και εφεξής.
  source:
    type: law
    citation: ν. 4172/2013 (Κώδικας Φορολογίας Εισοδήματος) άρθρο 58 παρ. 1 περ. α
    url: https://www.taxheaven.gr/law/4172/2013/arthro/58
    quote: Για τα εισοδήματα του φορολογικού έτους 2021 και εφεξής ο συντελεστής του προηγούμενου εδαφίου μειώνεται σε είκοσι δύο τοις εκατό (22%).
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα που ανήκουν σε εταιρείες (ΑΕ, ΙΚΕ, ΕΠΕ, ΟΕ, ΕΕ).
  model_impact: Συντελεστής φόρου στα κέρδη του μοντέλου. Για φυσικά πρόσωπα (ατομικές επιχειρήσεις, αγρότες) ισχύει η κλίμακα φυσικών προσώπων και όχι το 22%.
  suggested_parameter:
    name: corporate_income_tax_rate
    default: '0.22'
    alternatives:
    - κλίμακα φυσικών προσώπων για ατομικές επιχειρήσεις (δεν ελέγχθηκε)
  notes: Διαβάστηκε στο taxheaven.gr, που εμφανίζει ενημερωμένο κείμενο του ΚΦΕ. Δεν επαλήθευσα αν υπάρχει μεταγενέστερη αλλαγή συντελεστή για το 2026 ή το 2027, ούτε τον φόρο μερισμάτων και την προκαταβολή φόρου.
  enforced_by: Υπόθεση ASM-F10.
- id: REG-B-047
  topic: tax
  title: 'Φορολογική απόσβεση μπαταρίας: 10% ετησίως ως μηχανήματα και εξοπλισμός'
  requirement: Ο πίνακας φορολογικών αποσβέσεων δεν έχει ειδική κατηγορία για μπαταρίες. Η κατηγορία «Μηχανήματα, εξοπλισμός εκτός Η/Υ και λογισμικού» έχει συντελεστή 10% ανά φορολογικό έτος, το ίδιο και τα «Λοιπά πάγια στοιχεία». Τα «Κτίρια, κατασκευές, εγκαταστάσεις [...] αποθήκες και σταθμοί» έχουν 4%.
  source:
    type: law
    citation: ν. 4172/2013 άρθρο 24 παρ. 4 (πίνακας συντελεστών)
    url: https://www.taxheaven.gr/law/4172/2013/arthro/24
    quote: Μηχανήματα, εξοπλισμός εκτός Η/Υ και λογισμικού 10%
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλες οι επιχειρήσεις που αγοράζουν μπαταρία.
  model_impact: Απόσβεση 10 ετών σταθερής μεθόδου για το CAPEX της μπαταρίας. Επηρεάζει τη φορολογική ασπίδα και την καθαρή παρούσα αξία.
  suggested_parameter:
    name: battery_tax_depreciation_rate
    default: '0.10'
    alternatives:
    - 0.04 (αν η Φορολογική Διοίκηση θεωρήσει το σύστημα μέρος εγκατάστασης ή σταθμού, δεν βρέθηκε ερμηνευτική εγκύκλιος)
  notes: Η κατάταξη της μπαταρίας στα «μηχανήματα, εξοπλισμός» είναι δική μου ανάγνωση του πίνακα. Δεν βρήκα εγκύκλιο ΑΑΔΕ ειδικά για συστήματα αποθήκευσης. Δεν έλεγξα προσαυξημένες εκπτώσεις ή κίνητρα πράσινων επενδύσεων ούτε τον Αναπτυξιακό Νόμο.
  enforced_by: Υπόθεση ASM-F11.
- id: REG-B-048
  topic: tax
  title: 'Ειδικό τέλος 3% ΑΠΕ: οι Φ/Β παραγωγοί απαλλάσσονται, με εξαίρεση τους κοινούς διαγωνισμούς'
  requirement: 'Κάθε παραγωγός ΑΠΕ επιβαρύνεται με ειδικό τέλος 3% επί των εσόδων προ ΦΠΑ (ή επί της Τιμής Αναφοράς για σταθμούς του ν. 4414/2016). Οι παραγωγοί από φωτοβολταϊκά συστήματα απαλλάσσονται. Εξαίρεση: Φ/Β που λαμβάνουν λειτουργική ενίσχυση μετά από συμμετοχή σε κοινή ανταγωνιστική διαδικασία (αιολικά και Φ/Β μαζί) επιβαρύνονται με 3% επί του ποσού που προκύπτει με βάση την Τιμή Αναφοράς.'
  source:
    type: law
    citation: ν. 3468/2006 άρθρο 25 παρ. Α.1, όπως αντικαταστάθηκε με το άρθρο 3 του ν. 4585/2018 (ΦΕΚ Α' 216/24.12.2018)
    url: https://www.taxheaven.gr/law/4585/2018/arthro/3
    quote: Με την επιφύλαξη του επόμενου εδαφίου, οι παραγωγοί ηλεκτρικής ενέργειας από συστήματα Α.Π.Ε. σε κτίρια ή από φωτοβολταϊκά συστήματα και οι αυτοπαραγωγοί του άρθρου 14Α απαλλάσσονται από την καταβολή του ειδικού τέλους.
  date_issued: '2018-12-24'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: 'Φ/Β πάρκα: απαλλαγή. Φ/Β από κοινούς διαγωνισμούς ΡΑΕ: τέλος 3%.'
  model_impact: Για τα περισσότερα Φ/Β πάρκα το ειδικό τέλος είναι μηδέν. Για Φ/Β κοινών διαγωνισμών αφαιρείται 3% επί (ΤΑ x ενέργεια). Δεν είναι σαφές αν η ενέργεια της μπαταρίας που πωλείται σε τιμή αγοράς υπάγεται στο τέλος.
  suggested_parameter:
    name: special_res_levy_rate_pv
    default: '0.0'
    alternatives:
    - 0.03 (Φ/Β κοινών ανταγωνιστικών διαδικασιών, ή αν μεταγενέστερη τροποποίηση κατάργησε την απαλλαγή)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η διάταξη διαβάστηκε όπως ίσχυε το 2018. Αποσπάσματα αναζήτησης δείχνουν μεταγενέστερη διατύπωση που αναφέρεται σε σταθμούς που «δεν έχουν επιλεγεί σε ανταγωνιστικές διαδικασίες ή λειτουργούν σύμφωνα με το άρθρο 12Α» και ΥΑ του 2024 (ΦΕΚ Β' 4844/22.08.2024) για την απόδοση του τέλους. Δεν μπόρεσα να ανοίξω το ισχύον ενοποιημένο κείμενο (στο taxheaven η παρ. Α.1 εμφανίζεται κενή). Να επιβεβαιωθεί.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-049
  topic: tax
  title: Έκτακτες εισφορές και μηχανισμοί ανάκτησης εσόδων του παρελθόντος
  requirement: 'Ιστορικό ρυθμιστικού κινδύνου: (α) Έκτακτη εισφορά 6% επί των πωλήσεων του 2020 για σταθμούς ΑΠΕ που τέθηκαν σε λειτουργία έως 31.12.2015. (β) Προσωρινός Μηχανισμός Επιστροφής Μέρους Εσόδων Αγοράς Επόμενης Ημέρας, με εφαρμογή μετά την 1.7.2022 και αρχική λήξη 1.6.2023, με παρακράτηση εσόδων πάνω από ρυθμιζόμενο επίπεδο ανά τεχνολογία.'
  source:
    type: law
    citation: ν. 4759/2020 άρθρο 157 παρ. 1 (έκτακτη εισφορά) και ν. 4425/2016 άρθρο 12Α (προστέθηκε με ν. 4951/2022 άρθρο 122, ΦΕΚ Α' 129/04.07.2022)
    url: https://www.taxheaven.gr/law/4759/2020/arthro/157
    quote: Η έκτακτη εισφορά υπολογίζεται ως εκατοστιαίο ποσοστό επί του, προ Φ.Π.Α., τιμήματος πώλησης ηλεκτρικής ενέργειας [...] για τις πωλήσεις ηλεκτρικής ενέργειας που λαμβάνουν χώρα κατά το χρονικό διάστημα από 1.1.2020 έως 31.12.2020 ή τιμολογούνται στις μηνιαίες εκκαθαρίσεις του έτους 2020 και ανέρχεται σε ποσοστό έξι τοις εκατό (6%) για όλες τις κατηγορίες παραγωγών.
  date_issued: ''
  status: repealed
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: 'Ιστορικά: πάρκα FiT έως 2015 (εισφορά 2020), όλοι οι συμμετέχοντες στην ΑΕΗ (μηχανισμός 2022 έως 2023).'
  model_impact: Δεν υπάρχει ενεργή έκτακτη εισφορά ή ανώτατο όριο εσόδων που να βρήκα για το 2026. Προτείνεται σενάριο ευαισθησίας ρυθμιστικού κινδύνου (π.χ. εφάπαξ μείωση εσόδων ή πλαφόν σε υψηλές τιμές), επειδή τα έσοδα της μπαταρίας προέρχονται ακριβώς από ώρες υψηλών τιμών.
  suggested_parameter:
    name: regulatory_clawback_scenario_enabled
    default: 'false'
    alternatives:
    - true (σενάριο ευαισθησίας με ανώτατο όριο τιμής πώλησης τις ώρες αιχμής)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Ο μηχανισμός επιστροφής παρατάθηκε πέραν του Ιουνίου 2023 κατά τη μνήμη του Τύπου (έως τέλος 2023), κάτι που δεν επαλήθευσα. Η εισφορά αλληλεγγύης 2012 έως 2014 στα Φ/Β δεν ελέγχθηκε. Ημερομηνία ΦΕΚ του ν. 4759/2020 δεν επαληθεύτηκε.
  enforced_by: Πλαίσιο. Δεν επιβάλλεται από τον κώδικα.
- id: REG-B-050
  topic: storage_remuneration
  title: 'Σταθμός 11Α με ΣΕΔΠ: πώς εκκαθαρίζονται η προσαύξηση και η ενέργεια της μπαταρίας (τι ορίζεται και τι όχι)'
  requirement: 'Ορίζεται ρητά: (α) η σύμβαση ΣΕΔΠ διέπει μόνο την ενέργεια που εγχέουν οι Φ/Β μονάδες, (β) η ενέργεια της μπαταρίας αμείβεται με τιμές αγοράς και μετράται με διακριτό πιστοποιημένο μετρητή στην έξοδο της αποθήκευσης, (γ) η λειτουργική ενίσχυση δεν καταβάλλεται για ενέργεια που εγχέεται από τη μονάδα αποθήκευσης. Δεν βρήκα κανονιστικό κείμενο που να ορίζει: πώς προκύπτει μετρητικά η ποσότητα «άμεσης έγχυσης Φ/Β» (μετρητής σημείου σύνδεσης μείον μετρητής μπαταρίας ή ξεχωριστός μετρητής Φ/Β), αν η ενέργεια της μπαταρίας μπαίνει στο ίδιο χαρτοφυλάκιο του ΦοΣΕ, και πώς λογίζονται οι απώλειες. Η Ειδική Τιμή Αγοράς είναι τιμή ανά τεχνολογία που υπολογίζει η ΔΑΠΕΕΠ για όλους τους Φ/Β και όχι ανά σταθμό, άρα δεν εξαρτάται από τον μετρητή του συγκεκριμένου πάρκου.'
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 2 και 3, και απόφαση ΡΑΑΕΥ Ε-12/2026 (ΦΕΚ Β' 324/30.01.2026) για το πρόγραμμα «Απόλλων»
    url: https://raaey.gr/energeia/wp-content/uploads/2026/02/20260200324.pdf
    quote: Λαμβάνοντας υπόψη ότι σύμφωνα με την παρ. 197 της Εγκριτικής Απόφασης η Λειτουργική Ενίσχυση καταβάλλεται για την ηλεκτρική ενέργεια που εγχέεται στο Σύστημα από τη μονάδα ΑΠΕ και όχι από τη μονάδα αποθήκευσης, ο όρος Σταθμός της παρ. 5 του άρθρου 5 της ΚΥΑ αναφέρεται σαφώς στον Σταθμό ΑΠΕ.
  date_issued: '2026-01-30'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ (και αναλογικά ΣΕΣΤ ή FiT) που γίνονται σταθμοί 11Α.
  model_impact: 'Προτεινόμενος τύπος εκκαθάρισης για το μοντέλο, ανά μήνα: Έσοδο = Σ(E_pv_direct x τιμή αγοράς) + (ΤΑ μείον ΕΤΑ) x E_pv_direct_επιλέξιμη + Σ(E_batt_out x τιμή αγοράς) μείον αμοιβή ΦοΣΕ μείον κόστος αποκλίσεων. Όπου E_pv_direct = έγχυση σημείου σύνδεσης μείον έξοδος μπαταρίας, και E_pv_direct_επιλέξιμη εξαιρεί τις ώρες του κανόνα αρνητικών τιμών (REG-B-014). Η ΕΤΑ λαμβάνεται ως εξωγενής μηνιαία τιμή τεχνολογίας. Για ΣΕΣΤ και FiT ο πρώτος και ο δεύτερος όρος γίνονται σταθερή τιμή x E_pv_direct.'
  suggested_parameter:
    name: pv_direct_energy_definition
    default: poc_injection_minus_battery_output_meter
    alternatives:
    - separate_pv_meter (αν ο διαχειριστής απαιτήσει μετρητή στην έξοδο του Φ/Β)
  notes: 'Η αφαίρεση «σημείο σύνδεσης μείον μετρητής μπαταρίας» είναι δική μου λογική συνέπεια του νόμου, όχι κείμενο που διάβασα. Η απόφαση ΡΑΑΕΥ Ε-16/2026 (τροποποίηση Κώδικα ΔΑΠΕΕΠ, ΦΕΚ Β'' 2116/9.4.2026 κατά το e-nomothesia) αφορά τους αυτόνομους σταθμούς αποθήκευσης με ενίσχυση και, στο κείμενο που διάβασα, δεν ρυθμίζει τους σταθμούς ΑΠΕ με ενσωματωμένη αποθήκευση. Το άρθρο 11Γ παρ. 5 επιτρέπει ειδικούς όρους εκπροσώπησης Φ/Β και αποθήκευσης στις Προσφορές και Συμβάσεις Σύνδεσης. Ο ορισμός της ΕΤΑ ως τιμής τεχνολογίας δεν επαληθεύτηκε σε πρωτογενές κείμενο (REG-B-005). Ποιος εκκαθαρίζει την ενέργεια της μπαταρίας για πάρκα FiT και ΣΕΣΤ που σήμερα δεν έχουν ΦοΣΕ παραμένει ανοικτό: πιθανότερα απαιτείται ΦοΣΕ ή ΦοΣΕΤεΚ για το σκέλος της μπαταρίας. Να ζητηθεί γραπτή διευκρίνιση από τη ΔΑΠΕΕΠ.'
  enforced_by: Η εκκαθάριση που υλοποιεί το remuneration είναι η πρόταση αυτής της εγγραφής. Είναι δική μας κατασκευή, όχι κείμενο νόμου.
