- id: REG-B-036
  topic: support_merchant_ppa
  title: 'Πάρκα χωρίς ενίσχυση (merchant, PPA): όλα τα έσοδα σε τιμές αγοράς ή σύμβασης, η μπαταρία επιτρέπεται'
  requirement: Σταθμοί ΑΠΕ μπορούν να λειτουργούν χωρίς σύμβαση ενίσχυσης, ως Συμμετέχοντες ή μέσω ΦοΣΕ (άρθρο 12Α ν. 4414/2016). Το άρθρο 11Γ παρ. 4 και 5 ν. 4685/2020 καλύπτει ρητά τα «Φ/Β που συμμετέχουν απευθείας στην αγορά ηλεκτρικής ενέργειας και δεν λαμβάνουν λειτουργική ενίσχυση» για προσθήκη αποθήκευσης, χωρίς όριο ημερομηνίας λειτουργίας. Διμερή συμβόλαια (PPA) διέπονται από το συμβατικό δίκαιο. Ο τρόπος που μια μπαταρία επηρεάζει το PPA εξαρτάται από τους όρους του.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 4 και 5, και ν. 4414/2016 άρθρο 12Α (ν. 4643/2019 άρθρο 20)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: Για τους φωτοβολταϊκούς σταθμούς της παρ. 1, τους φωτοβολταϊκούς σταθμούς αυτοκατανάλωσης, καθώς και τους φωτοβολταϊκούς σταθμούς που συμμετέχουν απευθείας στην αγορά ηλεκτρικής ενέργειας και δεν λαμβάνουν λειτουργική ενίσχυση, σε περίπτωση υποβολής αιτήματος για την προσθήκη μονάδων αποθήκευσης, σύμφωνα με το παρόν, οι Βεβαιώσεις Παραγωγού, η Οριστική Προσφορά Σύνδεσης [...] καθώς και κάθε άλλη άδεια ή έγκριση τροποποιούνται κατά προτεραιότητα
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα merchant, πάρκα με PPA, πάρκα μετά τη λήξη της σύμβασης FiT.
  model_impact: 'Η καθαρότερη περίπτωση: η μπαταρία αποτιμάται με διαφορά τιμών (μεσημέρι προς βράδυ) και με ενέργεια που σώζεται από περικοπές. Αν επιλεγεί 11Β προστίθεται και φόρτιση από το δίκτυο.'
  suggested_parameter:
    name: merchant_battery_revenue_basis
    default: market_price_spread_plus_curtailment_recovery
    alternatives:
    - ppa_terms (αν υπάρχει PPA με ρήτρες προφίλ ή όγκου)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Δεν βρήκα ελληνική ρύθμιση για το πώς λογίζεται η ενέργεια μπαταρίας σε PPA με Εγγυήσεις Προέλευσης. Η ΚΥΑ ΥΠΕΝ/ΔΑΠΕΕΚ/88889/2592/14.8.2024 (ΦΕΚ Β' 4918) για διμερείς συμβάσεις και προτεραιότητα σύνδεσης αναφέρεται στον νόμο αλλά δεν τη διάβασα. Τα άρθρα του Κανονισμού 2019/943 για PPA (19α) δεν τα διάβασα.
- id: REG-B-037
  topic: subsidy
  title: Πρόγραμμα «Συστήματα Αποθήκευσης στις Επιχειρήσεις» (ΤΑΑ, 153,74 εκατ. ευρώ)
  requirement: Προκήρυξη με ΚΥΑ ΥΠΕΝ/ΔΕΠΕΑ/140608/2339/18.12.2024. Δαπάνη 153.740.000 ευρώ από το Πρόγραμμα Δημοσίων Επενδύσεων, χρηματοδότηση από το Ταμείο Ανάκαμψης και Ανθεκτικότητας. Αφορά επιχειρήσεις που εγκαθιστούν αποθήκευση μαζί με Φ/Β αυτοκατανάλωσης. Τροποποιήθηκε με τις ΥΠΕΝ/ΔΕΠΕΑ/61080/391/2.6.2026 και ΥΠΕΝ/ΔΕΠΕΑ/96969/652/28.8.2026.
  source:
    type: ministerial_decision
    citation: ΚΥΑ ΥΠΕΝ/ΔΕΠΕΑ/140608/2339/18.12.2024 «Προκήρυξη του Προγράμματος Συστήματα Αποθήκευσης στις Επιχειρήσεις» (ΦΕΚ Β' 6978/19.12.2024)
    url: https://www.taxheaven.gr/circulars/49096/ypen-depea-140608-2339-18-12-2024
    quote: '[...] προκαλείται δαπάνη στον κρατικό προϋπολογισμό η οποία ανέρχεται σε 153.740.000,00 €, η οποία θα καλυφθεί από πόρους του Προγράμματος Δημοσίων Επενδύσεων (ΣΑΤΑ 075) του Υπουργείου Περιβάλλοντος και Ενέργειας'
  date_issued: '2024-12-18'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Επιχειρήσεις αυτοκαταναλωτές. Κατά την ανάγνωσή μου όχι Φ/Β πάρκα που πωλούν στο δίκτυο.
  model_impact: 'Δεν πρέπει να υπολογίζεται επιδότηση από αυτό το πρόγραμμα για πάρκο παραγωγής. Σχετίζεται έμμεσα: οι αιτήσεις του προγράμματος έχουν προτεραιότητα στη σειρά εξέτασης του ΔΕΔΔΗΕ (άρθρο 11Γ παρ. 4).'
  suggested_parameter:
    name: capex_subsidy_rate_existing_programme
    default: '0.0'
    alternatives: []
  notes: 'Διάβασα μόνο το προοίμιο και το ποσό. Οι δικαιούχοι, τα ποσοστά ενίσχυσης και οι όροι βρίσκονται στο παράρτημα (οδηγός) που δεν διάβασα. Στοιχεία Τύπου: 209 προσωρινοί δικαιούχοι με περίπου 8,2 εκατ. ευρώ. Η περιγραφή δικαιούχων προέρχεται από δευτερογενή πηγή (σημείωμα PwC).'
- id: REG-B-038
  topic: pending_change
  title: 'Εξαγγελία: τέσσερα προγράμματα επιδότησης μπαταριών συνολικά 200 εκατ. ευρώ, ένα για Φ/Β πάρκα 11Α και 11Γ'
  requirement: 'Κατά δημοσίευμα της 16.10.2026 το ΥΠΕΝ σχεδιάζει τέσσερα προγράμματα των 50 εκατ. ευρώ με προκηρύξεις έως το τέλος του 2026: (1) αποθήκευση σε υφιστάμενα ή νέα Φ/Β πάρκα κατηγοριών 11Α και 11Γ, με αποκλεισμό των 11Β, επιλογή με μειοδοτικό διαγωνισμό επί της αιτούμενης επενδυτικής ενίσχυσης, (2) αυτόνομες μπαταρίες, (3) επιχειρήσεις με ποσοστό 30 έως 40%, (4) ΟΤΑ με 50%. Χρηματοδότηση από δημόσιους πόρους μέσω της ρήτρας διαφυγής για την ενέργεια.'
  source:
    type: secondary_press
    citation: 'powergame.gr, 16.10.2026, «Μπαταρίες: Ξεκλειδώνουν εντός του 2026 οι επιδοτήσεις, ποιοι επενδυτές αποκτούν προβάδισμα»'
    url: https://www.powergame.gr/green-power/1436120/bataries-xekleidonoun-entos-tou-2026-oi-epidotiseis-poioi-ependytes-apoktoun-provadisma/
    quote: ''
  date_issued: '2026-10-16'
  status: proposed
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Υφιστάμενα και νέα Φ/Β πάρκα που προσθέτουν μπαταρία χωρίς φόρτιση από το δίκτυο (11Α) ή με κοινό σταθμό αποθήκευσης (11Γ).
  model_impact: 'Πιθανή επιδότηση CAPEX για την περίπτωση που εξετάζει το DSS, αλλά χωρίς γνωστό ποσοστό. Βασικό σενάριο: χωρίς επιδότηση. Εναλλακτικό: ποσοστό ως παράμετρος. Η επιλεξιμότητα ευνοεί την επιλογή 11Α έναντι 11Β.'
  suggested_parameter:
    name: capex_subsidy_rate_new_programme
    default: '0.0'
    alternatives:
    - 'άγνωστο: θα προκύψει από μειοδοτικό διαγωνισμό, δεν έχει προκηρυχθεί'
  notes: Μόνο δημοσιογραφική πληροφορία. Δεν υπάρχει ΦΕΚ, νομική βάση ή επίσημη ανακοίνωση που να βρήκα. Δεν είναι γνωστό αν η επιδότηση θα μειώνει τη λειτουργική ενίσχυση (βλ. REG-B-039).
- id: REG-B-039
  topic: subsidy
  title: Επενδυτική ενίσχυση μειώνει τη λειτουργική ενίσχυση (Συντελεστής Απομείωσης Κεφαλαίου)
  requirement: Όταν ο κάτοχος σταθμού ΑΠΕ λαμβάνει επενδυτική ενίσχυση (κεφαλαιακή ή ισοδύναμη), τα έσοδα λειτουργικής ενίσχυσης (ΣΕΔΠ ή ΣΕΣΤ) μειώνονται ετησίως κατά ΕΑΛΕ = ΣΑΚ x ΕΕ. Ο κάτοχος οφείλει να δηλώσει την ενίσχυση πριν από την επόμενη μηνιαία εκκαθάριση. Μη δήλωση ή ανακριβής δήλωση επιφέρει τριπλάσια απομείωση.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 3 παρ. 7, 8 και 9 (ΦΕΚ Α' 149/09.08.2016)
    url: https://www.taxheaven.gr/law/4414/2016/arthro/3
    quote: Για τις περιπτώσεις κατόχων σταθμών Α.Π.Ε. και Σ.Η.Θ.Υ.Α. οι οποίοι λαμβάνουν Επενδυτική Ενίσχυση, υπό τη μορφή κεφαλαιακής ενίσχυσης ή ενίσχυση άλλης ισοδύναμης μορφής η οποία ανάγεται σε όρους κεφαλαιακής ενίσχυσης, τα έσοδα της Λειτουργικής Ενίσχυσης στη βάση Διαφορικής Προσαύξησης ή Σταθερής Τιμής, απομειώνονται κατά το ποσό που υπολογίζεται με βάση ένα Συντελεστή Απομείωσης του Κεφαλαίου (Σ.Α.Κ.).
  date_issued: '2016-08-09'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ΣΕΔΠ ή ΣΕΣΤ που λαμβάνουν επιδότηση κεφαλαίου. Η εφαρμογή σε επιδότηση που αφορά μόνο την μπαταρία είναι ασαφής.
  model_impact: 'Συντηρητική παραδοχή: επιδότηση CAPEX για την μπαταρία μειώνει ισόποσα (σε παρούσα αξία) τη λειτουργική ενίσχυση του πάρκου, άρα το καθαρό όφελος της επιδότησης μπορεί να είναι μικρό. Να υπάρχει διακόπτης στο μοντέλο.'
  suggested_parameter:
    name: capex_subsidy_reduces_operating_aid
    default: 'true'
    alternatives:
    - false (αν η επιδότηση θεωρηθεί ότι αφορά μόνο την αποθήκευση, της οποίας η ενέργεια δεν παίρνει ενίσχυση)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Αρχικό κείμενο 2016. Δεν βρήκα κανόνα ή ερμηνεία για επιδότηση αποθήκευσης σε σταθμό 11Α. Για πάρκα FiT του ν. 3468/2006 δεν έλεγξα αντίστοιχη διάταξη σώρευσης.
- id: REG-B-040
  topic: subsidy
  title: 'Αυτόνομη αποθήκευση: διαγωνισμοί με ενίσχυση και εμπορική οδός 4.700 MW, όρια και προτεραιότητες'
  requirement: 'Οι αυτόνομοι σταθμοί αποθήκευσης αναπτύσσονται με δύο οδούς. Α) Ανταγωνιστικές διαδικασίες ΡΑΑΕΥ με επενδυτική και λειτουργική ενίσχυση (άρθρο 143ΣΤ ν. 4001/2011), όπου τα έσοδα αγοράς πάνω από το ετήσιο επιτρεπόμενο έσοδο ανακτώνται. Β) Εμπορική οδός χωρίς ενίσχυση με προτεραιότητα σύνδεσης: ανώτατο όριο 3.800 MW στο ΕΣΜΗΕ και 900 MW στο ΕΔΔΗΕ (ΚΥΑ ΥΠΕΝ/ΓΔΕ/28255/1143/13.3.2025, ΦΕΚ Β'' 1248). Για αποθήκευση κοινού αιτήματος με Φ/Β (11Γ παρ. 5) δίνεται απόλυτη προτεραιότητα για 1.000 MW. Ισχύει πλαφόν 500 MW ανά πρόσωπο ή όμιλο έως το 2029 για μπαταρίες, εκτός των σταθμών 11Α.'
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ παρ. 5.δ (ν. 5325/2026 άρθρο 57), άρθρο 11Δ παρ. 8 (ν. 5299/2026 άρθρο 56 παρ. 5), ν. 4001/2011 άρθρο 143ΣΤ παρ. 5Α (ν. 5325/2026 άρθρο 58)
    url: https://www.taxheaven.gr/law/5325/2026/arthro/57
    quote: Τα αιτήματα εξετάζονται εναλλάξ σύμφωνα με το δεύτερο εδάφιο, μέχρι την πλήρη κάλυψη του ορίου της συνολικής ισχύος τριών χιλιάδων οκτακοσίων μεγαβάτ (3.800 MW), όπως ορίζεται στο άρθρο 2 της υπό στοιχεία ΥΠΕΝ/ΓΔΕ/28255/1143/13.3.2025 κοινής απόφασης του Υπουργού και της Υφυπουργού Περιβάλλοντος και Ενέργειας
  date_issued: '2026-07-31'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Αυτόνομοι σταθμοί αποθήκευσης. Έμμεσα όλα τα πάρκα, επειδή ο ανταγωνισμός μπαταριών μειώνει τη διαφορά τιμών μεσημέρι προς βράδυ.
  model_impact: Η μαζική είσοδος αυτόνομων μπαταριών (στόχος γιγαβάτ έως το 2028 έως 2030) θα συμπιέσει τα περιθώρια arbitrage και θα μειώσει τις περικοπές. Το μοντέλο πρέπει να έχει σενάρια μείωσης της διαφοράς τιμών και των περικοπών με τον χρόνο.
  suggested_parameter:
    name: standalone_bess_buildout_scenario_gw_2030
    default: '4.3'
    alternatives:
    - 6.8 (κυβερνητική εξαγγελία κατά τον Τύπο)
    - 3.0 (στόχος 2028 κατά τον Τύπο)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Το όριο 900 MW ΕΔΔΗΕ προκύπτει από το κείμενο του ν. 5261/2025 άρθρο 56. Το άθροισμα 4.700 MW είναι δικός μου υπολογισμός και συμφωνεί με τον Τύπο. Τρεις διαγωνισμοί ΡΑΑΕΥ με περίπου 900 MW και καθορισμός λειτουργικής ενίσχυσης για 32 σταθμούς το 2026 αναφέρονται μόνο σε δημοσιεύματα. Δεν βρήκα πρόγραμμα δανείων ΕΤΕπ ή Αναπτυξιακής Τράπεζας ειδικά για μπαταρίες σε υφιστάμενα Φ/Β πάρκα, ούτε ειδικό φορολογικό κίνητρο. Ο Αναπτυξιακός Νόμος δεν ελέγχθηκε.
- id: REG-B-041
  topic: targets
  title: Στόχοι αναθεωρημένου ΕΣΕΚ για Φ/Β, αιολικά και αποθήκευση
  requirement: 'Το αναθεωρημένο ΕΣΕΚ κυρώθηκε και δημοσιεύτηκε στο ΦΕΚ Β'' 6983/19.12.2024. Στόχοι 2030 κατά δευτερογενείς πηγές: Φ/Β 13,5 GW, χερσαία αιολικά 8,9 GW, υπεράκτια αιολικά 1,9 GW, μπαταρίες 4,325 GW, αντλησιοταμίευση 1,928 GW στο τελικό κείμενο (1,745 GW στο σχέδιο διαβούλευσης), μερίδιο ΑΠΕ στην ηλεκτρική ενέργεια 75,7% στο τελικό κείμενο (76,8% στο σχέδιο). 2035 (έκδοση διαβούλευσης Αυγούστου 2024): Φ/Β 18,5 GW, χερσαία αιολικά 9,5 GW, υπεράκτια 3,9 GW. 2050 (ίδια έκδοση): Φ/Β 35,1 GW, χερσαία αιολικά 13 GW, υπεράκτια 11,8 GW, μπαταρίες 12 GW, αντλησιοταμίευση 5,4 GW.'
  source:
    type: official_report
    citation: Αναθεωρημένο Εθνικό Σχέδιο για την Ενέργεια και το Κλίμα (ΕΣΕΚ), ΦΕΚ Β' 6983/19.12.2024
    url: https://ypen.gov.gr/wp-content/uploads/2025/04/%CE%91%CE%BD%CE%B1%CE%B8%CE%B5%CF%89%CF%81%CE%B7%CE%BC%CE%AD%CE%BD%CE%BF-%CE%95%CE%A3%CE%95%CE%9A-2024-%CE%A6%CE%95%CE%9A-6983.pdf
    quote: ''
  date_issued: '2024-12-19'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Γενικό πλαίσιο για σενάρια αγοράς.
  model_impact: Ο στόχος Φ/Β 2030 (13,5 GW) έχει ουσιαστικά καλυφθεί ήδη το 2026, ενώ η αποθήκευση υπολείπεται πολύ. Αυτό εξηγεί τις περικοπές και στηρίζει σενάρια υψηλών περικοπών για 2026 έως 2028 και αποκλιμάκωσης όταν μπουν οι μπαταρίες.
  suggested_parameter:
    name: necp_battery_target_2030_gw
    default: '4.325'
    alternatives:
    - 3.1 (προηγούμενο σχέδιο)
  notes: Δεν μπόρεσα να ανοίξω το ΦΕΚ στο ypen.gov.gr (403). Οι αριθμοί προέρχονται από energygame.gr (23.8.2024, έκδοση διαβούλευσης), balkangreenenergynews.com (21.10.2024, τελικό κείμενο) και ανακοινώσεις ΣΕΦ. Οι τιμές 2035 και 2050 είναι από την έκδοση διαβούλευσης και ίσως διαφέρουν στο τελικό. Αντιφάσεις μεταξύ εκδόσεων για την αντλησιοταμίευση και το μερίδιο ΑΠΕ.
- id: REG-B-042
  topic: targets
  title: Εγκατεστημένη ισχύς Φ/Β, αιολικών και μπαταριών (στοιχεία 2025 και 2026)
  requirement: 'Φ/Β: 11.538 MWp διασυνδεδεμένα στο τέλος του 2025, με 1.840 MWp νέα το 2025 (στατιστικά ΣΕΦ). Περίπου 13 GWp έως τον Μάιο 2026 κατά τον ΣΕΦ. Αιολικά: 6.017 MW στο τέλος του Α'' εξαμήνου 2026 (ΕΛΕΤΑΕΝ). Μπαταρίες: περίπου 530 MW ηλεκτρισμένα στο σύστημα του ΑΔΜΗΕ και σχεδόν 100 MW στο δίκτυο του ΔΕΔΔΗΕ (δήλωση υφυπουργού, καλοκαίρι 2026). Πάνω από 700 MW σε λειτουργία ή δοκιμαστική λειτουργία τον Οκτώβριο και Νοέμβριο 2026, με προοπτική 1 GW έως το τέλος του 2026. Από τα 900 MW των διαγωνισμών ΡΑΑΕΥ περίπου 400 MW ήταν συνδεδεμένα στα τέλη Σεπτεμβρίου 2026, συν περίπου 100 MW μικρών μπαταριών σε αυτοκατανάλωση. Αντλησιοταμίευση σε λειτουργία: 699 MW (Σφηκιά και Θησαυρός, ΔΕΗ). Υπό κατασκευή: Αμφιλοχία 680 MW, με ολοκλήρωση κατασκευής το 2026 και κανονική λειτουργία το 2027. Αδειοδοτημένα έως τον Αύγουστο 2026: 55,3 GW αυτόνομων μπαταριών, 11,8 GW μπαταριών σε σταθμούς 11Β, 16,7 GW αντλησιοταμίευσης. Προβλέψεις μπαταριών 2030: 8,6 GW (ΣΕΦ, σενάριο επιτάχυνσης), 4 έως 5 GW (Aurora). Μελέτη Επάρκειας ΑΔΜΗΕ: ανάγκη αποθήκευσης 3 GW έως το 2030 μαζί με αντλησιοταμίευση (παλαιότερο δημοσίευμα).'
  source:
    type: secondary_press
    citation: ΣΕΦ (HELAPCO) στατιστικά 2025 μέσω euro2day.gr, ΕΛΕΤΑΕΝ στατιστική Α' εξαμήνου 2026 μέσω ienergeia.gr, ess-news.com (29.9.2026), balkangreenenergynews.com, δημοσιεύματα protothema.gr, newmoney.gr, b2green.gr, energypress.gr
    url: https://www.euro2day.gr/news/economy/article/2353774/pano-apo-165-dis-eyro-oi-ependyseis-sta-fotovoltai.html
    quote: ''
  date_issued: '2026-10-31'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Γενικό πλαίσιο για σενάρια αγοράς.
  model_impact: Με περίπου 13 GWp Φ/Β και λιγότερο από 1 GW μπαταριών, οι μεσημβρινές τιμές και οι περικοπές θα μείνουν δυσμενείς βραχυπρόθεσμα. Η αξία της μπαταρίας πίσω από τον μετρητή είναι μέγιστη τώρα και φθίνει όσο προστίθεται αποθήκευση στο σύστημα.
  suggested_parameter:
    name: installed_pv_gw_mid_2026
    default: '13.0'
    alternatives:
    - 11.5 (τέλος 2025, διασυνδεδεμένα, ΣΕΦ)
    - 'λοιπές τιμές για σενάρια: αιολικά 6.0 GW (μέσα 2026), μπαταρίες 0.6 έως 0.7 GW (φθινόπωρο 2026), αντλησιοταμίευση 0.699 GW'
  notes: 'Καμία επίσημη πηγή (ΔΑΠΕΕΠ, ΑΔΜΗΕ) δεν ήταν προσβάσιμη: dapeep.gr και ypen.gov.gr επέστρεψαν 403. Το «περίπου 13 GWp έως Μάιο 2026» δεν συμβιβάζεται εύκολα με τα 11.538 MWp τέλους 2025, ίσως περιλαμβάνει έργα κατασκευασμένα αλλά μη συνδεδεμένα ή άλλη βάση μέτρησης. Τα στοιχεία μπαταριών είναι δηλώσεις και δημοσιεύματα και διαφέρουν μεταξύ τους (περίπου 630 MW ηλεκτρισμένα το καλοκαίρι, περίπου 500 MW συνδεδεμένα τον Σεπτέμβριο, πάνω από 700 MW τον Νοέμβριο), ανάλογα με το αν μετρούν ηλέκτριση, δοκιμαστική ή εμπορική λειτουργία. Άλλη πηγή δίνει 696 MW για την αντλησιοταμίευση. Το αποθετήριο έχει το αρχείο data/processed/installed_capacity_gr.csv από άλλη εργασία, δεν το διασταύρωσα. Το Δεκαετές Πρόγραμμα Ανάπτυξης του ΑΔΜΗΕ δεν διαβάστηκε.'
- id: REG-B-043
  topic: eu_law
  title: Αμφίδρομες συμβάσεις επί διαφοράς για νέα καθεστώτα στήριξης από 17.7.2027
  requirement: Τα καθεστώτα άμεσης στήριξης τιμών για επενδύσεις σε νέες εγκαταστάσεις παραγωγής (μεταξύ άλλων ηλιακές) παίρνουν τη μορφή αμφίδρομων συμβάσεων επί διαφοράς ή ισοδύναμων, για συμβάσεις που συνάπτονται από 17.7.2027. Η συμμετοχή είναι προαιρετική. Ο σχεδιασμός πρέπει να διατηρεί κίνητρα αποδοτικής λειτουργίας και να μη στρεβλώνει τις αποφάσεις κατανομής και προσφορών.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943 άρθρο 19δ, όπως προστέθηκε με τον Κανονισμό (ΕΕ) 2024/1747 (ενοποιημένη έκδοση 16.07.2024)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Το πρώτο εδάφιο ισχύει για συμβάσεις στο πλαίσιο καθεστώτων άμεσης στήριξης των τιμών για επενδύσεις σε νέα παραγωγή που συνάπτονται την ή μετά τις 17 Ιουλίου 2027
  date_issued: '2024-06-13'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Νέα έργα μετά τα μέσα του 2027. Όχι υφιστάμενες συμβάσεις FiT ή ΣΕΔΠ.
  model_impact: Δεν αλλάζει τα έσοδα υφιστάμενων πάρκων. Η ελληνική ΣΕΔΠ λειτουργεί ήδη αμφίδρομα (επιστροφή όταν η ΕΤΑ υπερβαίνει την ΤΑ).
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Ο χαρακτηρισμός της ΣΕΔΠ ως αμφίδρομης στηρίζεται σε δευτερογενή γνώση (βλ. REG-B-005).
- id: REG-B-044
  topic: eu_law
  title: 'Ευελιξία χωρίς ορυκτά καύσιμα: εκτίμηση αναγκών, ενδεικτικός εθνικός στόχος, καθεστώτα στήριξης'
  requirement: Η ρυθμιστική αρχή εκδίδει ανά διετία έκθεση αναγκών ευελιξίας για ορίζοντα 5 έως 10 ετών. Έξι μήνες μετά την έκθεση κάθε κράτος μέλος ορίζει ενδεικτικό εθνικό στόχο για ευελιξία χωρίς ορυκτά καύσιμα, με ειδικές συνεισφορές απόκρισης ζήτησης και αποθήκευσης. Αν οι επενδύσεις δεν επαρκούν, τα κράτη μπορούν να εφαρμόσουν καθεστώτα στήριξης με πληρωμές για διαθέσιμη ικανότητα ευελιξίας, περιορισμένα σε νέες επενδύσεις.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943 άρθρα 19ε, 19στ, 19ζ και 19η, όπως προστέθηκαν με τον Κανονισμό (ΕΕ) 2024/1747
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Το αργότερο έξι μήνες μετά την υποβολή της έκθεσης σύμφωνα με το άρθρο 19ε παράγραφος 1 του παρόντος κανονισμού, κάθε κράτος μέλος ορίζει, βάσει της εν λόγω έκθεσης, έναν ενδεικτικό εθνικό στόχο για την ευελιξία χωρίς ορυκτά καύσιμα, συμπεριλαμβανομένης στον εν λόγω στόχο των αντίστοιχων ειδικών συνεισφορών τόσο της απόκρισης ζήτησης όσο και της αποθήκευσης ενέργειας.
  date_issued: '2024-06-13'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Κράτος και ρυθμιστής. Έμμεσα νέες επενδύσεις αποθήκευσης.
  model_impact: Πιθανή μελλοντική πηγή εσόδου διαθεσιμότητας για νέες μπαταρίες. Δεν υπάρχει σήμερα στην Ελλάδα, άρα μηδέν στο βασικό σενάριο.
  suggested_parameter:
    name: flexibility_capacity_payment_eur_per_mw_year
    default: '0'
    alternatives:
    - θετική τιμή μόνο ως υποθετικό σενάριο
  notes: Δεν βρήκα ελληνική έκθεση αναγκών ευελιξίας ή εθνικό στόχο ευελιξίας κατά τα άρθρα 19ε και 19στ. Το άρθρο 7α (προϊόν εξομάλυνσης αιχμών) ενεργοποιείται μόνο σε κηρυγμένη κρίση τιμών.
- id: REG-B-045
  topic: eu_law
  title: 'Οδηγία (ΕΕ) 2019/944 και RED III: αποθήκευση χωρίς διπλές χρεώσεις, ενσωμάτωση ΑΠΕ'
  requirement: 'Οδηγία 2019/944 άρθρο 15 παρ. 5: οι ενεργοί πελάτες με εγκαταστάσεις αποθήκευσης έχουν δικαίωμα σύνδεσης σε εύλογο χρόνο, δεν υφίστανται διπλή επιβάρυνση για αποθηκευμένη ενέργεια που μένει εντός των εγκαταστάσεών τους και μπορούν να παρέχουν πολλές υπηρεσίες ταυτόχρονα. Οδηγία 2018/2001 όπως τροποποιήθηκε από την (ΕΕ) 2023/2413 (RED III): δεσμευτικός ενωσιακός στόχος ΑΠΕ τουλάχιστον 42,5% το 2030 (άρθρο 3) και υποχρεώσεις διευκόλυνσης της ενσωμάτωσης ΑΠΕ στο σύστημα (άρθρο 20α).'
  source:
    type: eu_directive
    citation: Οδηγία (ΕΕ) 2019/944 άρθρο 15 παρ. 5 (όπως ισχύει μετά την Οδηγία (ΕΕ) 2024/1711), Οδηγία (ΕΕ) 2018/2001 άρθρα 3 και 20α (όπως τροποποιήθηκε με την Οδηγία (ΕΕ) 2023/2413)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019L0944-20240716
    quote: δεν υποβάλλονται σε καμία διπλή επιβάρυνση, συμπεριλαμβανομένων των τελών δικτύου, για την αποθηκευμένη ηλεκτρική ενέργεια που παραμένει εντός των εγκαταστάσεών τους και όταν παρέχουν υπηρεσίες ευελιξίας σε διαχειριστές συστημάτων
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Κυρίως αυτοκαταναλωτές. Για πάρκα παραγωγής έχει ερμηνευτική αξία.
  model_impact: Δεν δίνει άμεσα αριθμητική παράμετρο. Στηρίζει την παραδοχή ότι η ενέργεια που αποθηκεύεται πίσω από τον μετρητή και δεν περνά από το δίκτυο δεν επιβαρύνεται με χρεώσεις δικτύου.
  suggested_parameter:
    name: grid_charges_on_behind_meter_storage_eur_mwh
    default: '0'
    alternatives: []
  notes: Οι οδηγίες χρειάζονται ενσωμάτωση. Η ενσωμάτωση για την αποθήκευση έγινε με τον ν. 4951/2022 (τίτλος κεφαλαίου που είδα), δεν έλεγξα την ενσωμάτωση της 2024/1711 ούτε της RED III. Οι χρεώσεις (ΥΚΩ, ΕΤΜΕΑΡ, χρήσης δικτύου) για φόρτιση από το δίκτυο σε σταθμούς 11Β ρυθμίζονται στον ν. 4951/2022 και δεν τις ανέλυσα.
- id: REG-B-046
  topic: tax
  title: Φόρος εισοδήματος νομικών προσώπων 22%
  requirement: Τα κέρδη από επιχειρηματική δραστηριότητα νομικών προσώπων και νομικών οντοτήτων φορολογούνται με 22% για τα εισοδήματα του φορολογικού έτους 2021 και εφεξής.
  source:
    type: law
    citation: ν. 4172/2013 (Κώδικας Φορολογίας Εισοδήματος) άρθρο 58 παρ. 1 περ. α
    url: https://www.taxheaven.gr/law/4172/2013/arthro/58
    quote: Για τα εισοδήματα του φορολογικού έτους 2021 και εφεξής ο συντελεστής του προηγούμενου εδαφίου μειώνεται σε είκοσι δύο τοις εκατό (22%).
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα που ανήκουν σε εταιρείες (ΑΕ, ΙΚΕ, ΕΠΕ, ΟΕ, ΕΕ).
  model_impact: Συντελεστής φόρου στα κέρδη του μοντέλου. Για φυσικά πρόσωπα (ατομικές επιχειρήσεις, αγρότες) ισχύει η κλίμακα φυσικών προσώπων και όχι το 22%.
  suggested_parameter:
    name: corporate_income_tax_rate
    default: '0.22'
    alternatives:
    - κλίμακα φυσικών προσώπων για ατομικές επιχειρήσεις (δεν ελέγχθηκε)
  notes: Διαβάστηκε στο taxheaven.gr, που εμφανίζει ενημερωμένο κείμενο του ΚΦΕ. Δεν επαλήθευσα αν υπάρχει μεταγενέστερη αλλαγή συντελεστή για το 2026 ή το 2027, ούτε τον φόρο μερισμάτων και την προκαταβολή φόρου.
- id: REG-B-047
  topic: tax
  title: 'Φορολογική απόσβεση μπαταρίας: 10% ετησίως ως μηχανήματα και εξοπλισμός'
  requirement: Ο πίνακας φορολογικών αποσβέσεων δεν έχει ειδική κατηγορία για μπαταρίες. Η κατηγορία «Μηχανήματα, εξοπλισμός εκτός Η/Υ και λογισμικού» έχει συντελεστή 10% ανά φορολογικό έτος, το ίδιο και τα «Λοιπά πάγια στοιχεία». Τα «Κτίρια, κατασκευές, εγκαταστάσεις [...] αποθήκες και σταθμοί» έχουν 4%.
  source:
    type: law
    citation: ν. 4172/2013 άρθρο 24 παρ. 4 (πίνακας συντελεστών)
    url: https://www.taxheaven.gr/law/4172/2013/arthro/24
    quote: Μηχανήματα, εξοπλισμός εκτός Η/Υ και λογισμικού 10%
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλες οι επιχειρήσεις που αγοράζουν μπαταρία.
  model_impact: Απόσβεση 10 ετών σταθερής μεθόδου για το CAPEX της μπαταρίας. Επηρεάζει τη φορολογική ασπίδα και την καθαρή παρούσα αξία.
  suggested_parameter:
    name: battery_tax_depreciation_rate
    default: '0.10'
    alternatives:
    - 0.04 (αν η Φορολογική Διοίκηση θεωρήσει το σύστημα μέρος εγκατάστασης ή σταθμού, δεν βρέθηκε ερμηνευτική εγκύκλιος)
  notes: Η κατάταξη της μπαταρίας στα «μηχανήματα, εξοπλισμός» είναι δική μου ανάγνωση του πίνακα. Δεν βρήκα εγκύκλιο ΑΑΔΕ ειδικά για συστήματα αποθήκευσης. Δεν έλεγξα προσαυξημένες εκπτώσεις ή κίνητρα πράσινων επενδύσεων ούτε τον Αναπτυξιακό Νόμο.
- id: REG-B-048
  topic: tax
  title: 'Ειδικό τέλος 3% ΑΠΕ: οι Φ/Β παραγωγοί απαλλάσσονται, με εξαίρεση τους κοινούς διαγωνισμούς'
  requirement: 'Κάθε παραγωγός ΑΠΕ επιβαρύνεται με ειδικό τέλος 3% επί των εσόδων προ ΦΠΑ (ή επί της Τιμής Αναφοράς για σταθμούς του ν. 4414/2016). Οι παραγωγοί από φωτοβολταϊκά συστήματα απαλλάσσονται. Εξαίρεση: Φ/Β που λαμβάνουν λειτουργική ενίσχυση μετά από συμμετοχή σε κοινή ανταγωνιστική διαδικασία (αιολικά και Φ/Β μαζί) επιβαρύνονται με 3% επί του ποσού που προκύπτει με βάση την Τιμή Αναφοράς.'
  source:
    type: law
    citation: ν. 3468/2006 άρθρο 25 παρ. Α.1, όπως αντικαταστάθηκε με το άρθρο 3 του ν. 4585/2018 (ΦΕΚ Α' 216/24.12.2018)
    url: https://www.taxheaven.gr/law/4585/2018/arthro/3
    quote: Με την επιφύλαξη του επόμενου εδαφίου, οι παραγωγοί ηλεκτρικής ενέργειας από συστήματα Α.Π.Ε. σε κτίρια ή από φωτοβολταϊκά συστήματα και οι αυτοπαραγωγοί του άρθρου 14Α απαλλάσσονται από την καταβολή του ειδικού τέλους.
  date_issued: '2018-12-24'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: 'Φ/Β πάρκα: απαλλαγή. Φ/Β από κοινούς διαγωνισμούς ΡΑΕ: τέλος 3%.'
  model_impact: Για τα περισσότερα Φ/Β πάρκα το ειδικό τέλος είναι μηδέν. Για Φ/Β κοινών διαγωνισμών αφαιρείται 3% επί (ΤΑ x ενέργεια). Δεν είναι σαφές αν η ενέργεια της μπαταρίας που πωλείται σε τιμή αγοράς υπάγεται στο τέλος.
  suggested_parameter:
    name: special_res_levy_rate_pv
    default: '0.0'
    alternatives:
    - 0.03 (Φ/Β κοινών ανταγωνιστικών διαδικασιών, ή αν μεταγενέστερη τροποποίηση κατάργησε την απαλλαγή)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η διάταξη διαβάστηκε όπως ίσχυε το 2018. Αποσπάσματα αναζήτησης δείχνουν μεταγενέστερη διατύπωση που αναφέρεται σε σταθμούς που «δεν έχουν επιλεγεί σε ανταγωνιστικές διαδικασίες ή λειτουργούν σύμφωνα με το άρθρο 12Α» και ΥΑ του 2024 (ΦΕΚ Β' 4844/22.08.2024) για την απόδοση του τέλους. Δεν μπόρεσα να ανοίξω το ισχύον ενοποιημένο κείμενο (στο taxheaven η παρ. Α.1 εμφανίζεται κενή). Να επιβεβαιωθεί.
- id: REG-B-049
  topic: tax
  title: Έκτακτες εισφορές και μηχανισμοί ανάκτησης εσόδων του παρελθόντος
  requirement: 'Ιστορικό ρυθμιστικού κινδύνου: (α) Έκτακτη εισφορά 6% επί των πωλήσεων του 2020 για σταθμούς ΑΠΕ που τέθηκαν σε λειτουργία έως 31.12.2015. (β) Προσωρινός Μηχανισμός Επιστροφής Μέρους Εσόδων Αγοράς Επόμενης Ημέρας, με εφαρμογή μετά την 1.7.2022 και αρχική λήξη 1.6.2023, με παρακράτηση εσόδων πάνω από ρυθμιζόμενο επίπεδο ανά τεχνολογία.'
  source:
    type: law
    citation: ν. 4759/2020 άρθρο 157 παρ. 1 (έκτακτη εισφορά) και ν. 4425/2016 άρθρο 12Α (προστέθηκε με ν. 4951/2022 άρθρο 122, ΦΕΚ Α' 129/04.07.2022)
    url: https://www.taxheaven.gr/law/4759/2020/arthro/157
    quote: Η έκτακτη εισφορά υπολογίζεται ως εκατοστιαίο ποσοστό επί του, προ Φ.Π.Α., τιμήματος πώλησης ηλεκτρικής ενέργειας [...] για τις πωλήσεις ηλεκτρικής ενέργειας που λαμβάνουν χώρα κατά το χρονικό διάστημα από 1.1.2020 έως 31.12.2020 ή τιμολογούνται στις μηνιαίες εκκαθαρίσεις του έτους 2020 και ανέρχεται σε ποσοστό έξι τοις εκατό (6%) για όλες τις κατηγορίες παραγωγών.
  date_issued: ''
  status: repealed
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: 'Ιστορικά: πάρκα FiT έως 2015 (εισφορά 2020), όλοι οι συμμετέχοντες στην ΑΕΗ (μηχανισμός 2022 έως 2023).'
  model_impact: Δεν υπάρχει ενεργή έκτακτη εισφορά ή ανώτατο όριο εσόδων που να βρήκα για το 2026. Προτείνεται σενάριο ευαισθησίας ρυθμιστικού κινδύνου (π.χ. εφάπαξ μείωση εσόδων ή πλαφόν σε υψηλές τιμές), επειδή τα έσοδα της μπαταρίας προέρχονται ακριβώς από ώρες υψηλών τιμών.
  suggested_parameter:
    name: regulatory_clawback_scenario_enabled
    default: 'false'
    alternatives:
    - true (σενάριο ευαισθησίας με ανώτατο όριο τιμής πώλησης τις ώρες αιχμής)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Ο μηχανισμός επιστροφής παρατάθηκε πέραν του Ιουνίου 2023 κατά τη μνήμη του Τύπου (έως τέλος 2023), κάτι που δεν επαλήθευσα. Η εισφορά αλληλεγγύης 2012 έως 2014 στα Φ/Β δεν ελέγχθηκε. Ημερομηνία ΦΕΚ του ν. 4759/2020 δεν επαληθεύτηκε.
- id: REG-B-050
  topic: storage_remuneration
  title: 'Σταθμός 11Α με ΣΕΔΠ: πώς εκκαθαρίζονται η προσαύξηση και η ενέργεια της μπαταρίας (τι ορίζεται και τι όχι)'
  requirement: 'Ορίζεται ρητά: (α) η σύμβαση ΣΕΔΠ διέπει μόνο την ενέργεια που εγχέουν οι Φ/Β μονάδες, (β) η ενέργεια της μπαταρίας αμείβεται με τιμές αγοράς και μετράται με διακριτό πιστοποιημένο μετρητή στην έξοδο της αποθήκευσης, (γ) η λειτουργική ενίσχυση δεν καταβάλλεται για ενέργεια που εγχέεται από τη μονάδα αποθήκευσης. Δεν βρήκα κανονιστικό κείμενο που να ορίζει: πώς προκύπτει μετρητικά η ποσότητα «άμεσης έγχυσης Φ/Β» (μετρητής σημείου σύνδεσης μείον μετρητής μπαταρίας ή ξεχωριστός μετρητής Φ/Β), αν η ενέργεια της μπαταρίας μπαίνει στο ίδιο χαρτοφυλάκιο του ΦοΣΕ, και πώς λογίζονται οι απώλειες. Η Ειδική Τιμή Αγοράς είναι τιμή ανά τεχνολογία που υπολογίζει η ΔΑΠΕΕΠ για όλους τους Φ/Β και όχι ανά σταθμό, άρα δεν εξαρτάται από τον μετρητή του συγκεκριμένου πάρκου.'
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 2 και 3, και απόφαση ΡΑΑΕΥ Ε-12/2026 (ΦΕΚ Β' 324/30.01.2026) για το πρόγραμμα «Απόλλων»
    url: https://raaey.gr/energeia/wp-content/uploads/2026/02/20260200324.pdf
    quote: Λαμβάνοντας υπόψη ότι σύμφωνα με την παρ. 197 της Εγκριτικής Απόφασης η Λειτουργική Ενίσχυση καταβάλλεται για την ηλεκτρική ενέργεια που εγχέεται στο Σύστημα από τη μονάδα ΑΠΕ και όχι από τη μονάδα αποθήκευσης, ο όρος Σταθμός της παρ. 5 του άρθρου 5 της ΚΥΑ αναφέρεται σαφώς στον Σταθμό ΑΠΕ.
  date_issued: '2026-01-30'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ (και αναλογικά ΣΕΣΤ ή FiT) που γίνονται σταθμοί 11Α.
  model_impact: 'Προτεινόμενος τύπος εκκαθάρισης για το μοντέλο, ανά μήνα: Έσοδο = Σ(E_pv_direct x τιμή αγοράς) + (ΤΑ μείον ΕΤΑ) x E_pv_direct_επιλέξιμη + Σ(E_batt_out x τιμή αγοράς) μείον αμοιβή ΦοΣΕ μείον κόστος αποκλίσεων. Όπου E_pv_direct = έγχυση σημείου σύνδεσης μείον έξοδος μπαταρίας, και E_pv_direct_επιλέξιμη εξαιρεί τις ώρες του κανόνα αρνητικών τιμών (REG-B-014). Η ΕΤΑ λαμβάνεται ως εξωγενής μηνιαία τιμή τεχνολογίας. Για ΣΕΣΤ και FiT ο πρώτος και ο δεύτερος όρος γίνονται σταθερή τιμή x E_pv_direct.'
  suggested_parameter:
    name: pv_direct_energy_definition
    default: poc_injection_minus_battery_output_meter
    alternatives:
    - separate_pv_meter (αν ο διαχειριστής απαιτήσει μετρητή στην έξοδο του Φ/Β)
  notes: 'Η αφαίρεση «σημείο σύνδεσης μείον μετρητής μπαταρίας» είναι δική μου λογική συνέπεια του νόμου, όχι κείμενο που διάβασα. Η απόφαση ΡΑΑΕΥ Ε-16/2026 (τροποποίηση Κώδικα ΔΑΠΕΕΠ, ΦΕΚ Β'' 2116/9.4.2026 κατά το e-nomothesia) αφορά τους αυτόνομους σταθμούς αποθήκευσης με ενίσχυση και, στο κείμενο που διάβασα, δεν ρυθμίζει τους σταθμούς ΑΠΕ με ενσωματωμένη αποθήκευση. Το άρθρο 11Γ παρ. 5 επιτρέπει ειδικούς όρους εκπροσώπησης Φ/Β και αποθήκευσης στις Προσφορές και Συμβάσεις Σύνδεσης. Ο ορισμός της ΕΤΑ ως τιμής τεχνολογίας δεν επαληθεύτηκε σε πρωτογενές κείμενο (REG-B-005). Ποιος εκκαθαρίζει την ενέργεια της μπαταρίας για πάρκα FiT και ΣΕΣΤ που σήμερα δεν έχουν ΦοΣΕ παραμένει ανοικτό: πιθανότερα απαιτείται ΦοΣΕ ή ΦοΣΕΤεΚ για το σκέλος της μπαταρίας. Να ζητηθεί γραπτή διευκρίνιση από τη ΔΑΠΕΕΠ.'
