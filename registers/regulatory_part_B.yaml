# Μητρώο ρυθμιστικών κανόνων, μέρος Β (αμοιβή, αγορά, επιδοτήσεις, φόροι)
# Έρευνα: 2026-11-10. Σχήμα: βλ. οδηγίες έργου. Οι εγγραφές με status unclear ή pending
# και confidence διαφορετικό από primary_verified δεν πρέπει να θεωρούνται δεδομένες.
- id: REG-B-001
  topic: support_fit
  title: 'Διάρκεια σύμβασης πώλησης FiT: 20 έτη'
  requirement: Η Σύμβαση Πώλησης ηλεκτρικής ενέργειας (FiT) των σταθμών ΑΠΕ ισχύει για 20 έτη. Αντισυμβαλλόμενος στο διασυνδεδεμένο σύστημα είναι σήμερα η ΔΑΠΕΕΠ (πρώην ΛΑΓΗΕ). Η αποζημίωση είναι σταθερή τιμή ανά MWh που εγχέεται.
  source:
    type: law
    citation: ν. 3468/2006, άρθρο 12 παρ. 2 (ΦΕΚ Α' 129/2006)
    url: https://www.taxheaven.gr/law/3468/2006/arthro/12
    quote: Η Σύμβαση Πώλησης ηλεκτρικής ενέργειας που παράγεται από σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α. ισχύει για είκοσι (20) έτη.
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με σύμβαση πώλησης του ν. 3468/2006 (κυρίως συνδέσεις 2007 έως 2015).
  model_impact: Ο ορίζοντας των εγγυημένων εσόδων είναι 20 έτη από την έναρξη, συν τυχόν 7 έτη επέκτασης (βλ. REG-B-002). Το μοντέλο πρέπει να γνωρίζει την ημερομηνία λήξης της σύμβασης κάθε πάρκου.
  suggested_parameter:
    name: fit_contract_years
    default: '20'
    alternatives:
    - 27 (20 + 7 έτη επέκτασης του ν. 4254/2014 για σταθμούς με λειτουργία κάτω των 12 ετών την 1.1.2014)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η σελίδα δείχνει το αρχικό κείμενο του άρθρου, δεν έλεγξα ενοποιημένη μορφή. Οι μειώσεις τιμών του New Deal (ν. 4254/2014, υποπαρ. ΙΓ.1) και η ημερομηνία ΦΕΚ του ν. 3468/2006 δεν επαληθεύτηκαν σε πρωτογενές κείμενο.
- id: REG-B-002
  topic: support_fit
  title: Επέκταση σύμβασης FiT κατά 7 έτη (New Deal) και τιμή στην επέκταση
  requirement: Για σταθμούς ΑΠΕ της υποπαρ. ΙΓ.1 του ν. 4254/2014 που την 1.1.2014 λειτουργούσαν λιγότερο από 12 έτη, η σύμβαση πώλησης επεκτείνεται αυτοδίκαια κατά 7 έτη. Στο διάστημα της επέκτασης ο παραγωγός επιλέγει αμετάκλητα (τουλάχιστον 3 μήνες πριν) είτε (αα) αποζημίωση βάσει μεθοδολογίας υπουργικής απόφασης είτε (αβ) τιμή 90 ευρώ/MWh για μέγιστη ετήσια ενέργεια ίση με Εγκατεστημένη Ισχύ (kW) x Συντελεστή Απόδοσης (1500 kWh/kW για Φ/Β στο διασυνδεδεμένο σύστημα). Η ενέργεια πάνω από το όριο εγχέεται χωρίς αποζημίωση. Χωρίς δήλωση εφαρμόζεται η μικρότερη από τις δύο τιμές.
  source:
    type: law
    citation: ν. 4254/2014 (ΦΕΚ Α' 85/07.04.2014), πρώτο άρθρο, υποπαρ. ΙΓ.4, όπως αντικαταστάθηκε με το άρθρο 101 του ν. 4821/2021 (ΦΕΚ Α' 134/31.07.2021)
    url: https://www.taxheaven.gr/law/4821/2021/arthro/101
    quote: 'αβ) Με τιμή ενενήντα (90) ευρώ/MWh για μέγιστη ετήσια ποσότητα ενέργειας που υπολογίζεται από τη μαθηματική σχέση: Ενέργεια (kWh) = Εγκατεστημένη Ισχύς (kW) Χ Συντελεστής Απόδοσης (kWh/kW). [...] Το πλεόνασμα ενέργειας που προκύπτει από την εφαρμογή της υποπερ. αβ) της περ. α) διοχετεύεται στο Σύστημα ή/και στο Δίκτυο, χωρίς υποχρέωση για οποιαδήποτε αποζημίωση στον παραγωγό.'
  date_issued: '2021-07-31'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα FiT που συνδέθηκαν από το 2002 και μετά και εμπίπτουν στο New Deal. Η επέκταση αρχίζει μετά το 20ό έτος.
  model_impact: Στα έτη 21 έως 27 το έσοδο είναι 90 ευρώ/MWh έως 1500 kWh/kWp ετησίως. Πάνω από το όριο η ενέργεια δεν πληρώνεται, άρα οι περικοπές κοστίζουν λιγότερο και η μπαταρία δεν σώζει αμειβόμενη ενέργεια αν το πάρκο ήδη ξεπερνά το όριο.
  suggested_parameter:
    name: fit_extension_price_eur_mwh
    default: '90'
    alternatives:
    - 'τιμή μεθοδολογίας υπουργικής απόφασης (περ. αα): δεν επιβεβαίωσα αν έχει εκδοθεί'
  notes: 'Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Συντελεστής απόδοσης Φ/Β διασυνδεδεμένου: 1500 kWh/kW (παράμετρος fit_extension_energy_cap_kwh_per_kw). Δεν διάβασα την υποπαρ. ΙΓ.1 (νέες τιμές 2014).'
- id: REG-B-003
  topic: support_fit
  title: Τα πάρκα FiT και ΣΕΣΤ δεν έχουν υποχρέωση συμμετοχής στις αγορές
  requirement: Οι μονάδες ΑΠΕ με σύμβαση πώλησης του άρθρου 12 ν. 3468/2006 ή με Σύμβαση Λειτουργικής Ενίσχυσης Σταθερής Τιμής (ΣΕΣΤ) εντάσσονται στο «Χαρτοφυλάκιο ΑΠΕ με Συμβάσεις Σταθερής Τιμής Αποζημίωσης» και δεν έχουν υποχρέωση συμμετοχής στις αγορές ηλεκτρικής ενέργειας. Την ενέργειά τους τη διαχειρίζεται η ΔΑΠΕΕΠ και ο παραγωγός πληρώνεται τη σταθερή τιμή για κάθε MWh που μετρήθηκε.
  source:
    type: raaey_decision
    citation: 'Απόφαση ΡΑΑΕΥ Ε-15/2026, Παράρτημα: Κανονισμός Λειτουργίας της Αγοράς Επόμενης Ημέρας και Ενδοημερήσιας Αγοράς, Ορισμοί («Χαρτοφυλάκιο ΑΠΕ με Συμβάσεις Σταθερής Τιμής Αποζημίωσης»)'
    url: https://www.raaey.gr/energeia/wp-content/uploads/2026/02/%CE%91%CE%A0%CE%9F%CE%A6%CE%91%CE%A3%CE%97-%CE%95-15_2026-%CE%A0%CE%91%CE%A1%CE%91%CE%A1%CE%A4%CE%97%CE%9C%CE%91.pdf
    quote: Ένα Χαρτοφυλάκιο από μονάδες ΑΠΕ, οι οποίες αποζημιώνονται με Σύμβαση Πώλησης Ηλεκτρικής Ενέργειας σύμφωνα με το άρθρο 12 του ν.3468/2006 ή Σύμβαση Λειτουργικής Ενίσχυσης Σταθερής Τιμής σύμφωνα με το άρθρο 10 του ν.4414/2016 ή Σύμβαση Αγοραπωλησίας Ηλεκτρικής Ενέργειας προ του ν.3468/2006 και οι οποίες δεν έχουν υποχρέωση συμμετοχής στις Αγορές Ηλεκτρικής Ενέργειας.
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα FiT (ν. 3468/2006) και ΣΕΣΤ (ν. 4414/2016).
  model_impact: Για την ενέργεια που εγχέει απευθείας το Φ/Β, η ώρα παραγωγής δεν αλλάζει την τιμή. Η μπαταρία δεν κερδίζει από μετατόπιση αυτής της ενέργειας. Η αξία της περιορίζεται σε ενέργεια που αλλιώς θα περικοπτόταν.
  suggested_parameter:
    name: fit_energy_price_basis
    default: fixed_contract_price
    alternatives: []
  notes: Διάβασα μόνο τον ορισμό στο Παράρτημα της απόφασης. Δεν επαλήθευσα αριθμό ΦΕΚ της Ε-15/2026 ούτε ημερομηνία έκδοσης. Ο ρόλος της ΔΑΠΕΕΠ ως διαχειριστή αυτού του χαρτοφυλακίου είναι γνωστός αλλά δεν τον επαλήθευσα σε κείμενο.
- id: REG-B-004
  topic: support_fip
  title: 'Λειτουργική Ενίσχυση ν. 4414/2016: ΣΕΔΠ ή ΣΕΣΤ, διάρκεια 20 έτη'
  requirement: Σταθμοί ΑΠΕ που τέθηκαν σε λειτουργία από 1.1.2016 λαμβάνουν Λειτουργική Ενίσχυση είτε ως Διαφορική Προσαύξηση (ΣΕΔΠ, sliding premium) είτε ως Σταθερή Τιμή (ΣΕΣΤ). ΣΕΣΤ προβλέφθηκε αρχικά για αιολικά κάτω των 3 MW και λοιπούς σταθμούς κάτω των 500 kW. Η ενίσχυση δίνεται για 20 έτη. Οι Φ/Β με ισχύ 500 kW και άνω λαμβάνουν ενίσχυση μόνο αν επιλεγούν σε ανταγωνιστική διαδικασία της ΡΑΕ (άρθρο 7).
  source:
    type: law
    citation: ν. 4414/2016, άρθρο 3 παρ. 5, 6 και 18 (ΦΕΚ Α' 149/09.08.2016)
    url: https://www.taxheaven.gr/law/4414/2016/arthro/3
    quote: Η χρονική διάρκεια παροχής της Λειτουργικής Ενίσχυσης στη βάση Διαφορικής Προσαύξησης ή Σταθερής Τιμής, καθορίζεται σε είκοσι (20) έτη για τους σταθμούς παραγωγής ηλεκτρικής ενέργειας από Α.Π.Ε. και Σ.Η.Θ.Υ.Α. πλην των ηλιοθερμικών σταθμών παραγωγής ηλεκτρικής ενέργειας.
  date_issued: '2016-08-09'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ (διαγωνισμοί ΡΑΕ) ή ΣΕΣΤ (μικροί σταθμοί, ενεργειακές κοινότητες).
  model_impact: Καθορίζει τον ορίζοντα ενίσχυσης και ποιο καθεστώς εκκαθάρισης εφαρμόζεται στο πάρκο.
  suggested_parameter:
    name: operating_aid_years
    default: '20'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η σελίδα δείχνει το αρχικό κείμενο του 2016. Τα όρια ισχύος της παρ. 5 μπορούν να μειωθούν με υπουργική απόφαση και έχουν αλλάξει (όριο 400 kW αναφέρεται σε άλλες διατάξεις). Δεν επαλήθευσα τα ισχύοντα όρια σε ενοποιημένο κείμενο.
- id: REG-B-005
  topic: support_fip
  title: 'Εκκαθάριση ΣΕΔΠ: Τιμή Αναφοράς μείον Ειδική Τιμή Αγοράς τεχνολογίας'
  requirement: Στη ΣΕΔΠ ο σταθμός πουλά στην αγορά (άμεσα ή μέσω ΦοΣΕ) και λαμβάνει μηνιαία από τη ΔΑΠΕΕΠ τη Διαφορική Προσαύξηση, δηλαδή τη διαφορά Τιμής Αναφοράς (ΤΑ) και Ειδικής Τιμής Αγοράς (ΕΤΑ) της τεχνολογίας του, επί την ενέργεια που εγχύθηκε. Η ΕΤΑ υπολογίζεται και δημοσιεύεται μηνιαία από τη ΔΑΠΕΕΠ ανά τεχνολογία. Αν η ΕΤΑ υπερβαίνει την ΤΑ, ο παραγωγός επιστρέφει τη διαφορά.
  source:
    type: ministerial_decision
    citation: ΥΑ ΑΠΕΗΛ/Α/Φ1/οικ.187480/7.12.2016 «Μεθοδολογία υπολογισμού της ειδικής τιμής αγοράς τεχνολογιών ΑΠΕ και ΣΗΘΥΑ [...]» (ΦΕΚ Β' 3955), ν. 4414/2016 άρθρα 2, 3, 5
    url: https://www.dapeep.gr/eta-2-2026/
    quote: ''
  date_issued: '2016-12-07'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ.
  model_impact: Επειδή η προσαύξηση υπολογίζεται με τη μέση τιμή της τεχνολογίας και όχι με την τιμή του ίδιου του σταθμού, το πάρκο κερδίζει αν πουλά ακριβότερα από τον μέσο Φ/Β. Όμως η ενέργεια που περνά από την μπαταρία δεν παίρνει προσαύξηση (βλ. REG-B-007). Το μοντέλο πρέπει να συγκρίνει (ΤΑ για άμεση έγχυση) με (τιμή αγοράς την ώρα εκφόρτισης επί απόδοση μπαταρίας).
  suggested_parameter:
    name: fip_premium_reference
    default: technology_monthly_eta
    alternatives:
    - own_capture_price (δεν προβλέπεται)
  notes: Δεν άνοιξα την ίδια την ΥΑ ούτε τα άρθρα 2 και 4 του ν. 4414/2016. Ο τίτλος και το ΦΕΚ της ΥΑ προκύπτουν από παραπομπή σε νόμο που διάβασα (ν. 5188/2025 άρθρο 35). Ο ιστότοπος dapeep.gr δεν ήταν προσβάσιμος (403). Ο κανόνας είναι γνωστός αλλά εδώ καταγράφεται ως μη επαληθευμένος σε πρωτογενές κείμενο.
- id: REG-B-006
  topic: storage_remuneration
  title: Ποια υφιστάμενα Φ/Β μπορούν να προσθέσουν μπαταρία πίσω από τον μετρητή (άρθρο 11Γ παρ. 1)
  requirement: Φ/Β σταθμοί που τέθηκαν σε λειτουργία μετά την 4η Ιουλίου 2019 (ή νέοι σταθμοί με Οριστική Προσφορά Σύνδεσης) και έχουν σύμβαση πώλησης, ΣΕΔΠ ή ΣΕΣΤ, μπορούν να μετατραπούν, εφόσον είναι τεχνικά δυνατόν, σε σταθμούς της παρ. 11Α του άρθρου 10 (ΑΠΕ με ενσωματωμένη αποθήκευση χωρίς απορρόφηση από το δίκτυο), με αίτημα στον Φορέα Αδειοδότησης ή στον αρμόδιο Διαχειριστή. Η ωφέλιμη χωρητικότητα της αποθήκευσης πρέπει να είναι τουλάχιστον 1 ώρα επί την εγκατεστημένη ισχύ του Φ/Β.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 1
    url: https://www.taxheaven.gr/law/5261/2025/arthro/56
    quote: Φωτοβολταϊκοί σταθμοί που είτε έχουν τεθεί σε λειτουργία μετά την 4η Ιουλίου 2019, είτε νέοι φωτοβολταϊκοί σταθμοί που έχουν λάβει Οριστική Προσφορά Σύνδεσης και δεν έχουν τεθεί σε λειτουργία κατά την 1η Δεκεμβρίου 2025, είτε νέοι φωτοβολταϊκοί σταθμοί που θα λάβουν Οριστική Προσφορά Σύνδεσης, και οι οποίοι συνάπτουν Σύμβαση Πώλησης ηλεκτρικής ενέργειας ή Σύμβαση λειτουργικής ενίσχυσης Διαφορικής Προσαύξησης ή Σύμβαση λειτουργικής ενίσχυσης Σταθερής Τιμής, δύνανται να μετατραπούν, εφόσον αυτό είναι τεχνικά δυνατόν, σε σταθμούς της παρ. 11Α του άρθρου 10 [...] Στην περίπτωση αυτή η ωφέλιμη χωρητικότητα των συστημάτων αποθήκευσης ηλεκτρικής ενέργειας, που θα εγκατασταθούν κατά τα ανωτέρω, είναι τουλάχιστον ίση με μία (1) ώρα στην εγκατεστημένη ισχύ του αντίστοιχου φωτοβολταϊκού σταθμού.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ημερομηνία θέσης σε λειτουργία μετά τις 4.7.2019 που έχουν FiT, ΣΕΣΤ ή ΣΕΔΠ.
  model_impact: 'Πρώτος έλεγχος επιλεξιμότητας του DSS: ημερομηνία λειτουργίας του πάρκου. Ελάχιστο μέγεθος μπαταρίας: 1 kWh ωφέλιμη ανά kW εγκατεστημένου Φ/Β.'
  suggested_parameter:
    name: min_battery_hours_at_pv_capacity
    default: '1.0'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Το νομοσχέδιο του Νοεμβρίου 2025 είχε προθεσμία αιτημάτων 30.4.2026, αλλά το ψηφισμένο κείμενο του ν. 5261/2025 διέγραψε την προθεσμία από την παρ. 1. Καταληκτική ημερομηνία μπορεί να οριστεί με υπουργική απόφαση της παρ. 6. Ο Τύπος αναφέρει παρατάσεις (30.4.2026 ή 30.6.2026) που δεν επιβεβαίωσα. Τις προθεσμίες και τη σύνδεση τις καλύπτει το μέρος Α.
- id: REG-B-007
  topic: storage_remuneration
  title: Η ενέργεια που βγαίνει από την μπαταρία πληρώνεται με τιμές αγοράς, όχι με την τιμή ενίσχυσης
  requirement: Για τους Φ/Β σταθμούς του άρθρου 11Γ παρ. 1, η ενέργεια που εγχέεται στο δίκτυο και προέρχεται από τις μονάδες αποθήκευσης αποζημιώνεται με την ωριαία τιμή της Αγοράς Επόμενης Ημέρας και τις τιμές των λοιπών αγορών στις οποίες συμμετέχει ο σταθμός. Η ποσότητα μετράται από διακριτό πιστοποιημένο μετρητή στην έξοδο της αποθήκευσης.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 2
    url: https://www.taxheaven.gr/law/5261/2025/arthro/56
    quote: Οι φωτοβολταϊκοί σταθμοί της παρ. 1 αποζημιώνονται με βάση την ωριαία τιμή της αγοράς της επόμενης ημέρας και τις τιμές των υπόλοιπων αγορών ηλεκτρικής ενέργειας, σύμφωνα με τη συμμετοχή τους σε αυτές, για την ενέργεια που εγχέουν στο δίκτυο και η οποία προέρχεται από τις μονάδες αποθήκευσης του φωτοβολταϊκού σταθμού. Η αποζημίωση των σταθμών του παρόντος για την ενέργεια που προέρχεται από τις μονάδες αποθήκευσης προσδιορίζεται από μετρήσεις διακριτού πιστοποιημένου μετρητή που συνδέεται στην έξοδο των μονάδων αποθήκευσης ηλεκτρικής ενέργειας.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα FiT, ΣΕΣΤ, ΣΕΔΠ με λειτουργία μετά τις 4.7.2019 που προσθέτουν μπαταρία ως σταθμοί 11Α.
  model_impact: Ο πιο κρίσιμος κανόνας. Κάθε MWh που φορτίζεται στην μπαταρία χάνει την τιμή ενίσχυσης και εισπράττει τιμή αγοράς την ώρα εκφόρτισης (μείον απώλειες). Με FiT ή ΤΑ υψηλότερη από τη βραδινή τιμή αγοράς, η φόρτιση ενέργειας που θα μπορούσε να εγχυθεί απευθείας είναι ζημιογόνα. Η μπαταρία έχει αξία μόνο για ενέργεια που αλλιώς θα κοβόταν ή δεν θα έπαιρνε ενίσχυση (αρνητικές τιμές, όριο έγχυσης).
  suggested_parameter:
    name: battery_discharge_price_basis
    default: day_ahead_market_price
    alternatives:
    - intraday_or_balancing_price (αν ο σταθμός συμμετέχει σε αυτές τις αγορές)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Ο νόμος λέει «ωριαία τιμή» ενώ από 1.10.2025 η ΑΕΗ έχει 15λεπτη χρονική μονάδα. Δεν βρήκα διάταξη που να διευκρινίζει αν ισχύει η 15λεπτη τιμή ή ο ωριαίος μέσος. Δεν βρήκα υπουργική απόφαση ή Κώδικα που να ορίζει τη μέθοδο εκκαθάρισης, τον χειρισμό απωλειών ή ποιος φορέας εκκαθαρίζει την ενέργεια της μπαταρίας για πάρκα FiT και ΣΕΣΤ που δεν συμμετέχουν στην αγορά.
- id: REG-B-008
  topic: storage_remuneration
  title: Η σύμβαση ενίσχυσης ή πώλησης διατηρείται για την ενέργεια των Φ/Β μονάδων
  requirement: Για τους σταθμούς του άρθρου 11Γ οι Συμβάσεις Λειτουργικής Ενίσχυσης και οι Συμβάσεις Πώλησης παραμένουν σε ισχύ και διέπουν την ποσότητα ενέργειας που εγχέεται από τις φωτοβολταϊκές μονάδες του σταθμού.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 3
    url: https://www.taxheaven.gr/law/5261/2025/arthro/56
    quote: Για τους σταθμούς του παρόντος οι Συμβάσεις Λειτουργικής Ενίσχυσης και οι Συμβάσεις Πώλησης Ηλεκτρικής Ενέργειας παραμένουν σε ισχύ και διέπουν την ποσότητα της ηλεκτρικής ενέργειας που εγχέεται από τις φωτοβολταϊκές μονάδες του σταθμού.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα του άρθρου 11Γ παρ. 1 που προσθέτουν μπαταρία.
  model_impact: 'Το πάρκο δεν χάνει το FiT ή το FiP με την προσθήκη μπαταρίας 11Α. Η άμεση έγχυση από τα Φ/Β συνεχίζει να πληρώνεται με τη σύμβαση. Το μοντέλο χωρίζει δύο ροές: Φ/Β προς δίκτυο (τιμή σύμβασης) και μπαταρία προς δίκτυο (τιμή αγοράς).'
  suggested_parameter:
    name: support_contract_kept_after_battery
    default: 'true'
    alternatives: []
  notes: 'Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η ίδια αρχή εμφανίζεται στην απόφαση ΡΑΑΕΥ Ε-12/2026 (ΦΕΚ Β'' 324/30.01.2026, πρόγραμμα «Απόλλων»): η λειτουργική ενίσχυση καταβάλλεται για την ενέργεια που εγχέεται από τη μονάδα ΑΠΕ και όχι από τη μονάδα αποθήκευσης (παρ. 197 της εγκριτικής απόφασης της Επιτροπής, την οποία δεν άνοιξα).'
- id: REG-B-009
  topic: storage_remuneration
  title: 'Παλιά πάρκα FiT (λειτουργία πριν τις 4.7.2019): δεν προβλέπεται ρητά προσθήκη μπαταρίας με διατήρηση της σύμβασης'
  requirement: Η παρ. 1 του άρθρου 11Γ καλύπτει μόνο Φ/Β που τέθηκαν σε λειτουργία μετά τις 4.7.2019. Οι παρ. 4 και 5 καλύπτουν επιπλέον Φ/Β αυτοκατανάλωσης και Φ/Β που συμμετέχουν απευθείας στην αγορά χωρίς λειτουργική ενίσχυση. Για πάρκο που λειτουργεί πριν από τις 4.7.2019 και έχει ενεργή σύμβαση FiT δεν βρήκα διάταξη που να επιτρέπει προσθήκη μπαταρίας πίσω από τον μετρητή με διατήρηση της σύμβασης.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 1, 4 και 5
    url: https://www.taxheaven.gr/law/5325/2026/arthro/57
    quote: Οι κάτοχοι φωτοβολταϊκών σταθμών της παρ. 1, φωτοβολταϊκών σταθμών για αυτοκατανάλωση και φωτοβολταικών σταθμών που συμμετέχουν απευθείας στην αγορά ηλεκτρικής ενέργειας και δεν λαμβάνουν λειτουργική ενίσχυση, που συνδέονται σε κοινό σημείο σύνδεσης με το Δίκτυο ή το Σύστημα δύνανται να υποβάλουν κοινό αίτημα [...]
  date_issued: '2026-07-31'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα FiT με θέση σε λειτουργία έως και 4.7.2019 (η μεγάλη μάζα των πάρκων 2009 έως 2013).
  model_impact: Για αυτά τα πάρκα η πιο υπερασπίσιμη ανάγνωση είναι ότι η μπαταρία δεν επιτρέπεται όσο ισχύει η σύμβαση FiT. Το DSS πρέπει να επιστρέφει «μη επιλέξιμο με το ισχύον πλαίσιο» ή να εξετάζει το σενάριο μετά τη λήξη της σύμβασης (συμμετοχή στην αγορά).
  suggested_parameter:
    name: old_fit_park_battery_allowed
    default: 'false'
    alternatives:
    - true μόνο μετά τη λήξη ή λύση της σύμβασης FiT, ως σταθμός που συμμετέχει στην αγορά χωρίς ενίσχυση
    - true αν εκδοθεί νέα ρύθμιση (δεν βρέθηκε)
  notes: Το ότι η διάταξη λείπει είναι δικό μου συμπέρασμα από τη διατύπωση του νόμου. Δεν βρήκα ρητή απαγόρευση ούτε εγκύκλιο. Δημοσίευμα αναφέρει ότι η δυνατότητα δόθηκε σε Φ/Β μετά τις 4.7.2019. Η ημερομηνία 4.7.2019 ταυτίζεται με το όριο του Κανονισμού (ΕΕ) 2019/943 για προτεραιότητα κατανομής και εξαίρεση από ευθύνη εξισορρόπησης (βλ. REG-B-027, REG-B-031). Να επιβεβαιωθεί με ΔΕΔΔΗΕ ή ΔΑΠΕΕΠ.
- id: REG-B-010
  topic: storage_remuneration
  title: 'Κοινός σταθμός αποθήκευσης στο ίδιο σημείο σύνδεσης (άρθρο 11Γ παρ. 5): η ενέργεια πάνω από τα όρια πάει στην μπαταρία χωρίς αμοιβή για το Φ/Β'
  requirement: Κάτοχοι Φ/Β της παρ. 1, Φ/Β αυτοκατανάλωσης και Φ/Β αγοράς χωρίς ενίσχυση, με κοινό σημείο σύνδεσης, μπορούν να ζητήσουν σταθμό αποθήκευσης στο σημείο αυτό, με μέγιστη ισχύ απορρόφησης και έγχυσης έως το άθροισμα της ισχύος των Φ/Β και ωφέλιμη χωρητικότητα τουλάχιστον 1 ώρα. Τα Φ/Β μπορούν να εγχέουν πάνω από τα όρια (στατικοί ή δυναμικοί περιορισμοί ή πρόγραμμα αγοράς) εφόσον ισόποση ενέργεια απορροφάται ταυτόχρονα από την αποθήκευση. Για αυτή την ενέργεια τα Φ/Β δεν λαμβάνουν ούτε έσοδο αγοράς ούτε λειτουργική ενίσχυση. Ο σταθμός αποθήκευσης συμμετέχει στις αγορές με τους γενικούς κανόνες.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 5 (όπως ισχύει μετά τον ν. 5325/2026)
    url: https://www.taxheaven.gr/law/5325/2026/arthro/57
    quote: Οι φωτοβολταϊκοί σταθμοί της παρούσας δύνανται να εγχέουν ενέργεια πέραν των ορίων που τίθενται από τους στατικούς ή δυναμικούς περιορισμούς ή περιορισμούς λόγω του προγράμματος κατανομής από την επίλυση της αγοράς, υπό την προϋπόθεση ότι ισόποση ενέργεια απορροφάται ταυτόχρονα από τον σταθμό αποθήκευσης. Οι φωτοβολταϊκοί σταθμοί της παρούσας δεν λαμβάνουν αποζημίωση από τις αγορές ηλεκτρικής ενέργειας ή λειτουργική ενίσχυση για την ενέργεια που εγχέουν πέραν των ως άνω περιορισμών η οποία απορροφάται ταυτόχρονα, χωρίς χρέωση, από τους σταθμούς αποθήκευσης.
  date_issued: '2026-07-31'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα που συνεργάζονται με αδειοδοτημένο σταθμό αποθήκευσης στο ίδιο σημείο σύνδεσης (ίδιος ή τρίτος ιδιοκτήτης).
  model_impact: 'Εναλλακτική αρχιτεκτονική: η περικοπτόμενη ενέργεια φορτίζει δωρεάν την μπαταρία και πωλείται από την αποθήκευση σε τιμές αγοράς. Το έσοδο ανήκει στον σταθμό αποθήκευσης και μοιράζεται με ιδιωτική συμφωνία. Σχετική προτεραιότητα σύνδεσης: 1000 MW από τον ΑΔΜΗΕ, αιτήματα έως 31.7.2026 με ειδική σειρά.'
  suggested_parameter:
    name: colocated_storage_energy_price_for_pv
    default: '0'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η παρ. 5 αφορά ξεχωριστή άδεια αποθήκευσης. Αν ο σταθμός αποθήκευσης μπορεί και να φορτίζει από το δίκτυο εξαρτάται από τους περιορισμούς έγχυσης και απορρόφησης της υπουργικής απόφασης (μέρος Α). Η απόφαση της παρ. 6 για λεπτομέρειες συμμετοχής στην αγορά και κυρώσεις δεν βρέθηκε.
- id: REG-B-011
  topic: storage_remuneration
  title: Σταθμοί 11Α (χωρίς φόρτιση από το δίκτυο) μπορούν να έχουν ενίσχυση, σταθμοί 11Β (με φόρτιση από το δίκτυο) όχι
  requirement: Οι σταθμοί της παρ. 11Α του άρθρου 10 ν. 4685/2020 μπορούν να συνάπτουν Συμβάσεις Λειτουργικής Ενίσχυσης, δεν απορροφούν ενέργεια από το δίκτυο παρά μόνο για βοηθητικές καταναλώσεις και δεν υπερβαίνουν τη Μέγιστη Ισχύ Παραγωγής της Βεβαίωσης. Οι σταθμοί της παρ. 11Β επιτρέπεται να απορροφούν από το δίκτυο για αποθήκευση, δεν επιτρέπεται να συνάπτουν Συμβάσεις Λειτουργικής Ενίσχυσης και συμμετέχουν στις αγορές.
  source:
    type: law
    citation: ν. 4685/2020 άρθρα 11Β και 19Α (προστέθηκαν με ν. 4951/2022 άρθρα 81 και 86, ΦΕΚ Α' 129/04.07.2022)
    url: https://www.taxheaven.gr/law/4951/2022/arthro/86
    quote: '1. Οι σταθμοί παραγωγής της παρ. 11Β του άρθρου 10: (α) επιτρέπεται να απορροφούν ενέργεια από το Σύστημα Μεταφοράς ή το Δίκτυο Διανομής ηλεκτρικής ενέργειας για σκοπούς αποθήκευσής της, (β) δεν επιτρέπεται να συνάπτουν Συμβάσεις Λειτουργικής Ενίσχυσης του ν. 4414/2016 (Α'' 149), (γ) συμμετέχουν στις Αγορές Ηλεκτρικής Ενέργειας του ν. 4425/2016 (Α'' 185)'
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα Φ/Β πάρκα που εξετάζουν μπαταρία πίσω από τον μετρητή.
  model_impact: 'Η φόρτιση από το δίκτυο (arbitrage) και η ενίσχυση αποκλείονται αμοιβαία. Στο μοντέλο: αν grid_charging = true τότε το πάρκο λογίζεται εκτός ενίσχυσης (merchant).'
  suggested_parameter:
    name: grid_charging_allowed_with_support
    default: 'false'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Τα άρθρα διαβάστηκαν στη μορφή του 2022. Δεν έλεγξα μεταγενέστερες τροποποιήσεις των άρθρων 11Β και 19Α.
- id: REG-B-012
  topic: storage_remuneration
  title: 'Μετατροπή 11Α σε 11Β: εφαρμόζεται το άρθρο 12Α ν. 4414/2016, πιθανή απώλεια της ενίσχυσης'
  requirement: Επιτρέπεται η μετατροπή σταθμών 11Α σε 11Β. Τότε εφαρμόζονται οι περιορισμοί έγχυσης των 11Β και, αν ο σταθμός έχει ή θα συνάψει σύμβαση λειτουργικής ενίσχυσης ή σύμβαση πώλησης, εφαρμόζεται το άρθρο 12Α του ν. 4414/2016 (λειτουργία εκτός καθεστώτος στήριξης). Το άρθρο 12Α παρ. 3, στη μορφή του 2019, ορίζει ότι η συμμετοχή στην αγορά χωρίς ενίσχυση επιφέρει αυτοδίκαιη λύση της σύμβασης και επιτρέπεται μόνο αν δεν έχει ληφθεί επενδυτική ενίσχυση και δεν έχουν περάσει 4 έτη από τη δοκιμαστική λειτουργία.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 6Α, και ν. 4414/2016 άρθρο 12Α (προστέθηκε με ν. 4643/2019 άρθρο 20, ΦΕΚ Α' 193)
    url: https://www.taxheaven.gr/law/4643/2019/arthro/20
    quote: Στην περίπτωση που συμμετέχουν στην αγορά ή πραγματοποιούν συναλλαγές ως Συμμετέχοντες χωρίς να λαμβάνουν Λειτουργική Ενίσχυση, επέρχεται αυτοδίκαιη λύση των συμβάσεων του προηγούμενου εδαφίου της παραγράφου αυτής.
  date_issued: '2025-12-12'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ενίσχυση που θέλουν μπαταρία με φόρτιση από το δίκτυο.
  model_impact: 'Υπερασπίσιμη ανάγνωση: η επιλογή 11Β σημαίνει οριστική έξοδο από την ενίσχυση. Το σενάριο arbitrage με φόρτιση από το δίκτυο πρέπει να αποτιμάται με όλα τα έσοδα του πάρκου σε τιμές αγοράς.'
  suggested_parameter:
    name: support_lost_if_grid_charging
    default: 'true'
    alternatives:
    - false (αν το ισχύον άρθρο 12Α επιτρέπει μερική διατήρηση, δεν επιβεβαιώθηκε)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Διάβασα το άρθρο 12Α όπως προστέθηκε το 2019. Έχει τροποποιηθεί έκτοτε (ο ν. 5313/2026 κατάργησε την περ. β της παρ. 7) και δεν βρήκα ενοποιημένο κείμενο. Το όριο των 4 ετών ίσως δεν ισχύει πλέον με την ίδια διατύπωση. Η σχέση της παρ. 6Α με το άρθρο 19Α παρ. 1β (απαγόρευση σύμβασης ενίσχυσης στους 11Β) χρειάζεται νομική γνώμη.
- id: REG-B-013
  topic: storage_remuneration
  title: 'Μόνιμο όριο ισχύος 07:00 έως 19:00 για Φ/Β που γίνονται 11Α: επίπτωση στα έσοδα'
  requirement: Στα Φ/Β των παρ. 1 και 4 του άρθρου 11Γ που προσθέτουν αποθήκευση και μετατρέπονται σε 11Α εφαρμόζεται μόνιμος περιορισμός της μέγιστης ισχύος παραγωγής του σταθμού «40% σε σχέση με την εγκατεστημένη ισχύ» του Φ/Β κατά τις ώρες 07:00 έως 19:00. Τις ώρες 19:00 έως 07:00 δεν υπάρχει μόνιμος περιορισμός. Κατά την ανάγνωση του ΔΕΔΔΗΕ που τεκμηριώνει το μέρος Α (REG-A-009) αυτό σημαίνει μέγιστη έγχυση ίση με 60% της εγκατεστημένης ισχύος Φ/Β (μείωση κατά 40%). Ο κανόνας καταγράφεται εδώ μόνο για την επίπτωσή του στην αμοιβή.
  source:
    type: law
    citation: ν. 4685/2020 άρθρο 11Γ (προστέθηκε με ν. 5151/2024 άρθρο 40, ΦΕΚ Α' 173/04.11.2024, τροποποιήθηκε με ν. 5261/2025 άρθρο 56, ΦΕΚ Α' 231/12.12.2025, ν. 5299/2026 άρθρο 56, ΦΕΚ Α' 67/05.05.2026 και ν. 5325/2026 άρθρο 57, ΦΕΚ Α' 122/31.07.2026), παρ. 5.α περ. α (όπως ισχύει μετά τον ν. 5299/2026 άρθρο 56 παρ. 2)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: α) μετατρέπονται σε σταθμούς της παρ. 11Α του άρθρου 10, εφαρμόζεται μόνιμος περιορισμός της μέγιστης ισχύος παραγωγής του σταθμού σαράντα τοις εκατό (40%) σε σχέση με την εγκατεστημένη ισχύ του φωτοβολταϊκού συστήματος κατά τις ώρες από 7:00 έως 19:00 κάθε ημέρας κατανομής, ενώ δεν εφαρμόζεται μόνιμος περιορισμός της μέγιστης ισχύος παραγωγής του σταθμού κατά τις ώρες από 19:00 έως 24:00 και 00:00 έως 7:00 κάθε ημέρας κατανομής
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Υφιστάμενα και νέα Φ/Β που προσθέτουν μπαταρία ως σταθμοί 11Α. Εξαιρούνται οι Γνωστοποιούμενοι Σταθμοί του άρθρου 38 ν. 4951/2022.
  model_impact: 'Το όριο μετατρέπει ενέργεια που σήμερα πληρώνεται με την τιμή της σύμβασης σε ενέργεια που περνά από την μπαταρία και πληρώνεται με τιμή αγοράς (REG-B-007). Για πάρκο FiT ή ΣΕΣΤ με τιμή σύμβασης πάνω από τη βραδινή τιμή αγοράς αυτό είναι καθαρή απώλεια ανά MWh, πέρα από τις απώλειες της μπαταρίας. Το μοντέλο πρέπει να υπολογίζει χωριστά: (α) ενέργεια Φ/Β έως το όριο με τιμή σύμβασης, (β) ενέργεια πάνω από το όριο προς μπαταρία με τιμή αγοράς, (γ) ενέργεια που δεν χωρά στην μπαταρία και χάνεται. Η απόφαση μπορεί να βγει αρνητική για πάρκα με υψηλή τιμή σύμβασης και λίγες περικοπές.'
  suggested_parameter:
    name: injection_cap_fraction_0700_1900
    default: '0.60'
    alternatives:
    - 0.40 (αν το «40%» διαβαστεί ως ανώτατο όριο και όχι ως ποσοστό μείωσης)
    - 1.00 (Γνωστοποιούμενοι Σταθμοί άρθρου 38 ν. 4951/2022)
  notes: 'Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η διατύπωση του νόμου είναι αμφίσημη (ανώτατο όριο 40% ή μείωση κατά 40%). Εγώ δεν άνοιξα το Τεχνικό Φυλλάδιο του ΔΕΔΔΗΕ, στηρίζομαι στην τεκμηρίωση του μέρους Α για την τιμή 0.60. Πριν από τις 5.5.2026 ο νόμος έγραφε 60% (ν. 5261/2025), άρα με την ίδια ανάγνωση το όριο ήταν τότε αυστηρότερο. Η τιμή πρέπει να επιβεβαιώνεται στην Οριστική Προσφορά Σύνδεσης κάθε έργου. Το ίδιο κλειδί παραμέτρου στο μέρος Α: export_cap_fraction_of_pv_installed_0700_1900.'
- id: REG-B-014
  topic: negative_prices
  title: 'ΣΕΔΠ: καμία λειτουργική ενίσχυση σε αρνητικές τιμές ΑΕΗ για πάνω από 2 διαδοχικές ώρες (από 1.6.2026)'
  requirement: Από την 1η Ιουνίου 2026 οι κάτοχοι σταθμών με ΣΕΔΠ δεν λαμβάνουν λειτουργική ενίσχυση για την ενέργεια που παράγουν τις ώρες κατά τις οποίες η Τιμή Εκκαθάρισης της Αγοράς Επόμενης Ημέρας είναι αρνητική (στρογγυλοποίηση 2 δεκαδικών, μεσοσταθμικά ανά ώρα από τα τέσσερα 15λεπτα) για πάνω από δύο διαδοχικές ώρες. Στις ώρες με μηδενική τιμή η ενίσχυση πλέον καταβάλλεται.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5 παρ. 10, όπως τροποποιήθηκε με το άρθρο 133 του ν. 5313/2026 (ΦΕΚ Α' 102/25.06.2026), ισχύς από 1.6.2026
    url: https://www.taxheaven.gr/law/5313/2026/arthro/133
    quote: 10. Οι κάτοχοι σταθμών παραγωγής ηλεκτρικής ενέργειας από Α.Π.Ε. και Σ.Η.Θ.Υ.Α. που συνάπτουν Σ.Ε.Δ.Π. και οι σταθμοί τους συμμετείχαν απευθείας ή μέσω Φο.Σ.Ε. ή Φο.Σ.Ε.Τε.Κ. στην Αγορά Επόμενης Ημέρας, στις Περιόδους Κατανομής από την 1η Ιουνίου 2026 και εφεξής, κατά τις οποίες η Τιμή Εκκαθάρισης της Αγοράς λαμβάνει αρνητικές τιμές στρογγυλοποιημένες με ακρίβεια δύο (2) δεκαδικών ψηφίων, μεσοσταθμικά ανά ώρα περιόδων κατανομής, για πάνω από δύο (2) διαδοχικές ώρες περιόδων κατανομής, δεν λαμβάνουν λειτουργική ενίσχυση για την παραγόμενη ηλεκτρική ενέργεια των σταθμών τους κατά τις ώρες αυτές. Για την εφαρμογή του παρόντος «Περίοδοι Κατανομής» νοούνται δεκαπεντάλεπτα (15 λεπτά) και ως «ώρα περιόδων κατανομής» νοούνται τέσσερα (4) δεκαπεντάλεπτα της ώρας.
  date_issued: '2026-06-25'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ που συμμετέχουν στην ΑΕΗ (άμεσα, μέσω ΦοΣΕ ή ΦοΣΕΤεΚ).
  model_impact: 'Στα επεισόδια αρνητικών τιμών άνω των 2 ωρών η άμεση έγχυση δεν παίρνει προσαύξηση και πωλείται σε αρνητική τιμή. Εδώ η μπαταρία έχει καθαρή αξία: φορτίζει ενέργεια με μηδενικό ή αρνητικό κόστος ευκαιρίας και την πουλά το βράδυ σε τιμή αγοράς.'
  suggested_parameter:
    name: fip_no_aid_rule
    default: negative_hourly_avg_price_more_than_2_consecutive_hours_whole_episode
    alternatives:
    - ίδιος κανόνας αλλά απώλεια μόνο από την τρίτη ώρα και μετά (ευνοϊκότερη ανάγνωση)
    - every_negative_interval (αν αυστηροποιηθεί κατά το σημείο 123 των CEEAG)
    - zero_or_negative_more_than_2_consecutive_hours (ίσχυε έως 31.5.2026)
  notes: 'Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η φράση «κατά τις ώρες αυτές» διαβάζεται από τους παραγωγούς (ΣΥΦΩΕΛ) ως απώλεια ενίσχυσης για όλο το επεισόδιο, μαζί με τις δύο πρώτες ώρες. Ο κανόνας μετρά ωριαίο μεσοσταθμικό των 15λέπτων, όχι κάθε 15λεπτο χωριστά. Δεν είδα το σταθμικό βάρος (όγκοι ή απλός μέσος). Η ΔΑΠΕΕΠ ενημέρωσε τους παραγωγούς για την εφαρμογή της νέας παρ. 10 στις εκκαθαρίσεις ΣΕΔΠ (αναδημοσίευση ienergeia.gr, 25.8.2026), επαναλαμβάνοντας το κείμενο του νόμου χωρίς να διευκρινίζει αν χάνονται όλες οι ώρες του επεισοδίου. Συντηρητική παραδοχή για το μοντέλο: όλες οι ώρες του επεισοδίου χωρίς ενίσχυση.'
- id: REG-B-015
  topic: negative_prices
  title: 'Προηγούμενη διατύπωση του κανόνα (έως 31.5.2026): μηδενικές ή αρνητικές τιμές'
  requirement: Έως τις 31.5.2026 η ενίσχυση των ΣΕΔΠ χανόταν όταν η Τιμή Εκκαθάρισης της ΑΕΗ ήταν μηδενική ή αρνητική (ωριαίο μεσοσταθμικό των 15λέπτων) για πάνω από δύο διαδοχικές ώρες. Η αρχική διάταξη του 2016 αναφερόταν σε μηδενική Οριακή Τιμή Συστήματος για πάνω από δύο διαδοχικές ώρες.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5 παρ. 10, όπως είχε διαμορφωθεί με το άρθρο 58 παρ. 2 του ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.taxheaven.gr/law/5261/2025/arthro/58
    quote: '[...] κατά τις οποίες η Τιμή Εκκαθάρισης της Αγοράς έλαβε μηδενικές ή και αρνητικές τιμές στρογγυλοποιημένες με ακρίβεια δύο (2) δεκαδικών ψηφίων, μεσοσταθμικά ανά ώρα περιόδων κατανομής, για πάνω από δύο (2) διαδοχικές ώρες περιόδων κατανομής, δεν λαμβάνουν λειτουργική ενίσχυση για την παραγόμενη ηλεκτρική ενέργεια των σταθμών τους κατά τις ώρες αυτές.'
  date_issued: '2025-12-12'
  status: repealed
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ, για ιστορικά δεδομένα έως 31.5.2026.
  model_impact: Χρήσιμο μόνο για αναδρομικό έλεγχο (backtesting) με δεδομένα 2025 και πρώτου πενταμήνου 2026.
  suggested_parameter:
    name: fip_no_aid_rule_until_2026_05_31
    default: zero_or_negative_hourly_avg_price_more_than_2_consecutive_hours
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Δεν εντόπισα ποιος νόμος πρόσθεσε πρώτος τις λέξεις «ή και αρνητικές» πριν από τον ν. 5261/2025.
- id: REG-B-016
  topic: negative_prices
  title: 'FiT και ΣΕΣΤ: ο κανόνας των αρνητικών τιμών δεν εφαρμόζεται, η σταθερή τιμή πληρώνεται'
  requirement: Ο κανόνας μη καταβολής ενίσχυσης σε αρνητικές τιμές βρίσκεται στο άρθρο 5 του ν. 4414/2016, που αφορά μόνο τις ΣΕΔΠ. Στους κατόχους ΣΕΣΤ δεν εφαρμόζεται το άρθρο 5. Για τις συμβάσεις πώλησης FiT του ν. 3468/2006 δεν βρήκα αντίστοιχη διάταξη. Άρα τα πάρκα FiT και ΣΕΣΤ εισπράττουν τη σταθερή τιμή και στις ώρες μηδενικών ή αρνητικών τιμών, για όση ενέργεια εγχέουν.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 3 παρ. 5 τελευταίο εδάφιο και άρθρο 5 παρ. 10 (ΦΕΚ Α' 149/09.08.2016)
    url: https://www.taxheaven.gr/law/4414/2016/arthro/3
    quote: Στους κατόχους σταθμών παραγωγής ηλεκτρικής ενέργειας από Α.Π.Ε. και Σ.Η.Θ.Υ.Α., που συνάπτουν Σ.Ε.Σ.Τ., δεν εφαρμόζονται όσα ορίζονται στο άρθρο 5.
  date_issued: '2016-08-09'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα FiT (ν. 3468/2006) και ΣΕΣΤ.
  model_impact: Για FiT και ΣΕΣΤ οι αρνητικές τιμές δεν μειώνουν το έσοδο της άμεσης έγχυσης. Η μπαταρία δεν αποκτά αξία από αυτές, εκτός αν οι αρνητικές τιμές συνοδεύονται από εντολές περικοπής.
  suggested_parameter:
    name: fixed_price_paid_in_negative_hours
    default: 'true'
    alternatives:
    - 'false για σταθμούς νέων καθεστώτων (π.χ. πρόγραμμα «Απόλλων»: καμία ενίσχυση για πάνω από 2 συνεχόμενες ώρες μηδενικών ή αρνητικών τιμών)'
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Το εδάφιο διαβάστηκε στο αρχικό κείμενο του 2016. Δεν επαλήθευσα ότι δεν άλλαξε. Η απόφαση ΡΑΑΕΥ Ε-12/2026 (ΦΕΚ Β' 324/30.01.2026) για το πρόγραμμα «Απόλλων» προβλέπει μη καταβολή ενίσχυσης σε επιλεγέντες σταθμούς για πάνω από δύο συνεχόμενες ώρες μηδενικών ή αρνητικών τιμών, άρα νεότερα καθεστώτα έχουν δικό τους κανόνα.
- id: REG-B-017
  topic: negative_prices
  title: 'Βάση κρατικών ενισχύσεων: EEAG 2014 σημ. 124 και 125, CEEAG 2022 σημ. 123'
  requirement: Οι Κατευθυντήριες Γραμμές 2014 (EEAG) απαιτούν από 1.1.2016 μέτρα ώστε οι παραγωγοί να μην έχουν κίνητρο να παράγουν με αρνητικές τιμές, με εξαίρεση εγκαταστάσεις κάτω των 500 kW. Οι Κατευθυντήριες Γραμμές 2022 (CEEAG) ορίζουν ότι οι δικαιούχοι δεν πρέπει να λαμβάνουν ενίσχυση για παραγωγή σε περιόδους με αρνητική αγοραία αξία. Ο ελληνικός κανόνας των 2 ωρών είναι ηπιότερος από τη διατύπωση των CEEAG.
  source:
    type: official_report
    citation: Ανακοίνωση της Επιτροπής 2022/C 80/01 (CEEAG), σημείο 123, και 2014/C 200/01 (EEAG), σημεία 124 και 125
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:52022XC0218(03)
    quote: Ειδικότερα, οι δικαιούχοι δεν θα πρέπει να κινητροδοτούνται ώστε να προσφέρουν την παραγωγή τους κάτω από το οριακό κόστος τους, ούτε πρέπει να λαμβάνουν ενίσχυση για παραγωγή σε περιόδους κατά τις οποίες η αγοραία αξία της εν λόγω παραγωγής είναι αρνητική
  date_issued: '2022-02-18'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα καθεστώτα λειτουργικής ενίσχυσης. Τα παλιά συμβόλαια κρίνονται με τις κατευθυντήριες γραμμές της εποχής έγκρισής τους.
  model_impact: Κίνδυνος μελλοντικής αυστηροποίησης (κάθε διάστημα αρνητικής τιμής) για νέα καθεστώτα. Για υφιστάμενες ΣΕΔΠ ο κανόνας των 2 ωρών ισχύει όσο δεν αλλάζει ο νόμος. Προτείνεται ανάλυση ευαισθησίας.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Το ΥΠΕΝ δήλωσε ότι η αλλαγή του Ιουνίου 2026 έγινε σε συνεννόηση με την Ευρωπαϊκή Επιτροπή (δημοσιεύματα). Δεν άνοιξα τις αποφάσεις έγκρισης των ελληνικών καθεστώτων (SA).
- id: REG-B-018
  topic: negative_prices
  title: Συχνότητα μηδενικών και αρνητικών τιμών ΑΕΗ 2025 και 2026
  requirement: 'Σύμφωνα με δημοσιεύματα που επικαλούνται το ΥΠΕΝ: το 2025 καταγράφηκαν 475,5 ώρες μηδενικών ή αρνητικών τιμών στη χονδρική. Το 2026, έως τις αρχές Ιουνίου, είχαν καταγραφεί 203 ώρες μηδενικών και 242 ώρες αρνητικών τιμών. Κατά την Aurora Energy Research (συνέδριο Αθήνας, Σεπτέμβριος 2026): ώρες αρνητικών τιμών 11 το 2024, 115 το 2025 και 382 έως τις 15.9.2026.'
  source:
    type: secondary_press
    citation: Δημοσιεύματα για την τροπολογία ΥΠΕΝ, Ιούνιος 2026 (capital.gr, protothema.gr, dnews.gr)
    url: https://www.capital.gr/oikonomia/3996757/anasa-gia-tous-paragogous-ape-to-upen-exasfalise-enisxusi-gia-tis-midenikes-times-meta-apo-sunennoisi-me-tin-europi/
    quote: ''
  date_issued: '2026-06-05'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα που εκτίθενται σε τιμές αγοράς.
  model_impact: Τάξη μεγέθους για έλεγχο των σεναρίων τιμών του μοντέλου. Τα πραγματικά 15λεπτα δεδομένα πρέπει να ληφθούν από το Ελληνικό Χρηματιστήριο Ενέργειας.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Αριθμοί από σύνοψη αναζήτησης και από ρεπορτάζ ess-news.com (29.9.2026), όχι από επίσημο αρχείο του ΕΧΕ. Δεν άνοιξα το enexgroup.gr. Τα όρια τιμών της ΑΕΗ (ανώτατο, κατώτατο) δεν επαληθεύτηκαν. Το αποθετήριο έχει δικά του δεδομένα τιμών ΑΕΗ (data/processed), από τα οποία οι ώρες αυτές μπορούν να μετρηθούν απευθείας.
- id: REG-B-019
  topic: curtailment
  title: Εντολές Περιορισμού Έγχυσης από ΑΔΜΗΕ και ΔΕΔΔΗΕ (μεταβατικό καθεστώς)
  requirement: Μέχρι να εκδοθεί η υπουργική απόφαση του άρθρου 10Α ν. 4951/2022, ο ΑΔΜΗΕ και ο Διαχειριστής του Δικτύου μπορούν να εκδίδουν Εντολές Περιορισμού Έγχυσης σε σταθμούς ΑΠΕ ή ομάδες σταθμών για λόγους αξιοπιστίας ή ασφάλειας του Συστήματος και του Δικτύου, μαζί με τοπική συμφόρηση. Εντολή θεωρείται και η αποσύνδεση. Ο ΑΔΜΗΕ δίνει εντολές και προς τους διαχειριστές διανομής, οι οποίοι περιορίζουν τους σταθμούς του δικτύου τους. Πρέπει πρώτα να ληφθούν μέτρα ελαχιστοποίησης των περικοπών ΑΠΕ.
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 10Β (προστέθηκε με ν. 5106/2024 άρθρο 118, ΦΕΚ Α' 63/01.05.2024)
    url: https://www.taxheaven.gr/law/5106/2024/arthro/118
    quote: Ως Εντολές Περιορισμού Έγχυσης σε σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α. ή σε ομάδες σταθμών Α.Π.Ε. και Σ.Η.Θ.Υ.Α. νοούνται οι εντολές κατανομής που εκδίδουν ο Διαχειριστής του Ελληνικού Συστήματος Μεταφοράς Ηλεκτρικής Ενέργειας (Ε.Σ.Μ.Η.Ε.) και ο Διαχειριστής του Δικτύου προκειμένου να περιοριστεί η έγχυση από Μονάδες Α.Π.Ε. και Σ.Η.Θ.Υ.Α. ή ομάδες Μονάδων Α.Π.Ε. και Σ.Η.Θ.Υ.Α. για λόγους που σχετίζονται με την αξιοπιστία ή την ασφάλεια λειτουργίας του Ε.Σ.Μ.Η.Ε. και του Δικτύου, περιλαμβανομένης της διαχείρισης συνθηκών τοπικής συμφόρησης.
  date_issued: '2024-05-01'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί ΑΠΕ στο διασυνδεδεμένο σύστημα και δίκτυο, ανεξάρτητα από καθεστώς ενίσχυσης.
  model_impact: 'Οι τεχνικές περικοπές (εντολές διαχειριστή) είναι ξεχωριστή κατηγορία από τις περικοπές αγοράς (μη αποδοχή εντολών πώλησης, αρνητικές τιμές). Το μοντέλο χρειάζεται δύο χρονοσειρές: εντολές περιορισμού και περικοπές αγοράς.'
  suggested_parameter:
    name: curtailment_types_modelled
    default: technical_orders_and_market_based
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Ο νόμος δεν ορίζει κανόνα επιμερισμού (αναλογικό ή κατά κατηγορία). Η κατηγοριοποίηση και οι προτεραιότητες παραπέμπονται στην υπουργική απόφαση του άρθρου 10Α. Δεν διάβασα τον Κώδικα Διαχείρισης ΕΣΜΗΕ ούτε τον Κώδικα Δικτύου.
- id: REG-B-020
  topic: curtailment
  title: 'Σταθμοί άνω του 1 MW: υποχρέωση υποδομής περιορισμού ισχύος, κύρωση 25% των εσόδων'
  requirement: Σταθμοί ΑΠΕ και αποθήκευσης (ή ομάδες, ή ιδιωτικά δίκτυα ΜΤ) με εγκατεστημένη ισχύ άνω του 1 MW, και οι ΦοΣΕ που τους εκπροσωπούν, πρέπει να διαθέτουν υποδομές περιορισμού της ισχύος μετά από εντολή του διαχειριστή. Όσοι δεν τις είχαν την 1.5.2024 έπρεπε να τις εγκαταστήσουν με δικές τους δαπάνες εντός 6 μηνών. Σε μη συμμόρφωση, για κάθε περίοδο με Εντολή Περιορισμού ο σταθμός επιστρέφει το 25% των εσόδων από τις αγορές και δεν δικαιούται αποζημίωση από τη ΔΑΠΕΕΠ για το σύνολο της ενέργειας που παρήχθη.
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 10Β παρ. 6 (ν. 5106/2024 άρθρο 118, ΦΕΚ Α' 63/01.05.2024)
    url: https://www.taxheaven.gr/law/5106/2024/arthro/118
    quote: '[...] οι σχετικές Μονάδες Α.Π.Ε. και Σ.Η.Θ.Υ.Α. για κάθε περίοδο που εκδόθηκε Εντολή Περιορισμού Έγχυσης επιστρέφουν το είκοσι πέντε τοις εκατό (25%) των εσόδων που έχουν λάβει από τις Αγορές Ηλεκτρικής Ενέργειας, χωρίς να δικαιούνται καμία αποζημίωση από τον Δ.Α.Π.Ε.Ε.Π. για το σύνολο της ενέργειας που παρήχθη.'
  date_issued: '2024-05-01'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα άνω του 1 MW (και ομάδες σταθμών ή ιδιωτικά δίκτυα ΜΤ άνω του 1 MW).
  model_impact: Το μοντέλο υποθέτει συμμόρφωση. Η μη συμμόρφωση είναι ξεχωριστός κίνδυνος κόστους.
  suggested_parameter:
    name: curtailment_control_threshold_mw
    default: '1.0'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr).
- id: REG-B-021
  topic: curtailment
  title: Τηλεποπτεία και τηλεδιαχείριση για σταθμούς άνω των 400 kW στο δίκτυο διανομής, με κυρώσεις
  requirement: 'Ο ΔΕΔΔΗΕ αναπτύσσει τηλεποπτεία και τηλεδιαχείριση όλων των σταθμών ΑΠΕ άνω των 400 kW. Οι παραγωγοί εγκαθιστούν με δικές τους δαπάνες τον εξοπλισμό και υποβάλλουν υπεύθυνη δήλωση συμμόρφωσης εντός 8 μηνών από τη γνωστοποίηση των απαιτήσεων. Αλλιώς επιβάλλεται μηνιαία χρέωση = π x Τιμή Αναφοράς (ή ΕΤΑ) x παραχθείσα ενέργεια. Το π αυξάνεται ανά μήνα καθυστέρησης: 5% (600 kW έως 1 MW, σύνδεση μετά τις 4.7.2019), 3% (400 έως 600 kW, μετά τις 4.7.2019), 2,5% (400 kW έως 1 MW, πριν τις 4.7.2019), με ανώτατο 25%. Σε παρατεταμένη μη συμμόρφωση ακολουθεί αποσύνδεση.'
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 9Α (προστέθηκε με ν. 5106/2024 άρθρο 111, παρ. 4 έως 9 όπως ισχύουν με ν. 5188/2025 άρθρο 35, ΦΕΚ Α' 49/28.03.2025)
    url: https://www.taxheaven.gr/law/5188/2025/arthro/35
    quote: Το ποσοστό δεν δύναται σε καμία εκ των περ. α), β) και γ), να υπερβαίνει το είκοσι πέντε τοις εκατό (25%), ανεξαρτήτως των μηνών καθυστέρησης συμμόρφωσης με την προθεσμία της παρ. 4.
  date_issued: '2025-03-28'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα άνω των 400 kW συνδεδεμένα στο ΕΔΔΗΕ, με ή χωρίς ενίσχυση. Τα πάρκα έως 400 kW δεν έχουν αυτή την υποχρέωση.
  model_impact: Τα πάρκα έως 400 kW πρακτικά δεν περικόπτονται με τηλεχειρισμό (μόνο με τοπικούς χειρισμούς ή αποσύνδεση), άρα έχουν μικρότερη περικοπτόμενη ενέργεια για να σώσει η μπαταρία. Τα πάρκα άνω των 400 kW είναι εκτεθειμένα σε περικοπές.
  suggested_parameter:
    name: telecontrol_threshold_kw
    default: '400'
    alternatives: []
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Το ότι τα πάρκα έως 400 kW περικόπτονται μόνο με τοπικούς χειρισμούς είναι δημοσιογραφική πληροφορία. Δεν επαλήθευσα τις ακριβείς ημερομηνίες γνωστοποίησης των απαιτήσεων από τον ΔΕΔΔΗΕ ούτε πόσα πάρκα έχουν συμμορφωθεί. Δημοσίευμα αναφέρει προθεσμία 15.9.2026 για αυτοπαραγωγούς άνω των 400 kW (μη επιβεβαιωμένο). Ο Κανονισμός (ΕΕ) 2019/943 άρθρο 12 δίνει προτεραιότητα κατανομής σε ΑΠΕ κάτω των 400 kW.
- id: REG-B-022
  topic: curtailment
  title: Πλαίσιο περιορισμών παραγωγής ΑΠΕ με υπουργική απόφαση (άρθρο 10Α ν. 4951/2022)
  requirement: 'Με απόφαση του Υπουργού Περιβάλλοντος και Ενέργειας καθορίζεται πλαίσιο περιορισμών παραγωγής ΑΠΕ: κατηγορίες περιορισμών (τοπική συμφόρηση, ασφάλεια, πλεόνασμα παραγωγής σε επίπεδο ζώνης προσφορών), όρια, αρχές και προτεραιότητα επιβολής, κατηγοριοποίηση σταθμών, συνεργασία με αποθήκευση ανά αγορά, ρόλοι ΑΔΜΗΕ, ΔΕΔΔΗΕ, ΕΧΕ, ΔΑΠΕΕΠ, ΦοΣΕ, υποχρεώσεις εξοπλισμού και κυρώσεις. Αποδεκτά όρια περιορισμών μπορούν να τεθούν μόνο όταν ο ΔΕΔΔΗΕ ελέγχει την παραγωγή ΑΠΕ του δικτύου του.'
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 10Α (προστέθηκε με ν. 5106/2024 άρθρο 117, ΦΕΚ Α' 63/01.05.2024)
    url: https://www.taxheaven.gr/law/5106/2024/arthro/117
    quote: Δύναται να καθορίζονται όρια επιβολής περιορισμών έγχυσης στους σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α., οι αρχές και η προτεραιότητα επιβολής των περιορισμών αυτών στους σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α. και η σχετική κατηγοριοποίηση των σταθμών, καθώς και η συνεργασία τους με σταθμούς αποθήκευσης ηλεκτρικής ενέργειας, για κάθε επιμέρους αγορά ηλεκτρικής ενέργειας (Αγορά Επόμενης Ημέρας, Ενδοημερήσια Αγορά, Αγορά Εξισορρόπησης) αφού ληφθούν υπόψη οι ανάγκες ανακατανομής.
  date_issued: '2024-05-01'
  status: pending
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί ΑΠΕ και αποθήκευσης.
  model_impact: Ο τρόπος κατανομής των περικοπών μεταξύ σταθμών (αναλογικά, κατά κατηγορία, εξαιρέσεις μικρών ή παλιών) δεν έχει οριστεί σε κανονιστικό κείμενο που να βρήκα. Το μοντέλο πρέπει να δέχεται το ποσοστό περικοπής ως παράμετρο σεναρίου ανά πάρκο.
  suggested_parameter:
    name: curtailment_allocation_rule
    default: unknown_use_scenario_input
    alternatives:
    - pro_rata_within_controllable_group
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Η εξουσιοδότηση ισχύει, αλλά δεν βρήκα ΦΕΚ της απόφασης-πλαισίου. Δημοσιεύματα του 2026 περιγράφουν ότι οι περισσότερες περικοπές γίνονται πλέον από τους ΦοΣΕ για συμμόρφωση με τα προγράμματα αγοράς και ότι τα έργα στο σύστημα του ΑΔΜΗΕ κόβονται πολύ περισσότερο από όσα είναι στο δίκτυο του ΔΕΔΔΗΕ.
- id: REG-B-023
  topic: pending_change
  title: 'Μηχανισμός Αντιστάθμισης (Αναδιανομής) Περικοπών ΑΠΕ: προβλέπεται στον νόμο, η απόφαση εκκρεμεί'
  requirement: 'Ο νόμος επιτρέπει να θεσπιστεί με υπουργική απόφαση Μηχανισμός Αντιστάθμισης Περικοπών μεταξύ παραγωγών ΑΠΕ: χρεώσεις σε σταθμούς που δεν μπορούν τεχνικά να περικοπούν, πιστώσεις σε σταθμούς που περικόπηκαν πέραν της αναλογίας τους. Φορέας εφαρμογής η ΔΑΠΕΕΠ με ειδικό λογαριασμό. Κατά τον Τύπο (Αύγουστος και Οκτώβριος 2026) το πλαίσιο έχει οριστικοποιηθεί χωρίς αναδρομική ισχύ, η απόφαση αναμενόταν έως το τέλος του 2026 και η πρώτη εκκαθάριση στις αρχές του 2027.'
  source:
    type: law
    citation: ν. 4951/2022 άρθρο 10Α παρ. 5 (ν. 5106/2024 άρθρο 117)
    url: https://www.taxheaven.gr/law/5106/2024/arthro/117
    quote: Με απόφαση του Υπουργού Περιβάλλοντος και Ενέργειας, δύναται, κατόπιν πρότασης της Ομάδας Διοίκησης Έργου, να θεσπίζεται Μηχανισμός Αντιστάθμισης Περικοπών Α.Π.Ε. και Σ.Η.Θ.Υ.Α. μεταξύ παραγωγών Α.Π.Ε. και Σ.Η.Θ.Υ.Α., για την αντιστάθμιση των πρόσθετων περιορισμών που επιβάλλονται σε σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α., λόγω της τεχνικής αδυναμίας εφαρμογής στην πράξη αναλογικού επιμερισμού των περιορισμών σε όλους τους σταθμούς της αυτής ομάδας περιορισμών, με χρεώσεις που επιβάλλονται σε σταθμούς Α.Π.Ε. και Σ.Η.Θ.Υ.Α. οι οποίοι δεν δύναται να εφαρμόσουν λόγω τεχνικής αδυναμίας τους ως άνω περιορισμούς.
  date_issued: '2024-05-01'
  status: pending
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: 'Όλοι οι παραγωγοί ΑΠΕ. Ειδικά: πάρκα που δεν περικόπτονται (π.χ. μικρά χωρίς τηλεέλεγχο) θα πληρώνουν, πάρκα που περικόπτονται δυσανάλογα θα εισπράττουν.'
  model_impact: Αν εφαρμοστεί, μειώνει το όφελος της μπαταρίας για τα πολύ περικοπτόμενα πάρκα (παίρνουν ήδη μερική αντιστάθμιση) και δημιουργεί κόστος στα μη περικοπτόμενα. Να μπει ως σενάριο με διακόπτη.
  suggested_parameter:
    name: curtailment_redistribution_mechanism_active
    default: 'false'
    alternatives:
    - true από το 2027 (αν εκδοθεί η υπουργική απόφαση)
  notes: Οι λεπτομέρειες (θεωρητική παραγωγή υπολογισμένη από ΑΔΜΗΕ και ΔΕΔΔΗΕ, χρηματοδότηση ελλείμματος από ΕΛΑΠΕ, χρεώσεις μη συμμόρφωσης) προέρχονται μόνο από δημοσίευμα του B2Green (4.8.2026). Δεν βρήκα ΦΕΚ. Παλαιότερα δημοσιεύματα έλεγαν αναδρομική ισχύ από 1.1.2026, νεότερα το αποκλείουν.
- id: REG-B-024
  topic: curtailment
  title: 'Ενωσιακός κανόνας αποζημίωσης ανακατανομής (redispatch): Κανονισμός (ΕΕ) 2019/943 άρθρο 13'
  requirement: Η ανακατανομή πρέπει να βασίζεται στην αγορά και να αποζημιώνεται. Όταν γίνεται ανακατανομή που δεν βασίζεται στην αγορά, ο διαχειριστής που τη ζητά αποζημιώνει τον παραγωγό, εκτός αν η συμφωνία σύνδεσης δεν εγγυάται σταθερή παράδοση ενέργειας. Η αποζημίωση είναι τουλάχιστον το πρόσθετο λειτουργικό κόστος ή τα καθαρά έσοδα της αγοράς επόμενης ημέρας που θα είχε ο σταθμός, μαζί με την οικονομική στήριξη που θα λάμβανε. Οι διαχειριστές εγγυώνται ελάχιστη ανακατανομή ΑΠΕ, με αναφορά το 5% της ετήσιας παραγωγής.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943, άρθρο 13 παρ. 2, 5, 6 και 7 (ενοποιημένη έκδοση 16.07.2024, όπως τροποποιήθηκε με τον Κανονισμό (ΕΕ) 2024/1747)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Όταν χρησιμοποιείται ανακατανομή που δεν βασίζεται στην αγορά, αποτελεί αντικείμενο οικονομικής αποζημίωσης από τον διαχειριστή συστήματος που ζητεί την ανακατανομή προς τον διαχειριστή της εγκατάστασης ανακατανομής μονάδας, αποθήκευσης ενέργειας ή απόκρισης ζήτησης, με την εξαίρεση των ηλεκτροπαραγωγών που έχουν δεχθεί συμφωνία σύνδεσης στην οποία δεν υπάρχει εγγύηση παγιωμένη για παράδοση σταθερών ποσοτήτων ενέργειας.
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί ΑΠΕ που υφίστανται τεχνικές περικοπές κατ' εντολή διαχειριστή.
  model_impact: Κατ' αρχήν οι τεχνικές περικοπές είναι αποζημιώσιμες στο ενωσιακό δίκαιο. Στην πράξη το μοντέλο δεν πρέπει να υπολογίζει αποζημίωση (βλ. REG-B-025). Η εξαίρεση για συμβάσεις σύνδεσης χωρίς εγγύηση σταθερής παράδοσης καλύπτει τους σταθμούς με όρους περιορισμών έγχυσης.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Ο Κανονισμός έχει άμεση ισχύ. Δεν βρήκα ελληνική διάταξη ή απόφαση ΡΑΑΕΥ που να οργανώνει πληρωμή αποζημίωσης για εντολές περιορισμού ΑΠΕ.
- id: REG-B-025
  topic: curtailment
  title: Στην Ελλάδα η περικοπτόμενη ενέργεια ΑΠΕ δεν αποζημιώνεται στην πράξη
  requirement: Δεν εντόπισα σε νόμο, υπουργική απόφαση ή απόφαση ΡΑΑΕΥ μηχανισμό που να πληρώνει τον παραγωγό για ενέργεια που δεν εγχύθηκε λόγω Εντολής Περιορισμού ή λόγω μη αποδοχής της προσφοράς στην αγορά. Η σύμβαση FiT, ΣΕΣΤ ή ΣΕΔΠ πληρώνει μόνο ενέργεια που εγχύθηκε και μετρήθηκε. Ο μόνος προβλεπόμενος μηχανισμός είναι η αναδιανομή μεταξύ παραγωγών (REG-B-023), που δεν έχει ενεργοποιηθεί.
  source:
    type: secondary_press
    citation: 'Συνδυασμός: ν. 4951/2022 άρθρα 10Α και 10Β, δημοσιεύματα B2Green (7.5.2026 και 4.8.2026), ανακοινώσεις ΠΟΣΠΗΕΦ'
    url: https://news.b2green.gr/77779/
    quote: ''
  date_issued: ''
  status: unclear
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Όλα τα Φ/Β πάρκα.
  model_impact: 'Η περικοπή ισοδυναμεί με μηδενικό έσοδο για την αντίστοιχη ενέργεια. Αυτό είναι η βασική πηγή αξίας της μπαταρίας: η ενέργεια που θα κοβόταν αποθηκεύεται και πωλείται αργότερα σε τιμή αγοράς.'
  suggested_parameter:
    name: curtailed_energy_compensation_eur_mwh
    default: '0'
    alternatives:
    - αξία αντιστάθμισης από τον μηχανισμό αναδιανομής όταν εφαρμοστεί (άγνωστο ύψος)
  notes: 'Αρνητικό εύρημα: η απουσία μηχανισμού δεν αποδεικνύεται από ένα κείμενο. Υπάρχει ένταση με το άρθρο 13 παρ. 7 του Κανονισμού (ΕΕ) 2019/943. Δεν διάβασα τον Κώδικα Διαχείρισης ΕΣΜΗΕ ούτε τον Κανονισμό Αγοράς Εξισορρόπησης στο σύνολό τους.'
- id: REG-B-026
  topic: curtailment
  title: Μέγεθος περικοπών ΑΠΕ 2023 έως 2026
  requirement: 'Εκτιμήσεις Green Tank με βάση δεδομένα προγραμματισμού του ΑΔΜΗΕ: 2023: 228 GWh. 2024: 860 GWh (3,3% της παραγωγής ΑΠΕ). 2025: 1.867 GWh (6,6%). Ιανουάριος έως Σεπτέμβριος 2026: 2.063 GWh (7,8%), έναντι 1.786 GWh την ίδια περίοδο του 2025. Σεπτέμβριος 2026: 158,2 GWh (5,4%). Η ΠΟΣΠΗΕΦ εκτιμά 3,3 έως 3,7 TWh για όλο το 2026 και απώλειες εσόδων Φ/Β άνω του 40%. Άλλες εκτιμήσεις αγοράς: 30 έως 35% της παραγωγής Φ/Β.'
  source:
    type: secondary_press
    citation: Green Tank «Τάσεις στην ηλεκτροπαραγωγή» (μηνιαίες αναλύσεις 2024 έως Σεπτέμβριος 2026), όπως αναδημοσιεύτηκαν (ienergeia.gr, michanikos-online.gr, powergame.gr), ανακοινώσεις ΠΟΣΠΗΕΦ
    url: https://www.ienergeia.gr/ilektrismos/44439/greentank-taseis-stin-ilektroparagogi-septemvrios-2026
    quote: ''
  date_issued: '2026-11-01'
  status: in_force
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Σύνολο ΑΠΕ διασυνδεδεμένου συστήματος. Τα ποσοστά για Φ/Β είναι πολύ υψηλότερα από τον μέσο όρο ΑΠΕ.
  model_impact: Βαθμονόμηση των σεναρίων περικοπών. Τα συστημικά ποσοστά (7 έως 9% των ΑΠΕ) υποεκτιμούν την περικοπή ενός Φ/Β πάρκου με τηλεέλεγχο τις μεσημβρινές ώρες. Χρειάζονται δεδομένα ανά πάρκο από τον ΦοΣΕ ή τον διαχειριστή.
  suggested_parameter:
    name: system_res_curtailment_share_2025
    default: '0.066'
    alternatives:
    - 0.078 (Ιανουάριος έως Σεπτέμβριος 2026)
    - 0.30 έως 0.40 της παραγωγής Φ/Β (ισχυρισμοί συλλόγων παραγωγών, μη επαληθευμένοι)
  notes: Δεν είναι επίσημα απολογιστικά στοιχεία ΑΔΜΗΕ, ΡΑΑΕΥ ή ΔΑΠΕΕΠ. Είναι εκτιμήσεις τρίτου από δεδομένα προγραμματισμού και τις είδα μέσω συνόψεων αναζήτησης. Δεν βρήκα επίσημη ετήσια έκθεση ανακατανομής (άρθρο 13 παρ. 4 του Κανονισμού 2019/943). Τα ποσοστά ΠΟΣΠΗΕΦ μπερδεύουν μερικές φορές απώλεια ενέργειας με απώλεια εσόδων.
- id: REG-B-027
  topic: curtailment
  title: Προτεραιότητα κατανομής μικρών και παλιών ΑΠΕ και απώλειά της σε «σημαντική τροποποίηση»
  requirement: Οι διαχειριστές δίνουν προτεραιότητα κατανομής σε ΑΠΕ κάτω των 400 kW (κάτω των 200 kW για όσες τεθούν σε λειτουργία μετά την 1.1.2026). Οι ΑΠΕ που τέθηκαν σε λειτουργία πριν από τις 4.7.2019 και είχαν προτεραιότητα κατανομής τη διατηρούν, αλλά τη χάνουν όταν υποστούν σημαντικές τροποποιήσεις, δηλαδή τουλάχιστον όταν απαιτείται νέα συμφωνία σύνδεσης ή αυξάνεται η ισχύς παραγωγής.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943, άρθρο 12 παρ. 2, 5 και 6 (ενοποιημένη έκδοση 16.07.2024)
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02019R0943-20240716
    quote: Η κατανομή κατά προτεραιότητα παύει να εφαρμόζεται στις εν λόγω εγκαταστάσεις ηλεκτροπαραγωγής από την ημερομηνία κατά την οποία η εγκατάσταση ηλεκτροπαραγωγής υφίσταται σημαντικές τροποποιήσεις, γεγονός που θεωρείται ότι συμβαίνει τουλάχιστον όταν απαιτείται νέα συμφωνία σύνδεσης ή όταν αυξάνεται η ισχύς παραγωγής της εγκατάστασης ηλεκτροπαραγωγής.
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα κάτω των 400 kW και πάρκα με λειτουργία πριν τις 4.7.2019.
  model_impact: 'Κίνδυνος για παλιά πάρκα: αν η προσθήκη μπαταρίας απαιτήσει νέα σύμβαση σύνδεσης, μπορεί να χαθεί η προτεραιότητα κατανομής και το πάρκο να γίνει περικόψιμο όπως τα νεότερα. Να μπει ως ποιοτική προειδοποίηση του DSS.'
  suggested_parameter:
    name: priority_dispatch_lost_on_new_connection_agreement
    default: 'true'
    alternatives:
    - false (αν η τροποποίηση της σύμβασης σύνδεσης δεν θεωρηθεί «νέα συμφωνία»)
  notes: Η εφαρμογή στην προσθήκη μπαταρίας είναι δική μου ερμηνεία, δεν βρήκα ελληνική οδηγία. Πώς εφαρμόζει η Ελλάδα την προτεραιότητα κατανομής στα παλιά FiT σε συνθήκες περικοπών δεν επαληθεύτηκε.
- id: REG-B-028
  topic: market_participation
  title: 'ΣΕΔΠ: υποχρέωση εγγραφής στο Μητρώο Συμμετεχόντων ή σύμβασης με ΦοΣΕ'
  requirement: Οι κάτοχοι σταθμών με ΣΕΔΠ πρέπει να είναι εγγεγραμμένοι στο Μητρώο Συμμετεχόντων ή να έχουν Σύμβαση Εκπροσώπησης με Φορέα Σωρευτικής Εκπροσώπησης (ΦοΣΕ) και να έχουν υποβάλει Δήλωση Εκπροσώπησης στη ΔΑΠΕΕΠ.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5 παρ. 4, όπως ισχύει μετά το άρθρο 54 του ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/54
    quote: '[...] υποχρεούνται να έχουν εγγραφεί στο Μητρώο Συμμετεχόντων ή να έχουν συνάψει Σύμβαση Εκπροσώπησης με Φορέα Σωρευτικής Εκπροσώπησης (Φο.Σ.Ε.) και να έχουν υποβάλει τη σχετική Δήλωση Εκπροσώπησης στον Διαχειριστή Ανανεώσιμων Πηγών Ενέργειας και Εγγυήσεων Προέλευσης (Δ.Α.Π.Ε.Ε.Π. Α.Ε.).'
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με ΣΕΔΠ. Αναλογικά και πάρκα χωρίς ενίσχυση (άρθρο 12Α ν. 4414/2016).
  model_impact: Το μοντέλο αφαιρεί αμοιβή ΦοΣΕ και κόστος αποκλίσεων από τα έσοδα αγοράς. Ο ΦοΣΕ είναι και αυτός που στην πράξη θα προγραμματίζει την μπαταρία στην αγορά.
  suggested_parameter:
    name: market_access_route
    default: aggregator_fose
    alternatives:
    - direct_participant
    - fosetek_last_resort
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr).
- id: REG-B-029
  topic: aggregator
  title: 'ΦοΣΕΤεΚ: σήμερα η ΔΑΠΕΕΠ, από 1.1.2027 με διαγωνισμό ΡΑΑΕΥ και ανώτατη χρέωση 6% της ΕΤΑ'
  requirement: Φορέας Σωρευτικής Εκπροσώπησης Τελευταίου Καταφυγίου (ΦοΣΕΤεΚ) ορίστηκε με την ΥΑ ΥΠΕΝ/ΔΑΠΕΕΚ/25512/883/20.3.2019 (η ΔΑΠΕΕΠ). Από 1.1.2027 και ανά διετία ο ΦοΣΕΤεΚ επιλέγεται με πρόσκληση της ΡΑΑΕΥ. Κριτήριο είναι η χαμηλότερη μηνιαία χρέωση ως ποσοστό της μηνιαίας Ειδικής Τιμής Αγοράς της τεχνολογίας, που δεν μπορεί να υπερβαίνει το 6%. Για σταθμούς που συνεχίζουν να λειτουργούν μετά τη λήξη της σύμβασής τους και αμείβονται μόνο από την αγορά, η χρέωση είναι μειωμένη κατά μία ποσοστιαία μονάδα.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5 παρ. 5, όπως συμπληρώθηκε με το άρθρο 58 παρ. 1 του ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.taxheaven.gr/law/5261/2025/arthro/58
    quote: Κριτήριο επιλογής του Φο.Σ.Ε.Τε.Κ αποτελεί η χαμηλότερη μηνιαία χρέωση, σε ποσοστό επί της αντίστοιχης μηνιαίας Ειδικής Τιμής Αγοράς, της τεχνολογίας όπου ανήκει ο σταθμός, η οποία δεν δύναται να υπερβαίνει το έξι τοις εκατό (6%).
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ΣΕΔΠ ή χωρίς ενίσχυση που δεν βρίσκουν ιδιωτικό ΦοΣΕ. Πάρκα μετά τη λήξη της σύμβασης FiT.
  model_impact: 'Ανώτατο όριο κόστους εκπροσώπησης για το μοντέλο από το 2027: 6% της ΕΤΑ (5% για πάρκα με ληγμένη σύμβαση). Οι ιδιωτικοί ΦοΣΕ είναι λογικά φθηνότεροι, αλλά οι αμοιβές τους δεν είναι δημόσιες.'
  suggested_parameter:
    name: aggregator_fee_fraction_of_market_revenue
    default: '0.06'
    alternatives:
    - 0.05 (σταθμοί με ληγμένη σύμβαση, από 2027)
    - 'εμπορική αμοιβή ιδιωτικού ΦοΣΕ: μη δημόσια, να ζητηθεί προσφορά'
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Οι τρέχουσες χρεώσεις ΦοΣΕΤεΚ της ΔΑΠΕΕΠ (ΥΑ του 2019, ΦΕΚ Β' 1020) και το «αντικίνητρο παρατεταμένης παραμονής» δεν επαληθεύτηκαν αριθμητικά. Δεν βρήκα δημόσια στοιχεία για αμοιβές ιδιωτικών ΦοΣΕ ούτε για το αν χρεώνουν ξεχωριστά τη διαχείριση μπαταρίας.
- id: REG-B-030
  topic: imbalance
  title: Ευθύνη εξισορρόπησης για ΣΕΣΤ και FiT άνω των 400 kW με λειτουργία από 4.7.2019
  requirement: Από 1.1.2020 οι σταθμοί ισχύος 400 kW και άνω με ΣΕΣΤ ή σύμβαση πώλησης που τέθηκαν σε λειτουργία από 4.7.2019 είναι υπεύθυνοι για τις αποκλίσεις τους. Το κόστος εξισορρόπησης υπολογίζεται με μεθοδολογία του Κώδικα ΔΑΠΕΕΠ, παρακρατείται από τη ΔΑΠΕΕΠ και δεν μπορεί να υπερβαίνει τις χρεώσεις και το αντικίνητρο του ΦοΣΕΤεΚ για σταθμούς της ίδιας κατηγορίας. Οι σταθμοί αυτοί με σύμβαση πώλησης μπορούν να μεταπέσουν σε ΣΕΔΠ με Τιμή Αναφοράς ίση με την τιμή πώλησής τους.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 5Α, όπως διαμορφώθηκε με το άρθρο 46 του ν. 4951/2022 (ΦΕΚ Α' 129/04.07.2022)
    url: https://www.taxheaven.gr/law/4951/2022/arthro/46
    quote: 1. Από την 1η Ιανουαρίου 2020, σταθμοί εγκατεστημένης ισχύος ή μέγιστης ισχύος παραγωγής μεγαλύτερης ή ίσης των 400kW, που οι κάτοχοί τους έχουν συνάψει Σ.Ε.Σ.Τ. ή σύμβαση πώλησης ηλεκτρικής ενέργειας του άρθρου 12 του ν. 3468/2006 (Α' 129) [...] και οι οποίοι τέθηκαν σε λειτουργία (κανονική ή δοκιμαστική) από την 4η Ιουλίου 2019 και εφεξής, είναι υπεύθυνοι για τις αποκλίσεις που προκαλούν («ευθύνη εξισορρόπησης»).
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα ΣΕΣΤ ή FiT με ισχύ 400 kW και άνω και λειτουργία από 4.7.2019. Τα παλαιότερα FiT και τα μικρότερα πάρκα δεν φέρουν ευθύνη εξισορρόπησης.
  model_impact: Για αυτά τα πάρκα το μοντέλο αφαιρεί κόστος εξισορρόπησης από τα έσοδα σταθερής τιμής. Η μπαταρία θα μπορούσε να μειώσει αποκλίσεις, αλλά το κόστος παρακρατείται με μεθοδολογία χαρτοφυλακίου και το όφελος για το μεμονωμένο πάρκο είναι αβέβαιο.
  suggested_parameter:
    name: balancing_cost_fixed_price_parks_eur_mwh
    default: ''
    alternatives:
    - να ληφθεί από τα μηνιαία δελτία ΕΛΑΠΕ της ΔΑΠΕΕΠ (μη προσβάσιμα κατά την έρευνα)
  notes: Το κείμενο διαβάστηκε στην αναδημοσίευση του taxheaven.gr και όχι στο PDF του ΦΕΚ (et.gr). Δεν βρήκα την τρέχουσα μοναδιαία χρέωση. Σύνοψη αναζήτησης αναφέρει τιμές της τάξης 7,5 έως 15 ευρώ/MWh σε δελτία ΔΑΠΕΕΠ χωρίς σαφή περίοδο, δεν τις υιοθετώ.
- id: REG-B-031
  topic: imbalance
  title: 'Ενωσιακοί κανόνες αποκλίσεων: ευθύνη εξισορρόπησης, 15λεπτη εκκαθάριση, τιμή ανισορροπίας'
  requirement: Όλοι οι συμμετέχοντες στην αγορά φέρουν ευθύνη εξισορρόπησης. Παρεκκλίσεις επιτρέπονται μόνο για έργα επίδειξης, ΑΠΕ κάτω των 400 kW και εγκαταστάσεις με εγκεκριμένη στήριξη που τέθηκαν σε λειτουργία πριν από τις 4.7.2019. Η περίοδος εκκαθάρισης ανισορροπιών είναι 15 λεπτά. Η τιμή ανισορροπίας μπορεί να είναι θετική, μηδενική ή αρνητική και συνδέεται με την ενεργοποιημένη ενέργεια εξισορρόπησης.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943 άρθρο 5 παρ. 1 και 2, Κανονισμός (ΕΕ) 2017/2195 (EBGL) άρθρα 53 και 55
    url: https://eur-lex.europa.eu/legal-content/EL/TXT/?uri=CELEX:02017R2195-20220619
    quote: Εντός τριών ετών από την έναρξη ισχύος του παρόντος κανονισμού, όλοι οι ΔΣΜ εφαρμόζουν την περίοδο εκκαθάρισης ανισορροπιών που έχει διάρκεια 15 λεπτών σε όλες τις περιοχές προγραμματισμού, διασφαλίζοντας παράλληλα ότι όλα τα όρια της αγοραίας χρονικής μονάδας συμπίπτουν με τα όρια της περιόδου εκκαθάρισης ανισορροπιών.
  date_issued: '2017-11-23'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα που συμμετέχουν στην αγορά (ΣΕΔΠ, merchant, PPA) και οι ΦοΣΕ τους.
  model_impact: Η προσομοίωση πρέπει να τρέχει σε βήμα 15 λεπτών. Το κόστος αποκλίσεων εξαρτάται από τιμές αποκλίσεων που μπορούν να γίνουν αρνητικές (βλ. REG-B-034).
  suggested_parameter:
    name: imbalance_settlement_period_minutes
    default: '15'
    alternatives: []
  notes: Δεν διάβασα τον ελληνικό Κανονισμό Αγοράς Εξισορρόπησης στο σύνολό του (τύπος τιμής αποκλίσεων, χρεώσεις μη συμμόρφωσης, προσαυξήσεις ΛΠ-3). Οι χρεώσεις αυτές υπάρχουν αλλά δεν τις ποσοτικοποίησα.
- id: REG-B-032
  topic: market_participation
  title: 15λεπτη χρονική μονάδα στην Αγορά Επόμενης Ημέρας από την ημέρα παράδοσης 1.10.2025
  requirement: Στις 30.9.2025 η ευρωπαϊκή σύζευξη αγορών επόμενης ημέρας (SDAC) πέρασε από ωριαία σε 15λεπτα διαστήματα συναλλαγών, με πρώτη ημέρα παράδοσης την 1.10.2025. Οι τιμές υπολογίζονται ανά 15 λεπτά (96 τιμές την ημέρα). Ο ελληνικός νόμος ορίζει πλέον ως «Περίοδο Κατανομής» το 15λεπτο.
  source:
    type: official_report
    citation: Ευρωπαϊκή Επιτροπή, ΓΔ Ενέργειας, ανακοίνωση 1.10.2025 «EU electricity trading in the day-ahead markets becomes more dynamic», και ν. 4414/2016 άρθρο 5 παρ. 10 τελευταίο εδάφιο
    url: https://energy.ec.europa.eu/news/eu-electricity-trading-day-ahead-markets-becomes-more-dynamic-2025-10-01_en
    quote: On 30 September 2025, the EU’s day-ahead electricity market moved from hourly to 15-minute trading intervals.
  date_issued: '2025-10-01'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι συμμετέχοντες στην ΑΕΗ.
  model_impact: Χρονικό βήμα μοντέλου 15 λεπτά για τιμές ΑΕΗ από 1.10.2025. Τα ιστορικά δεδομένα πριν από την ημερομηνία αυτή είναι ωριαία.
  suggested_parameter:
    name: dam_market_time_unit_minutes
    default: '15'
    alternatives:
    - 60 για δεδομένα πριν από 1.10.2025
  notes: Δεν άνοιξα ανακοίνωση του Ελληνικού Χρηματιστηρίου Ενέργειας για την ελληνική ζώνη, στηρίζομαι στην ανακοίνωση της Επιτροπής και στη διατύπωση του ελληνικού νόμου. Ο Κανονισμός 2019/943 άρθρο 8 ορίζει κλείσιμο πύλης διαζωνικής ενδοημερήσιας αγοράς το αργότερο 30 λεπτά πριν τον πραγματικό χρόνο από 1.1.2026, με δυνατότητα παρέκκλισης έως 1.1.2029. Στον ιστότοπο της ΡΑΑΕΥ υπάρχει αίτημα παρέκκλισης (Νοέμβριος 2025) που δεν διάβασα.
- id: REG-B-033
  topic: balancing_services
  title: Συμμετοχή αποθήκευσης και ΑΠΕ με αποθήκευση στην Αγορά Εξισορρόπησης (ΡΑΑΕΥ Ε-14/2026)
  requirement: Η Αγορά Εξισορρόπησης λειτουργεί με κεντρικό προγραμματισμό ανά μονάδα. Μεγάλος Σταθμός Αποθήκευσης είναι όποιος συνδέεται στο ΕΣΜΗΕ με Μέγιστη Ισχύ Έγχυσης 10 MW και άνω (το όριο μειώθηκε από 40 MW). Οι Μεγάλοι Σταθμοί Αποθήκευσης και οι Σταθμοί ΑΠΕ με Μεγάλη Αποθήκευση συμμετέχουν υποχρεωτικά ως διακριτές Οντότητες και όχι σε χαρτοφυλάκια. Οι μικρότεροι συμμετέχουν μέσω χαρτοφυλακίων.
  source:
    type: raaey_decision
    citation: Απόφαση ΡΑΑΕΥ Ε-14/2026 «Τροποποίηση του Κανονισμού Αγοράς Εξισορρόπησης [...] για τη συμμετοχή των Σταθμών Αποθήκευσης Ηλεκτρικής Ενέργειας στην Αγορά Εξισορρόπησης και το Τέλος Αγοράς Εξισορρόπησης»
    url: https://www.raaey.gr/energeia/wp-content/uploads/2026/02/%CE%91%CE%A0%CE%9F%CE%A6%CE%91%CE%A3%CE%97-%CE%95-14_2026_%CE%A4%CF%81%CE%BF%CF%80%CE%BF%CF%80%CE%BF%CE%AF%CE%B7%CF%83%CE%B7-%CE%9A%CE%91%CE%95-%CE%B3%CE%B9%CE%B1-%CE%A3%CE%91%CE%97%CE%95_final.pdf
    quote: Οι Μεγάλοι Σταθμοί Αποθήκευσης και οι Σταθμοί ΑΠΕ με Μεγάλη Αποθήκευση συμμετέχουν υποχρεωτικά ως διακριτές Οντότητες στις αγορές και δε δύνανται να συμμετέχουν σε χαρτοφυλάκια.
  date_issued: '2026-02-20'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί αποθήκευσης και ΑΠΕ με αποθήκευση. Για μικρά Φ/Β πάρκα διανομής με μπαταρία πίσω από τον μετρητή η εφαρμογή είναι ασαφής.
  model_impact: Για πάρκο λίγων MW στο δίκτυο διανομής δεν πρέπει να υπολογίζονται έσοδα aFRR ή mFRR στο βασικό σενάριο. Μόνο ως αισιόδοξο σενάριο μέσω ΦοΣΕ.
  suggested_parameter:
    name: balancing_services_revenue_enabled
    default: 'false'
    alternatives:
    - true μέσω χαρτοφυλακίου ΦοΣΕ (δεν επιβεβαιώθηκε ότι επιτρέπεται για σταθμούς 11Α διανομής)
  notes: Διάβασα το σκεπτικό της απόφασης, όχι ολόκληρο τον τροποποιημένο Κανονισμό. Ο αριθμός ΦΕΚ (Β' 939/20.02.2026) και ο εθελοντικός χαρακτήρας της συμμετοχής προέρχονται από δημοσίευμα. Οι σταθμοί 11Α με ενίσχυση περιορίζονται από τον κανόνα ότι η ενέργεια της μπαταρίας αμείβεται με τιμές των αγορών «σύμφωνα με τη συμμετοχή τους σε αυτές» (άρθρο 11Γ παρ. 2), άρα η συμμετοχή σε άλλες αγορές δεν αποκλείεται από τον νόμο. Δεν βρήκα κανόνα προεπιλογής για μικρούς σταθμούς διανομής. Σχετική και η απόφαση Ε-20/2026 (όροι Παρόχων Υπηρεσιών Εξισορρόπησης), που δεν διάβασα.
- id: REG-B-034
  topic: balancing_services
  title: 'Κατώτατο όριο προσφορών ενέργειας εξισορρόπησης: μείον 100 ευρώ/MWh για ένα έτος από 26.6.2026'
  requirement: Το Κατώτατο Όριο Προσφοράς Ενέργειας Εξισορρόπησης ορίστηκε σε μείον 100 ευρώ/MWh για ένα έτος, με ισχύ από 26.6.2026 (Ημέρα Κατανομής 27.6.2026). Από 27.6.2025 ίσχυε προσωρινό όριο μείον 50 ευρώ/MWh (απόφαση Ε-96/2025). Πριν από αυτό οι αρνητικές προσφορές ήταν σε αναστολή (απόφαση 54/2021).
  source:
    type: raaey_decision
    citation: Απόφαση ΡΑΑΕΥ Ε-181/2026 (18.06.2026), τροποποίηση άρθρου 27.2 του Κανονισμού Αγοράς Εξισορρόπησης
    url: https://www.admie.gr/sites/default/files/users/dda/%CE%B5-181_2026%20%CE%B1%CF%81%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%AD%CF%82%20%CF%84%CE%B9%CE%BC%CE%AD%CF%82.pdf.pdf
    quote: Πλέον των όσων προβλέπονται ανωτέρω, θεσπίζεται αριθμητική τιμή για το Κατώτατο Όριο Προσφοράς Ενέργειας Εξισορρόπησης, η οποία ανέρχεται σε -100 €/MWh και ισχύει για χρονικό διάστημα ενός έτους από την έναρξη ισχύος της Ε-181/2026 Απόφασης του Κλάδου Ενέργειας της ΡΑΑΕΥ.
  date_issued: '2026-06-18'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι συμμετέχοντες που εκτίθενται σε τιμές αποκλίσεων, δηλαδή χαρτοφυλάκια ΑΠΕ με ΣΕΔΠ ή χωρίς ενίσχυση.
  model_impact: Οι τιμές αποκλίσεων μπορούν να γίνουν αρνητικές έως μείον 100 ευρώ/MWh τις ώρες πλεονάσματος. Αυξάνει το κόστος θετικών αποκλίσεων για Φ/Β και την αξία της ελεγχόμενης απορρόφησης από μπαταρία.
  suggested_parameter:
    name: balancing_energy_bid_floor_eur_mwh
    default: '-100'
    alternatives:
    - -50 (27.6.2025 έως 25.6.2026)
    - άγνωστο μετά τις 26.6.2027 (προσωρινό μέτρο υπό επανεξέταση)
  notes: Διάβασα την απόφαση σε PDF στον ιστότοπο του ΑΔΜΗΕ. Δεν επαλήθευσα αριθμό ΦΕΚ.
- id: REG-B-035
  topic: support_merchant_ppa
  title: Μετά τη λήξη της σύμβασης το πάρκο συνεχίζει και αμείβεται μόνο από την αγορά
  requirement: Σταθμοί με σύμβαση λειτουργικής ενίσχυσης ή σύμβαση πώλησης που συνεχίζουν να λειτουργούν μετά τη λήξη της αποζημιώνονται μόνο από τη συμμετοχή τους στην αγορά ηλεκτρικής ενέργειας (άρθρο 3 παρ. 19 ν. 4414/2016 και ΥΑ ΑΠΕΕΚ/Α/Φ1/οικ.172857/22.3.2018, ΦΕΚ Β' 1150), με εκπροσώπηση από ΦοΣΕ ή ΦοΣΕΤεΚ.
  source:
    type: law
    citation: ν. 4414/2016 άρθρο 3 παρ. 19 και άρθρο 5 παρ. 5, όπως αναφέρονται στο άρθρο 58 παρ. 1 του ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.taxheaven.gr/law/5261/2025/arthro/58
    quote: '[...] οι οποίοι συνεχίζουν να λειτουργούν μετά την ημερομηνία λήξης της αντίστοιχης σύμβασης και αποζημιώνονται μόνο στο πλαίσιο της συμμετοχής τους στην αγορά ηλεκτρικής ενέργειας, σύμφωνα με την παρ. 19 του άρθρου 3 του παρόντος και την υπό στοιχεία ΑΠΕΕΚ/Α/Φ1/οικ.172857/22.3.2018 απόφαση του Υπουργού Περιβάλλοντος και Ενέργειας (Β'' 1150)'
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα FiT που φτάνουν στο τέλος των 20 ή 27 ετών.
  model_impact: 'Το μοντέλο χρειάζεται δύο περιόδους ανά πάρκο: με σύμβαση και μετά τη σύμβαση (τιμές αγοράς). Μετά τη λήξη το πάρκο εμπίπτει στους «Φ/Β που συμμετέχουν απευθείας στην αγορά χωρίς ενίσχυση» του άρθρου 11Γ παρ. 4 και 5.'
  suggested_parameter:
