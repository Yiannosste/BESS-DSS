# Μητρώο δυσκολιών. Σοβαρότητα: χαμηλή | μεσαία | υψηλή | κρίσιμη. Ανοιχτό: ναι | όχι | μερικώς.
- id: DIF-001
  what: "Το API του ENTSO-E Transparency Platform ζητά token (HTTP 401). Η έκδοση token θέλει εγγραφή και email στο helpdesk."
  where: "Δεδομένα, πρώτη μέρα"
  domain: "Δεδομένα"
  severity: "μεσαία"
  affects: "Τιμές, φορτίο και παραγωγή ανά τεχνολογία"
  action: "Χρήση του ανοιχτού API energy-charts (Fraunhofer ISE) που αναδημοσιεύει δεδομένα ENTSO-E χωρίς token, και των αρχείων ΑΔΜΗΕ/HEnEx."
  open: "όχι"
  lesson: "Οι ομάδες να ζητήσουν token ENTSO-E την πρώτη μέρα. Η έγκριση μπορεί να πάρει μέρες."
- id: DIF-002
  what: "Το dapeep.gr απαντά 403 σε αυτοματοποιημένα αιτήματα."
  where: "Δεδομένα, έλεγχος πρόσβασης"
  domain: "Δεδομένα"
  severity: "χαμηλή"
  affects: "Μηνιαία δελτία ΑΠΕ (εγκατεστημένη ισχύς, ΕΤΑ)"
  action: "Αναζήτηση των ίδιων στοιχείων από άλλες πηγές. Καταγραφή όσων λείπουν."
  open: "μερικώς"
  lesson: "Κάποια ελληνικά δεδομένα κατεβαίνουν μόνο με το χέρι από browser."
- id: DIF-003
  what: "Το PVGIS δίνει μόνο ωριαίες τιμές, με χρονοσήμανση στο λεπτό της δορυφορικής λήψης (π.χ. 10:09). Δεν υπάρχει δημόσια 15λεπτη παραγωγή ανά πάρκο."
  where: "Παραγωγή ΦΒ"
  domain: "Δεδομένα πάρκου"
  severity: "μεσαία"
  affects: "Αποκλίσεις, clipping, αξία μπαταρίας μέσα στην ώρα"
  action: "Παρεμβολή σε 15λεπτο που διατηρεί την ωριαία ενέργεια. Η μεταβλητότητα από σύννεφα μέσα στην ώρα δεν αναπαράγεται. Δηλώνεται ως μοντελοποιημένο."
  open: "ναι"
  lesson: "Αν ένας ιδιοκτήτης δώσει 15λεπτες μετρήσεις, αξίζουν περισσότερο από κάθε μοντέλο."
- id: DIF-004
  what: "Λάθος σε δικό μας test: υπολόγισα με το χέρι ότι με αρνητικές τιμές η μπαταρία γεμίζει μία φορά. Ο solver βρήκε περισσότερα έσοδα κάνοντας διαδοχικούς κύκλους (φόρτιση, εκφόρτιση, φόρτιση) για να 'κάψει' ενέργεια στις απώλειες. Αυτό είναι φυσικά εφικτό και νόμιμο ως μαθηματικό αποτέλεσμα."
  where: "Κινητήρας λειτουργίας, tests"
  domain: "Short-term"
  severity: "χαμηλή"
  affects: "Έσοδα σε ώρες αρνητικών τιμών όταν επιτρέπεται φόρτιση από το δίκτυο"
  action: "Διόρθωση του test. Το μοντέλο απαγορεύει μόνο την ταυτόχρονη φόρτιση και εκφόρτιση, όχι τη διαδοχική. Το κόστος φθοράς και το όριο κύκλων περιορίζουν αυτή τη συμπεριφορά."
  open: "όχι"
  lesson: "Οι 'γνωστές απαντήσεις' θέλουν προσοχή στις αρνητικές τιμές. Χωρίς κόστος φθοράς το μοντέλο θα κάνει άσκοπους κύκλους."
- id: DIF-005
  what: "Το θεσμικό πλαίσιο άλλαξε μέσα στο 2025 και το 2026. Καμία προϋπάρχουσα γνώση δεν είναι ασφαλής χωρίς επαλήθευση στην πηγή."
  where: "Ρυθμιστικό"
  domain: "Ρυθμιστικό"
  severity: "υψηλή"
  affects: "Όλο το αποτέλεσμα"
  action: "Κάθε κανόνας μπαίνει στο ρυθμιστικό μητρώο με πηγή, ημερομηνία επαλήθευσης και βαθμό βεβαιότητας. Ό,τι δεν επιβεβαιώνεται σε πρωτογενή πηγή γίνεται ρύθμιση με εναλλακτικές."
  open: "ναι"
  lesson: "Ένας άνθρωπος της ομάδας πρέπει να έχει το ρυθμιστικό ως μόνη δουλειά την πρώτη εβδομάδα."
- id: DIF-006
  what: "Το shadow run δεν μπορεί να ικανοποιήσει δύο σημεία του checklist του Stage 3: review κάθε merge request από άλλο μέλος και issues ανά requirement στο GitLab."
  where: "Stage 3"
  domain: "Τρόπος δουλειάς"
  severity: "χαμηλή"
  affects: "Ποιότητα κώδικα, ιχνηλασιμότητα"
  action: "Πίνακας ιχνηλασιμότητας REQ προς test μέσα στο repo, CI σε κάθε push. Το review αντικαθίσταται μερικώς από tests με γνωστή απάντηση και σύγκριση με PySAM."
  open: "ναι"
  lesson: "Οι ομάδες έχουν εδώ πλεονέκτημα: το review πιάνει λάθη υποθέσεων που δεν πιάνει κανένα test."
- id: DIF-007
  what: "Η δημοσιευμένη παραγωγή ΦΒ (ENTSO-E, ΑΔΜΗΕ) μετριέται μετά τις περικοπές. Το πλεόνασμα που οδηγεί τις μηδενικές τιμές δεν φαίνεται στα δεδομένα."
  where: "Long-term, πρώτη ανάλυση τιμής προς υπολειπόμενο φορτίο"
  domain: "Long-term"
  severity: "υψηλή"
  affects: "Μοντέλο τιμών, εκτίμηση περικοπών"
  action: "Ανακατασκευή της δυνητικής παραγωγής από ακτινοβολία NASA POWER (D-010). Με το πραγματικό υπολειπόμενο φορτίο η πιθανότητα μηδενικής τιμής φαινόταν να τριπλασιάζεται από χρόνο σε χρόνο στο ίδιο φορτίο. Με το δυνητικό σταθεροποιείται."
  open: "μερικώς"
  lesson: "Όποιος δουλέψει με τιμές και παραγωγή ΦΒ του 2025 έως 2026 χωρίς αυτή τη διόρθωση θα βγάλει λάθος μοντέλο."
- id: DIF-008
  what: "Η σχέση τιμής προς υπολειπόμενο φορτίο μετακινείται από χρόνο σε χρόνο. Μοντέλο που εκπαιδεύεται στο 2025 και δοκιμάζεται στο 2026 υπερεκτιμά την ημερήσια διαφορά τιμών κατά 26% (171 έναντι 136 ευρώ/MWh), και αντίστροφα την υποεκτιμά κατά 23%."
  where: "Long-term, backtest εκτός δείγματος"
  domain: "Long-term"
  severity: "υψηλή"
  affects: "Έσοδα μπαταρίας σε κάθε σενάριο"
  action: "Δοκιμάστηκαν τέσσερις μορφές μοντέλου και διόρθωση για υδροηλεκτρικά, χωρίς να εξηγηθεί η μετατόπιση. Πιθανές αιτίες: νέες μονάδες αερίου, κορεσμός των γειτονικών αγορών, υγρή χρονιά. Το μοντέλο εκπαιδεύεται στο πιο πρόσφατο καθεστώς (2025 έως 2026) και η αβεβαιότητα ±25% στη διαφορά τιμών μπαίνει ρητά στην ανάλυση κινδύνου."
  open: "ναι"
  lesson: "Κανένα μοντέλο τιμών με δύο χρόνια δεδομένων δεν δικαιούται στενά διαστήματα. Να φαίνεται το σφάλμα εκτός δείγματος δίπλα σε κάθε αποτέλεσμα."
- id: DIF-009
  what: "Το όριο χρήσης του λογαριασμού εξαντλήθηκε στη μέση της δουλειάς. Δύο παράλληλοι ερευνητές (δεδομένα αγοράς, ρυθμιστικό Β) σταμάτησαν πριν τελειώσουν."
  where: "Οργάνωση, ώρα 1,5 του run"
  domain: "Τρόπος δουλειάς"
  severity: "μεσαία"
  affects: "Χρονοδιάγραμμα, πληρότητα των μητρώων"
  action: "Η μερική δουλειά είχε γραφτεί σε αρχεία και μπήκε στο git. Οι ερευνητές συνεχίστηκαν μετά την επαναφορά του ορίου."
  open: "όχι"
  lesson: "Κάθε ενδιάμεσο αποτέλεσμα να γράφεται σε αρχείο και να γίνεται commit συχνά. Για τις ομάδες το αντίστοιχο είναι η απουσία ενός μέλους: ό,τι δεν είναι γραμμένο χάνεται."
- id: DIF-010
  what: "Το API energy-charts δηλώνει ότι τα δεδομένα τιμών είναι «μόνο για ιδιωτική και εσωτερική χρήση». Η αναδιανομή του αρχείου τιμών σε ανοιχτό repository μπορεί να μην επιτρέπεται."
  where: "Δεδομένα, πεδίο license_info της απάντησης"
  domain: "Δεδομένα"
  severity: "υψηλή"
  affects: "Αν το εργαλείο μπορεί να μοιράζεται έτοιμα δεδομένα τιμών"
  action: "Καταγράφεται στο μητρώο προέλευσης. Υπάρχει και σειρά από τα επίσημα αρχεία του HEnEx για διασταύρωση. Το script λήψης επιτρέπει σε κάθε χρήστη να κατεβάσει μόνος του τα δεδομένα."
  open: "ναι"
  lesson: "Πριν από τη δημοσίευση στο GitHub χρειάζεται απόφαση: είτε δεδομένα μόνο από πηγή με καθαρή άδεια (ENTSO-E με token, HEnEx με άδεια), είτε μόνο scripts χωρίς δεδομένα."
- id: DIF-011
  what: "Έγραψα αρχικά συντελεστές μοντέλου φθοράς (Naumann) από μνήμη, χωρίς πηγή."
  where: "Φυσική μπαταρίας, πρώτη εκδοχή του κώδικα"
  domain: "Φυσική μπαταρίας"
  severity: "μεσαία"
  affects: "Τροχιά SoH, αντικατάσταση, NPV"
  action: "Αφαιρέθηκαν. Μπήκε το μοντέλο BLAST-Lite με συντελεστές διαβασμένους από τον κώδικα του NREL και test που αναπαράγει ανεξάρτητα σημεία ελέγχου."
  open: "όχι"
  lesson: "«Το θυμάμαι» δεν είναι πηγή. Κάθε συντελεστής θέλει αρχείο και γραμμή."
- id: DIF-012
  what: "Η εκτίμησή μας για την κρυμμένη περικοπή ΦΒ (0,62 TWh το 2025) είναι πολύ κάτω από την εκτίμηση του Green Tank για όλες τις ΑΠΕ (1,87 TWh). Επιπλέον η παραγωγή ανά εγκατεστημένο MW έπεσε 15% το 2025 χωρίς προφανή λόγο."
  where: "Long-term, βαθμονόμηση"
  domain: "Long-term"
  severity: "μεσαία"
  affects: "Περικοπές ανά πάρκο, αξία της διάσωσης ενέργειας"
  action: "Η μέθοδός μας μετρά μόνο ΦΒ και μόνο ώρες με τιμή κάτω από 5 ευρώ/MWh, άρα είναι κάτω όριο. Οι περικοπές του πάρκου είναι ρύθμιση του χρήστη (πολλαπλασιαστής). Εκκρεμεί διασταύρωση με τα αρχεία ISP του ΑΔΜΗΕ."
  open: "ναι"
  lesson: "Δεν υπάρχει επίσημη, ωριαία σειρά περικοπών. Όποιος αριθμός κυκλοφορεί είναι εκτίμηση τρίτου."
- id: DIF-013
  what: "Το όριο έγχυσης του σταθμού 11Α: ο νόμος γράφει «περιορισμός 40%», ο ΔΕΔΔΗΕ εφαρμόζει έγχυση έως 60%. Πριν από τον Μάιο 2026 ο νόμος έγραφε 60%."
  where: "Ρυθμιστικό, άρθρο 11Γ ν. 4685/2020"
  domain: "Ρυθμιστικό"
  severity: "κρίσιμη"
  affects: "Πόση ενέργεια χάνει το πάρκο μετά τη μετατροπή, μέγεθος μπαταρίας, απόφαση"
  action: "Προεπιλογή 0,60 (ανάγνωση ΔΕΔΔΗΕ), εναλλακτική 0,40. Το εργαλείο δείχνει το αποτέλεσμα και με τις δύο."
  open: "ναι"
  lesson: "Η τιμή πρέπει να επιβεβαιώνεται στην προσφορά σύνδεσης κάθε έργου πριν από κάθε επένδυση."
- id: DIF-014
  what: "Πάρκα με ενίσχυση που ηλεκτρίστηκαν πριν από τις 04.07.2019 (τα παλιά FiT): ο νόμος δεν λέει αν μπορούν να βάλουν μπαταρία και να κρατήσουν την ταρίφα."
  where: "Ρυθμιστικό, άρθρο 11Γ παρ. 1"
  domain: "Ρυθμιστικό"
  severity: "κρίσιμη"
  affects: "Όλη η κατηγορία των παλιών πάρκων FiT, που είναι η πολυπληθέστερη"
  action: "Προεπιλογή: δεν κρατούν την ενίσχυση. Διακόπτης για την αντίθετη ανάγνωση."
  open: "ναι"
  lesson: "Να μπει στις ερωτήσεις προς ειδικούς. Αλλάζει ποιον χρήστη αξίζει να εξυπηρετήσει πρώτα το MVP."
- id: DIF-015
  what: "Σιωπηλό λάθος μονάδων χρόνου: το pandas 3 κρατά ημερομηνίες άλλοτε σε δευτερόλεπτα και άλλοτε σε nanoseconds. Η παρεμβολή εγκατεστημένης ισχύος έβγαζε λάθος τιμές χωρίς σφάλμα."
  where: "Βαθμονόμηση αγοράς"
  domain: "Εργαλεία"
  severity: "μεσαία"
  affects: "Συντελεστές χρησιμοποίησης ΦΒ και αιολικών"
  action: "Εντοπίστηκε επειδή ο λόγος παραγωγής προς ισχύ έβγαινε τετραπλάσιος το 2026. Διορθώθηκε με ρητή μετατροπή σε δευτερόλεπτα."
  open: "όχι"
  lesson: "Κάθε ενδιάμεσο μέγεθος θέλει έναν έλεγχο λογικής (π.χ. ώρες πλήρους φορτίου ΦΒ 1300 έως 1500). Έτσι πιάστηκε."
- id: DIF-016
  what: "Ο κανόνας των αρνητικών τιμών για τα ΣΕΔΠ (από 01.06.2026) κρίνεται στο πρόσημο: μηδενική τιμή κρατά την ενίσχυση, αρνητική για πάνω από δύο ώρες τη χάνει. Στα δεδομένα οι τιμές «πάτου» είναι συνήθως μείον 0,01 ή 0,00."
  where: "Ρυθμιστικό και Long-term"
  domain: "Ρυθμιστικό"
  severity: "υψηλή"
  affects: "Έσοδα πάρκων ΣΕΔΠ, αξία μπαταρίας στα επεισόδια αρνητικών τιμών"
  action: "Ο κανόνας υλοποιήθηκε με τρεις αναγνώσεις (πάνω από δύο ώρες, κάθε μη θετική τιμή, καθόλου). Το πρόσημο του πάτου μοντελοποιείται από το ιστορικό μετά τον Ιούνιο 2026."
  open: "ναι"
  lesson: "Ένα λεπτό του ευρώ αλλάζει το έσοδο ενός πάρκου ΣΕΔΠ. Το μοντέλο τιμών πρέπει να ξεχωρίζει το 0 από το μείον 0,01."
- id: DIF-017
  what: "Λάθος στην πρώτη εκδοχή της ανάδρασης αποθήκευσης: ο στόλος μπαταριών έβλεπε μόνο τη μέση καμπύλη τιμής, όχι το πραγματικό ημερήσιο μοτίβο. Με 25 GW μπαταρίες η διαφορά τιμών έμενε σχεδόν ίδια και η ισορροπία ελεύθερης εισόδου δεν σταματούσε ποτέ."
  where: "Long-term, πρώτο τρέξιμο ισορροπίας"
  domain: "Long-term"
  severity: "υψηλή"
  affects: "Όλα τα σενάρια με ενδογενή αποθήκευση"
  action: "Ο στόλος κατανέμεται τώρα πάνω στην καμπύλη τιμής της κάθε ώρας (με τη βαθμίδα της). Έλεγχος: στο κεντρικό σενάριο 2030 το περιθώριο μιας οριακής μπαταρίας πέφτει από 73 σε 14 χιλ. ευρώ/MW/έτος όταν ο στόλος πάει από 1 σε 12 GW."
  open: "όχι"
  lesson: "Το τεστ «τι γίνεται με παράλογα πολλές μπαταρίες» έπιασε το λάθος. Κάθε μοντέλο θέλει ένα ακραίο σενάριο όπου η απάντηση είναι προφανής."
- id: DIF-018
  what: "Οι κανόνες δημιουργούν κίνητρο που μοιάζει με παραθυράκι: στη διαφορική προσαύξηση διπλής κατεύθυνσης, όταν η αγορά είναι πάνω από την τιμή αναφοράς, η ενέργεια που περνά από τη μπαταρία πληρώνεται σε τιμή αγοράς και γλιτώνει την επιστροφή. Ο βελτιστοποιητής το βρήκε μόνος του και άρχισε να περνά ενέργεια από τη μπαταρία μέσα στο ίδιο διάστημα."
  where: "Short-term, πρώτο πλήρες τρέξιμο πάρκου ΣΕΔΠ"
  domain: "Short-term και Ρυθμιστικό"
  severity: "μεσαία"
  affects: "Έσοδα πάρκων ΣΕΔΠ σε μήνες με υψηλές τιμές, ταχύτητα υπολογισμού"
  action: "Το μοντέλο επιτρέπει φόρτιση και εκφόρτιση στο ίδιο διάστημα μόνο ως εναλλαγή μέσα στο διάστημα, με άθροισμα έως την ονομαστική ισχύ, και αναφέρει πόση ενέργεια κυκλοφόρησε έτσι. Η αυστηρή εκδοχή με ακέραιες μεταβλητές έμεινε για επαλήθευση, γιατί έκανε το τρέξιμο 10 φορές πιο αργό. Υπάρχει διακόπτης για προσαύξηση μονής κατεύθυνσης."
  open: "μερικώς"
  lesson: "Ένας βελτιστοποιητής θα εκμεταλλευτεί κάθε κενό των κανόνων. Αν ένα αποτέλεσμα στηρίζεται σε τέτοιο κενό, πρέπει να φαίνεται, γιατί ο ρυθμιστής μπορεί να το κλείσει."
- id: DIF-019
  what: "Οι τιμές της αγοράς επόμενης ημέρας δεν είναι ανοιχτά δεδομένα σε καμία πηγή: energy-charts (μόνο ιδιωτική χρήση), HEnEx (απαγορεύει αναδημοσίευση χωρίς γραπτή συναίνεση), ENTSO-E (οι τιμές εξαιρούνται από την ελεύθερη επαναχρησιμοποίηση CC BY)."
  where: "Δεδομένα, έλεγχος αδειών"
  domain: "Δεδομένα"
  severity: "κρίσιμη"
  affects: "Αν το repository μπορεί να γίνει δημόσιο με τα αρχεία τιμών μέσα"
  action: "Καταγράφηκε στο μητρώο προέλευσης. Τα αρχεία τιμών βρίσκονται ήδη στο ιστορικό του git. Δεν αλλάξαμε το ιστορικό χωρίς εντολή. Επιλογές: το repo μένει ιδιωτικό, ή ζητείται γραπτή άδεια από το HEnEx, ή αφαιρούνται τα αρχεία και το ιστορικό τους και μένουν μόνο τα scripts λήψης."
  open: "ναι"
  lesson: "Η άδεια των δεδομένων ελέγχεται πριν από το πρώτο commit, όχι μετά. Το «open-source εργαλείο με πραγματικά δεδομένα» θέλει νομική απάντηση για τις τιμές."
- id: DIF-020
  what: "Ο επιλυτής HiGHS επέστρεψε «άγνωστη κατάσταση» σε λίγες ημέρες όταν ξεκινούσε από τη βάση της προηγούμενης ημέρας (warm start) σε παράλληλα τρεξίματα."
  where: "Κινητήρας λειτουργίας, παράλληλη αξιολόγηση μεγεθών"
  domain: "Υπολογισμός"
  severity: "χαμηλή"
  affects: "Αξιοπιστία μεγάλων τρεξιμάτων"
  action: "Αν η λύση δεν είναι βέλτιστη, καθαρίζεται η βάση και λύνεται ξανά, και ως τελευταία λύση με μέθοδο εσωτερικού σημείου."
  open: "όχι"
  lesson: "Στα χιλιάδες LP κάποιο θα αποτύχει. Χρειάζεται δεύτερη προσπάθεια στον κώδικα, όχι στο χέρι."
