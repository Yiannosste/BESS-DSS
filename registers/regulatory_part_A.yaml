- id: REG-A-037
  topic: pending_change
  title: 'Νομοσχέδιο ενσωμάτωσης της Οδηγίας 2024/1711: Συμβάσεις Σύνδεσης Ευέλικτης Ισχύος'
  requirement: Το νομοσχέδιο «Βελτίωση του σχεδιασμού της αγοράς ηλεκτρικής ενέργειας» (διαβούλευση 10 έως 24.10.2026, κατάθεση στη Βουλή 30.10.2026, εισαγωγή στην Ολομέλεια 10.11.2026) θεσπίζει Συμβάσεις Σύνδεσης Ευέλικτης Ισχύος για ΑΠΕ, αποθήκευση και ζήτηση σε περιοχές χωρίς επαρκή χωρητικότητα, με πιστοποιημένο σύστημα ελέγχου ισχύος, χωρίς αποζημίωση εντός των συμφωνημένων ορίων. Κατά τον τύπο η πρώτη εισήγηση χαρακτηρισμού περιοχών θα φτάσει στη ΡΑΑΕΥ τουλάχιστον 22 μήνες μετά την ψήφιση, και για αποθήκευση και σταθμούς 11Α και 11Β οι εισηγήσεις μπορούν να ακολουθήσουν. Έως τότε συνεχίζονται οι προσφορές με ειδικούς όρους του άρθρου 10 ν. 4951/2022.
  source:
    type: secondary_press
    citation: B2Green 01.11.2026, Mononews 12.10.2026, Energymag 10.10.2026, ΣΚΑΪ 09.11.2026 (σχέδιο νόμου ΥΠΕΝ, δεν έχει δημοσιευθεί σε ΦΕΚ)
    url: https://news.b2green.gr/80860/nomoschedio-ilektrismou-vouli-allages
    quote: ''
  date_issued: '2026-10-30'
  status: pending
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Νέες και τροποποιούμενες συνδέσεις, μελλοντικά
  model_impact: Καμία αλλαγή στο μοντέλο για αποφάσεις του 2026 και 2027. Να καταγραφεί ως μελλοντική επιλογή σύνδεσης με μη εγγυημένη ισχύ.
  suggested_parameter:
    name: flexible_connection_expected_from
    default: όχι πριν από το 2028 (εκτίμηση από το χρονοδιάγραμμα των 22 μηνών)
    alternatives: []
  notes: Το κείμενο του νομοσχεδίου δεν ανοίχτηκε (opengov.gr και ypen.gov.gr έδωσαν HTTP 403, η Βουλή δεν αναζητήθηκε επιτυχώς). Όλα τα στοιχεία είναι από δημοσιεύματα. Κατά την ημερομηνία ελέγχου δεν είχε επιβεβαιωθεί η ψήφιση. Δεν βρέθηκε στα δημοσιεύματα διάταξη που να αλλάζει το άρθρο 11Γ ή τον κανόνα της 1 ώρας, αυτό όμως δεν μπορεί να αποκλειστεί χωρίς το κείμενο.
- id: REG-A-038
  topic: pending_change
  title: 'Νομοσχέδιο: ο παραγωγός θα πληρώνει το σύνολο του κόστους σύνδεσης'
  requirement: Κατά δημοσίευμα, νέο άρθρο 42 του νομοσχεδίου αναστέλλει το άρθρο 98 ν. 4951/2022 (επιμερισμός κόστους). Από την έναρξη ισχύος ο κάτοχος σταθμού (ΑΠΕ, ΣΗΘΥΑ, αποθήκευση) θα επιβαρύνεται με το σύνολο του κόστους των έργων σύνδεσης και με το αναλογούν κόστος επέκτασης. Κρίσιμη είναι η ημερομηνία σύναψης της Σύμβασης Σύνδεσης, ως τέτοια λογίζεται η ημερομηνία καταβολής του κόστους σύνδεσης.
  source:
    type: secondary_press
    citation: B2Green, 01.11.2026, «τι άλλαξε μετά τη διαβούλευση» (σχέδιο νόμου ΥΠΕΝ, άρθρο 42)
    url: https://news.b2green.gr/80860/nomoschedio-ilektrismou-vouli-allages
    quote: ''
  date_issued: '2026-10-30'
  status: pending
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Έργα που θα συνάψουν ή θα τροποποιήσουν Σύμβαση Σύνδεσης μετά την έναρξη ισχύος του νέου νόμου
  model_impact: Αν ψηφιστεί, το μερίδιο του παραγωγού στα έργα σύνδεσης γίνεται 100% αντί 50%. Επηρεάζει μόνο έργα που χρειάζονται νέα έργα δικτύου. Το DSS να έχει και τις δύο τιμές.
  suggested_parameter:
    name: producer_share_of_connection_works_pending
    default: '1.00'
    alternatives:
    - 0.50 αν η διάταξη δεν ψηφιστεί ή αν η Σύμβαση Σύνδεσης προηγηθεί
  notes: Μόνο από ένα δημοσίευμα. Το κείμενο του άρθρου δεν διαβάστηκε. Δεν είναι σαφές αν η τροποποίηση Σύμβασης Σύνδεσης λόγω προσθήκης μπαταρίας εμπίπτει (το δημοσίευμα αναφέρει τροποποιήσεις λόγω ριζικής ανανέωσης).
- id: REG-A-039
  topic: pending_change
  title: 'Μέτρα στήριξης υπό εξέταση: επιδότηση μπαταριών και παράταση συμβάσεων ενίσχυσης'
  requirement: Κατά τον τύπο το ΥΠΕΝ σχεδιάζει τέσσερις δράσεις επιδότησης μπαταριών συνολικά 200 εκατ. ευρώ με προκηρύξεις έως το τέλος του 2026. Στη δράση για ΑΠΕ με αποθήκευση επιλέξιμοι θα είναι οι σταθμοί 11Α και η μπαταρία στο κοινό σημείο σύνδεσης του άρθρου 11Γ, ενώ οι 11Β εξαιρούνται. Επιλογή με μειοδοτικό διαγωνισμό. Συζητήθηκαν επίσης, χωρίς απόφαση, πενταετής παράταση των συμβάσεων ενίσχυσης ή υψηλότερη ταρίφα που επιστρέφεται στο τέλος.
  source:
    type: secondary_press
    citation: PowerGame, 16.10.2026. Energygame, 25.07.2026
    url: https://www.powergame.gr/green-power/1436120/bataries-xekleidonoun-entos-tou-2026-oi-epidotiseis-poioi-ependytes-apoktoun-provadisma/
    quote: ''
  date_issued: '2026-10-16'
  status: proposed
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Πάρκα που εξετάζουν 11Α ή μπαταρία στο κοινό σημείο σύνδεσης
  model_impact: 'Αξία αναμονής: αν έρθει επιδότηση, η άμεση επένδυση μπορεί να τη χάσει. Το DSS να έχει σενάριο με επενδυτική ενίσχυση και σενάριο χωρίς, και να σημειώνει ότι το 11Β μένει εκτός.'
  suggested_parameter:
    name: capex_subsidy_fraction
    default: '0.0'
    alternatives:
    - άγνωστο ποσοστό μετά την προκήρυξη (διαγωνισμός με τη μικρότερη αιτούμενη ενίσχυση)
  notes: Τα οικονομικά κίνητρα ανήκουν κυρίως στο μέρος Β. Καταγράφονται εδώ επειδή διαφοροποιούν τις κατηγορίες 11Α και 11Β. Καμία προκήρυξη δεν βρέθηκε δημοσιευμένη. Δεν είναι γνωστό αν έργα που έχουν ήδη ξεκινήσει θα είναι επιλέξιμα.
- id: REG-A-040
  topic: connection_limit
  title: Κανένα νόμιμο ανώτατο όριο χωρητικότητας, αλλά όρια αντισυγκέντρωσης για 11Β
  requirement: Το άρθρο 11Γ δεν θέτει ανώτατο όριο χωρητικότητας (MWh) στην μπαταρία που προστίθεται. Για σταθμούς 11Β και μεμονωμένες μπαταρίες ισχύει ανώτατο όριο συνολικής μέγιστης ισχύος έγχυσης 500 MW ανά φυσικό ή νομικό πρόσωπο ή όμιλο έως το 2029. Οι σταθμοί 11Α εξαιρούνται από το όριο αυτό.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Δ παρ. 8, όπως προστέθηκε με το άρθρο 56 παρ. 5 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026). ΥΑ ΥΠΕΝ/ΓΔΕ/28255/1143/13.03.2025 (ΦΕΚ Β' 1248/13.03.2025) άρθρο 5 παρ. 4
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: Τίθεται ανώτατο όριο συνολικής μέγιστης ισχύος έγχυσης των Σ.Α.Η.Ε. τεχνολογίας συσσωρευτών για τους οποίους χορηγούνται Οριστικές Προσφορές Σύνδεσης ή εκπροσωπούνται στις αγορές ηλεκτρικής ενέργειας, είτε ως μεμονωμένοι Σ.Α.Η.Ε. είτε ως Σ.Α.Η.Ε. που συνδυάζονται με σταθμούς ΑΠΕ, εξαιρουμένων των σταθμών της παρ. 11Α του άρθρου 10
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όμιλοι με μεγάλο χαρτοφυλάκιο μπαταριών. Πρακτικά αδιάφορο για έναν ιδιοκτήτη ενός πάρκου
  model_impact: Για ένα πάρκο το άνω όριο μεγέθους είναι οικονομικό και τεχνικό, όχι νομικό. Το DSS δεν χρειάζεται άνω νομικό φράγμα στη χωρητικότητα.
  suggested_parameter:
    name: max_usable_capacity_hours
    default: none
    alternatives: []
  notes: Το όριο 500 MW μετρά και συμφωνίες εκχώρησης εσόδων ή εκπροσώπησης, άρα μπορεί να αφορά ΦοΣΕ ή επενδυτή που συνεργάζεται με πολλούς ιδιοκτήτες.
- id: REG-A-041
  topic: other
  title: Νέα Φ/Β στο ΕΔΔΗΕ υποχρεωτικά με μπαταρία (πλαίσιο, δεν αφορά υφιστάμενα πάρκα)
  requirement: Οι νέες αιτήσεις Φ/Β προς τον Διαχειριστή του Δικτύου περιλαμβάνουν υποχρεωτικά σύστημα αποθήκευσης ωφέλιμης χωρητικότητας τουλάχιστον 1 ώρας επί την εγκατεστημένη ισχύ και εγκαθίστανται ως σταθμοί 11Α ή 11Β.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 5.β (άρθρο 56 ν. 5261/2025 και άρθρο 56 παρ. 3 ν. 5299/2026)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: Οι νέες αιτήσεις για φωτοβολταϊκούς σταθμούς που υποβάλλονται στον Διαχειριστή του Δικτύου στο πλαίσιο εφαρμογής του δευτέρου εδαφίου της παρ. 8 του άρθρου 97 του ν. 4951/2022 περιλαμβάνουν και σύστημα αποθήκευσης ωφέλιμης χωρητικότητας τουλάχιστον ίσης με μία (1) ώρα στην εγκατεστημένη ισχύ του αντίστοιχου φωτοβολταϊκού σταθμού
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Νέα Φ/Β στο ΕΔΔΗΕ, όχι υφιστάμενα πάρκα
  model_impact: Δεν επηρεάζει την απόφαση για υφιστάμενο πάρκο. Εξηγεί γιατί το ΥΠΕΝ κρατά το κατώφλι της 1 ώρας (ενιαίος κανόνας για νέα και υφιστάμενα) και γιατί η ουρά αιτημάτων στον ΔΕΔΔΗΕ μεγαλώνει.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Καταγράφεται μόνο ως πλαίσιο.
