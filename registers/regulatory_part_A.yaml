- id: REG-A-001
  topic: btm_storage_addition
  title: 'Νομική βάση: άρθρο 11Γ ν. 4685/2020, μετατροπή υφιστάμενου Φ/Β σε σταθμό 11Α'
  requirement: Φωτοβολταϊκός σταθμός που τέθηκε σε λειτουργία μετά την 4η Ιουλίου 2019 και έχει Σύμβαση Πώλησης ή Σύμβαση Λειτουργικής Ενίσχυσης (ΣΕΔΠ ή ΣΕΣΤ) μπορεί, εφόσον είναι τεχνικά δυνατό, να προσθέσει μπαταρία πίσω από τον μετρητή και να μετατραπεί σε σταθμό της παρ. 11Α του άρθρου 10 (χωρίς απορρόφηση από το δίκτυο). Το αίτημα υποβάλλεται στον Φορέα Αδειοδότησης (ΡΑΑΕΥ) ή στον αρμόδιο Διαχειριστή. Στο ισχύον κείμενο δεν αναγράφεται πλέον καταληκτική ημερομηνία αιτήματος ούτε ανώτατο όριο συνολικής ισχύος (η προθεσμία 30.04.2025 διαγράφηκε με τον ν. 5261/2025).
  source:
    type: law
    citation: ν. 4685/2020 (ΦΕΚ Α' 92/07.05.2020), άρθρο 11Γ παρ. 1, όπως προστέθηκε με το άρθρο 40 ν. 5151/2024 (ΦΕΚ Α' 173/04.11.2024) και αντικαταστάθηκε με το άρθρο 56 ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.deddie.gr/wp-content/uploads/2026/02/%CE%86%CF%81%CE%B8%CF%81%CE%BF-56-%CF%84%CE%BF%CF%85-%CE%BD.-5261-2025.pdf
    quote: Φωτοβολταϊκοί σταθμοί που είτε έχουν τεθεί σε λειτουργία μετά την 4η Ιουλίου 2019, είτε νέοι φωτοβολταϊκοί σταθμοί που έχουν λάβει Οριστική Προσφορά Σύνδεσης και δεν έχουν τεθεί σε λειτουργία κατά την 1η Δεκεμβρίου 2025, είτε νέοι φωτοβολταϊκοί σταθμοί που θα λάβουν Οριστική Προσφορά Σύνδεσης, και οι οποίοι συνάπτουν Σύμβαση Πώλησης ηλεκτρικής ενέργειας ή Σύμβαση λειτουργικής ενίσχυσης Διαφορικής Προσαύξησης ή Σύμβαση λειτουργικής ενίσχυσης Σταθερής Τιμής, δύνανται να μετατραπούν, εφόσον αυτό είναι τεχνικά δυνατόν, σε σταθμούς της παρ. 11Α του άρθρου 10, κατόπιν υποβολής αιτήματος προς τον Φορέα Αδειοδότησης Ανανεώσιμων Πηγών Ενέργειας και Συμπαραγωγής Ηλεκτρισμού Θερμότητας Υψηλής Απόδοσης, ή τον αρμόδιο Διαχειριστή κατά περίπτωση.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα με λειτουργική ενίσχυση ή σύμβαση πώλησης που ηλεκτρίστηκαν μετά τις 04.07.2019, σε ΕΔΔΗΕ ή ΕΣΜΗΕ
  model_impact: Πρώτος έλεγχος επιλεξιμότητας του DSS. Αν το πάρκο δεν πληροί την ημερομηνία ή τον τύπο σύμβασης, η διαδρομή 11Α με διατήρηση ενίσχυσης δεν είναι διαθέσιμη.
  suggested_parameter:
    name: eligibility_commissioning_after_date
    default: '2019-07-04'
    alternatives: []
  notes: Το κείμενο της παρ. 1 διαβάστηκε στο ΦΕΚ Α' 231/12.12.2025 (αντίγραφο στον ιστότοπο του ΔΕΔΔΗΕ). Οι μεταγενέστεροι ν. 5299/2026 (άρθρο 56) και ν. 5325/2026 (άρθρο 57) δεν άλλαξαν την παρ. 1. Δεν βρέθηκε απόφαση του Υπουργού κατά την παρ. 6 που να θέτει νέο όριο ισχύος ή προθεσμία.
- id: REG-A-002
  topic: btm_storage_addition
  title: 'Πάρκα πριν από την 04.07.2019 με λειτουργική ενίσχυση: δεν καλύπτονται ρητά'
  requirement: Η παρ. 1 του άρθρου 11Γ αφορά μόνο Φ/Β που τέθηκαν σε λειτουργία μετά την 4η Ιουλίου 2019. Για παλαιότερα πάρκα με ταρίφα (ΣΠΗΕ ν. 3468/2006 ή ΣΕΔΠ/ΣΕΣΤ) δεν βρέθηκε ρητή διάταξη που να επιτρέπει προσθήκη μπαταρίας πίσω από τον μετρητή με διατήρηση της ενίσχυσης. Η παρ. 4 αναφέρει χωριστά Φ/Β αυτοκατανάλωσης και Φ/Β που συμμετέχουν απευθείας στην αγορά χωρίς λειτουργική ενίσχυση, χωρίς όριο ημερομηνίας.
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο «Σύνδεση Φωτοβολταϊκών Σταθμών Παραγωγής που συνδυάζονται με αποθήκευση στο Δίκτυο ΜΤ», Ιούνιος 2026, Σκοπός. Βλ. και ν. 4685/2020 άρθρο 11Γ παρ. 1 και 4
    url: https://www.deddie.gr/wp-content/uploads/2026/06/SYNDESI-FOTOVOLTAIKON-STATHMON-SE-SYNDYASMO-ME-APOTHIKEFSI-STO-DIKTYO-MT.pdf
    quote: σύμφωνα με το άρθρο 11Γ του ν. 4685/2020, ΦΒ σταθμοί που έχουν τεθεί ή θα τεθούν σε λειτουργία μετά την 4η Ιουλίου 2019, δύνανται να αιτηθούν την προσθήκη συστήματος αποθήκευσης.
  date_issued: '2026-06-19'
  status: unclear
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β πάρκα που ηλεκτρίστηκαν έως και 04.07.2019 και λαμβάνουν ενίσχυση
  model_impact: Το DSS πρέπει να ρωτά ημερομηνία ηλέκτρισης. Για πάρκα πριν από το όριο να εμφανίζει προειδοποίηση ότι η διαδρομή 11Α με διατήρηση ταρίφας δεν τεκμηριώνεται και να μην δίνει θετική σύσταση χωρίς νομικό έλεγχο.
  suggested_parameter:
    name: pre_2019_supported_park_eligible_11A
    default: 'false'
    alternatives:
    - true μόνο αν το πάρκο έχει βγει από την ενίσχυση και συμμετέχει απευθείας στην αγορά (ανάγνωση της παρ. 4)
    - true μέσω γενικών διατάξεων του άρθρου 5 παρ. 18 και 19 ν. 4951/2022, όπως κάνει ο ΑΔΜΗΕ για αιολικά (δεν επιβεβαιώθηκε για Φ/Β)
  notes: Το απόσπασμα του ΔΕΔΔΗΕ και το γράμμα της παρ. 1 είναι επιβεβαιωμένα. Η συνέπεια για τα παλαιά πάρκα είναι ερμηνεία, κανείς δεν τη διατυπώνει ρητά. Ο τύπος γράφει για περίπου 6.000 πάρκα με feed-in premium που μπορούν να βάλουν μπαταρία. Δεν βρέθηκε δημόσιο αίτημα φορέων για επέκταση στα παλαιά πάρκα.
- id: REG-A-003
  topic: btm_storage_addition
  title: Ορισμοί σταθμών 11Α και 11Β (με και χωρίς απορρόφηση από το δίκτυο)
  requirement: 'Σταθμός 11Α: σταθμός ΑΠΕ με διατάξεις αποθήκευσης κατάντη του μετρητή που δεν μπορεί να απορροφά ενέργεια από το δίκτυο για αποθήκευση. Σταθμός 11Β: σταθμός ΑΠΕ με διατάξεις αποθήκευσης κατάντη του μετρητή που μπορεί να αποθηκεύει ενέργεια την οποία απορροφά από το Σύστημα ή το Δίκτυο. Ο 11Β ανήκει στα Ειδικά Έργα (Βεβαίωση Ειδικών Έργων).'
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 10 παρ. 5 περ. (ι), παρ. 11Α και 11Β, όπως προστέθηκαν με το άρθρο 79 ν. 4951/2022 (ΦΕΚ Α' 129/04.07.2022)
    url: https://www.taxheaven.gr/law/4951/2022/arthro/79
    quote: '11Α. Σταθμός παραγωγής Α.Π.Ε. και Σ.Η.Θ.Υ.Α. με ενσωματωμένη αποθήκευση ηλεκτρικής ενέργειας, χωρίς δυνατότητα αποθήκευσης ηλεκτρικής ενέργειας που απορροφάται από το δίκτυο: Σταθμός παραγωγής Α.Π.Ε. και Σ.Η.Θ.Υ.Α. που περιλαμβάνει διατάξεις αποθήκευσης ηλεκτρικής ενέργειας εγκατεστημένες κατάντη του μετρητή, χωρίς να έχει δυνατότητα να απορροφά ενέργεια από το σύστημα μεταφοράς ή το δίκτυο διανομής ηλεκτρικής ενέργειας στο οποίο συνδέεται για σκοπούς αποθήκευσής της, σύμφωνα με το άρθρο 11Β.'
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί ΑΠΕ με μπαταρία πίσω από τον μετρητή
  model_impact: 'Το DSS έχει δύο διακριτά σενάρια: 11Α (φόρτιση μόνο από Φ/Β) και 11Β (φόρτιση και από δίκτυο). Κάθε σενάριο έχει άλλους κανόνες ενίσχυσης, έγχυσης, μέτρησης.'
  suggested_parameter:
    name: station_category
    default: 11A
    alternatives:
    - 11B
    - χωριστός σταθμός αποθήκευσης στο κοινό σημείο σύνδεσης (άρθρο 11Γ παρ. 5)
  notes: Κείμενο όπως ψηφίστηκε το 2022, από αναπαραγωγή του ΦΕΚ στο taxheaven. Δεν ελέγχθηκε κωδικοποιημένη μορφή του άρθρου 10 (το kodiko.gr δεν άνοιξε).
- id: REG-A-004
  topic: grid_charging
  title: 'Σταθμός 11Α: απαγορεύεται η φόρτιση από το δίκτυο'
  requirement: Ο σταθμός 11Α δεν απορροφά ενέργεια από το Σύστημα ή το Δίκτυο, παρά μόνο για τις βοηθητικές καταναλώσεις του, και δεν υπερβαίνει τη Μέγιστη Ισχύ Παραγωγής της Βεβαίωσης. Η μπαταρία φορτίζει αποκλειστικά από το Φ/Β. Ο ΔΕΔΔΗΕ ζητά στο μονογραμμικό σχέδιο αισθητήρες κατεύθυνσης που εμποδίζουν απορρόφηση από το Δίκτυο προς την μπαταρία.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Β παρ. 2, όπως προστέθηκε με το άρθρο 81 ν. 4951/2022 (ΦΕΚ Α' 129/04.07.2022). Βλ. και ανακοίνωση ΔΕΔΔΗΕ 19.01.2026 (δικαιολογητικά)
    url: https://www.taxheaven.gr/law/4951/2022/arthro/81
    quote: Οι σταθμοί της παρ. 11Α του άρθρου 10 δεν απορροφούν ενέργεια από το Σύστημα Μεταφοράς ή το Δίκτυο Διανομής ηλεκτρικής ενέργειας, παρά μόνο για την εξυπηρέτηση των βοηθητικών τους καταναλώσεων και, κατά τη λειτουργία τους, δεν υπερβαίνουν τη Μέγιστη Ισχύ Παραγωγής, όπως αυτή αναγράφεται στη Βεβαίωση.
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί 11Α (η μόνη διαδρομή που διατηρεί τη λειτουργική ενίσχυση)
  model_impact: Στο σενάριο 11Α ο περιορισμός φόρτισης είναι charge_power <= pv_power κάθε χρονικό βήμα. Καμία αγορά ενέργειας από το δίκτυο για arbitrage.
  suggested_parameter:
    name: grid_charging_allowed
    default: 'false'
    alternatives:
    - true μόνο στο σενάριο 11Β
  notes: 'Το απόσπασμα του ΔΕΔΔΗΕ για τους αισθητήρες: «θα παρουσιάζονται και οι αισθητήρες κατεύθυνσης αναφορικά με την απαγόρευση απορρόφησης από το Δίκτυο ενέργειας από το σύστημα αποθήκευσης» (ανακοίνωση 19.01.2026, διαβάστηκε στο πρωτότυπο).'
- id: REG-A-005
  topic: grid_charging
  title: 'Σταθμός 11Β: επιτρέπεται φόρτιση από το δίκτυο, χάνεται η λειτουργική ενίσχυση'
  requirement: Ο σταθμός 11Β επιτρέπεται να απορροφά ενέργεια από το δίκτυο για αποθήκευση, δεν επιτρέπεται να συνάπτει Σύμβαση Λειτουργικής Ενίσχυσης και συμμετέχει στις αγορές. Όταν υφιστάμενο Φ/Β με ενίσχυση μετατρέπεται σε 11Β, εφαρμόζεται το άρθρο 12Α ν. 4414/2016 (συμμετοχή στην αγορά χωρίς ενίσχυση). Ο ΑΔΜΗΕ ζητά λύση της σύμβασης λειτουργικής ενίσχυσης με τον ΔΑΠΕΕΠ από την ημερομηνία ηλέκτρισης ως 11Β και βεβαίωση απευθείας συμμετοχής στην αγορά.
  source:
    type: law
    citation: 'ν. 4685/2020, άρθρο 19Α παρ. 1 (προστέθηκε με το άρθρο 86 ν. 4951/2022) και άρθρο 11Γ παρ. 6Α (ν. 5261/2025). Εφαρμογή: ΑΔΜΗΕ, «Προσθήκη αποθήκευσης σε ΑΠΕ (Μετατροπή σε 11Α_11Β)», ανακοίνωση 22.07.2026'
    url: https://www.taxheaven.gr/law/4951/2022/arthro/86
    quote: 'Οι σταθμοί παραγωγής της παρ. 11Β του άρθρου 10: (α) επιτρέπεται να απορροφούν ενέργεια από το Σύστημα Μεταφοράς ή το Δίκτυο Διανομής ηλεκτρικής ενέργειας για σκοπούς αποθήκευσής της, (β) δεν επιτρέπεται να συνάπτουν Συμβάσεις Λειτουργικής Ενίσχυσης του ν. 4414/2016 (Α'' 149), (γ) συμμετέχουν στις Αγορές Ηλεκτρικής Ενέργειας του ν. 4425/2016 (Α'' 185)'
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Κάθε πάρκο που εξετάζει φόρτιση από το δίκτυο. Κρίσιμο για πάρκα με ΣΕΔΠ ή ΣΕΣΤ
  model_impact: Το σενάριο 11Β πρέπει να αφαιρεί όλη τη λειτουργική ενίσχυση του Φ/Β από την ημέρα μετατροπής και να τιμολογεί όλη την έγχυση σε τιμές αγοράς. Συνήθως αποκλείει το 11Β για πάρκα με υψηλή ταρίφα.
  suggested_parameter:
    name: operating_aid_retained_with_grid_charging
    default: 'false'
    alternatives: []
  notes: 'Απόσπασμα ΑΔΜΗΕ (πρωτότυπο docx): «θα πρέπει να προσκομιστεί λύση της σύμβασης λειτουργικής ενίσχυσης με τον ΔΑΠΕΕΠ από την ημερομηνία ηλέκτρισης του έργου ως έργου της παρ. 11Β». Το άρθρο 19Α διαβάστηκε όπως ψηφίστηκε το 2022. Το ισχύον κείμενο του άρθρου 12Α ν. 4414/2016 δεν ανοίχτηκε σε κωδικοποιημένη μορφή (η αρχική παρ. 3 είχε όριο 4 ετών από τη δοκιμαστική λειτουργία και προϋπόθεση μη λήψης επενδυτικής ενίσχυσης, άγνωστο αν ισχύουν εδώ). Η μετατροπή σε 11Β θεωρείται εδώ μη αναστρέψιμη ως προς την ενίσχυση, δεν βρέθηκε διάταξη επιστροφής.'
- id: REG-A-006
  topic: metering
  title: Η ενέργεια της μπαταρίας πληρώνεται σε τιμές αγοράς, η ενίσχυση μένει μόνο για την ενέργεια του Φ/Β
  requirement: Στον σταθμό 11Α του άρθρου 11Γ η ενέργεια που εγχέεται και προέρχεται από την μπαταρία αποζημιώνεται με την ωριαία τιμή της Αγοράς Επόμενης Ημέρας και τις τιμές των λοιπών αγορών, ανάλογα με τη συμμετοχή σε αυτές. Μετριέται από διακριτό πιστοποιημένο μετρητή στην έξοδο της μπαταρίας. Οι Συμβάσεις Λειτουργικής Ενίσχυσης και Πώλησης παραμένουν σε ισχύ και διέπουν μόνο την ενέργεια που εγχέεται από τις φωτοβολταϊκές μονάδες.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 2 και 3, όπως ισχύει μετά το άρθρο 56 ν. 5261/2025 (ΦΕΚ Α' 231/12.12.2025)
    url: https://www.deddie.gr/wp-content/uploads/2026/02/%CE%86%CF%81%CE%B8%CF%81%CE%BF-56-%CF%84%CE%BF%CF%85-%CE%BD.-5261-2025.pdf
    quote: Η αποζημίωση των σταθμών του παρόντος για την ενέργεια που προέρχεται από τις μονάδες αποθήκευσης προσδιορίζεται από μετρήσεις διακριτού πιστοποιημένου μετρητή που συνδέεται στην έξοδο των μονάδων αποθήκευσης ηλεκτρικής ενέργειας.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ενίσχυση που μετατρέπονται σε 11Α
  model_impact: Κάθε kWh που περνά από την μπαταρία χάνει την ταρίφα και παίρνει τιμή αγοράς. Η μπαταρία αξίζει μόνο όταν (τιμή αγοράς στην εκφόρτιση επί απόδοση κύκλου) υπερβαίνει ό,τι θα εισέπραττε η ίδια kWh αν εγχεόταν απευθείας, ή όταν η kWh θα κοβόταν ούτως ή άλλως.
  suggested_parameter:
    name: storage_discharge_remuneration
    default: market_price_no_operating_aid
    alternatives: []
  notes: 'Δεύτερο απόσπασμα (παρ. 3): «οι Συμβάσεις Λειτουργικής Ενίσχυσης και οι Συμβάσεις Πώλησης Ηλεκτρικής Ενέργειας παραμένουν σε ισχύ και διέπουν την ποσότητα της ηλεκτρικής ενέργειας που εγχέεται από τις φωτοβολταϊκές μονάδες του σταθμού». Ο τρόπος εκκαθάρισης (ΔΑΠΕΕΠ, ΦοΣΕ, αποκλίσεις) ανήκει στο μέρος Β και δεν ερευνήθηκε εδώ.'
- id: REG-A-007
  topic: min_capacity
  title: 'Ελάχιστη ωφέλιμη χωρητικότητα: 1 ώρα επί την εγκατεστημένη ισχύ του Φ/Β'
  requirement: Η ωφέλιμη χωρητικότητα της μπαταρίας που προστίθεται κατά το άρθρο 11Γ παρ. 1 είναι τουλάχιστον ίση με μία (1) ώρα στην εγκατεστημένη ισχύ του φωτοβολταϊκού σταθμού. Ο ΔΕΔΔΗΕ το εφαρμόζει ως τουλάχιστον 1 MWh ανά MW εγκατεστημένης ισχύος Φ/Β. Ο νόμος δεν θέτει ανώτατο όριο χωρητικότητας.
  source:
    type: law
    citation: 'ν. 4685/2020, άρθρο 11Γ παρ. 1 τελευταίο εδάφιο (άρθρο 40 ν. 5151/2024, άρθρο 56 ν. 5261/2025). Εφαρμογή: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητα 4.2'
    url: https://www.deddie.gr/wp-content/uploads/2026/02/%CE%86%CF%81%CE%B8%CF%81%CE%BF-56-%CF%84%CE%BF%CF%85-%CE%BD.-5261-2025.pdf
    quote: Στην περίπτωση αυτή η ωφέλιμη χωρητικότητα των συστημάτων αποθήκευσης ηλεκτρικής ενέργειας, που θα εγκατασταθούν κατά τα ανωτέρω, είναι τουλάχιστον ίση με μία (1) ώρα στην εγκατεστημένη ισχύ του αντίστοιχου φωτοβολταϊκού σταθμού.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Υφιστάμενα και νέα Φ/Β που προσθέτουν μπαταρία κατά το άρθρο 11Γ
  model_impact: 'Κάτω όριο στη μεταβλητή απόφασης του μεγέθους: E_usable_MWh >= 1.0 x P_pv_installed_MW. Το DSS δεν μπορεί να προτείνει μικρότερη μπαταρία, ακόμη κι αν είναι οικονομικά βέλτιστη.'
  suggested_parameter:
    name: min_usable_capacity_hours_of_pv_installed_power
    default: '1.0'
    alternatives:
    - 0 (αν γίνει δεκτό το αίτημα κατάργησης, βλ. REG-A-008)
    - 2.0 (τιμή που ζητείται σε διαγωνισμούς Φ/Β με αποθήκευση και σε μεμονωμένες μπαταρίες, όχι εδώ)
  notes: 'Απόσπασμα ΔΕΔΔΗΕ: «η ωφέλιμη χωρητικότητα των συστημάτων αποθήκευσης θα πρέπει να είναι σύμφωνη με το ισχύον νομοθετικό πλαίσιο, δηλαδή τουλάχιστον ίση με μία (1) MWh ανά MW εγκατεστημένης ισχύος του ΦΒ σταθμού». Ασάφειες: α) βάση υπολογισμού είναι η εγκατεστημένη ισχύς (όχι η μέγιστη ισχύς παραγωγής), το DSS πρέπει να ζητά και τις δύο, β) δεν ορίζεται αν η ωφέλιμη χωρητικότητα μετριέται στην αρχή ζωής ή πρέπει να τηρείται και μετά τη γήρανση, γ) το κατώφλι γράφεται στην παρ. 1, ο ΔΕΔΔΗΕ το αναφέρει γενικά για όλους τους σταθμούς με αποθήκευση.'
- id: REG-A-008
  topic: min_capacity
  title: 'Αίτημα κατάργησης του κανόνα της 1 ώρας: δεν έγινε δεκτό έως σήμερα'
  requirement: Ο Σύνδεσμος Εταιριών Φωτοβολταϊκών ζήτησε αναθεώρηση του ελάχιστου ορίου της μίας ώρας, ώστε το μέγεθος της μπαταρίας να είναι επιλογή του επενδυτή. Κατά τον τύπο το ΥΠΕΝ επέμεινε στην κατεύθυνση που διαμόρφωσαν οι διαγωνισμοί αποθήκευσης. Ο ΣΠΕΦ ζήτησε δημόσια να μην αφαιρεθεί το κατώφλι.
  source:
    type: secondary_press
    citation: PowerGame / Energygame, 25.07.2026. ΣΠΕΦ, δελτίο τύπου 05.04.2026 «Χωρητικότητα μπαταριών στα φωτοβολταϊκά, ρίσκα και υπεραπλουστεύσεις»
    url: https://www.energygame.gr/ananeosimes-piges-ape/536325/fotovoltaika-pos-tha-epitachynthei-egkatastasi-mpatarion-piso-apo-ton-metriti/
    quote: το μέγεθος της αποθήκευσης θα έπρεπε να αποτελεί επιχειρηματική επιλογή του επενδυτή
  date_issued: '2026-07-25'
  status: proposed
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα του άρθρου 11Γ
  model_impact: 'Ανάλυση ευαισθησίας: το DSS να υπολογίζει και τη βέλτιστη μπαταρία χωρίς το κατώφλι, ώστε να φαίνεται το κόστος του κανόνα. Η βασική σύσταση πρέπει να τηρεί το 1.0.'
  suggested_parameter:
    name: min_capacity_rule_active
    default: 'true'
    alternatives:
    - false (σενάριο ευαισθησίας)
  notes: 'Οι φορείς της αγοράς διαφωνούν μεταξύ τους: ο ΣΕΦ ζητά κατάργηση, ο ΣΠΕΦ ζητά διατήρηση («να μην ενδώσει στην αφαίρεση του κατωφλίου του ν. 5261»). Η θέση του ΥΠΕΝ προέρχεται μόνο από δημοσίευμα που επικαλείται πηγές της αγοράς, όχι από επίσημη ανακοίνωση. Δεν βρέθηκε σχετική διάταξη στο νομοσχέδιο που συζητείται στη Βουλή τον Νοέμβριο 2026 (κατά τα δημοσιεύματα, το κείμενο δεν ανοίχτηκε).'
- id: REG-A-009
  topic: injection_limit
  title: 'Σταθμός 11Α: στατικό όριο έγχυσης 07:00 έως 19:00'
  requirement: 'Στα Φ/Β που προσθέτουν μπαταρία και μετατρέπονται σε 11Α εφαρμόζεται μόνιμος περιορισμός της μέγιστης ισχύος παραγωγής του σταθμού κατά 40% σε σχέση με την εγκατεστημένη ισχύ του Φ/Β, τις ώρες 07:00 έως 19:00 κάθε ημέρας κατανομής. Τις ώρες 19:00 έως 07:00 δεν εφαρμόζεται μόνιμος περιορισμός. Ο ΔΕΔΔΗΕ το διαβάζει ως εξής: μέγιστη έγχυση του σταθμού 07:00 έως 19:00 ίση με 60% της εγκατεστημένης ισχύος Φ/Β, τις λοιπές ώρες ίση με τη μέγιστη ισχύ παραγωγής. Το όριο αφορά τη συνολική έγχυση στο σημείο σύνδεσης (Φ/Β και μπαταρία μαζί).'
  source:
    type: law
    citation: 'ν. 4685/2020, άρθρο 11Γ παρ. 5.α περ. α), όπως τροποποιήθηκε με το άρθρο 56 παρ. 2 ν. 5299/2026 (ΦΕΚ Α'' 67/05.05.2026). Εφαρμογή: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητα 4.1 και Πίνακας 3'
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: μετατρέπονται σε σταθμούς της παρ. 11Α του άρθρου 10, εφαρμόζεται μόνιμος περιορισμός της μέγιστης ισχύος παραγωγής του σταθμού σαράντα τοις εκατό (40%) σε σχέση με την εγκατεστημένη ισχύ του φωτοβολταϊκού συστήματος κατά τις ώρες από 7:00 έως 19:00 κάθε ημέρας κατανομής, ενώ δεν εφαρμόζεται μόνιμος περιορισμός της μέγιστης ισχύος παραγωγής του σταθμού κατά τις ώρες από 19:00 έως 24:00 και 00:00 έως 7:00 κάθε ημέρας κατανομής
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα Φ/Β (υφιστάμενα και νέα) που γίνονται 11Α, σε ΕΔΔΗΕ και ΕΣΜΗΕ. Δεν εφαρμόζεται στους Γνωστοποιούμενους Σταθμούς του άρθρου 38 ν. 4951/2022
  model_impact: Ο πιο καθοριστικός κανόνας. Ένα υφιστάμενο πάρκο χωρίς όριο (ή με 73%) αποκτά όριο εξαγωγής 60% της εγκατεστημένης ισχύος όλη την ημέρα. Ό,τι παράγεται πάνω από το 60% πρέπει να αποθηκευτεί ή χάνεται. Η μπαταρία δεν μπορεί να εκφορτίσει πάνω από το όριο πριν από τις 19:00. Χωρίς αυτόν τον κανόνα το μοντέλο υπερεκτιμά τα έσοδα.
  suggested_parameter:
    name: export_cap_fraction_of_pv_installed_0700_1900
    default: '0.60'
    alternatives:
    - 0.40 (αν το «περιορισμός 40%» διαβαστεί ως ανώτατο όριο 40%, ανάγνωση που ίσχυε ουσιαστικά πριν από τον ν. 5299/2026 με τη διατύπωση 60%)
  notes: 'Η διατύπωση του νόμου είναι διφορούμενη (περιορισμός 40%: μείωση κατά 40% ή όριο στο 40%). Ο ΔΕΔΔΗΕ γράφει ρητά: «Η μέγιστη ισχύς έγχυσης των σταθμών χωρίς δυνατότητα απορρόφησης ορίζεται ίση με την εγκατεστημένη ισχύ του ΦΒ συστήματος, μειούμενη κατά 40% τις ώρες 07:00 - 19:00» και στον Πίνακα 3 «7:00 – 19:00: 60% της εγκατεστημένης ισχύος (απομείωση 40%)». Πριν από τις 05.05.2026 ο νόμος έγραφε 60% (ν. 5261/2025). Ο ΑΔΜΗΕ απλώς παραθέτει το κείμενο του νόμου. Η τιμή 0.60 είναι η πιο υπερασπίσιμη, πρέπει όμως να επιβεβαιωθεί στην Οριστική Προσφορά Σύνδεσης κάθε έργου. Ο νόμος μιλά για ώρες ημέρας κατανομής, δεν διευκρινίζεται η θερινή ώρα.'
- id: REG-A-010
  topic: injection_limit
  title: Το παλαιό όριο 27% (73% ή 72%) καταργείται με τη μετατροπή και αντικαθίσταται από το όριο της κατηγορίας
  requirement: Για Φ/Β που έλαβαν Οριστική Προσφορά Σύνδεσης υπό το άρθρο 10 ν. 4951/2022 ισχύει μόνιμο όριο μέγιστης εγχεόμενης ισχύος 73% της εγκατεστημένης ισχύος στο ΕΔΔΗΕ και 72% στο ΕΣΜΗΕ. Εξαιρούνται οι σταθμοί που λειτουργούσαν στην έναρξη ισχύος του ν. 4951/2022 (04.07.2022) ή υπέβαλαν δήλωση ετοιμότητας έως 31.12.2022 και οι λοιπές περιπτώσεις του άρθρου 1 παρ. 2 της απόφασης. Όταν υφιστάμενο Φ/Β προσθέτει μπαταρία, το όριο 27% καταργείται όπου ίσχυε και εφαρμόζεται συνολικά το όριο της νέας κατηγορίας (11Α ή 11Β).
  source:
    type: ministerial_decision
    citation: ΥΑ ΥΠΕΝ/ΔΑΠΕΕΚ/53563/1556/15.05.2023 (ΦΕΚ Β' 3328/19.05.2023), άρθρα 1 και 2. ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητα 4.1
    url: https://www.dikaio.ai/prod-assets/fek/2023/02/03328.pdf
    quote: Επισημαίνεται ότι στην περίπτωση υφιστάμενων ΦΒ σταθμών, καταργείται ο περιορισμός έγχυσης κατά 27%, όπου αυτός εφαρμόζεται, και στον νέο σταθμό εφαρμόζεται συνολικά ο εκάστοτε περιορισμός της κατηγορίας του.
  date_issued: '2023-05-19'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Υφιστάμενα Φ/Β. Το όριο 73% ή 72% αφορά όσα έχουν Οριστική Προσφορά υπό το άρθρο 10 ν. 4951/2022
  model_impact: 'Το σενάριο βάσης (χωρίς μπαταρία) πρέπει να έχει το σωστό σημερινό όριο του πάρκου: 1.00, 0.73 ή 0.72. Η σύγκριση με το σενάριο 11Α (0.60 την ημέρα) δίνει το πραγματικό κόστος της μετατροπής.'
  suggested_parameter:
    name: baseline_static_export_cap_fraction
    default: 1.00 για πάρκα σε λειτουργία πριν από 04.07.2022 και λοιπές εξαιρέσεις, αλλιώς 0.73 (ΕΔΔΗΕ) ή 0.72 (ΕΣΜΗΕ)
    alternatives:
    - τιμή που αναγράφει η Οριστική Προσφορά ή η Σύμβαση Σύνδεσης του συγκεκριμένου πάρκου
  notes: Το απόσπασμα είναι του ΔΕΔΔΗΕ (αφορά το ΕΔΔΗΕ ΜΤ). Ο πίνακας 73% και 72% διαβάστηκε στο ΦΕΚ Β' 3328. Δεν ελέγχθηκε αν η απόφαση τροποποιήθηκε μετά το 2023. Ορισμένες προσφορές σύνδεσης έχουν αυστηρότερους όρους βάσει άλλων αποφάσεων (π.χ. ΥΑ 88889/2592/2024), δεν ερευνήθηκαν.
- id: REG-A-011
  topic: injection_limit
  title: 'Σταθμός 11Β: ωριαία όρια έγχυσης (μηδενική έγχυση 11:00 έως 15:00)'
  requirement: 'Στα Φ/Β που μετατρέπονται σε 11Β εφαρμόζονται τα όρια του άρθρου 4 της ΥΑ 53563/1556/2023 για σταθμούς αποθήκευσης: μέγιστη επιτρεπόμενη έγχυση ως ποσοστό της μέγιστης ισχύος έγχυσης 70% (09:00 έως 10:00), 35% (10:00 έως 11:00), 0% (11:00 έως 15:00), 35% (15:00 έως 16:00), 70% (16:00 έως 17:00), 100% τις λοιπές ώρες. Ισχύουν μέχρι να εκδοθεί ειδική απόφαση για το ΕΔΔΗΕ.'
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 5.α περ. β), όπως τροποποιήθηκε με το άρθρο 56 παρ. 2 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026), σε συνδυασμό με ΥΑ ΥΠΕΝ/ΔΑΠΕΕΚ/53563/1556/15.05.2023 (ΦΕΚ Β' 3328/19.05.2023) άρθρο 4 Πίνακας 3
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: μετατρέπονται σε σταθμούς της παρ. 11Β του άρθρου 10, εφαρμόζονται οι περιορισμοί έγχυσης, όπως ορίζονται στο άρθρο 4 της υπό στοιχεία ΥΠΕΝ/ΔΑΠΕΕΚ/53563/1556/15.5.2023 απόφασης
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β που γίνονται 11Β, σε ΕΔΔΗΕ και ΕΣΜΗΕ
  model_impact: Στο σενάριο 11Β ο σταθμός δεν εγχέει τίποτα 11:00 έως 15:00. Όλη η μεσημεριανή παραγωγή πρέπει να αποθηκευτεί ή χάνεται, άρα απαιτείται πολύ μεγαλύτερη μπαταρία. Συνδυασμένο με την απώλεια ενίσχυσης, το 11Β είναι σπάνια ελκυστικό για υφιστάμενο πάρκο.
  suggested_parameter:
    name: export_cap_profile_11B
    default: '{''09-10'': 0.70, ''10-11'': 0.35, ''11-15'': 0.00, ''15-16'': 0.35, ''16-17'': 0.70, ''other'': 1.00}'
    alternatives:
    - νέα τιμές όταν εκδοθεί η απόφαση του άρθρου 10 παρ. 5 ν. 4951/2022 για το ΕΔΔΗΕ
  notes: Ο πίνακας διαβάστηκε στο ΦΕΚ Β' 3328 και αναπαράγεται στον Πίνακα 2 του φυλλαδίου ΔΕΔΔΗΕ ως «Περιορισμός μέγιστης επιτρεπόμενης ισχύος έγχυσης σταθμών με δυνατότητα απορρόφησης από το Δίκτυο». Βάση του ποσοστού είναι η μέγιστη ισχύς έγχυσης του σταθμού. Η απόφαση εξαιρεί ορισμένες περιοχές του Συστήματος (Νότια Εύβοια, Κρήτη, διασυνδεδεμένες Κυκλάδες), άγνωστο αν η εξαίρεση μεταφέρεται στους 11Β.
- id: REG-A-012
  topic: injection_limit
  title: 'Δυναμικοί περιορισμοί και περικοπές: ισχύουν για όλο το έργο, χωρίς ανώτατο όριο κατά τον ΑΔΜΗΕ'
  requirement: Πέρα από τα στατικά όρια, οι όροι σύνδεσης επιτρέπουν περιορισμούς που ορίζει ο Διαχειριστής με βάση την κατάσταση του δικτύου και περιορισμούς πραγματικού χρόνου έως και αποσύνδεση. Εφαρμόζονται επιπλέον των περικοπών που προκύπτουν από την αγορά. Ο ΑΔΜΗΕ σημειώνει για τα έργα που μετατρέπονται σε 11Α ή 11Β ότι οι δυναμικοί περιορισμοί είναι απεριόριστοι για το σύνολο του έργου.
  source:
    type: admie_code
    citation: 'ΑΔΜΗΕ, «Προσθήκη αποθήκευσης σε ΑΠΕ (Μετατροπή σε 11Α_11Β)», συνημμένο στην ανακοίνωση 22.07.2026. Νομική βάση: ν. 4951/2022 άρθρο 10 παρ. 2 περ. γ) και δ)'
    url: https://www.admie.gr/sites/default/files/users/dssas/%CE%A0%CF%81%CE%BF%CF%83%CE%B8%CE%AE%CE%BA%CE%B7%20%CE%B1%CF%80%CE%BF%CE%B8%CE%AE%CE%BA%CE%B5%CF%85%CF%83%CE%B7%CF%82%20%CF%83%CE%B5%20%CE%91%CE%A0%CE%95%20(%CE%9C%CE%B5%CF%84%CE%B1%CF%84%CF%81%CE%BF%CF%80%CE%AE%20%CF%83%CE%B5%2011%CE%91_11%CE%92).docx
    quote: 'Δυναμικοί περιορισμοί: Απεριόριστοι για το σύνολο του έργου.'
  date_issued: '2026-07-22'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Έργα συνδεδεμένα στο ΕΣΜΗΕ που μετατρέπονται σε 11Α ή 11Β. Για το ΕΔΔΗΕ δεν βρέθηκε αντίστοιχη ρητή διατύπωση
  model_impact: Το μοντέλο δεν μπορεί να υποθέσει ότι μετά τη μετατροπή σταματούν οι περικοπές. Χρειάζεται σενάριο περικοπών για το σύνολο του σταθμού. Η μπαταρία 11Α μπορεί να απορροφά την παραγωγή που κόβεται, αν έχει χώρο.
  suggested_parameter:
    name: dynamic_curtailment_cap_fraction_of_annual_energy
    default: none
    alternatives:
    - 0.05 (όριο του άρθρου 10 παρ. 4 ν. 4951/2022 για την περιοχή, όχι ανά σταθμό, και όχι για έργα που το έχουν αποδεχθεί χωρίς όριο)
  notes: Το άρθρο 10 παρ. 3 και 4 ν. 4951/2022 προβλέπει όρια 5% της ετήσιας δυνατότητας παραγωγής για τους περιορισμούς και η παρ. 11 ότι δεν οφείλεται αποζημίωση εντός των ορίων. Η φράση του ΑΔΜΗΕ δείχνει ότι τα έργα αυτά δεν προστατεύονται από το 5%. Η σχέση των δύο δεν διευκρινίζεται πουθενά. Οι κανόνες περικοπών της αγοράς ανήκουν στο μέρος Β.
- id: REG-A-013
  topic: connection_limit
  title: 'Μέγιστη ισχύς εξαγωγής: δεν αυξάνεται πάνω από τη συμφωνημένη στον 11Α'
  requirement: Ο σταθμός 11Α δεν υπερβαίνει τη Μέγιστη Ισχύ Παραγωγής που αναγράφεται στη Βεβαίωση. Επιτρέπεται υπέρβαση έως 5% αν εμφανίζεται σπάνια, με μέτρηση μέσου όρου 15 λεπτών. Η προσθήκη μπαταρίας δεν δίνει πρόσθετη ισχύ εξαγωγής.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Β παρ. 2 (άρθρο 81 ν. 4951/2022) και άρθρο 10 παρ. 9
    url: https://www.taxheaven.gr/law/4951/2022/arthro/79
    quote: Επιτρέπεται υπέρβαση της Μέγιστης Ισχύος Παραγωγής μέχρι ποσοστού πέντε τοις εκατό (5%), εφόσον η υπέρβαση αυτή εμφανίζεται σε μικρή συχνότητα, σύμφωνα με τα οριζόμενα κατά περίπτωση στον Κανονισμό Βεβαιώσεων.
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί 11Α
  model_impact: 'Περιορισμός ισχύος στο σημείο σύνδεσης: pv_to_grid + battery_discharge <= min(μέγιστη ισχύς παραγωγής, στατικό όριο ώρας). Τις νυχτερινές ώρες το όριο είναι η μέγιστη ισχύς παραγωγής.'
  suggested_parameter:
    name: max_export_power_kw
    default: υφιστάμενη Μέγιστη Ισχύς Παραγωγής του πάρκου
    alternatives:
    - έως +5% σπάνια (όχι για σχεδιασμό)
  notes: Το DSS δεν πρέπει να στηρίζεται στην ανοχή 5%. Η ακριβής τιμή ισχύος βρίσκεται στη Βεβαίωση ή στη Σύμβαση Σύνδεσης του πάρκου.
- id: REG-A-014
  topic: connection_limit
  title: 'Ισχύς μπαταρίας στον 11Β: ο ΔΕΔΔΗΕ δέχεται ισχύ μεγαλύτερη του Φ/Β, ο ΑΔΜΗΕ όχι'
  requirement: 'Η Μέγιστη Ισχύς Έγχυσης σταθμού 11Β δεν υπερβαίνει τη μεγαλύτερη από τις δύο: μέγιστη ισχύ παραγωγής του σταθμού ΑΠΕ ή μέγιστη ισχύ έγχυσης των διατάξεων αποθήκευσης. Ο ΔΕΔΔΗΕ δέχεται μπαταρία με ισχύ μεγαλύτερη από του Φ/Β (παράδειγμα 400 kW Φ/Β με 500 kW μπαταρία). Ο ΑΔΜΗΕ ορίζει ότι η μέγιστη ισχύς έγχυσης της μπαταρίας δεν μπορεί να υπερβαίνει τη μέγιστη παραγόμενη ισχύ του σταθμού πριν από την τροποποίηση.'
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 19Α παρ. 1 περ. ε) (άρθρο 86 ν. 4951/2022). ΔΕΔΔΗΕ, ανακοίνωση 19.01.2026 και Τεχνικό Φυλλάδιο ΜΤ ενότητα 4.1. ΑΔΜΗΕ, έγγραφο 22.07.2026
    url: https://www.taxheaven.gr/law/4951/2022/arthro/86
    quote: η Μέγιστη Ισχύς Έγχυσης σταθμού παραγωγής Α.Π.Ε. και Σ.Η.Θ.Υ.Α. με διατάξεις αποθήκευσης δεν μπορεί να υπερβαίνει τη μέγιστη ισχύ παραγωγής του σταθμού Α.Π.Ε. και Σ.Η.Θ.Υ.Α. και τη μέγιστη ισχύ έγχυσης από τις διατάξεις αποθήκευσης του σταθμού, όποια από τις δύο είναι υψηλότερη.
  date_issued: '2022-07-04'
  status: contradictory
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί 11Β
  model_impact: Στο σενάριο 11Β το άνω όριο ισχύος μετατροπέα μπαταρίας εξαρτάται από τον Διαχειριστή. Συντηρητικά το DSS θέτει battery_power <= μέγιστη ισχύς παραγωγής Φ/Β.
  suggested_parameter:
    name: max_battery_inverter_power_11B_kw
    default: ίση με τη Μέγιστη Ισχύ Παραγωγής του Φ/Β πριν από την τροποποίηση
    alternatives:
    - μεγαλύτερη, αν ο ΔΕΔΔΗΕ χορηγήσει τον πρόσθετο ηλεκτρικό χώρο
  notes: 'Απόσπασμα ΔΕΔΔΗΕ: «Οι σταθμοί με δυνατότητα απορρόφησης δύναται να διαθέτουν σύστημα αποθήκευσης με ισχύ μεγαλύτερη από εκείνη του ΦΒ συστήματος». Απόσπασμα ΑΔΜΗΕ: «Η μέγιστη ισχύς έγχυσης του αποθηκευτικού συστήματος δεν μπορεί να υπερβαίνει την μέγιστη παραγόμενη ισχύ του σταθμού ΑΠΕ όπως είχε πριν την τροποποίηση (με την επιφύλαξη του άρθρου 5 παρ. 18 (περ. δ’ υποπερίπτ. Δβ’) του ν. 4951/2022)». Η επιφύλαξη του άρθρου 5 παρ. 18 δεν διαβάστηκε σε ισχύον κείμενο.'
- id: REG-A-015
  topic: connection_limit
  title: Ισχύς μετατροπέα μπαταρίας και ηλεκτρικός χώρος (συμβολή στο βραχυκύκλωμα)
  requirement: 'Ο νόμος δεν θέτει ρητό ανώτατο όριο ισχύος μπαταρίας για τον 11Α. Στην πράξη ο ΔΕΔΔΗΕ ελέγχει τη συμβολή στο βραχυκύκλωμα: 1,1 x Sn κάθε μετατροπέα. Με χωριστό μετατροπέα μπαταρίας (AC coupled) η συμβολή προστίθεται σε αυτήν του Φ/Β, άρα δεσμεύεται νέος ηλεκτρικός χώρος. Με κοινό μετατροπέα (DC coupled) δεν δεσμεύεται νέος χώρος αν 1,1 x Sn του νέου κοινού μετατροπέα δεν υπερβαίνει τη συνολική ισχύ βραχυκύκλωσης της υφιστάμενης Οριστικής Προσφοράς.'
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, ανακοίνωση 19.01.2026 (κοινός μετατροπέας) και Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητα 4.2
    url: https://www.deddie.gr/el/anakoinosi-tou-deddie-schetika-me-tin-ypodochi-aitimaton-gia-prosthiki-monadon-apothikefsis-se-yfistamenous-kai-neous-stathmous-ape-meso-koinou-metatropea/
    quote: 1,1 x Ονομαστική φαινόμενη ισχύς του νέου κοινού μετατροπέα > Συνολική ισχύς που καταλαμβάνει ο σταθμός στο βραχυκύκλωμα με βάση την ΟΠΣ που έχει χορηγηθεί
  date_issued: '2026-01-19'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα συνδεδεμένα στο ΕΔΔΗΕ
  model_impact: 'Η επιλογή τοπολογίας αλλάζει τον χρόνο και τον κίνδυνο αδειοδότησης. AC coupled: αίτημα που δεσμεύει νέο ηλεκτρικό χώρο, Ομάδα Β, αναμονή. DC coupled εντός ορίου: ταχύτερο, αλλά με ζήτημα μέτρησης και ενίσχυσης (βλ. REG-A-026). Το DSS πρέπει να έχει την τοπολογία ως επιλογή με διαφορετική καθυστέρηση.'
  suggested_parameter:
    name: common_inverter_max_kva_without_new_capacity
    default: S_sc_OPS_kVA / 1.1 (π.χ. 363,6 kVA για Φ/Β 400 kW)
    alternatives: []
  notes: Το παράδειγμα 400/1,1 = 363,6 kVA είναι του ΔΕΔΔΗΕ. Μικρότεροι μετατροπείς επιτρέπονται με γνωστοποίηση. Αλλαγή χωρητικότητας χωρίς αλλαγή ισχύος μετατροπέων δεν επηρεάζει τη συμβολή στο βραχυκύκλωμα. Ο ν. 5299/2026 (άρθρο 61) προβλέπει δυνατότητα μείωσης της συμβολής στο βραχυκύκλωμα, δεν διαβάστηκε.
- id: REG-A-016
  topic: procedure
  title: Ποιος εγκρίνει και ποιες άδειες τροποποιούνται
  requirement: Το αίτημα υποβάλλεται στη ΡΑΑΕΥ (Φορέας Αδειοδότησης, για σταθμούς με Βεβαίωση Παραγωγού) ή απευθείας στον αρμόδιο Διαχειριστή (ΔΕΔΔΗΕ για το Δίκτυο, ΑΔΜΗΕ για το Σύστημα, και για Εξαιρούμενους σταθμούς). Η Βεβαίωση Παραγωγού, η Οριστική Προσφορά Σύνδεσης, η περιβαλλοντική αδειοδότηση και κάθε άλλη άδεια ή έγκριση τροποποιούνται κατά προτεραιότητα. Ακολουθεί τροποποίηση Σύμβασης Σύνδεσης και, όπου απαιτείται, της σύμβασης με τον ΔΑΠΕΕΠ.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 1 και παρ. 4 πρώτο εδάφιο, όπως ισχύει μετά το άρθρο 56 παρ. 1 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: οι Βεβαιώσεις Παραγωγού, η Οριστική Προσφορά Σύνδεσης με την επιφύλαξη της περ. ζ) της παρ. 19 του άρθρου 5 του ν. 4951/2022 (Α’ 129), οι αποφάσεις περιβαλλοντικής αδειοδότησης, καθώς και κάθε άλλη άδεια ή έγκριση τροποποιούνται κατά προτεραιότητα με την επιφύλαξη του τρίτου εδαφίου.
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα του άρθρου 11Γ (αδειοδοτούμενα και εξαιρούμενα)
  model_impact: Το DSS πρέπει να περιλαμβάνει κόστος και χρόνο αδειοδότησης ως παραμέτρους με αβεβαιότητα, και λίστα ελέγχου βημάτων ανά Διαχειριστή.
  suggested_parameter:
    name: permitting_route
    default: ΔΕΔΔΗΕ για σύνδεση στο ΕΔΔΗΕ, ΑΔΜΗΕ για σύνδεση στο ΕΣΜΗΕ, ΡΑΑΕΥ για τροποποίηση Βεβαίωσης όπου υπάρχει
    alternatives: []
  notes: Η περ. ζ) της παρ. 19 του άρθρου 5 ν. 4951/2022 (περίπτωση όπου αρκεί απλή γνωστοποίηση αντί τροποποίησης της Οριστικής Προσφοράς) δεν βρέθηκε σε ισχύον κείμενο, το taxheaven δείχνει την παρ. 19 χωρίς περ. ζ). Το όριο ισχύος για Εξαιρούμενους σταθμούς (Φ/Β έως 1 MW) δεν επαληθεύτηκε σε αυτή την έρευνα. Για την άδεια εγκατάστασης και λειτουργίας δεν βρέθηκε ειδική οδηγία, καλύπτονται από τη φράση «κάθε άλλη άδεια ή έγκριση».
- id: REG-A-017
  topic: procedure
  title: 'ΔΕΔΔΗΕ: πλατφόρμα, χρονικό παράθυρο και δικαιολογητικά'
  requirement: 'Τα αιτήματα υποβάλλονται στην ηλεκτρονική πλατφόρμα ΑΠΕ του ΔΕΔΔΗΕ με κωδικούς TAXISnet. Για προσθήκη μπαταρίας με ανεξάρτητο μετατροπέα σε σταθμούς με λειτουργική ενίσχυση, και για κοινό μετατροπέα που αυξάνει τη συμβολή στο βραχυκύκλωμα, η υποβολή γίνεται μόνο το πρώτο δεκαήμερο κάθε μήνα. Κοινός μετατροπέας χωρίς αύξηση συμβολής υποβάλλεται όλο τον μήνα. Απαιτούνται: επικαιροποιημένα δικαιολογητικά της αρχικής αίτησης (Βεβαίωση όπου υπάρχει, περιβαλλοντική αδειοδότηση, μονογραμμικό με αισθητήρες κατεύθυνσης για 11Α, τοπογραφικό, τεχνική περιγραφή, εγχειρίδια και πιστοποιήσεις), εγγυητική επιστολή, Παράρτημα Ι με τα τεχνικά στοιχεία.'
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, ανακοινώσεις 17.04.2025 (επικαιροποίηση 19.01.2026), 19.01.2026 και 03.02.2026 για προσθήκη μονάδων αποθήκευσης σε υφιστάμενους και νέους σταθμούς ΑΠΕ
    url: https://www.deddie.gr/el/anakoinosi-tou-deddie-schetika-me-tin-ypodochi-aitimaton-gia-prosthiki-monadon-apothikefsis-se-yfistamenous-kai-neous-stathmous-ape-pou-apozimionontai-me-leitourgiki-enischysi-se-efarmogi-tou-arthrou/
    quote: Η υποδοχή των αιτημάτων σύνδεσης γίνεται μέσω της ηλεκτρονικής πλατφόρμας, όπου απαιτείται είσοδος μέσω ΓΓΠΣ αποκλειστικά με τους κωδικούς TAXISnet του αιτούντος φορέα, κατά το πρώτο 10ήμερο του κάθε μήνα.
  date_issued: '2026-02-03'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα συνδεδεμένα στο Διασυνδεδεμένο Δίκτυο (ΕΔΔΗΕ)
  model_impact: Βήματα και χρόνοι για τον οδηγό ενεργειών του DSS. Ο χρόνος έως την τροποποιημένη προσφορά σύνδεσης δεν ορίζεται, να μπει ως αβέβαιη παράμετρος.
  suggested_parameter:
    name: deddie_application_window
    default: ημέρες 1 έως 10 κάθε μήνα
    alternatives:
    - όλο τον μήνα για κοινό μετατροπέα χωρίς νέο ηλεκτρικό χώρο
  notes: Αν η μπαταρία εξαιρούμενου σταθμού εγκατασταθεί σε διαφορετικό χώρο από το Φ/Β, ζητείται υπεύθυνη δήλωση και νομιμοποιητικά έγγραφα για το δικαίωμα χρήσης του χώρου. Δεν βρέθηκε τέλος αίτησης ή μελέτης του ΔΕΔΔΗΕ για αυτά τα αιτήματα. Δεν βρέθηκε οδηγία για σύνδεση στη Χαμηλή Τάση.
- id: REG-A-018
  topic: procedure
  title: 'ΕΔΔΗΕ: σειρά προτεραιότητας αιτημάτων που δεσμεύουν νέο ηλεκτρικό χώρο'
  requirement: Στο ΕΔΔΗΕ τα αιτήματα τροποποίησης Οριστικής Προσφοράς για προσθήκη μπαταρίας που οδηγούν σε δέσμευση νέου ηλεκτρικού χώρου και υποβάλλονται μετά τις 30.11.2025 κατατάσσονται στην Ομάδα Προτεραιότητας Β και εξετάζονται αφού χορηγηθούν οι Οριστικές Προσφορές και εξαντληθεί το όριο των 900 MW για μεμονωμένες μπαταρίες στο ΕΔΔΗΕ. Εξαιρούνται οι ενταγμένες αιτήσεις του Προγράμματος «Συστήματα Αποθήκευσης στις Επιχειρήσεις».
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 4 τρίτο εδάφιο, όπως τροποποιήθηκε με το άρθρο 56 παρ. 1 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026)
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: οι αιτήσεις για τροποποιήσεις των Οριστικών Προσφορών Σύνδεσης των φωτοβολταϊκών σταθμών της παρούσας, καθώς και της παρ. 5, για την προσθήκη μονάδων αποθήκευσης οι οποίες οδηγούν σε δέσμευση νέου ηλεκτρικού χώρου και οι οποίες υποβάλλονται μετά την 30ή Νοεμβρίου 2025
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα στο ΕΔΔΗΕ με μπαταρία που αυξάνει τη συμβολή στο βραχυκύκλωμα (κυρίως AC coupled)
  model_impact: Κίνδυνος μεγάλης και άγνωστης καθυστέρησης για AC coupled στο ΕΔΔΗΕ. Το DSS πρέπει να δείχνει την επίδραση καθυστέρησης 6, 12, 24 μηνών στην καθαρή παρούσα αξία.
  suggested_parameter:
    name: connection_offer_delay_months
    default: unknown (δεν ορίζεται προθεσμία, να δοθεί από τον χρήστη)
    alternatives:
    - σενάρια ευαισθησίας 6, 12, 24 μήνες (δική μου πρόταση, όχι νομικός κανόνας)
    - μικρότερη καθυστέρηση για κοινό μετατροπέα χωρίς νέο ηλεκτρικό χώρο (εκτίμηση, όχι κανόνας)
  notes: Πριν από τον ν. 5299/2026 το κριτήριο ήταν «μέσω ανεξάρτητου μετατροπέα», τώρα είναι η δέσμευση νέου ηλεκτρικού χώρου. Κανένα κείμενο δεν δίνει προθεσμία απάντησης του Διαχειριστή για αυτά τα αιτήματα. Ο τύπος (Οκτώβριος 2026) αναφέρει ότι η αγορά περιμένει όρους σύνδεσης για περίπου 2 GW co-located έργων σε 1 έως 2 χρόνια. Τα σενάρια μηνών είναι δική μου πρόταση για ανάλυση ευαισθησίας, όχι νομικός κανόνας.
- id: REG-A-019
  topic: procedure
  title: 'ΑΔΜΗΕ: διαδικασία μετατροπής σε 11Α ή 11Β για έργα στο Σύστημα'
  requirement: Ο ΑΔΜΗΕ εξετάζει κατά προτεραιότητα αιτήματα τροποποίησης Οριστικής Προσφοράς και Σύμβασης Σύνδεσης για μετατροπή Φ/Β σε 11Α ή 11Β (αδειοδοτούμενοι και απαλλασσόμενοι σταθμοί). Για πληρότητα απαιτούνται εγγυητική επιστολή κατά το άρθρο 6 ν. 4951/2022 χωρίς τη μείωση του άρθρου 89Α και έγγραφο τροποποίησης ή ενημέρωσης της περιβαλλοντικής αδειοδότησης. Αν ο σταθμός έχει ήδη ηλεκτριστεί, για να λειτουργήσει ως 11Α απαιτείται νέα βεβαίωση ηλέκτρισης και τίθεται ξανά σε δοκιμαστική λειτουργία. Στο στάδιο ηλέκτρισης ζητείται τροποποίηση της σύμβασης με τον ΔΑΠΕΕΠ.
  source:
    type: admie_code
    citation: ΑΔΜΗΕ, ανακοινώσεις 22.07.2026 και 29.10.2026 και συνημμένο «Προσθήκη αποθήκευσης σε ΑΠΕ (Μετατροπή σε 11Α_11Β)»
    url: https://www.admie.gr/sites/default/files/users/dssas/%CE%A0%CF%81%CE%BF%CF%83%CE%B8%CE%AE%CE%BA%CE%B7%20%CE%B1%CF%80%CE%BF%CE%B8%CE%AE%CE%BA%CE%B5%CF%85%CF%83%CE%B7%CF%82%20%CF%83%CE%B5%20%CE%91%CE%A0%CE%95%20(%CE%9C%CE%B5%CF%84%CE%B1%CF%84%CF%81%CE%BF%CF%80%CE%AE%20%CF%83%CE%B5%2011%CE%91_11%CE%92).docx
    quote: Σε περίπτωση όπου ο Φ/Β σταθμός έχει ήδη ηλεκτριστεί, για την ηλέκτριση του έργου ως έργου της παρ. 11Α του άρθρου 10 του ν.4658/2020 απαιτείται νέα βεβαίωση ηλέκτρισης και τίθεται ξανά σε δοκιμαστική λειτουργία.
  date_issued: '2026-07-22'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Πάρκα που έχουν Οριστική Προσφορά Σύνδεσης από τον ΑΔΜΗΕ (σύνδεση στο ΕΣΜΗΕ, και μέσω κοινού αιτήματος)
  model_impact: Πρόσθετα βήματα και πιθανή διακοπή ή μεταβατική περίοδος (νέα δοκιμαστική λειτουργία) που το DSS πρέπει να κοστολογεί ως ημέρες μειωμένων εσόδων.
  suggested_parameter:
    name: re_energisation_downtime_days
    default: άγνωστο, να δοθεί από τον χρήστη
    alternatives: []
  notes: Το απόσπασμα περιέχει τυπογραφικό λάθος του ΑΔΜΗΕ (ν.4658/2020 αντί 4685/2020), μεταφέρεται ως έχει. Για απαλλασσόμενο σταθμό αρκεί ο αριθμός πρωτοκόλλου του αιτήματος προς την περιβαλλοντική αρχή και η άπρακτη πάροδος 20 ημερών. Για σταθμό που συνδέεται σε «ΚΑΔ» (έτσι το γράφει ο ΑΔΜΗΕ, το αρκτικόλεξο δεν εξηγείται στο έγγραφο) την αίτηση υπογράφει και ο εκπρόσωπος του ΚΑΔ με συναίνεση όλων των συνδεόμενων. Τέλος διεκπεραίωσης 250 ευρώ συν ΦΠΑ αναφέρεται σε ανακοίνωση του 2022 για αιτήσεις προσφοράς σύνδεσης, δεν επιβεβαιώθηκε ότι ισχύει και εδώ. Δεν είναι γνωστό αν ο ΔΕΔΔΗΕ απαιτεί επίσης νέα δοκιμαστική λειτουργία.
- id: REG-A-020
  topic: procedure
  title: Εγγυητική επιστολή για την προσθήκη μπαταρίας
  requirement: 'Για κάθε αίτημα προσθήκης μπαταρίας σε υφιστάμενο Φ/Β απαιτείται εγγυητική επιστολή κατά το άρθρο 6 ν. 4951/2022. Για 11Α υπολογίζεται στη μέγιστη ισχύ παραγωγής του σταθμού, για 11Β στη μέγιστη ισχύ έγχυσης του σταθμού. Ύψος: 42 ευρώ ανά kW έως 1 MW, 21 ευρώ ανά kW από 1 έως 10 MW, 14 ευρώ ανά kW από 10 έως 100 MW, 7 ευρώ ανά kW πάνω από 100 MW. Δεν εφαρμόζεται η μείωση του άρθρου 89Α. Η εγγυητική μειώνεται στο ένα τέταρτο με τη θέση σε ισχύ της Σύμβασης Σύνδεσης και επιστρέφεται με την ενεργοποίηση.'
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 5.γ, όπως ισχύει μετά το άρθρο 56 παρ. 4 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026). ν. 4951/2022 άρθρο 6 παρ. 3 και 4
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: Για τις αιτήσεις προσθήκης συστημάτων αποθήκευσης σε υφιστάμενους φωτοβολταϊκούς σταθμούς δεν εφαρμόζεται το άρθρο 89Α του ν. 4951/2022
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα υφιστάμενα Φ/Β που προσθέτουν μπαταρία, σε ΕΔΔΗΕ και ΕΣΜΗΕ
  model_impact: 'Κόστος δέσμευσης κεφαλαίου και προμήθεια εγγυητικής έως την ενεργοποίηση. Παράδειγμα: πάρκο 1 MW σε 11Α χρειάζεται εγγυητική 42.000 ευρώ, πάρκο 3 MW χρειάζεται 84.000 ευρώ.'
  suggested_parameter:
    name: guarantee_eur_per_kw_tiers
    default: '{''0-1MW'': 42, ''1-10MW'': 21, ''10-100MW'': 14, ''>100MW'': 7}'
    alternatives: []
  notes: Τα ποσά του άρθρου 6 διαβάστηκαν σε αναπαραγωγή του νόμου στο taxheaven, δεν ελέγχθηκε αν αναπροσαρμόστηκαν. Το άρθρο 6 παρ. 2 έχει εξαιρέσεις (π.χ. ενεργειακές κοινότητες με πολλά μέλη, μικρά Φ/Β σε Δυτική Μακεδονία), δεν είναι σαφές αν ισχύουν και για την προσθήκη μπαταρίας. Η βάση υπολογισμού είναι όλη η ισχύς του σταθμού, όχι μόνο της μπαταρίας. Η παλαιότερη οδηγία του ΔΕΔΔΗΕ (17.04.2025) για χωριστή εγγυητική στα kVA του μετατροπέα με μείωση 89Α έχει αντικατασταθεί.
- id: REG-A-021
  topic: procedure
  title: 'Κόστος έργων σύνδεσης: 50% στον παραγωγό σήμερα'
  requirement: Κατά τον ΔΕΔΔΗΕ οι σταθμοί Φ/Β με αποθήκευση επιβαρύνονται με το 50% του κόστους κατασκευής των έργων σύνδεσης, βάσει του άρθρου 98 ν. 4951/2022, που εφαρμόζεται αναλογικά και σε σταθμούς αποθήκευσης.
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητα 5. ν. 4951/2022 άρθρο 98
    url: https://www.deddie.gr/wp-content/uploads/2026/06/SYNDESI-FOTOVOLTAIKON-STATHMON-SE-SYNDYASMO-ME-APOTHIKEFSI-STO-DIKTYO-MT.pdf
    quote: Οι σταθμοί επιβαρύνονται με το πενήντα τοις εκατό (50%) του κόστους κατασκευής των έργων σύνδεσης (άρθρο 98, παρ. 10 του ν. 4951/2022).
  date_issued: '2026-06-19'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί στο ΕΔΔΗΕ ΜΤ που χρειάζονται νέα ή ενισχυμένα έργα σύνδεσης
  model_impact: Αν η προσθήκη απαιτεί έργα δικτύου, το DSS χρεώνει στον παραγωγό το 50% του κόστους. Αν δεν απαιτούνται έργα (ίδια ισχύς εξαγωγής), το κόστος είναι μηδέν.
  suggested_parameter:
    name: producer_share_of_connection_works
    default: '0.50'
    alternatives:
    - 1.00 αν ψηφιστεί το άρθρο 42 του νομοσχεδίου (βλ. REG-A-038)
  notes: Η έρευνα δεν ανέλυσε ποια έργα καλύπτει ακριβώς το άρθρο 98 (επέκταση ή ενίσχυση). Εκκρεμεί αλλαγή, βλ. REG-A-038.
- id: REG-A-022
  topic: procedure
  title: Περιβαλλοντική αδειοδότηση και μέτρα πυρόσβεσης
  requirement: Για την προσθήκη μπαταρίας εφαρμόζονται τα μέτρα πυρόσβεσης των ενοτήτων Στ.1 και Στ.2 του Παραρτήματος Β της απόφασης για τις Πρότυπες Περιβαλλοντικές Δεσμεύσεις μεμονωμένων σταθμών μπαταριών κατηγορίας Β. Η περιβαλλοντική αδειοδότηση του σταθμού τροποποιείται ή ενημερώνεται.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 7 (άρθρο 56 ν. 5261/2025, ΦΕΚ Α' 231/12.12.2025). ΥΑ ΥΠΕΝ/ΔΙΠΑ/103448/7298/25.09.2024 (ΦΕΚ Β' 5628)
    url: https://www.deddie.gr/wp-content/uploads/2026/02/%CE%86%CF%81%CE%B8%CF%81%CE%BF-56-%CF%84%CE%BF%CF%85-%CE%BD.-5261-2025.pdf
    quote: Για την προσθήκη συστημάτων αποθήκευσης σύμφωνα με το παρόν, εφαρμόζονται τα μέτρα πυρόσβεσης των ενοτήτων Στ.1 και Στ.2 του Παραρτήματος Β’ της υπό στοιχεία ΥΠΕΝ/ΔΙΠΑ/103448/7298/25.9.2024 απόφασης του Υπουργού Περιβάλλοντος και Ενέργειας (Β’ 5628)
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα που προσθέτουν μπαταρία κατά το άρθρο 11Γ
  model_impact: Πρόσθετο κόστος εγκατάστασης (πυρανίχνευση, πυρόσβεση, αποστάσεις) και χρόνος για την περιβαλλοντική τροποποίηση. Να μπει ως παράμετρος κόστους ανά έργο.
  suggested_parameter:
    name: fire_safety_capex_eur
    default: άγνωστο, να δοθεί από τον χρήστη ή τον προμηθευτή
    alternatives: []
  notes: Το περιεχόμενο των ενοτήτων Στ.1 και Στ.2 της ΥΑ 103448/7298/2024 δεν διαβάστηκε. Δεν είναι γνωστό αν η προσθήκη αλλάζει την περιβαλλοντική κατάταξη του έργου.
- id: REG-A-023
  topic: other
  title: 'Τεχνικές απαιτήσεις ΔΕΔΔΗΕ: προστασίες, πιστοποιήσεις, απαγόρευση νησιδοποίησης'
  requirement: 'Ο σταθμός με αποθήκευση πρέπει να έχει τις ίδιες προστασίες με το Φ/Β (όρια τάσης και συχνότητας, RoCoF, νησιδοποίηση, ομοπολική τάση). Δεν επιτρέπεται απομονωμένη λειτουργία (off-grid) σε διακοπή του δικτύου. Το σύστημα αποθήκευσης πρέπει να είναι πιστοποιημένο κατά EN 50549-2 ή IEC TS 62786-1 και -3 ή ισοδύναμο. Ο κοινός μετατροπέας πρέπει να πληροί το EN 50549-2. Το Φ/Β πρέπει να πληροί τον Κανονισμό (ΕΕ) 2016/631. Όρια ποιότητας: THD ρεύματος κάτω από 5%, έγχυση συνεχούς κάτω από 0,5% του ονομαστικού ρεύματος.'
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητες 4.4, 6 και 8
    url: https://www.deddie.gr/wp-content/uploads/2026/06/SYNDESI-FOTOVOLTAIKON-STATHMON-SE-SYNDYASMO-ME-APOTHIKEFSI-STO-DIKTYO-MT.pdf
    quote: δεν επιτρέπεται η απομονωμένη (off - grid) λειτουργία του συστήματος αποθήκευσης και του ΦΒ συστήματος, σε περιπτώσεις διακοπών τροφοδότησης από το Δίκτυο.
  date_issued: '2026-06-19'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί Φ/Β με αποθήκευση στο ΕΔΔΗΕ ΜΤ
  model_impact: Περιορίζει τις επιλογές εξοπλισμού (μόνο πιστοποιημένοι μετατροπείς). Η μπαταρία δεν δίνει αξία εφεδρείας σε διακοπή δικτύου. Κόστος πιστοποιήσεων και ρυθμίσεων προστασίας στο CAPEX.
  suggested_parameter:
    name: equipment_certification_required
    default: EN 50549-2 ή IEC TS 62786-1/-3
    alternatives: []
  notes: Το απόσπασμα προέρχεται από κείμενο με ατέλειες εξαγωγής από PDF, τα κενά μέσα σε λέξεις διορθώθηκαν. Το φυλλάδιο δηλώνει ότι υπερισχύει η εκάστοτε νομοθεσία.
- id: REG-A-024
  topic: injection_limit
  title: 'Τηλεποπτεία και τηλεέλεγχος: υποχρέωση για σταθμούς άνω των 400 kW και για σταθμούς με αποθήκευση'
  requirement: Παραγωγοί με σταθμούς ΑΠΕ εγκατεστημένης ισχύος άνω των 400 kW που είναι ή θα συνδεθούν στο ΕΔΔΗΕ εγκαθιστούν με δικές τους δαπάνες τον εξοπλισμό για λήψη και εφαρμογή εντολών τηλεποπτείας και ελέγχου του Διαχειριστή. Αν δεν υποβάλουν υπεύθυνη δήλωση συμμόρφωσης εντός 6 μηνών από τη γνωστοποίηση των απαιτήσεων, ο Διαχειριστής απενεργοποιεί τη σύνδεση. Οι σταθμοί Φ/Β με αποθήκευση πρέπει να ανταλλάσσουν σήματα και μετρήσεις σε πραγματικό χρόνο με το Κέντρο Ελέγχου, με σύστημα και τηλεπικοινωνιακή σύνδεση ευθύνης του ιδιοκτήτη.
  source:
    type: law
    citation: ν. 4951/2022, άρθρο 9Α, όπως προστέθηκε με το άρθρο 111 ν. 5106/2024 (Α' 63). ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητα 7
    url: https://www.taxheaven.gr/law/5106/2024/arthro/111
    quote: εγκαθιστούν με δικές τους δαπάνες, μετά από υπόδειξη και σύμφωνα με τις τεχνικές απαιτήσεις και προδιαγραφές που ανακοινώνει ο Διαχειριστής Ε.Δ.Δ.Η.Ε. ή ο Διαχειριστής Μ.Δ.Ν. κατά περίπτωση, εντός των σταθμών τους, τον αναγκαίο εξοπλισμό για να καταστεί δυνατή η λήψη και εφαρμογή των εντολών τηλεποπτείας και ελέγχου από τον αρμόδιο Διαχειριστή
  date_issued: ''
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Υφιστάμενα και νέα πάρκα άνω των 400 kW στο ΕΔΔΗΕ. Με το φυλλάδιο ΔΕΔΔΗΕ, όλοι οι σταθμοί Φ/Β με αποθήκευση στη ΜΤ
  model_impact: Κόστος εξοπλισμού τηλεελέγχου και επικοινωνιών στο CAPEX και OPEX. Ο τηλεέλεγχος κάνει εφικτές τις περικοπές σε πραγματικό χρόνο, άρα το σενάριο περικοπών αφορά και μικρότερα πάρκα.
  suggested_parameter:
    name: remote_control_required
    default: 'true'
    alternatives: []
  notes: Η ημερομηνία του ΦΕΚ Α' 63/2024 δεν επαληθεύτηκε, γι' αυτό μένει κενή. Ο ακριβής κατάλογος σημάτων καθορίζεται κατά την υπογραφή της Σύμβασης Σύνδεσης. Κατά τον τύπο η προθεσμία για αυτοπαραγωγούς άνω των 400 kW ήταν η 15.09.2026.
- id: REG-A-025
  topic: metering
  title: 'Μετρητικές διατάξεις ΔΕΔΔΗΕ: τρεις μετρητές για 11Α με ενίσχυση, ένας πρόσθετος για 11Β'
  requirement: 'Σταθμός 11Α με Σύμβαση Λειτουργικής Ενίσχυσης ή Πώλησης σε ισχύ: απαιτείται πιστοποιημένος εσωτερικός μετρητής στην έξοδο της μπαταρίας (Μ3, μετρά εγχεόμενη και απορροφώμενη ενέργεια αποθήκευσης) και πιστοποιημένος εσωτερικός μετρητής στην έξοδο του Φ/Β (Μ1), πέρα από τον μετρητή εγκατάστασης στο όριο Δικτύου και Χρήστη (Μ2). Σταθμός 11Α που συμμετέχει απευθείας στην αγορά: δεν απαιτούνται εσωτερικοί μετρητές. Σταθμός 11Β: δεν απαιτούνται Μ1 και Μ3, αλλά απαιτείται πιστοποιημένος εσωτερικός μετρητής στο κύκλωμα των ιδιοκαταναλώσεων.'
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ, Ιούνιος 2026, ενότητες 3.1 και 3.2 (Σχεδιαγράμματα 4 έως 6)
    url: https://www.deddie.gr/wp-content/uploads/2026/06/SYNDESI-FOTOVOLTAIKON-STATHMON-SE-SYNDYASMO-ME-APOTHIKEFSI-STO-DIKTYO-MT.pdf
    quote: Σε αυτή την περίπτωση είναι απαραίτητος πιστοποιημένος εσωτερικός μετρητής στην έξοδο του συστήματος αποθήκευσης (Μετρητής Μ3) και πιστοποιημένος εσωτερικός μετρητής στην έξοδο του ΦΒ συστήματος (Μετρητής Μ1).
  date_issued: '2026-06-19'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί Φ/Β με αποθήκευση στο ΕΔΔΗΕ ΜΤ
  model_impact: 'Κόστος δύο πρόσθετων πιστοποιημένων μετρητών και μετασχηματιστών μέτρησης στο σενάριο 11Α με ενίσχυση. Το μοντέλο πρέπει να κρατά χωριστές ροές: Φ/Β προς δίκτυο (ταρίφα), Φ/Β προς μπαταρία, μπαταρία προς δίκτυο (τιμή αγοράς).'
  suggested_parameter:
    name: extra_certified_meters_11A_with_support
    default: '2'
    alternatives:
    - 0 για 11Α χωρίς ενίσχυση
    - 1 (ιδιοκαταναλώσεις) για 11Β
  notes: Οι εσωτερικοί μετρητές πρέπει να τηρούν τις προδιαγραφές του ΔΕΔΔΗΕ για μετρητές αυτοπαραγωγής στη ΜΤ. Ο ΑΔΜΗΕ ορίζει για το Σύστημα ότι ο μετρητής εξόδου της μπαταρίας πιστοποιείται από Φορέα Ελέγχου και σφραγίζεται από τον ΑΔΜΗΕ. Ο ακριβής τύπος επιμερισμού της ενέργειας στο σημείο σύνδεσης μεταξύ Φ/Β και μπαταρίας (απώλειες, ταυτόχρονη έγχυση) δεν περιγράφεται σε κανένα κείμενο που βρέθηκε.
- id: REG-A-026
  topic: metering
  title: 'Κοινός μετατροπέας (DC coupled) και λειτουργική ενίσχυση: ασαφές'
  requirement: Ο ΔΕΔΔΗΕ δέχεται από 19.01.2026 αιτήματα προσθήκης μπαταρίας μέσω κοινού μετατροπέα. Το Τεχνικό Φυλλάδιο δείχνει μετρητικές διατάξεις για σταθμούς με ενίσχυση μόνο σε τοπολογίες με διακριτούς μετατροπείς (AC coupled, Σχεδιαγράμματα 4 έως 6). Κατά τον τύπο, με κοινό μετατροπέα ο ΔΕΔΔΗΕ θεωρεί ότι χάνεται η λειτουργική ενίσχυση του Φ/Β και όλος ο σταθμός αποζημιώνεται σε τιμές αγοράς, επειδή δεν μπορεί να διακριθεί η ενέργεια του Φ/Β από της μπαταρίας.
  source:
    type: secondary_press
    citation: 'Energypress, «Δυο προτάσεις για την αποθήκευση πίσω από τον μετρητή» (2026, ακριβής ημερομηνία άγνωστη). Συγκριτικά: ΔΕΔΔΗΕ, Τεχνικό Φυλλάδιο ΜΤ ενότητα 3.1'
    url: https://energypress.gr/news/dyo-protaseis-gia-tin-apothikeysi-piso-apo-ton-metriti
    quote: ''
  date_issued: ''
  status: unclear
  confidence: secondary_only
  verified_on: '2026-11-10'
  applies_to: Πάρκα με ενίσχυση που εξετάζουν DC coupled (κοινό ή υβριδικό μετατροπέα)
  model_impact: Το DSS πρέπει να θεωρεί ότι η διατήρηση της ταρίφας απαιτεί AC coupled με χωριστούς μετρητές. Το DC coupled να προσφέρεται μόνο με σενάριο απώλειας ενίσχυσης ή για πάρκα χωρίς ενίσχυση.
  suggested_parameter:
    name: dc_coupling_keeps_operating_aid
    default: 'false'
    alternatives:
    - 'true αν ο ΔΕΔΔΗΕ δεχθεί πιστοποιημένη μέτρηση στην πλευρά DC ή αλλάξει ο νόμος (πρόταση αγοράς: ταρίφα 07:00 έως 19:00, τιμή αγοράς τις λοιπές ώρες)'
  notes: Το άρθρο του Energypress δεν ανοίχτηκε (HTTP 403), το περιεχόμενο προέρχεται από περίληψη μηχανής αναζήτησης, γι' αυτό δεν δίνεται απόσπασμα. Το συμπέρασμα από το φυλλάδιο του ΔΕΔΔΗΕ (έλλειψη διάταξης μέτρησης DC με ενίσχυση) είναι δική μου ανάγνωση, το φυλλάδιο δεν το λέει ρητά. Ο νόμος (παρ. 2) ζητά απλώς διακριτό πιστοποιημένο μετρητή στην έξοδο της μπαταρίας.
- id: REG-A-027
  topic: grid_charging
  title: 'Χρεώσεις στην ενέργεια που απορροφά ο 11Β για φόρτιση: ΕΤΜΕΑΡ και ΥΚΩ μόνο στις ιδιοκαταναλώσεις'
  requirement: 'Για σταθμούς 11Β: το ΕΤΜΕΑΡ υπολογίζεται μόνο στην ενέργεια των ιδιοκαταναλώσεων και όχι στην ενέργεια που απορροφάται για πλήρωση της μπαταρίας και επαναποδίδεται. Οι χρεώσεις ΥΚΩ αφορούν μόνο το τμήμα της ιδιοκατανάλωσης. Οι χρεώσεις χρήσης συστήματος και δικτύου υπολογίζονται αποκλειστικά με βάση την απορροφούμενη ισχύ, στον βαθμό που συμβάλλει στην αιχμή του συστήματος μεταφοράς.'
  source:
    type: law
    citation: ν. 4001/2011 άρθρο 143 παρ. 3 περ. β) υποπερ. βα) (άρθρο 76 ν. 4951/2022) και άρθρο 140 παρ. 2 (άρθρο 74 ν. 4951/2022). ν. 4067/2012 άρθρο 36, όπως τροποποιήθηκε με το άρθρο 52 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026)
    url: https://www.taxheaven.gr/law/4951/2022/arthro/76
    quote: το ειδικό τέλος υπολογίζεται και καταβάλλεται από τους κατόχους των σχετικών αδειών αποκλειστικά για την ενέργεια των ιδιοκαταναλώσεων των σταθμών αυτών, εξαιρουμένης της ενέργειας η οποία απορροφάται προς πλήρωση των αποθηκευτικών συστημάτων και επαναπόδοση στο σύστημα μεταφοράς ή στο δίκτυο διανομής
  date_issued: '2022-07-04'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί 11Β και μεμονωμένοι σταθμοί αποθήκευσης. Δεν αφορά τον 11Α, που δεν φορτίζει από το δίκτυο
  model_impact: Στο σενάριο 11Β το κόστος φόρτισης από το δίκτυο είναι τιμή αγοράς συν χρέωση δικτύου για την ισχύ απορρόφησης σε ώρες αιχμής, χωρίς ΕΤΜΕΑΡ και ΥΚΩ στην ενέργεια κύκλου. Οι απώλειες κύκλου μπορεί να λογίζονται ως ιδιοκατανάλωση, πρέπει να ελεγχθεί.
  suggested_parameter:
    name: grid_charging_levies_on_cycled_energy
    default: ΕΤΜΕΑΡ 0, ΥΚΩ 0, χρέωση δικτύου μόνο για ισχύ απορρόφησης στην αιχμή
    alternatives:
    - πλήρεις χρεώσεις στο τμήμα που λογίζεται ιδιοκατανάλωση (απώλειες, βοηθητικά)
  notes: 'Απόσπασμα για ΥΚΩ (ΦΕΚ Α'' 67/2026): «η υποχρέωση του πρώτου εδαφίου αφορά στο τμήμα της ιδιοκατανάλωσης ηλεκτρικής ενέργειας των σταθμών αυτών». Τα άρθρα 74 και 76 διαβάστηκαν όπως ψηφίστηκαν το 2022. Δεν βρέθηκαν οι μοναδιαίες τιμές ούτε η μεθοδολογία ΡΑΑΕΥ για τη χρέωση ισχύος. Δεν διευκρινίζεται πώς αντιμετωπίζονται οι απώλειες κύκλου.'
- id: REG-A-028
  topic: third_party
  title: 'Μπαταρία τρίτου στο ίδιο σημείο σύνδεσης: επιτρέπεται ως χωριστός σταθμός αποθήκευσης'
  requirement: 'Κάτοχοι Φ/Β που συνδέονται σε κοινό σημείο σύνδεσης μπορούν να ζητήσουν εγκατάσταση σταθμού αποθήκευσης στο σημείο αυτό. Το αίτημα μπορεί να το υποβάλει και κάτοχος ενός μόνο Φ/Β ή κάτοχος άδειας αποθήκευσης (τρίτος), με συμφωνία μεταξύ τους. Όροι: μέγιστη ισχύς απορρόφησης και μέγιστη ισχύς έγχυσης έως το άθροισμα της εγκατεστημένης ισχύος των Φ/Β, ωφέλιμη χωρητικότητα τουλάχιστον 1 ώρα επί το άθροισμα αυτό. Η συνολική έγχυση Φ/Β και μπαταρίας δεν υπερβαίνει τη μέγιστη έγχυση των Φ/Β μετά τους μόνιμους περιορισμούς. Τα Φ/Β μπορούν να εγχέουν πάνω από τα όριά τους αν ισόποση ενέργεια απορροφάται ταυτόχρονα από την μπαταρία, χωρίς αποζημίωση ή ενίσχυση για αυτή την ενέργεια.'
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 5, όπως αντικαταστάθηκε με το άρθρο 57 παρ. 1 ν. 5325/2026 (ΦΕΚ Α' 122/31.07.2026)
    url: https://www.taxheaven.gr/law/5325/2026/arthro/57
    quote: Το αίτημα του πρώτου εδαφίου δύναται να υποβληθεί και από κάτοχο ενός φωτοβολταϊκού σταθμού αλλά και από κάτοχο άδειας αποθήκευσης, προσκομίζοντας σχετική συμφωνία με τον κάτοχο της άδειας αποθήκευσης ηλεκτρικής ενέργειας ή τους κατόχους φωτοβολταϊκών σταθμών, αντίστοιχα, για σύνδεση στο εν λόγω κοινό σημείο
  date_issued: '2026-07-31'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Φ/Β της παρ. 1, Φ/Β αυτοκατανάλωσης και Φ/Β χωρίς ενίσχυση, που έχουν Οριστική Προσφορά από τον ίδιο Διαχειριστή
  model_impact: 'Τρίτο σενάριο για το DSS: ο ιδιοκτήτης δεν αγοράζει μπαταρία, συμφωνεί με επενδυτή αποθήκευσης (ενοίκιο, μερίδιο εσόδων). Η ενέργεια που περνά στην μπαταρία του τρίτου δεν πληρώνεται στο Φ/Β από αγορά ή ενίσχυση, άρα το όφελος του ιδιοκτήτη είναι μόνο ό,τι ορίζει η ιδιωτική συμφωνία.'
  suggested_parameter:
    name: third_party_storage_at_connection_point_allowed
    default: 'true'
    alternatives: []
  notes: Το κείμενο διαβάστηκε σε αναπαραγωγή του ν. 5325/2026 στο taxheaven, ο αριθμός ΦΕΚ προέρχεται από την ίδια πηγή. Αιτήματα προς τον ΑΔΜΗΕ μετά τις 31.07.2026 χάνουν την απόλυτη προτεραιότητα (παρ. 5.δ). Ο νόμος ορίζει μέγιστη ισχύ απορρόφησης αλλά δεν λέει ρητά αν ο σταθμός αυτός μπορεί να φορτίζει και από το δίκτυο. Δημοσίευμα (PowerGame 16.10.2026) τον περιγράφει ως μονάδα που απορροφά αποκλειστικά την παραγωγή των Φ/Β. Αντίφαση που δεν επιλύθηκε. Οι Προσφορές Σύνδεσης μπορούν να έχουν Ειδικούς Όρους για την εκπροσώπηση στην αγορά. Η απόφαση της παρ. 6 μπορεί να ορίσει κυρώσεις, δεν βρέθηκε να έχει εκδοθεί.
- id: REG-A-029
  topic: third_party
  title: 'Μίσθωση μπαταρίας ή γης μέσα σε σταθμό 11Α ή 11Β: δεν ρυθμίζεται ρητά'
  requirement: Ο σταθμός 11Α ή 11Β είναι ένας ενιαίος σταθμός με έναν κάτοχο αδειών και μία σύνδεση. Δεν βρέθηκε διάταξη που να ρυθμίζει ή να απαγορεύει τη χρηματοδοτική μίσθωση της μπαταρίας ή την ιδιοκτησία της από τρίτο μέσα στον σταθμό. Για τον χώρο ζητούνται νομιμοποιητικά έγγραφα δικαιώματος χρήσης όταν η μπαταρία εξαιρούμενου σταθμού εγκαθίσταται σε διαφορετικό χώρο από το Φ/Β.
  source:
    type: deddie_guideline
    citation: ΔΕΔΔΗΕ, ανακοίνωση 19.01.2026 (δικαιολογητικά για εξαιρούμενο σταθμό με μπαταρία σε διαφορετικό χώρο)
    url: https://www.deddie.gr/el/anakoinosi-tou-deddie-schetika-me-tin-ypodochi-aitimaton-gia-prosthiki-monadon-apothikefsis-se-yfistamenous-kai-neous-stathmous-ape-meso-koinou-metatropea/
    quote: Νομιμοποιητικά έγγραφα για την τεκμηρίωση του δικαιώματος χρήσης του χώρου εγκατάστασης του συστήματος αποθήκευσης.
  date_issued: '2026-01-19'
  status: unclear
  confidence: unverified
  verified_on: '2026-11-10'
  applies_to: Όλα τα πάρκα που εξετάζουν μίσθωση εξοπλισμού ή γης
  model_impact: Το DSS μπορεί να μοντελοποιεί τη μίσθωση ως χρηματοδοτικό σχήμα (πληρωμές αντί CAPEX), με ρητή προειδοποίηση ότι η νομική βάση χρειάζεται έλεγχο από δικηγόρο και από τον ΔΑΠΕΕΠ ή την τράπεζα.
  suggested_parameter:
    name: battery_leasing_inside_station_allowed
    default: unknown
    alternatives:
    - true ως χρηματοδοτική μίσθωση εξοπλισμού με κάτοχο αδειών τον παραγωγό (συνήθης πρακτική στα Φ/Β, δεν επιβεβαιώθηκε για μπαταρίες)
    - 'false'
  notes: Το απόσπασμα επιβεβαιώνει μόνο ότι ο χώρος της μπαταρίας μπορεί να διαφέρει από του Φ/Β και να στηρίζεται σε δικαίωμα χρήσης (π.χ. μίσθωση γης). Το ζήτημα της κυριότητας του εξοπλισμού δεν απαντάται σε καμία πηγή. Το όριο αντισυγκέντρωσης 500 MW ανά πρόσωπο έως το 2029 (άρθρο 11Δ παρ. 8 ν. 4685/2020, ν. 5299/2026) μετρά και συμφωνίες εκχώρησης εσόδων, εξαιρεί όμως τους σταθμούς 11Α.
- id: REG-A-030
  topic: btm_storage_addition
  title: Μετάβαση από 11Α σε 11Β επιτρέπεται
  requirement: Σταθμός 11Α μπορεί να μετατραπεί σε 11Β. Τότε εφαρμόζονται τα όρια έγχυσης του 11Β αντί των ορίων της προσφοράς ως 11Α, και αν έχει σύμβαση ενίσχυσης εφαρμόζεται το άρθρο 12Α ν. 4414/2016 (συμμετοχή στην αγορά χωρίς ενίσχυση). Ισχύει το όριο αντισυγκέντρωσης 500 MW.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 6Α (άρθρο 56 ν. 5261/2025, ΦΕΚ Α' 231/12.12.2025)
    url: https://www.deddie.gr/wp-content/uploads/2026/02/%CE%86%CF%81%CE%B8%CF%81%CE%BF-56-%CF%84%CE%BF%CF%85-%CE%BD.-5261-2025.pdf
    quote: Επιτρέπεται η μετατροπή των σταθμών Α.Π.Ε. της παρ. 11Α του άρθρου 10 σε σταθμούς Α.Π.Ε. της παρ. 11Β του άρθρου 10. Στην περίπτωση αυτή εφαρμόζονται οι περιορισμοί έγχυσης της περ. β) της παρ. 5α και δεν καταλαμβάνονται από τους περιορισμούς που τους διείπαν βάσει της σχετικής Οριστικής Προσφοράς Σύνδεσης, ως έργα της παρ. 11Α του άρθρου 10.
  date_issued: '2025-12-12'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί 11Α
  model_impact: 'Δικαίωμα προαίρεσης: ο ιδιοκτήτης μπορεί να ξεκινήσει ως 11Α (με ταρίφα) και να περάσει αργότερα σε 11Β, π.χ. στη λήξη της σύμβασης ενίσχυσης. Το DSS μπορεί να αξιολογεί σενάριο δύο φάσεων.'
  suggested_parameter:
    name: switch_11A_to_11B_allowed
    default: 'true'
    alternatives: []
  notes: Δεν βρέθηκε διάταξη για την αντίστροφη μετάβαση (11Β σε 11Α). Η μετάβαση θέλει νέα τροποποίηση όρων σύνδεσης και, κατά τον ΑΔΜΗΕ, νέα βεβαίωση ηλέκτρισης.
- id: REG-A-031
  topic: eu_law
  title: 'Οδηγία (ΕΕ) 2019/944: ορισμός αποθήκευσης και απαγόρευση διπλών χρεώσεων για ενεργούς πελάτες'
  requirement: Η αποθήκευση ενέργειας ορίζεται ως αναβολή της τελικής χρήσης ηλεκτρικής ενέργειας. Οι ενεργοί πελάτες που έχουν εγκατάσταση αποθήκευσης δικαιούνται σύνδεση σε εύλογο χρόνο, δεν υπόκεινται σε διπλές χρεώσεις (και δικτύου) για αποθηκευμένη ενέργεια που μένει στις εγκαταστάσεις τους ή όταν παρέχουν υπηρεσίες ευελιξίας, ούτε σε δυσανάλογες απαιτήσεις αδειοδότησης.
  source:
    type: eu_directive
    citation: Οδηγία (ΕΕ) 2019/944, άρθρο 2 σημεία 59 και 60, άρθρο 15 παρ. 5 (ενοποιημένη έκδοση 16.07.2024)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02019L0944-20240716
    quote: are not subject to any double charges, including network charges, for stored electricity remaining within their premises or when providing flexibility services to system operators
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Ενεργοί πελάτες με αποθήκευση. Για παραγωγό με Φ/Β πάρκο ισχύει μόνο ως ερμηνευτική αρχή
  model_impact: Στηρίζει την παραδοχή ότι η ενέργεια κύκλου του 11Β δεν φέρει ΕΤΜΕΑΡ και ΥΚΩ. Δεν δημιουργεί από μόνο του δικαίωμα για τον παραγωγό.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Το απόσπασμα δίνεται στα αγγλικά από το EUR-Lex. Το άρθρο 15 παρ. 5 αφορά ενεργούς πελάτες, όχι ρητά παραγωγούς ΑΠΕ με ενίσχυση. Η ελληνική ενσωμάτωση (ν. 4986/2022, ν. 5037/2023) δεν ελέγχθηκε άρθρο προς άρθρο.
- id: REG-A-032
  topic: eu_law
  title: 'Οδηγία (ΕΕ) 2024/1711: ευέλικτες συμφωνίες σύνδεσης (νέο άρθρο 6α της Οδηγίας 2019/944)'
  requirement: 'Η ρυθμιστική αρχή αναπτύσσει πλαίσιο ώστε οι διαχειριστές να προσφέρουν ευέλικτες συμφωνίες σύνδεσης σε περιοχές με περιορισμένη ή μηδενική χωρητικότητα. Οι ευέλικτες συνδέσεις δεν καθυστερούν τις ενισχύσεις δικτύου, μετατρέπονται σε σταθερές όταν αναπτυχθεί το δίκτυο, και μπορούν να είναι μόνιμη λύση, και για αποθήκευση. Ο χρήστης εγκαθιστά πιστοποιημένο σύστημα ελέγχου ισχύος. Προθεσμία ενσωμάτωσης: 17.01.2025.'
  source:
    type: eu_directive
    citation: Οδηγία (ΕΕ) 2024/1711, άρθρο 2 σημείο 3 (νέο άρθρο 6α της Οδηγίας 2019/944) και άρθρο 3 παρ. 1
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401711
    quote: The system user connecting through a flexible grid connection shall be required to install a power control system that is certified by an authorised certifier.
  date_issued: '2024-06-13'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλες οι νέες ή τροποποιούμενες συνδέσεις, όταν η Ελλάδα θεσπίσει το πλαίσιο
  model_impact: Σήμερα δεν αλλάζει το μοντέλο. Μελλοντικά μπορεί να επιτρέψει σύνδεση μπαταρίας με ευέλικτη (μη εγγυημένη) ισχύ έγχυσης και απορρόφησης ανά χρονική ζώνη.
  suggested_parameter:
    name: flexible_connection_available
    default: 'false'
    alternatives:
    - true μετά τη θέσπιση του ελληνικού πλαισίου (βλ. REG-A-037)
  notes: Η Ελλάδα δεν είχε ενσωματώσει το άρθρο 6α έως τις 10.11.2026. Το νομοσχέδιο ενσωμάτωσης συζητείται στην Ολομέλεια (βλ. REG-A-037). Σήμερα τη λειτουργία αυτή καλύπτουν μερικώς οι ειδικοί όροι περιορισμών έγχυσης του άρθρου 10 ν. 4951/2022.
- id: REG-A-033
  topic: eu_law
  title: 'Κανονισμός (ΕΕ) 2019/943: οι χρεώσεις δικτύου δεν κάνουν διακρίσεις κατά της αποθήκευσης'
  requirement: Οι χρεώσεις δικτύου δεν εισάγουν θετικές ή αρνητικές διακρίσεις κατά της αποθήκευσης ενέργειας. Οι μεθοδολογίες τιμολόγησης στηρίζουν τη χρήση υπηρεσιών ευελιξίας και επιτρέπουν ευέλικτες συνδέσεις.
  source:
    type: eu_regulation
    citation: Κανονισμός (ΕΕ) 2019/943, άρθρο 18 παρ. 1 και παρ. 2, όπως τροποποιήθηκε με τον Κανονισμό (ΕΕ) 2024/1747 (ενοποιημένη έκδοση 16.07.2024)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02019R0943-20240716
    quote: The network charges shall not discriminate either positively or negatively against energy storage or aggregation and shall not create disincentives for self-generation, self-consumption or for participation in demand response.
  date_issued: '2019-06-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλοι οι σταθμοί αποθήκευσης και οι σταθμοί 11Β
  model_impact: Ερμηνευτικό όριο για τις χρεώσεις δικτύου στη φόρτιση από το δίκτυο. Δεν δίνει αριθμητική τιμή.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Άμεσης εφαρμογής ως Κανονισμός. Το άρθρο 50 παρ. 4α (δημοσίευση διαθέσιμης χωρητικότητας) δεν διαβάστηκε.
- id: REG-A-034
  topic: eu_law
  title: 'RED III (Οδηγία (ΕΕ) 2023/2413): συντοπισμένη αποθήκευση ενέργειας'
  requirement: Η Οδηγία ορίζει τη συντοπισμένη αποθήκευση ως εγκατάσταση αποθήκευσης συνδυασμένη με εγκατάσταση παραγωγής ΑΠΕ και συνδεδεμένη στο ίδιο σημείο πρόσβασης στο δίκτυο. Την εντάσσει στις ταχείες διαδικασίες αδειοδότησης των ΑΠΕ και ζητά από τα κράτη μέλη να αντιμετωπίζουν τα εμπόδια της. Η Ελλάδα μετέφερε τον ορισμό με τον ν. 5299/2026.
  source:
    type: eu_directive
    citation: 'Οδηγία (ΕΕ) 2023/2413, άρθρο 1 (νέο σημείο 44δ στο άρθρο 2, άρθρα 3 παρ. 4α, 16, 16α, 16β, 16δ της Οδηγίας 2018/2001). Ελληνική ενσωμάτωση: ν. 5299/2026 (ΦΕΚ Α'' 67/05.05.2026), νέα περ. 32ξε στους ορισμούς του ν. 3468/2006'
    url: https://www.karagilanis.gr/files/nomos_5299_2026_fek67A20260505.pdf
    quote: 'Συντοπισμένη αποθήκευση ενέργειας: εγκατάσταση αποθήκευσης ενέργειας, συνδυασμένη με εγκατάσταση παραγωγής ενέργειας από ανανεώσιμες πηγές και συνδεδεμένη με το ίδιο σημείο πρόσβασης στο δίκτυο.'
  date_issued: '2026-05-05'
  status: in_force
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Όλα τα έργα ΑΠΕ με μπαταρία στο ίδιο σημείο σύνδεσης
  model_impact: Δεν αλλάζει άμεσα παράμετρο. Στηρίζει την προσδοκία σύντομων προθεσμιών αδειοδότησης, που όμως δεν έχουν μετατραπεί σε δεσμευτικό χρόνο απάντησης των Διαχειριστών για την προσθήκη μπαταρίας.
  suggested_parameter:
    name: ''
    default: ''
    alternatives: []
  notes: Το απόσπασμα είναι από το ΦΕΚ Α' 67/2026 (αντίγραφο σε ιδιωτικό ιστότοπο). Ο ακριβής αριθμός άρθρου του ν. 5299/2026 που προσθέτει την περ. 32ξε δεν καταγράφηκε. Οι προθεσμίες αδειοδότησης της RED III για συντοπισμένη αποθήκευση (π.χ. 6 μήνες σε περιοχές επιτάχυνσης) δεν ελέγχθηκαν στο ελληνικό κείμενο.
- id: REG-A-035
  topic: pending_change
  title: Εκκρεμεί ειδική απόφαση για όρια έγχυσης μπαταριών και σταθμών 11Β στο ΕΔΔΗΕ
  requirement: Τα ωριαία όρια έγχυσης του 11Β (πίνακας της ΥΑ 53563/1556/2023 για το ΕΣΜΗΕ) εφαρμόζονται προσωρινά, μέχρι να θεσπιστούν ειδικότεροι περιορισμοί με απόφαση του Υπουργού κατά το άρθρο 10 παρ. 5 ν. 4951/2022 για σταθμούς αποθήκευσης και σταθμούς 11Β που συνδέονται στο ΕΔΔΗΕ. Ο ΑΔΜΗΕ επιβεβαιώνει ότι λείπει υπουργική απόφαση που να ρυθμίζει γενικά τους στατικούς περιορισμούς των έργων 11Α και 11Β.
  source:
    type: law
    citation: ν. 4685/2020, άρθρο 11Γ παρ. 5.α περ. β), όπως τροποποιήθηκε με το άρθρο 56 παρ. 2 ν. 5299/2026 (ΦΕΚ Α' 67/05.05.2026). ΑΔΜΗΕ, έγγραφο 22.07.2026, Πίνακας 2
    url: https://www.taxheaven.gr/law/5299/2026/arthro/56
    quote: μέχρι τη θέσπιση ειδικότερων περιορισμών βάσει της απόφασης του Υπουργού Περιβάλλοντος και Ενέργειας της παρ. 5 του άρθρου 10 του ν. 4951/2022, περί περιορισμών έγχυσης για σταθμούς αποθήκευσης ηλεκτρικής ενέργειας και σταθμούς της παρ. 11Β του άρθρου 10 του παρόντος που συνδέονται στο Ε.Δ.Δ.Η.Ε.
  date_issued: '2026-05-05'
  status: pending
  confidence: primary_verified
  verified_on: '2026-11-10'
  applies_to: Σταθμοί 11Β στο ΕΔΔΗΕ. Πιθανώς και 11Α αν η απόφαση καλύψει και αυτούς
  model_impact: Το προφίλ ορίων του 11Β μπορεί να αλλάξει. Το DSS πρέπει να κρατά το προφίλ ως παράμετρο με ημερομηνία ισχύος και όχι ως σταθερά κώδικα.
  suggested_parameter:
    name: export_cap_profile_11B_valid_until
    default: έως την έκδοση της απόφασης του άρθρου 10 παρ. 5 ν. 4951/2022 (άγνωστη ημερομηνία)
    alternatives: []
  notes: 'Απόσπασμα ΑΔΜΗΕ: «Ελλείψει υπουργικής απόφασης (του άρθρου 10 παρ. 5 του ν. 4951/2022) που να ρυθμίζει τους στατικούς για τα έργα του άρθρου 10 παρ. 11Α και παρ. 11Β». Δεν βρέθηκε σχέδιο της απόφασης ούτε χρονοδιάγραμμα. Παλαιότερο δημοσίευμα αναφέρει εισήγηση του ΑΔΜΗΕ για στατικούς περιορισμούς έργων ΑΠΕ με μπαταρίες, δεν ανοίχτηκε.'
- id: REG-A-036
  topic: pending_change
  title: 'Πρακτικές οδηγίες ΔΕΔΔΗΕ: εκδόθηκε φυλλάδιο για τη ΜΤ, η αγορά περιμένει περισσότερα'
  requirement: Ο ΔΕΔΔΗΕ δημοσίευσε τον Ιούνιο 2026 Τεχνικό Φυλλάδιο για σύνδεση Φ/Β με αποθήκευση στο Δίκτυο ΜΤ (κατηγορίες, τοπολογίες, μετρητές, μελέτη σύνδεσης, προστασίες, πιστοποιήσεις). Δημοσίευμα της 25.07.2026 αναφέρει ότι οι επενδυτές περιμένουν ακόμη πρακτικές οδηγίες του ΔΕΔΔΗΕ για τεχνικές και διαδικαστικές λεπτομέρειες εγκατάστασης και λειτουργίας.
  source:
    type: secondary_press
