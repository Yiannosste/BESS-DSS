# Decision Log. Ίδιες στήλες με το Decision Log του Notion:
# απόφαση, stage, επιλογές που εξετάστηκαν, τι επιλέχθηκε και γιατί, κατάσταση, ημερομηνία.
# Κάθε εγγραφή γράφεται τη στιγμή που παίρνεται η απόφαση. Κατάσταση: Πρόταση | Αποφασίστηκε | Αντικαταστάθηκε.
- id: D-001
  decision: "Οργάνωση του shadow run: ένας κύριος agent και παράλληλη έρευνα ανά τομέα"
  stage: "Stage 0"
  options:
    - "Όλα σειριακά από έναν agent"
    - "Παράλληλοι ερευνητές ανά τομέα (ρυθμιστικό Α, ρυθμιστικό Β, δεδομένα, καινοτομία, οικονομικά/μπαταρία/εργαλεία) και ο κύριος agent χτίζει τον κινητήρα"
  chosen: "Παράλληλη έρευνα. Μιμείται τους 6 τομείς των ομάδων και δείχνει ποια κομμάτια είναι πραγματικά ανεξάρτητα. Ο κώδικας του πυρήνα γράφεται από έναν, για να μείνουν συνεπή τα interfaces."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-002
  decision: "Τα registers (αποφάσεις, δυσκολίες, ρυθμιστικό, υποθέσεις, δεδομένα, καινοτομία) είναι αρχεία YAML και τα έγγραφα παράγονται από αυτά"
  stage: "Stage 2"
  options:
    - "Χειρόγραφα markdown"
    - "YAML ως μοναδική πηγή αλήθειας, markdown που παράγεται με script"
    - "Notion (απαγορεύεται στο shadow run)"
  chosen: "YAML. Ο κώδικας διαβάζει τις ίδιες τιμές που βλέπει ο αναγνώστης, άρα κάθε νούμερο έχει πηγή. Το CI ελέγχει ότι κάθε κανόνας και κάθε υπόθεση που χρησιμοποιεί ο κώδικας υπάρχει στο register."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-003
  decision: "Γλώσσα και βασικές βιβλιοθήκες: Python, numpy/pandas, HiGHS για βελτιστοποίηση"
  stage: "Stage 2"
  options:
    - "Python με HiGHS (open source, MIT)"
    - "Julia/JuMP (ταχύτερο, αλλά οι ομάδες δεν το ξέρουν)"
    - "Εμπορικός solver (Gurobi/CPLEX): αποκλείεται για open-source εργαλείο"
    - "Excel: δεν αντέχει 15λεπτα x έτη x σενάρια"
  chosen: "Python με HiGHS. Το ξέρουν οι ομάδες, είναι δωρεάν και αρκετά γρήγορο (βλ. D-004)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-004
  decision: "Κινητήρας λειτουργίας: δικό μας LP με HiGHS και επαναχρησιμοποίηση του μοντέλου"
  stage: "Stage 2"
  options:
    - "Κανόνες (φόρτισε το μεσημέρι, εκφόρτισε το βράδυ): γρήγορο, αλλά υποεκτιμά και δεν βλέπει περικοπές"
    - "PySAM dispatch: έτοιμο, αλλά δεν ξέρει κοινό όριο έγχυσης με εντολές περικοπής ούτε ελληνικούς κανόνες αποζημίωσης"
    - "Δυναμικός προγραμματισμός σε πλέγμα SoC"
    - "LP ανά ημέρα με HiGHS"
  chosen: "LP με HiGHS. Μέτρηση: 0,33 ms ανά ημέρα 15λέπτου όταν το μοντέλο χτίζεται μία φορά και αλλάζουν μόνο κόστη και όρια, έναντι 3,4 ms με scipy.linprog. Ένα έτος λύνεται σε κλάσμα του δευτερολέπτου, άρα δεν χρειάζεται να κόψουμε σενάρια. Τα duals δίνουν δωρεάν την οριακή αξία ισχύος και χωρητικότητας. Οι κανόνες και το PySAM μένουν ως benchmarks."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-005
  decision: "Μία ενιαία διατύπωση για AC-coupled και DC-coupled"
  stage: "Stage 3"
  options:
    - "Δύο ξεχωριστά μοντέλα"
    - "Ένα μοντέλο με συντελεστές (a_e, k) που αλλάζουν ανά τοπολογία"
  chosen: "Ένα μοντέλο. Λιγότερος κώδικας, ίδια tests. Στο DC η ενέργεια πάνω από το όριο του inverter μπορεί να αποθηκευτεί (clipping recapture), στο AC χάνεται."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-006
  decision: "Ταυτόχρονη φόρτιση και εκφόρτιση: έλεγχος μετά τη λύση και MILP μόνο όπου χρειάζεται"
  stage: "Stage 3"
  options:
    - "Αγνόηση του προβλήματος (το LP 'καίει' ενέργεια όταν πληρώνεται να απορροφά)"
    - "Δυαδικές μεταβλητές παντού (αργό)"
    - "LP με περιορισμό c + d <= P, έλεγχος, και MILP μόνο στις ημέρες που βρέθηκε παραβίαση"
  chosen: "Η τρίτη επιλογή. Η παραβίαση συμφέρει μόνο όταν το κόστος απορρόφησης από το δίκτυο είναι αρνητικό, άρα είναι σπάνια. Υπάρχει test που το αποδεικνύει."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-007
  decision: "Παραγωγή ΦΒ: PVGIS ωριαία 2005 έως 2023, μετατροπή σε 15λεπτο με παρεμβολή που διατηρεί την ενέργεια"
  stage: "Stage 1"
  options:
    - "Ένα τυπικό έτος (TMY): δεν δίνει κακό χρόνο"
    - "PVGIS πολλά έτη, ωριαία"
    - "ERA5 και δικό μας μοντέλο ΦΒ (pvlib): περισσότερη δουλειά, ίδια βασικά δεδομένα"
    - "Μετρήσεις πάρκων: δεν υπάρχουν δημόσια"
  chosen: "PVGIS πολλά έτη. Είναι μοντελοποιημένη παραγωγή και το λέμε καθαρά. Αν ο ιδιοκτήτης δώσει μετρήσεις, το εργαλείο βαθμονομεί το PVGIS πάνω τους. Η παρεμβολή σε 15λεπτο δεν προσθέτει πραγματική μεταβλητότητα από σύννεφα (βλ. δυσκολία DIF-004)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-008
  decision: "Οικονομικό μοντέλο: σενάρια σε πραγματικές τιμές έτους βάσης, ταμειακές ροές σε ονομαστικές, επένδυση ως διαφορά (με μπαταρία μείον χωρίς)"
  stage: "Stage 2"
  options:
    - "Όλα σε πραγματικές τιμές (απλό, αλλά φόρος και δάνειο είναι ονομαστικά μεγέθη)"
    - "Όλα σε ονομαστικές με ρητό δείκτη πληθωρισμού"
    - "Τα οικονομικά του PySAM (Single Owner): φτιαγμένα για ΗΠΑ (ITC, MACRS)"
  chosen: "Ονομαστικές ροές με ρητό πληθωρισμό και ονομαστικό επιτόκιο προεξόφλησης. Υπάρχει test που δείχνει ότι πραγματικός και ονομαστικός υπολογισμός δίνουν το ίδιο NPV. Η αξία της μπαταρίας μετριέται πάντα ως διαφορά από το πάρκο χωρίς μπαταρία."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-009
  decision: "GitHub αντί για GitLab, χωρίς issues και merge requests με review"
  stage: "Stage 3"
  options:
    - "GitLab όπως οι ομάδες"
    - "GitHub repository που δόθηκε, με CI σε GitHub Actions και πίνακα ιχνηλασιμότητας requirements μέσα στο repo"
  chosen: "GitHub, γιατί εκεί ζητήθηκε να ζει η δουλειά. Τα requirements δεν γίνονται issues αλλά πίνακας στο repo που δένει κάθε REQ με το test του. Review από δεύτερο άνθρωπο δεν υπάρχει στο shadow run (βλ. DIF-007)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
