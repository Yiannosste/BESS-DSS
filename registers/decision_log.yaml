# Decision Log. Ίδιες στήλες με το Decision Log του Notion:
# απόφαση, stage, επιλογές που εξετάστηκαν, τι επιλέχθηκε και γιατί, κατάσταση, ημερομηνία.
# Κάθε εγγραφή γράφεται τη στιγμή που παίρνεται η απόφαση. Κατάσταση: Πρόταση | Αποφασίστηκε | Αντικαταστάθηκε.
- id: D-001
  decision: "Οργάνωση του shadow run: ένας κύριος agent και παράλληλη έρευνα ανά τομέα"
  stage: "Stage 0"
  options:
    - "Όλα σειριακά από έναν agent"
    - "Παράλληλοι ερευνητές ανά τομέα (ρυθμιστικό Α, ρυθμιστικό Β, δεδομένα, καινοτομία, οικονομικά/μπαταρία/εργαλεία) και ο κύριος agent χτίζει τον κινητήρα"
  chosen: "Παράλληλη έρευνα. Μιμείται τους 6 τομείς των ομάδων και δείχνει ποια κομμάτια είναι πραγματικά ανεξάρτητα. Ο κώδικας του πυρήνα γράφεται από έναν, για να μείνουν συνεπή τα interfaces."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-002
  decision: "Τα registers (αποφάσεις, δυσκολίες, ρυθμιστικό, υποθέσεις, δεδομένα, καινοτομία) είναι αρχεία YAML και τα έγγραφα παράγονται από αυτά"
  stage: "Stage 2"
  options:
    - "Χειρόγραφα markdown"
    - "YAML ως μοναδική πηγή αλήθειας, markdown που παράγεται με script"
    - "Notion (απαγορεύεται στο shadow run)"
  chosen: "YAML. Ο κώδικας διαβάζει τις ίδιες τιμές που βλέπει ο αναγνώστης, άρα κάθε νούμερο έχει πηγή. Το CI ελέγχει ότι κάθε κανόνας και κάθε υπόθεση που χρησιμοποιεί ο κώδικας υπάρχει στο register."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-003
  decision: "Γλώσσα και βασικές βιβλιοθήκες: Python, numpy/pandas, HiGHS για βελτιστοποίηση"
  stage: "Stage 2"
  options:
    - "Python με HiGHS (open source, MIT)"
    - "Julia/JuMP (ταχύτερο, αλλά οι ομάδες δεν το ξέρουν)"
    - "Εμπορικός solver (Gurobi/CPLEX): αποκλείεται για open-source εργαλείο"
    - "Excel: δεν αντέχει 15λεπτα x έτη x σενάρια"
  chosen: "Python με HiGHS. Το ξέρουν οι ομάδες, είναι δωρεάν και αρκετά γρήγορο (βλ. D-004)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-004
  decision: "Κινητήρας λειτουργίας: δικό μας LP με HiGHS και επαναχρησιμοποίηση του μοντέλου"
  stage: "Stage 2"
  options:
    - "Κανόνες (φόρτισε το μεσημέρι, εκφόρτισε το βράδυ): γρήγορο, αλλά υποεκτιμά και δεν βλέπει περικοπές"
    - "PySAM dispatch: έτοιμο, αλλά δεν ξέρει κοινό όριο έγχυσης με εντολές περικοπής ούτε ελληνικούς κανόνες αποζημίωσης"
    - "Δυναμικός προγραμματισμός σε πλέγμα SoC"
    - "LP ανά ημέρα με HiGHS"
  chosen: "LP με HiGHS. Μέτρηση: 0,33 ms ανά ημέρα 15λέπτου όταν το μοντέλο χτίζεται μία φορά και αλλάζουν μόνο κόστη και όρια, έναντι 3,4 ms με scipy.linprog. Ένα έτος λύνεται σε κλάσμα του δευτερολέπτου, άρα δεν χρειάζεται να κόψουμε σενάρια. Τα duals δίνουν δωρεάν την οριακή αξία ισχύος και χωρητικότητας. Οι κανόνες και το PySAM μένουν ως benchmarks."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-005
  decision: "Μία ενιαία διατύπωση για AC-coupled και DC-coupled"
  stage: "Stage 3"
  options:
    - "Δύο ξεχωριστά μοντέλα"
    - "Ένα μοντέλο με συντελεστές (a_e, k) που αλλάζουν ανά τοπολογία"
  chosen: "Ένα μοντέλο. Λιγότερος κώδικας, ίδια tests. Στο DC η ενέργεια πάνω από το όριο του inverter μπορεί να αποθηκευτεί (clipping recapture), στο AC χάνεται."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-006
  decision: "Ταυτόχρονη φόρτιση και εκφόρτιση: έλεγχος μετά τη λύση και MILP μόνο όπου χρειάζεται"
  stage: "Stage 3"
  options:
    - "Αγνόηση του προβλήματος (το LP 'καίει' ενέργεια όταν πληρώνεται να απορροφά)"
    - "Δυαδικές μεταβλητές παντού (αργό)"
    - "LP με περιορισμό c + d <= P, έλεγχος, και MILP μόνο στις ημέρες που βρέθηκε παραβίαση"
  chosen: "Η τρίτη επιλογή. Η παραβίαση συμφέρει μόνο όταν το κόστος απορρόφησης από το δίκτυο είναι αρνητικό, άρα είναι σπάνια. Υπάρχει test που το αποδεικνύει."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-007
  decision: "Παραγωγή ΦΒ: PVGIS ωριαία 2005 έως 2023, μετατροπή σε 15λεπτο με παρεμβολή που διατηρεί την ενέργεια"
  stage: "Stage 1"
  options:
    - "Ένα τυπικό έτος (TMY): δεν δίνει κακό χρόνο"
    - "PVGIS πολλά έτη, ωριαία"
    - "ERA5 και δικό μας μοντέλο ΦΒ (pvlib): περισσότερη δουλειά, ίδια βασικά δεδομένα"
    - "Μετρήσεις πάρκων: δεν υπάρχουν δημόσια"
  chosen: "PVGIS πολλά έτη. Είναι μοντελοποιημένη παραγωγή και το λέμε καθαρά. Αν ο ιδιοκτήτης δώσει μετρήσεις, το εργαλείο βαθμονομεί το PVGIS πάνω τους. Η παρεμβολή σε 15λεπτο δεν προσθέτει πραγματική μεταβλητότητα από σύννεφα (βλ. δυσκολία DIF-004)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-008
  decision: "Οικονομικό μοντέλο: σενάρια σε πραγματικές τιμές έτους βάσης, ταμειακές ροές σε ονομαστικές, επένδυση ως διαφορά (με μπαταρία μείον χωρίς)"
  stage: "Stage 2"
  options:
    - "Όλα σε πραγματικές τιμές (απλό, αλλά φόρος και δάνειο είναι ονομαστικά μεγέθη)"
    - "Όλα σε ονομαστικές με ρητό δείκτη πληθωρισμού"
    - "Τα οικονομικά του PySAM (Single Owner): φτιαγμένα για ΗΠΑ (ITC, MACRS)"
  chosen: "Ονομαστικές ροές με ρητό πληθωρισμό και ονομαστικό επιτόκιο προεξόφλησης. Υπάρχει test που δείχνει ότι πραγματικός και ονομαστικός υπολογισμός δίνουν το ίδιο NPV. Η αξία της μπαταρίας μετριέται πάντα ως διαφορά από το πάρκο χωρίς μπαταρία."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-009
  decision: "GitHub αντί για GitLab, χωρίς issues και merge requests με review"
  stage: "Stage 3"
  options:
    - "GitLab όπως οι ομάδες"
    - "GitHub repository που δόθηκε, με CI σε GitHub Actions και πίνακα ιχνηλασιμότητας requirements μέσα στο repo"
  chosen: "GitHub, γιατί εκεί ζητήθηκε να ζει η δουλειά. Τα requirements δεν γίνονται issues αλλά πίνακας στο repo που δένει κάθε REQ με το test του. Review από δεύτερο άνθρωπο δεν υπάρχει στο shadow run (βλ. DIF-007)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-010
  decision: "Ανακατασκευή της δυνητικής (πριν τις περικοπές) παραγωγής ΦΒ της χώρας από ακτινοβολία NASA POWER"
  stage: "Stage 2"
  options:
    - "Χρήση της δημοσιευμένης παραγωγής ΦΒ (ENTSO-E) ως έχει: είναι μετά τις περικοπές, άρα κρύβει το πλεόνασμα"
    - "PVGIS: σταματά στο 2023, ενώ οι μηδενικές τιμές απογειώθηκαν 2024 έως 2026"
    - "Open-Meteo: το ημερήσιο όριο κλήσεων είχε εξαντληθεί"
    - "NASA POWER ωριαία ακτινοβολία 2015 έως 2026 και παλινδρόμηση στις ώρες χωρίς περικοπή (τιμή πάνω από 5 ευρώ/MWh)"
  chosen: "NASA POWER με μοντέλο solar = c[μήνας] x beta[μήνας έτους, ώρα] x GHI. R2 0,976 στις ώρες χωρίς περικοπή. Δίνει εκτίμηση κρυμμένης περικοπής ΦΒ 0,17 TWh (2024), 0,62 TWh (2025), 0,99 TWh (Ιαν έως Αυγ 2026). Είναι κάτω όριο (βλ. DIF-012)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-011
  decision: "Μοντέλο τιμών: επιφάνεια υπό συνθήκη ποσοστημορίων με αναδειγματοληψία ημερών βαθμίδων (CQR-rank)"
  stage: "Stage 2"
  options:
    - "Επανάληψη ιστορικών τιμών: δεν αλλάζει όταν μπαίνουν ΦΒ και μπαταρίες"
    - "Μία μέση καμπύλη τιμής ως προς το υπολειπόμενο φορτίο: σωστή μέση τιμή, αλλά μόνο το 75 έως 80% της πραγματικής ημερήσιας διαφοράς και ποτέ μηδενική τιμή"
    - "Gradient boosting με ramps και ημερήσια χαρακτηριστικά: καλύτερο εντός δείγματος, ασταθές εκτός δείγματος (TB4 2026: 144 έναντι 136, 2025: 99 έναντι 129)"
    - "Λανθάνουσα οριζόντια μετατόπιση της καμπύλης: εκρηκτικές τιμές στο πάνω άκρο (TB4 P90 322 έναντι 187)"
    - "Υπό συνθήκη ποσοστημόρια Q(u|z) και ημέρες βαθμίδων u από το ιστορικό"
  chosen: "CQR-rank. Εντός δείγματος 2025 έως 2026 αναπαράγει μέση τιμή (102,8 έναντι 102,0), ημερήσια διαφορά TB4 (138 έναντι 132) και ώρες μηδενικής τιμής (1412 έναντι 1303). Η δομική αλλαγή μπαίνει μέσα από το z (δυνητικό υπολειπόμενο φορτίο). Το σφάλμα μεταφοράς από έτος σε έτος στη διαφορά τιμών είναι 25 έως 30% και μπαίνει ρητά ως αβεβαιότητα (DIF-008)."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-012
  decision: "Ο στόλος αποθήκευσης της χώρας κατανέμεται με LP σχεδιαστή πάνω στην αναμενόμενη καμπύλη τιμής, και η ισχύς του μπορεί να είναι ενδογενής (ισορροπία ελεύθερης εισόδου)"
  stage: "Stage 2"
  options:
    - "Εξωγενής συμπίεση της διαφοράς τιμών με έναν συντελεστή ανά έτος"
    - "Ευρετική εξομάλυνση φορτίου (peak shaving)"
    - "LP σχεδιαστή: ελαχιστοποίηση του ολοκληρώματος της καμπύλης τιμής, ισοδύναμο με ανταγωνιστική ισορροπία πολλών μικρών μπαταριών"
  chosen: "LP σχεδιαστή (0,5 ms ανά ημέρα). Η ανάδραση «περισσότερες μπαταρίες, μικρότερη διαφορά» υπολογίζεται και δεν υποτίθεται. Πάνω από το δεσμευμένο κατώφλι, η ισχύς μπαταριών βρίσκεται με διχοτόμηση: μπαίνουν νέες όσο η οριακή κερδίζει το ετήσιο κόστος της."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-013
  decision: "Καιρικά έτη 2015 έως 2023, ολόκληρα: φορτίο, αιολικά και ΦΒ της ίδιας χρονιάς μαζί με την παραγωγή του πάρκου"
  stage: "Stage 2"
  options:
    - "Τυχαία ανάμιξη καιρού, τιμών και περικοπών από διαφορετικές χρονιές: λάθος P90"
    - "Ολόκληρα ιστορικά έτη 2015 έως 2023 (τομή PVGIS και δεδομένων συστήματος)"
    - "Συνθετική γεννήτρια καιρού: περισσότερα έτη, αλλά δεν επικυρώνεται εύκολα"
  chosen: "Ολόκληρα έτη. Εννέα έτη είναι λίγα για καθαρό P90, γι' αυτό το P90 της ετήσιας παραγωγής ελέγχεται και με τα 19 έτη του PVGIS."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-014
  decision: "Οι νομικές κατηγορίες σταθμού 11Α και 11Β είναι επιλογές που αξιολογεί το εργαλείο, όχι σταθερή υπόθεση"
  stage: "Stage 1"
  options:
    - "Ένας διακόπτης «φόρτιση από το δίκτυο ναι/όχι»"
    - "Πλήρης μοντελοποίηση των δύο κατηγοριών του άρθρου 11Γ ν. 4685/2020: 11Α (κρατά την ενίσχυση, φορτίζει μόνο από το ΦΒ, όριο έγχυσης 07:00 έως 19:00) και 11Β (φορτίζει και από το δίκτυο, χάνει την ενίσχυση, μηδενική έγχυση 11:00 έως 15:00)"
  chosen: "Πλήρης μοντελοποίηση. Η μετατροπή σε 11Α δεν είναι δωρεάν: το πάρκο αποκτά όριο έγχυσης 60% τη μέρα και η ενέργεια της μπαταρίας πληρώνεται σε τιμή αγοράς. Το εργαλείο συγκρίνει «χωρίς μπαταρία», 11Α και 11Β."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-015
  decision: "Μοντέλο φθοράς: NREL BLAST-Lite LFP 250 Ah με τους δημοσιευμένους συντελεστές"
  stage: "Stage 2"
  options:
    - "Γραμμικό: σταθερή απώλεια ανά έτος και ανά κύκλο (baseline)"
    - "Naumann 2018/2020 (κυψέλη Sony 3 Ah): τα άρθρα πίσω από συνδρομή, μικρή κυψέλη"
    - "BLAST-Lite Lfp_Gr_250AhPrismatic (ανοιχτός κώδικας BSD-3, μεγάλη πρισματική κυψέλη όπως στα containers)"
  chosen: "BLAST-Lite. Οι συντελεστές διαβάστηκαν από τον κώδικα του NREL και η υλοποίησή μας αναπαράγει τα σημεία ελέγχου (77,5% στα 20 έτη με 1 κύκλο τη μέρα). Οι συντελεστές που είχα γράψει αρχικά από μνήμη για το Naumann αφαιρέθηκαν (DIF-011). Το γραμμικό μένει ως baseline για σύγκριση."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-016
  decision: "«Εγκατεστημένη ισχύς ΦΒ» για το όριο 60% και την ελάχιστη χωρητικότητα: προεπιλογή η ισχύς πλαισίων (kWp), ρυθμιζόμενη"
  stage: "Stage 1"
  options:
    - "Ισχύς πλαισίων (DC, kWp)"
    - "Ισχύς μετατροπέων (AC)"
    - "Μέγιστη ισχύς έγχυσης"
  chosen: "Ισχύς πλαισίων ως προεπιλογή, γιατί ο νόμος ξεχωρίζει «εγκατεστημένη ισχύ» από «μέγιστη ισχύ παραγωγής». Το άρθρο 10 ν. 4685/2020 δεν ορίζει τον όρο και παραπέμπει στον ν. 3468/2006, που δεν διαβάστηκε. Μένει ρύθμιση και το αποτέλεσμα δείχνεται και με τις άλλες αναγνώσεις."
  status: "Πρόταση"
  date: "2026-11-11"
