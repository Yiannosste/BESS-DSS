  chosen: "NASA POWER με μοντέλο solar = c[μήνας] x beta[μήνας έτους, ώρα] x GHI. R2 0,976 στις ώρες χωρίς περικοπή. Δίνει εκτίμηση κρυμμένης περικοπής ΦΒ 0,17 TWh (2024), 0,62 TWh (2025), 0,99 TWh (Ιαν έως Αυγ 2026). Είναι κάτω όριο (βλ. DIF-012)."
