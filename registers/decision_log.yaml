  chosen: "Ολόκληρα έτη. Εννέα έτη είναι λίγα για καθαρό P90, γι' αυτό το P90 της ετήσιας παραγωγής ελέγχεται και με τα 19 έτη του PVGIS."
  status: "Αποφασίστηκε"
  date: "2026-11-10"
- id: D-014
  decision: "Οι νομικές κατηγορίες σταθμού 11Α και 11Β είναι επιλογές που αξιολογεί το εργαλείο, όχι σταθερή υπόθεση"
  stage: "Stage 1"
  options:
    - "Ένας διακόπτης «φόρτιση από το δίκτυο ναι/όχι»"
    - "Πλήρης μοντελοποίηση των δύο κατηγοριών του άρθρου 11Γ ν. 4685/2020: 11Α (κρατά την ενίσχυση, φορτίζει μόνο από το ΦΒ, όριο έγχυσης 07:00 έως 19:00) και 11Β (φορτίζει και από το δίκτυο, χάνει την ενίσχυση, μηδενική έγχυση 11:00 έως 15:00)"
  chosen: "Πλήρης μοντελοποίηση. Η μετατροπή σε 11Α δεν είναι δωρεάν: το πάρκο αποκτά όριο έγχυσης 60% τη μέρα και η ενέργεια της μπαταρίας πληρώνεται σε τιμή αγοράς. Το εργαλείο συγκρίνει «χωρίς μπαταρία», 11Α και 11Β."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-015
  decision: "Μοντέλο φθοράς: NREL BLAST-Lite LFP 250 Ah με τους δημοσιευμένους συντελεστές"
  stage: "Stage 2"
  options:
    - "Γραμμικό: σταθερή απώλεια ανά έτος και ανά κύκλο (baseline)"
    - "Naumann 2018/2020 (κυψέλη Sony 3 Ah): τα άρθρα πίσω από συνδρομή, μικρή κυψέλη"
    - "BLAST-Lite Lfp_Gr_250AhPrismatic (ανοιχτός κώδικας BSD-3, μεγάλη πρισματική κυψέλη όπως στα containers)"
  chosen: "BLAST-Lite. Οι συντελεστές διαβάστηκαν από τον κώδικα του NREL και η υλοποίησή μας αναπαράγει τα σημεία ελέγχου (77,5% στα 20 έτη με 1 κύκλο τη μέρα). Οι συντελεστές που είχα γράψει αρχικά από μνήμη για το Naumann αφαιρέθηκαν (DIF-011). Το γραμμικό μένει ως baseline για σύγκριση."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-016
  decision: "«Εγκατεστημένη ισχύς ΦΒ» για το όριο 60% και την ελάχιστη χωρητικότητα: προεπιλογή η ισχύς πλαισίων (kWp), ρυθμιζόμενη"
  stage: "Stage 1"
  options:
    - "Ισχύς πλαισίων (DC, kWp)"
    - "Ισχύς μετατροπέων (AC)"
    - "Μέγιστη ισχύς έγχυσης"
  chosen: "Ισχύς πλαισίων ως προεπιλογή, γιατί ο νόμος ξεχωρίζει «εγκατεστημένη ισχύ» από «μέγιστη ισχύ παραγωγής». Το άρθρο 10 ν. 4685/2020 δεν ορίζει τον όρο και παραπέμπει στον ν. 3468/2006, που δεν διαβάστηκε. Μένει ρύθμιση και το αποτέλεσμα δείχνεται και με τις άλλες αναγνώσεις."
  status: "Πρόταση"
  date: "2026-11-11"
- id: D-017
  decision: "Φόρτιση και εκφόρτιση στο ίδιο διάστημα επιτρέπονται μόνο ως εναλλαγή μέσα στο διάστημα, με άθροισμα έως την ονομαστική ισχύ. Η αυστηρή εκδοχή (MILP) μένει για επαλήθευση"
  stage: "Stage 3"
  options:
    - "MILP σε κάθε ημέρα με παραβίαση (D-006): ακριβές, αλλά 10 φορές πιο αργό όταν οι κανόνες ανταμείβουν τη διέλευση από τη μπαταρία"
    - "LP με περιορισμό φόρτιση + εκφόρτιση <= ισχύς, ερμηνεία ως χρονική εναλλαγή, και διαγνωστικό που αναφέρει πόση ενέργεια κυκλοφόρησε έτσι"
    - "Απαγόρευση εκφόρτισης όσο παράγει το ΦΒ: δεν είναι κανόνας του νόμου"
  chosen: "Η δεύτερη. Είναι φυσικά υλοποιήσιμη (ο μετατροπέας φορτίζει ένα μέρος του 15λέπτου και εκφορτίζει το υπόλοιπο). Στο πάρκο ΣΕΔΠ το MILP χρειαζόταν σε 51 από 365 ημέρες, όχι «σπάνια». Η ενέργεια αυτή αναφέρεται ξεχωριστά στην αναφορά, γιατί στηρίζεται σε κενό των κανόνων (DIF-018)."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-018
  decision: "Εύρεση μεγέθους: διαλογή πλέγματος σε ωριαία ανάλυση με τρία καιρικά έτη, πλήρης αξιολόγηση των καλύτερων στο 15λεπτο, και οριακή αξία ισχύος και χωρητικότητας από τα duals"
  stage: "Stage 2"
  options:
    - "Πλήρες πλέγμα στο 15λεπτο με όλα τα έτη: περίπου 3,5 λεπτά ανά μέγεθος, δηλαδή πάνω από μία ώρα"
    - "Ανάβαση με παραγώγους από τα duals (το έσοδο είναι κοίλη συνάρτηση του μεγέθους): λίγες αξιολογήσεις, αλλά ο κανόνας της μίας ώρας και οι δύο κατηγορίες κάνουν το εφικτό σύνολο μη κυρτό"
    - "Διαλογή σε δύο βήματα και χρήση των duals μόνο για εξήγηση και έλεγχο"
  chosen: "Διαλογή σε δύο βήματα (24 μεγέθη σε 74 s με 4 πυρήνες). Τα duals δίνουν δωρεάν πόσο αξίζει ένα επιπλέον MW ή MWh στο επιλεγμένο σημείο και δείχνουν αν η λύση κάθεται πάνω στο νόμιμο ελάχιστο. Η «καμία μπαταρία» είναι πάντα υποψήφια."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-019
  decision: "Λειτουργία χωρίς τέλεια γνώση: τα οικονομικά χρησιμοποιούν τέλεια γνώση επί συντελεστή πρόβλεψης, και η αναφορά δείχνει τρεις πολιτικές δίπλα δίπλα"
  stage: "Stage 2"
  options:
    - "Μόνο τέλεια γνώση: αισιόδοξο"
    - "Πλήρες μοντέλο πρόβλεψης τιμών μέσα σε κάθε προσομοιωμένο έτος: βαρύ και δεν επικυρώνεται σε συνθετικά έτη"
    - "Τέλεια γνώση (άνω όριο), χθεσινές τιμές (απλή πρόβλεψη), κανόνας ρολογιού (κάτω όριο), και συντελεστής 0,90 με εύρος 0,80 έως 0,97 στα οικονομικά"
  chosen: "Η τρίτη. Ο συντελεστής στηρίζεται στη σύγκριση των πολιτικών στα πραγματικά 15λεπτα και στη βιβλιογραφία, και είναι μία από τις πέντε πηγές αβεβαιότητας του Monte Carlo."
  status: "Αποφασίστηκε"
  date: "2026-11-11"
- id: D-020
  decision: "Τι σημαίνει P90: το 10ο εκατοστημόριο πάνω σε διαδρομές που συνδυάζουν σενάριο αγοράς, σειρά καιρικών ετών, σφάλμα μοντέλου τιμών, ποιότητα πρόβλεψης και κόστος"
  stage: "Stage 2"
  options:
    - "P90 μόνο της παραγωγής (όπως στα ΦΒ): δεν πιάνει τον κίνδυνο τιμών, που εδώ είναι ο κύριος"
    - "Χειρότερο σενάριο: δεν έχει πιθανότητα"
    - "Κοινή κατανομή με βάρη σεναρίων, και δίπλα το αποτέλεσμα ανά σενάριο"
  chosen: "Κοινή κατανομή, 2000 διαδρομές. Τα βάρη των σεναρίων είναι υποκειμενικά, γι' αυτό η αναφορά δείχνει πάντα και τον πίνακα ανά σενάριο και την ανάλυση του ποιος παράγοντας εξηγεί τη διασπορά."
  status: "Αποφασίστηκε"
