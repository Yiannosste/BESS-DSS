# Σενάρια αγοράς. Δεν είναι προβλέψεις. Είναι συνεπείς ιστορίες για το πώς μπορεί να εξελιχθεί το σύστημα.
# Όλες οι τιμές καυσίμων και CO2 είναι σε πραγματικά ευρώ 2026.
# Σημεία αγκύρωσης ανά έτος, γραμμική παρεμβολή ενδιάμεσα.
#
# Πηγές για τα σημεία εκκίνησης (βλ. μητρώο υποθέσεων και ρυθμιστικό μητρώο):
#   ΦΒ: 11,5 GWp τέλος 2025, περίπου 13 GWp Μάιος 2026 (ΣΕΦ, δευτερογενής, REG-B-042 κ.ε.).
#   Αιολικά: 6,0 GW μέσα 2026 (ΕΛΕΤΑΕΝ, δευτερογενής).
#   Μπαταρίες: 0,5 έως 0,7 GW φθινόπωρο 2026, στόχος 1 GW τέλος 2026. Εμπορικές με προτεραιότητα: 3,8 + 0,9 = 4,7 GW (ΚΥΑ 13.3.2025).
#   Αντλησιοταμίευση: 0,70 GW σήμερα, Αμφιλοχία 0,68 GW το 2027.
#   ΕΣΕΚ 2030: ΦΒ 13,5 GW (ήδη ξεπερασμένος στόχος), αιολικά 8,9 + 1,9, μπαταρίες 4,325 GW, αντλησιοταμίευση 1,93 GW. 2035: ΦΒ 18,5. 2050: ΦΒ 35,1, μπαταρίες 12.
#   Ζήτηση 2026: 49,9 TWh (μέσο φορτίο 5,69 GW, δεδομένα συστήματος).
#   Αέριο και CO2: δεν βρέθηκαν ανοιχτές προθεσμιακές καμπύλες. Οι τροχιές είναι ΥΠΟΘΕΣΗ με εύρος (TTF 2023 έως 2025: 30 έως 41 ευρώ/MWh, EUA 65 έως 85 ευρώ/t).
#   saturation_shift_gw: πόσο ανεβαίνει το κατώφλι μηδενικής τιμής επειδή οι γείτονες δεν απορροφούν πια
#     το μεσημεριανό πλεόνασμα. Ιστορικά: μείον 1,45 (2024), μείον 0,34 (2025), 0,02 (2026) GW, δηλαδή
#     περίπου +0,7 GW τον χρόνο. Το μοντέλο βαθμονομείται στο 2025 έως 2026, άρα 0 = όπως σήμερα. ΥΠΟΘΕΣΗ.
#   spread_scale: διόρθωση για το σφάλμα του μοντέλου στη διασπορά τιμών (1 = όπως βαθμονομήθηκε).
#
# entry: παράμετροι ισορροπίας ελεύθερης εισόδου αυτόνομων μπαταριών (μόνο όταν endogenous_storage_entry: true).
#   capex σε ευρώ/kWh για μεγάλα έργα (Ember 2025: 125 USD/kWh all-in εκτός Κίνας και ΗΠΑ), ετήσια πραγματική μείωση,
#   WACC, διάρκεια ζωής, σταθερό O&M, λοιπά έσοδα (εξισορρόπηση) σε ευρώ/MW/έτος, μέγιστος ρυθμός κατασκευής.
scenarios:
  - name: central
    label: "Κεντρικό"
    description: "Τα ΦΒ συνεχίζουν πάνω από το ΕΣΕΚ με μειούμενο ρυθμό, οι μπαταρίες φτάνουν τον στόχο του 2030, το αέριο επιστρέφει στα 30 ευρώ/MWh. Η ισχύς μπαταριών πάνω από το δεσμευμένο κατώφλι είναι ενδογενής."
    weight: 0.35
    endogenous_storage_entry: true
    entry: {capex_eur_per_kwh: 135, capex_decline: 0.03, wacc: 0.08, life: 15, fom_frac: 0.02, other_revenue_eur_per_mw: [[2027, 15000], [2030, 8000], [2035, 5000]], max_build_gw_per_year: 1.5}
