# Ημερολόγιο τεχνικής έρευνας και καινοτομίας.
# Κάθε ιδέα συγκρίνεται με ένα απλό baseline. Ετυμηγορία: Κρατήθηκε | Κρατήθηκε ως εργαλείο εξήγησης | Απορρίφθηκε | Δεν δοκιμάστηκε.
# Η βιβλιογραφία ανά ιδέα είναι στο docs/research/innovation_literature.md. Τα νούμερα των πειραμάτων στο docs/validation/.
- id: INN-01
  idea: "Ισορροπία ελεύθερης εισόδου μπαταριών (το φαινόμενο ανάκαμψης: φθηνότερες μπαταρίες, περισσότερες μπαταρίες, μικρότερη διαφορά τιμών)"
  what: "Η ισχύς των μπαταριών της χώρας δεν είναι μόνο είσοδος. Πάνω από το δεσμευμένο κατώφλι μπαίνουν νέες όσο μια οριακή μπαταρία κερδίζει το ετήσιο κόστος της. Η ισχύς ισορροπίας βρίσκεται με διχοτόμηση για κάθε έτος και δεν μειώνεται ποτέ."
  where: "Long-term: bessdss.market.longterm.MarketSimulator.equilibrium_bess, bessdss.market.library.ScenarioLibrary.storage_path"
  baseline: "Εξωγενής τροχιά μπαταριών (μόνο το δεσμευμένο κατώφλι του σεναρίου)"
  experiment: "scripts/run_experiments.py rebound: κεντρικό σενάριο με και χωρίς ενδογενή είσοδο, ίδια όλα τα άλλα"
  result: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  verdict: "Κρατήθηκε"
  why: "Απαντά στο ερώτημα «πόσες μπαταρίες θα μπουν» με οικονομική λογική αντί για αυθαίρετη υπόθεση, και κάνει ρητό ότι το περιθώριο μιας μπαταρίας τείνει στο κόστος της. Η αξία μιας μπαταρίας σε πάρκο πρέπει να έρχεται από κάτι που η αυτόνομη δεν έχει."
  sources: ["Butters, Dorsey, Gowrisankaran (2025), Econometrica 93(3), https://doi.org/10.3982/ECTA20411", "Hirth (2013), Energy Economics 38, https://doi.org/10.1016/j.eneco.2013.02.004", "Mills, Wiser (2015), Applied Energy 147, https://doi.org/10.1016/j.apenergy.2015.03.014"]
  evidence_short: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
- id: INN-02
  idea: "Ο στόλος μπαταριών ως πρόβλημα σχεδιαστή πάνω στην καμπύλη τιμής της κάθε ώρας"
  what: "Πολλές μικρές μπαταρίες που κάνουν arbitrage καταλήγουν στην ίδια κατάσταση με έναν σχεδιαστή που ελαχιστοποιεί το ολοκλήρωμα της καμπύλης τιμής. Με τμηματικά γραμμική καμπύλη είναι LP."
  where: "Long-term: bessdss.market.fleet.FleetDispatch, MarketSimulator.segment_prices"
  baseline: "Κατανομή πάνω στη μέση καμπύλη τιμής (η πρώτη μας εκδοχή)"
  experiment: "Σάρωση της ισχύος μπαταριών από 1 έως 12 GW στο κεντρικό σενάριο 2030 και μέτρηση του περιθωρίου οριακής μπαταρίας 2 ωρών"
  result: "Με τη μέση καμπύλη το περιθώριο έμενε 80 έως 110 χιλ. ευρώ/MW/έτος ακόμη και με 25 GW, και η είσοδος δεν σταματούσε ποτέ. Με την καμπύλη της κάθε ώρας πέφτει από 73 (1 GW) σε 59, 42, 31, 22 και 14 χιλ. (12 GW), και η ημερήσια διαφορά TB4 από 90 σε 45 ευρώ/MWh."
  verdict: "Κρατήθηκε"
  why: "Η πρώτη εκδοχή ήταν λάθος (DIF-017). Η διορθωμένη δίνει τη μονοτονία που απαιτεί η θεωρία και υπάρχει test (test_more_storage_lowers_spread)."
  sources: ["Cruise, Flatley, Gibbens, Zachary (2019), Operations Research 67(1), https://doi.org/10.1287/opre.2018.1761", "Ward, Staffell (2018), Journal of Energy Storage, https://doi.org/10.1016/j.est.2018.08.022"]
  evidence_short: "Περιθώριο 73 έως 14 χιλ. ευρώ/MW/έτος από 1 έως 12 GW"
  code: "0,5 ms ανά ημέρα"
- id: INN-03
  idea: "Οριακή αξία ισχύος και χωρητικότητας από τα duals του LP (θεώρημα περιβάλλουσας)"
  what: "Τα duals των περιορισμών ισχύος και χωρητικότητας είναι η ακριβής παράγωγος του εσόδου ως προς το μέγεθος. Βγαίνουν χωρίς επιπλέον προσομοίωση."
  where: "Sizing: bessdss.dispatch.lp (dual_power, dual_energy), bessdss.sizing.search.marginal_npv"
  baseline: "Πεπερασμένες διαφορές με 4 επιπλέον πλήρεις προσομοιώσεις"
  experiment: "scripts/run_experiments.py duals και test_duals_match_finite_difference"
  result: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  verdict: "Κρατήθηκε ως εργαλείο εξήγησης"
  why: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  sources: ["Cruise et al. (2019), Θεωρήματα 4 και 5, https://arxiv.org/abs/1406.3653"]
  evidence_short: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
- id: INN-04
  idea: "Σκιώδης τιμή φθοράς (κανόνας τύπου Hotelling): ποιο κόστος ανά MWh πρέπει να βλέπει η λειτουργία"
  what: "Η χωρητικότητα είναι εξαντλήσιμος πόρος. Η λειτουργία πρέπει να χρεώνει κάθε κύκλο με την αξία της χωρητικότητας που καταστρέφει. Αναζήτηση της σταθερής τιμής που μεγιστοποιεί την NPV."
  where: "Short-term και φυσική μπαταρίας: bessdss.study.marginal_cycle_cost"
  baseline: "Κόστος κύκλου από το μοντέλο φθοράς: οριακή απώλεια ανά κύκλο επί αξία αντικατάστασης"
  experiment: "scripts/run_experiments.py cycle_cost: έξι τιμές από 0 έως 8 φορές το baseline"
  result: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  verdict: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  why: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  sources: ["Xu, Zhao, Zheng, Litvinov, Kirschen (2018), IEEE Trans. Power Systems, https://arxiv.org/abs/1707.04567"]
  evidence_short: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
- id: INN-05
  idea: "Πόση αξία χάνεται χωρίς τέλεια γνώση: απλή πρόβλεψη, παλινδρόμηση τύπου LEAR, κανόνας ρολογιού. Θεμελιώδη μοντέλα χρονοσειρών (Chronos κ.ά.)"
  what: "Προγραμματισμός με προβλεπόμενες τιμές και εκκαθάριση στις πραγματικές. Μετράμε το μερίδιο της αξίας τέλειας γνώσης που διασώζεται."
  where: "Short-term: πολιτικές του bessdss.dispatch.simulate και συντελεστής ASM-O01"
  baseline: "Χθεσινές τιμές (naive)"
  experiment: "scripts/run_experiments.py forecast: πραγματικές ωριαίες τιμές Νοε 2025 έως Οκτ 2026, σταθμός 11Α"
  result: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  verdict: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  why: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  sources: ["Lago, Marcjasz, De Schutter, Weron (2021), Applied Energy 293, https://arxiv.org/abs/2008.08004", "Lipiecki, Weron (2026), arXiv:2609.00089, https://arxiv.org/abs/2609.00089", "Chronos-2, https://arxiv.org/abs/2510.15821"]
  evidence_short: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
- id: INN-06
  idea: "Μοντέλο τιμών με ποσοστημόρια υπό συνθήκη και αναδειγματοληψία ημερών βαθμίδων (CQR-rank)"
  what: "Η κανονικοποιημένη τιμή είναι Q(u | z): ποσοστημόριο u της κατανομής της δεδομένου του δυνητικού υπολειπόμενου φορτίου z. Οι βαθμίδες u ολόκληρων ιστορικών ημερών αναδειγματοληπτούνται μαζί. Είναι ένα μη παραμετρικό γενετικό μοντέλο με δομική μεταβλητή."
  where: "Long-term: bessdss.market.cqr"
  baseline: "Μέση καμπύλη τιμής ως προς το υπολειπόμενο φορτίο"
  experiment: "Backtest εκτός δείγματος (εκπαίδευση 2025, δοκιμή 2026 και αντίστροφα) και εντός δείγματος 2025 έως 2026. Συγκρίθηκαν πέντε μορφές."
  result: "Εντός δείγματος: μέση τιμή 102,8 έναντι 102,0, TB4 138 έναντι 132, ώρες μηδενικής τιμής 1412 έναντι 1303. Η μέση καμπύλη: TB4 98, ώρες μηδενικής τιμής 290. Εκτός δείγματος 2025 προς 2026: TB4 171 έναντι 136 (+26%). 2026 προς 2025: 99 έναντι 129 (μείον 23%). Gradient boosting με ramps: 144 έναντι 136 και 99 έναντι 129. Λανθάνουσα οριζόντια μετατόπιση: 182 έναντι 136, με ουρά 322 έναντι 187."
  verdict: "Κρατήθηκε"
  why: "Είναι το μόνο από τα πέντε που δίνει σωστές μηδενικές τιμές και σωστή διασπορά εντός δείγματος, χωρίς εκρηκτικές ουρές. Κανένα δεν μεταφέρεται καλά από χρόνο σε χρόνο: το σφάλμα ±25% μπαίνει στο ρίσκο (DIF-008)."
  sources: ["Nowotarski, Weron (2015), Computational Statistics, https://doi.org/10.1007/s00180-014-0523-0"]
  evidence_short: "Εντός δείγματος TB4 +5%, μηδενικές ώρες +8%. Εκτός δείγματος ±25%"
- id: INN-07
  idea: "Ανακατασκευή της δυνητικής παραγωγής ΦΒ και της κρυμμένης περικοπής από δορυφορική ακτινοβολία"
  what: "Η δημοσιευμένη παραγωγή είναι μετά τις περικοπές. Παλινδρόμηση παραγωγής σε ακτινοβολία μόνο στις ώρες χωρίς περικοπή, και εφαρμογή σε όλες."
  where: "Long-term: bessdss.market.calibrate.fit_potential_pv"
  baseline: "Χρήση της δημοσιευμένης παραγωγής ως έχει"
  experiment: "Πιθανότητα μηδενικής τιμής ως προς το υπολειπόμενο φορτίο, ανά έτος, με τους δύο τρόπους"
  result: "R2 0,976 στις ώρες χωρίς περικοπή. Με το πραγματικό φορτίο, η πιθανότητα μηδενικής τιμής στα 0 έως 0,5 GW ήταν 8% (2024), 29% (2025), 43% (2026): το μοντέλο φαινόταν να αλλάζει κάθε χρόνο. Με το δυνητικό σταθεροποιείται (31% το 2025, 36% το 2026). Κρυμμένη περικοπή ΦΒ: 0,17, 0,62 και 0,99 TWh."
  verdict: "Κρατήθηκε"
  why: "Χωρίς αυτό το πλεόνασμα δεν φαίνεται και κανένα μοντέλο τιμών δεν στέκει για το 2025 έως 2026. Η εκτίμηση περικοπής είναι κάτω όριο (DIF-012)."
  sources: ["NASA POWER, https://power.larc.nasa.gov/"]
  evidence_short: "Σταθεροποιεί τη σχέση μηδενικής τιμής και φορτίου μεταξύ ετών"
- id: INN-08
  idea: "Γενετικά μοντέλα βαθιάς μάθησης (diffusion, GAN, flows) για σενάρια τιμών"
  what: "Εκμάθηση της κοινής κατανομής τιμών, καιρού και περικοπών από το ιστορικό και δειγματοληψία νέων ετών."
  where: "Long-term"
  baseline: "Αναδειγματοληψία ολόκληρων ιστορικών ημερών βαθμίδων πάνω σε δομικό μοντέλο (INN-06)"
  experiment: "Δεν έγινε"
  result: "Δεν υπάρχει αποτέλεσμα"
  verdict: "Απορρίφθηκε για το μακροχρόνιο μοντέλο, χωρίς πείραμα"
  why: "Τα 15λεπτα υπάρχουν 13 μήνες και οι συχνές μηδενικές τιμές δύο χρόνια. Ένα μοντέλο που μαθαίνει από αυτά δεν μπορεί να περιέχει έναν κόσμο με 5 GW μπαταρίες, γιατί δεν τον έχει δει. Η δομή (το z) είναι αυτή που μεταφέρει την αλλαγή, όχι η στατιστική. Ένα γενετικό μοντέλο θα είχε θέση μόνο στο κομμάτι που κάνει σήμερα η αναδειγματοληψία ημερών, και εκεί 600 ημέρες δεν αρκούν για να ξεπεράσει το απλό. Η απόρριψη είναι επιχείρημα, όχι μέτρηση."
  sources: ["docs/research/innovation_literature.md, ενότητα B"]
  evidence_short: "Χωρίς πείραμα: το ιστορικό δεν περιέχει το μέλλον που μας ενδιαφέρει"
- id: INN-09
  idea: "Weight-space programming (ένα LLM διαβάζει και γράφει απευθείας βάρη νευρωνικών δικτύων)"
  what: "Η ανάρτηση των Takehi, Teoh, Zhang, Khattab (2 Νοε 2026) δείχνει ένα μεγάλο γλωσσικό μοντέλο να αναγνωρίζει τι κάνει ένα μικρό δίκτυο από τα βάρη του, να διορθώνει μια πολιτική ελέγχου αλλάζοντας το 3,5% των βαρών, και να γράφει από το μηδέν πολιτικές για παιχνίδια χωρίς εκπαίδευση."
  where: "Θα μπορούσε: πολιτική λειτουργίας της μπαταρίας γραμμένη απευθείας σε μικρό δίκτυο, αντί για βελτιστοποίηση"
  baseline: "LP ανά ημέρα με HiGHS (ακριβές, 0,4 s ανά έτος)"
  experiment: "Δεν έγινε. Διαβάστηκε η ανάρτηση δύο φορές (ερευνητής και κύριος agent)."
  result: "Δεν υπάρχει αποτέλεσμα"
  verdict: "Απορρίφθηκε"
  why: "Το πρόβλημα λειτουργίας είναι κυρτό και λύνεται ακριβώς σε χιλιοστά του δευτερολέπτου, με εγγύηση ότι τηρεί τα όρια έγχυσης και τους κανόνες. Ένα χειρόγραφο δίκτυο δεν δίνει τέτοια εγγύηση, δεν ελέγχεται από τράπεζα ή ρυθμιστή, εξαρτάται από ένα κλειστό μοντέλο, και η ανάρτηση είναι πρώιμη, χωρίς κριτές και χωρίς εφαρμογή σε χρονοσειρές ή ενέργεια. Θα είχε νόημα μόνο αν η λειτουργία γινόταν μη κυρτή και πολύ αργή, κάτι που δεν συμβαίνει εδώ."
  sources: ["https://rikiyat.github.io/blog/weight-space-programming/"]
  evidence_short: "Δεν εφαρμόζεται: το baseline είναι ήδη ακριβές και γρήγορο"
- id: INN-10
  idea: "Μάθηση με στόχο την απόφαση (decision-focused learning, SPO+)"
  what: "Εκπαίδευση του μοντέλου πρόβλεψης τιμών ώστε να μεγιστοποιεί το έσοδο της μπαταρίας και όχι να ελαχιστοποιεί το σφάλμα πρόβλεψης."
  where: "Short-term"
  baseline: "Πρόβλεψη με ελάχιστα τετράγωνα και μετά βελτιστοποίηση"
  experiment: "Δεν έγινε"
  result: "Δεν υπάρχει αποτέλεσμα"
  verdict: "Δεν δοκιμάστηκε"
  why: "Το πείραμα INN-05 έδειξε πόσο χώρο αφήνει η απλή πρόβλεψη. Για την απόφαση επένδυσης αρκεί ένας τεκμηριωμένος συντελεστής. Για έναν ΦοΣΕ που λειτουργεί καθημερινά αξίζει να δοκιμαστεί."
  sources: ["Elmachtoub, Grigas (2022), Management Science, https://arxiv.org/abs/1710.08005"]
  evidence_short: "Χωρίς πείραμα: εκτός του ερωτήματος της επένδυσης"
- id: INN-11
  idea: "Ενισχυτική μάθηση για τη λειτουργία της μπαταρίας"
  what: "Εκπαίδευση πράκτορα που αποφασίζει φόρτιση και εκφόρτιση."
  where: "Short-term"
  baseline: "LP"
  experiment: "Δεν έγινε"
  result: "Δεν υπάρχει αποτέλεσμα"
  verdict: "Απορρίφθηκε"
  why: "Όταν το φυσικό μοντέλο είναι γνωστό και το πρόβλημα κυρτό, οι κλασικές μέθοδοι είναι ίσες ή καλύτερες και δίνουν εγγυήσεις (Ginzburg et al. 2025). Δεν υπάρχει λόγος να αντικατασταθεί ακριβής λύση με προσεγγιστική."
  sources: ["Ginzburg, Segev, Levron, Keren (2025), https://arxiv.org/abs/2506.00459"]
  evidence_short: "Χωρίς πείραμα: η βιβλιογραφία και η κυρτότητα αρκούν"
- id: INN-12
  idea: "Απόδοση του ρίσκου σε αιτίες: δείκτες ευαισθησίας βασισμένοι στη διασπορά και προφίλ του κακού 10%"
  what: "Για κάθε παράγοντα, το μερίδιο της διασποράς της NPV που εξηγεί μόνος του, και πώς μοιάζει ο παράγοντας στις χειρότερες διαδρομές."
  where: "Risk: bessdss.risk.analysis"
  baseline: "Διάγραμμα tornado (ένας παράγοντας τη φορά)"
  experiment: "Και τα δύο υπολογίζονται για κάθε μελέτη"
  result: "Τα δύο συμφωνούν στη σειρά των παραγόντων στα παραδείγματα. Ο δείκτης διασποράς ζυγίζει με τις πιθανότητες, το tornado δείχνει τα άκρα."
  verdict: "Κρατήθηκαν και τα δύο"
  why: "Το tornado το καταλαβαίνει ο ιδιοκτήτης. Ο δείκτης διασποράς και το προφίλ του κακού 10% απαντούν στην ερώτηση της τράπεζας: τι οδηγεί τον κακό χρόνο."
  sources: ["docs/research/innovation_literature.md, ενότητα H"]
  evidence_short: "Ίδια κατάταξη παραγόντων, διαφορετική ανάγνωση"
- id: INN-13
  idea: "Το NREL SAM (PySAM) ως βάση ή ως benchmark"
  what: "Έτοιμο εργαλείο με ΦΒ, μπαταρία, φθορά και οικονομικά."
  where: "Όλη η αλυσίδα. Τελικά μόνο ως benchmark του κινητήρα λειτουργίας και της φυσικής."
  baseline: "Ο δικός μας κινητήρας"
  experiment: "scripts/benchmark_pysam.py: ίδιο προφίλ ΦΒ (1,1 MWp), ίδια μπαταρία (0,5 MW / 1,22 MWh), πραγματικές ωριαίες τιμές Νοε 2025 έως Οκτ 2026, χωρίς ελληνικά όρια"
  result: "Φυσική: όταν το SAM ακολουθεί το δικό μας πρόγραμμα, δίνει 351 MWh εκφόρτισης έναντι 369 (μείον 5%), απόδοση 87,9% έναντι 88,0%, πρόσθετο έσοδο 50,8 έναντι 53,2 χιλ. ευρώ (μείον 4,6%). Λειτουργία: η αυτόματη στρατηγική του SAM δίνει 20,8 χιλ. ευρώ, δηλαδή το 39% της βέλτιστης. Ο δικός μας κανόνας ρολογιού δίνει 44,8 χιλ. (84%) και οι χθεσινές τιμές 41,6 χιλ. (78%)."
  verdict: "Κρατήθηκε ως benchmark, απορρίφθηκε ως βάση"
  why: "Η φυσική του συμφωνεί με το απλό μας μοντέλο στο 5%, άρα το απλό μοντέλο αρκεί. Η λειτουργία του δεν βελτιστοποιεί με ωριαίες τιμές και δεν χωρά τα ελληνικά όρια έγχυσης. Δεν ρυθμίσαμε εξαντλητικά τις επιλογές του SAM, άρα το 39% είναι με τις προεπιλογές της αυτόματης στρατηγικής."
  sources: ["NREL PySAM 7.1.1, https://github.com/NREL/pysam"]
  evidence_short: "Φυσική στο 5%, αυτόματη λειτουργία στο 39% της βέλτιστης"
- id: INN-14
  idea: "Ευαισθησία στην ανάγνωση των κανόνων ως αποτέλεσμα της μελέτης"
  what: "Κάθε ασαφής κανόνας είναι ρύθμιση. Η μελέτη ξανατρέχει το προτεινόμενο μέγεθος με κάθε εναλλακτική ανάγνωση και δείχνει πώς αλλάζει η NPV."
  where: "Regulatory: bessdss.pipeline.regulatory_sensitivity"
  baseline: "Μία ανάγνωση «καρφωμένη» στον κώδικα"
  experiment: "Και στα τρία παραδείγματα"
  result: "ΣΥΜΠΛΗΡΩΝΕΤΑΙ"
  verdict: "Κρατήθηκε"
  why: "Τέσσερις κρίσιμοι κανόνες είναι ασαφείς. Ένα εργαλείο που κρύβει την επιλογή του θα ήταν λάθος για τους μισούς αναγνώστες."
