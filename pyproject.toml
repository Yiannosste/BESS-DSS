[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bessdss"
version = "0.1.0"
description = "Decision Support System: should an existing Greek PV park add a battery, which size, how to operate it, and does the decision hold in a bad year."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "highspy>=1.7",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pyarrow>=15",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
benchmark = ["NREL-PySAM>=7.0"]
ui = ["streamlit>=1.36"]

[project.scripts]
bessdss = "bessdss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bessdss = ["report/templates/*.j2"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "network: tests that need internet access",
]
