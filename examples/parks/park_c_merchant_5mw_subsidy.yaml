# Παράδειγμα Γ με επιδότηση: το ίδιο πάρκο με το park_c_merchant_5mw.yaml, αλλά με επιδότηση κεφαλαίου 60%.
# Δείχνει πώς αλλάζει η απάντηση. Το ποσοστό είναι υπόθεση εργασίας: το εξαγγελθέν πρόγραμμα επιδότησης
# μπαταριών σε ΦΒ πάρκα (REG-B-038) δεν έχει δημοσιευτεί και οι όροι του δεν είναι γνωστοί.
park:
  name: "Πάρκο Γ με επιδότηση 60%: 5 MW merchant, Κοζάνη"
  lat: 40.30
  lon: 21.79
  pv_dc_kwp: 5000
  pv_ac_kw: 4200
  grid_export_limit_kw: 4200
  tracking: single_axis
  commissioning_year: 2024
  commissioning_date: "2024-06-01"
  grid_operator: deddie
  voltage_level: mv
  static_injection_cap_frac: 0.73
  support: {kind: merchant}
base_year: 2026
cod_year: 2027
life_years: 15
finance_overrides: {capex_subsidy_frac: 0.6}
